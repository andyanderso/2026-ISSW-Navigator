e fully capture and translate program impact."],"kw":"avalanche forecasting operations, organizational structure, funding, program analysis","ty":"P","pp":199,"em":[],"r":3577,"day":"Tue","th":"Operations and Program Management","pr":"Liz Daniel"},"215":{"id":"215","t":"Avalanche Scenario Maps: From Terrain Identification to Decision Support Tool","au":[{"n":"Christoph Hesselbach","raw":"Hesselbach, Christoph","p":true,"aff":""},{"n":"Jakob Schwarz","raw":"Schwarz, Jakob","p":false,"aff":""},{"n":"Paula Spannring","raw":"Spannring, Paula","p":false,"aff":""},{"n":"Anna Wirbel","raw":"Wirbel, Anna","p":false,"aff":""},{"n":"Andreas Huber","raw":"Huber, Andreas","p":false,"aff":""},{"n":"Michael Winkler","raw":"Winkler, Michael","p":false,"aff":""},{"n":"Christoph Mitterer","raw":"Mitterer, Christoph","p":false,"aff":""},{"n":"Harald Riedl","raw":"Riedl, Harald","p":false,"aff":""},{"n":"Jan-Thomas Fischer","raw":"Fischer, Jan-Thomas","p":false,"aff":""}],"ab":["Site-specific avalanche warning requires spatially explicit estimates of where avalanches may release, how they may propagate, and what size they may reach. These assessments are often made under time pressure and from heterogeneous or limited information. Avalanche scenario maps can support local decision-making by translating these assessments into a consistent spatial representation of expected avalanche activity and its potential interaction with exposed elements. To address this need, we present a framework for translating an operational avalanche scenario into spatially explicit avalanche scenario maps by combining terrain potential with scenario-specific spatial and avalanche constraints. Terrain potential, derived through avalanche terrain identification, represents what the terrain can produce, while the avalanche scenario describes what is expected under prevailing conditions. A harmonized avalanche size interface links both components and enables spatial mapping of avalanche size. The interface builds on the established EAWS, CAA and AAA classifications. Continuous size relationships retain compatibility with these five-class operational schemes while allowing model inputs and outputs to be expressed on the same scale. Simulation results can therefore be translated back into spatially mapped dimension, runout and destructive size. The framework was developed and tested in two cross-border pilot regions and applied to selected scenarios across the EUREGIO Tyrol–South Tyrol–Trentino in the European Alps. Contrasting dry winter and wet spring scenarios demonstrate how the same terrain potential can result in spatially distinct avalanche scenario maps under different spatial and avalanche constraints. The resulting maps also allow scenarios to be compared in terms of affected area, characterized avalanche size and exposure of infrastructure. Developed iteratively with avalanche warning services and local avalanche commissions, the approach provides a basis for further integration into operational decision-support workflows."],"kw":"Avalanche terrain identification, avalanche scenario maps, site-specific avalanche warning, avalanche size, avalanche simulation, decision support","ty":"O","pp":200,"em":[],"r":3396,"pr":"Christoph Hesselbach"},"216":{"id":"216","t":"Towards Automatic Avalanche Detection and Characterization Using Seismic and Infrasound Array Data","au":[{"n":"Christine Seupel","raw":"Seupel, Christine","p":true,"aff":""},{"n":"Patrick Düggelin","raw":"Düggelin, Patrick","p":false,"aff":""},{"n":"Andri Simeon","raw":"Simeon, Andri","p":false,"aff":""},{"n":"Cristina Pérez-Guillén","raw":"Pérez-Guillén, Cristina","p":false,"aff":""},{"n":"Andreas Fichtner","raw":"Fichtner, Andreas","p":false,"aff":""},{"n":"Alec van Herwijnen","raw":"van Herwijnen, Alec","p":false,"aff":""}],"ab":["Reliable avalanche detection and localization are essential for effective hazard mitigation. They support avalanche forecasting, risk management, and the development of new, data-driven forecasting tools. Both seismic and infrasound sensors can be used to record avalanche signals. Generated by different parts of the avalanche flow, these signals contain complementary information. When deployed as arrays, seismic and infrasound sensors enable advanced signal processing to estimate source parameters, including apparent velocity and backazimuth, which can be used to locate avalanches. Although both types of systems are well suited for avalanche detection and localization, each possesses specific strengths and limitations that can be exploited in a complementary manner. To investigate this potential, we installed a co-located seismo-acoustic array of five seismic and five infrasound sensors in the Dischma Valley near Davos, Switzerland. We have recorded continuous data since the 2020-2021 winter season. While infrasound array processing yields stable and coherent source parameters even when signal amplitudes are close to the noise level, beamforming results from seismic data are more variable but still robust. In addition, crosscorrelation between co-located seismic and infrasound sensors reveals distinct patterns of seismo-acoustic coupling that reflect differences in avalanche types. Based on these findings, we are developing a combined seismo–acoustic detection framework that exploits array-derived source parameters to automatically detect avalanches and provide additional information on avalanche type and flow regime. Specifically, the framework identifies candidate avalanche signals using threshold-based rules applied to source parameters, signal amplitudes, and durations, while crosscorrelations between seismic and infrasound signals are used to estimate the avalanche type. We evaluate the detection algorithm using a dataset of avalanche signals recorded over five winter seasons. Preliminary results are promising, indicating that the combination of seismic and infrasound data improves detection robustness, while also enabling basic avalanche characterization."],"kw":"Avalanche Detection, Seismic, Infrasound, Array Processing, Instrumentation and Remote Sensing","ty":"O","pp":201,"em":[],"r":3462,"pr":"Christine Seupel"},"217":{"id":"217","t":"Near real-time snow depth monitoring with low-cost lidar sensors for road safety decisions","au":[{"n":"Pia Ruttner","raw":"Ruttner, Pia","p":true,"aff":""},{"n":"Julia Glaus","raw":"Glaus, Julia","p":false,"aff":""},{"n":"Yves Bühler","raw":"Bühler, Yves","p":false,"aff":""}],"ab":["Operational avalanche safety decisions often must be taken under conditions of limited direct observations and sparse spatial data coverage. In particular, information from avalanche release zones during periods of low visibility is rarely available. As a result, decisions typically rely on a combination of expert judgment, avalanche bulletins, and data from nearby weather stations. Since November 2023, we operate low-cost lidar sensors that measure the snow depth distribution in an avalanche release area above a road close to Davos, Switzerland, at high temporal (1 h) and spatial (0.5 m) resolution. Our results can capture the evolution of new snow accumulation and redistribution even during relevant snowfall periods. To illustrate the achieved information, we present a case study from February 2026. During this event, a spontaneous avalanche release occurred overnight, which we could detect and quantify with our in-situ lidar measurements and directly influenced the decision-making of the local avalanche safety experts. The dataset provides direct input for avalanche dynamics simulations, enabling the estimation of potential runout distances for road safety applications. Our findings underline both the potential and the constraints of low-cost lidar systems for snow depth distribution monitoring in avalanche release areas. Beyond operational applications, the dataset provides a valuable benchmark for validating snow depth models and improving our understanding of snow depth distribution in avalanche-prone areas."],"kw":"Remote Sensing, Snow Depth Monitoring, Low-Cost Lidar, Road Safety","ty":"P","pp":202,"em":[],"r":3639,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Pia Ruttner"},"218":{"id":"218","t":"An Integrated Multi-Instrument Framework for Operational Avalanche Risk Management: The Milano Cortina 2026 Winter Olympics in Livigno, Italy","au":[{"n":"Fabiano Monti","raw":"Monti, Fabiano","p":true,"aff":""},{"n":"Alberto Mariani","raw":"Mariani, Alberto","p":false,"aff":""},{"n":"Martin Metzger","raw":"Metzger, Martin","p":false,"aff":""},{"n":"Luca Dellarole","raw":"Dellarole, Luca","p":false,"aff":""},{"n":"Giacomo Villa","raw":"Villa, Giacomo","p":false,"aff":""},{"n":"Diana Lazzeri","raw":"Lazzeri, Diana","p":false,"aff":""}],"ab":["Avalanche risk management in complex alpine environments increasingly relies on the integration of heterogeneous data sources and modelling approaches into a coherent operational framework. During the Milano Cortina 2026 Winter Olympic Games, an advanced multi-layer system was implemented in Livigno (Italy) to support real-time decisionmaking for avalanche risk mitigation affecting critical infrastructures. The system combined in situ measurements and field observations, automatic detection technologies, numerical weather model (NWM) data, snowpack modelling and avalanche dynamics simulations within a unified operational environment. Automatic Weather Stations (AWS) provided continuous observations of key meteorological and snow variables, forming the basis for both process interpretation and model forcing. These data were complemented by NWM outputs, used both as forecast products and as input for snowpack simulations. Snowpack evolution was simulated using the SNOWPACK model, providing stratigraphic information, stability indices and forecasts of typical avalanche problems. These outputs were coupled with automated identification of Potential Release Areas (PRA) and avalanche dynamics simulations using the AvaFrame framework, together forming PRISM (Potential Release-area & Impact Scenario Modelling), which generates daily scenario-based maps of potential release and impact areas under different instability regimes. Automatic avalanche detection systems added a real-time observational layer: a geophone-based system with trafficlight control and an infrasound array enabled continuous (24/7) detection of avalanche events, even under poor visibility or during nighttime. High-resolution webcams supported rapid validation of detected events and enhanced situational awareness. Satellite-based SAR observations (Sentinel-1) provided spatially distributed evidence of avalanche activity and supported the identification of released slopes and residual hazard areas. All data streams were integrated into dedicated operational platforms, enabling real-time visualization, analysis and reporting. The strength of the approach lies in the synergy between complementary components: observations describe current conditions, models anticipate future evolution, and remote sensing validates spatial patterns. The system was successfully tested under critical conditions during February 2026, including periods of High avalanche danger (level 4 of 5), while simultaneously managing routine avalanche forecasting and risk mitigation activities typical of an inhabited alpine valley and ski resort, demonstrating the effectiveness of an integrated observation-modelling-decision framework for avalanche risk mitigation in high-stakes environments."],"kw":"avalanche risk management; multi-instrument monitoring; SNOWPACK; PRISM; Ava- Frame; SAR remote sensing; Winter Olympics","ty":"O","pp":203,"em":[],"r":3463,"pr":"Fabiano Monti"},"220":{"id":"220","t":"Consistent (Numerical) Approach for Large Scale Snow-Avalanche Hazard Update: Application to a Poorly Documented Area Like Corsica Island (Fr)","au":[{"n":"Philippe Berthet-Rambaud","raw":"Berthet-Rambaud, Philippe","p":false,"aff":""},{"n":"Stéphane Roudnitska","raw":"Roudnitska, Stéphane","p":false,"aff":""},{"n":"Jérôme Bock","raw":"Bock, Jérôme","p":false,"aff":""},{"n":"Clément Belgodère","raw":"Belgodère, Clément","p":false,"aff":""}],"ab":["The avalanche of Ortiporio (1934), village of Corsica (mountainous island situated in the Mediterra-nean Sea), caused the death of 37 persons. Despite this event was the second deadliest that occurred in France during the XXth century and despite other Corsica villages faced remarkable accidents, exhaustive assessment of this hazard was not guaranteed by available works and documentation. Based on a combined approach and considering recent climate change, the aim of this study is thus to assess avalanche hazard at the regional scale of Corsica. First, extensive bibliographic research was carried out, notably through old newspaper articles and the collection of eyewitness accounts. In parallel, and thanks to the availability of LiDAR surveys across the island, topographic and influential forest layers were built. Secondly, statistics on the limited measurements available in recent years were compiled and supported by known trends in other nearby mountain ranges. From this, a large-scale indication hazard map was processed, notably based on a recent algorithm for detecting Potential Release Areas (PRAs) using the concept of watersheds. Upon altitude limits, the entire Corsican mountain range was thus modeled, resulting in several thousand dense flow simulations using RAMMS to cover homogeneously and rather rapidly (a few weeks) two scenarios. Next, the results obtained were compared not only with historical events (first scenario) but also with existing buildings: the several dozen interaction cases were then pre-analyzed semi-automatically to determine their sensitivity by reference to the vulnerability of the asset at risk, as well as to the known strengths and weaknesses of the hazard maps obtained. A further step will be to refine the few cases that still require in-depth investigation, either using ad-ditional specific simulations (RAMMS::extended for aerosol or wet avalanches) and/or site visits by experts."],"kw":"Corsican mountain range, large-scale indicative hazard map, RAMMS climate change, protective forest effect","ty":"P","pp":204,"em":[],"r":3520,"day":"Mon","th":"Planning and Engineering","pr":"Philippe Berthet-Rambaud"},"222":{"id":"222","t":"A Survey of Terminology Factors Related to Avalanche Transceiver Use","au":[{"n":"Steve Conger","raw":"Conger, Steve","p":true,"aff":""}],"ab":["A 15-question survey was disseminated to avalanche transceiver users of any experience level and in any country, including avalanche instructors, students, and winter backcountry travelers using a variety of travel modes, from March to July 2025. Distributed in cooperation with the UIAA Avalanche Working Group, the survey’s goal was to identify the most universally accepted avalanche transceiver function terms from a global perspective that will be direct, concise, and effective during an emergent avalanche rescue situation. The survey focused on avalanche transceiver function terms (how/what a transceiver does), rather than on avalanche rescue terminology (such as signal, coarse, fine, pinpoint). This paper describes the results of the survey."],"kw":"Transceiver, Search, Standards, Education, Rescue Training","ty":"P","pp":205,"em":[],"r":3521,"day":"Mon","th":"Avalanche Rescue","pr":"Steve Conger"},"223":{"id":"223","t":"Mid-Winter Wet Slabs in Intermountain Snowpacks: How “Unusual” Is This Really?","au":[{"n":"Brooke Maushund","raw":"Maushund, Brooke","p":true,"aff":""},{"n":"Ben VandenBos","raw":"VandenBos, Ben","p":false,"aff":""}],"ab":["Mid-winter wet slab avalanche cycles are most often thought of as phenomena associated with rain-on-snow events in maritime snow climates. Intermountain and continental snow climates are generally not discussed in this regard. This work explores a 25-year dataset compiled for the Utah Avalanche Center’s Salt Lake Forecasting Zone, comparing forecasted and observed mid-winter wet slab avalanche activity. We examine wet slab forecast and occurrence timing, the frequency of midwinter wet slab forecasts and avalanches, peak weeks of mid-winter wet slab activity, and trends in these metrics over these 25 years. We also examine trends in meteorological data leading to these events, snowpack trends, and the forecast accuracy in predicting them. Results show whether midwinter wet slabs really are unusual in the intermountain snowpack of the Salt Lake Forecasting Zone in Utah, or if they’re more common than we may perceive. With Utah’s wintertime climate warm trends exceeding 2-2.5°C, and a greater percentage of coldseason low-elevation precipitation arriving as rain, these results may bring some insight into trends that may become more common in the future."],"kw":"Wet slab; mid-winter; intermountain snowpack; avalanche forecasting; Utah; Wasatch","ty":"P","pp":206,"em":[],"r":3578,"day":"Tue","th":"Avalanche Forecasting","pr":"Brooke Maushund"},"225":{"id":"225","t":"Creating Standardized Non-Verbal Communications for Guides","au":[{"n":"Shena Thomas","raw":"Thomas, Shena","p":true,"aff":""},{"n":"Iain Stewart-Patterson","raw":"Stewart-Patterson, Iain","p":false,"aff":""}],"ab":["Effective communication is critical in winter backcountry guiding, as it is often a dynamic and high-risk environment. Current communication best practices focus on prerequisite training, pre-trip briefings, radio communication, and informal hand signals. However, these processes are not fail-safe and desired communication messages can be lost. For example, clients may not retain pre-trip instructions in high-excitement situations, radios may not function correctly, environmental “noise” such as wind, precipitation, rotor wash, machine exhaust, or simply distance can hinder verbal communication. Unlike winter backcountry guiding, other high-risk industries such as aviation, SCUBA diving, and whitewater paddling utilize standardized non-verbal communication systems and signals that are universally taught and recognized. This allows for consistent and reliable communication across personnel, teams, operations, and geographic regions. Observations of heli ski, cat ski, ski touring, and motorized backcountry guiding operations and associations in Western Canada have highlighted a lack of standardized hand and body non-verbal communication. This gap is a crucial missing element to the task of optimizing the client experience in winter backcountry travel. To explore this gap, surveys, observations, and conversations have been conducted within all four winter guiding disciplines. Based on the findings, this project proposes a framework for standardized non-verbal communication in motorized backcountry guiding that can be incorporated into the CMBGA training and certification program. The framework includes a set of core hand and body signals designed for clarity, repeatability, and ease of adoption. The goal is to support more consistent communication in the field and to initiate discussion within the broader mountain guiding community, with the aim of improving alignment and connectivity in communication standards."],"kw":"Non-Verbal Communication, Guiding Standards, Standardization","ty":"P","pp":207,"em":[],"r":3640,"day":"Thu","th":"Risk Communication","pr":"Shena Thomas"},"226":{"id":"226","t":"Human-Affected Snowpack: Disturbance, Compaction, and Snowpack Development in Motorized Terrain","au":[{"n":"Shena Thomas","raw":"Thomas, Shena","p":true,"aff":""},{"n":"Jeremy Hanke","raw":"Hanke, Jeremy","p":false,"aff":""}],"ab":["Human activity is routinely visible in avalanche terrain, yet its role in snowpack development is often summarized with broad terms such as “tracked,” “packed,” or “compacted.” Those descriptions rarely identify how deeply snow was affected, how much terrain was altered, when the interaction occurred relative to layer formation and burial, or whether it reached a layer of concern. Previous controlled studies show that systematic boot packing and ski compaction can alter snowpack properties and stability-test responses when disturbance reaches relevant layers, while snowmobile research shows that repeated use can change physical and mechanical snow properties and that trigger penetration influences stress transmission. We present a practitioner-led case observation from Joss Mountain near Revelstoke, British Columbia: a repeated-use motorized corridor beside lower-use snow, with paired Snow Pilot profiles recorded on the same day. The lower-use profile recorded ECTP25 and CT 15 SP near 75 cm; the repeated-use corridor profile recorded ECTX and shallower compressiontest breaks, together with distinctly different recorded layering. The sites were paired with contextual observations rather than experimental controls, and causation is not established. Instead, the case exposes an observational gap and motivates future work using concise human-interaction descriptors - penetration, extent, pattern, use history, and layer relation - to structure future observations of humanuse history alongside snowpack development and potential fracture behavior. The resulting observation concept has implications for research comparability, professional observation, forecast interpretation, avalanche education, and communication with recreational users."],"kw":"Human-Affected snowpack, observing and recording, disturbance, compaction, motorized terrain, snowpack development","ty":"P","pp":208,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"Shena Thomas"},"227":{"id":"227","t":"A Physics-Informed Data-Driven Framework for Real-Time Avalanche Runout Prediction Using SNOWPACK Simulations and Velocity Measurements","au":[{"n":"Bettina Richter","raw":"Richter, Bettina","p":true,"aff":""},{"n":"Anselm Köhler","raw":"Köhler, Anselm","p":false,"aff":""},{"n":"Pierre Huguenin","raw":"Huguenin, Pierre","p":false,"aff":""},{"n":"Nander Wever","raw":"Wever, Nander","p":false,"aff":""},{"n":"Eloïse Bovet","raw":"Bovet, Eloïse","p":false,"aff":""},{"n":"Betty Sovilla","raw":"Sovilla, Betty","p":false,"aff":""}],"ab":["As most mass movement model were calibrated to reproduce extreme avalanches, their link to daily snow cover remains poorly constraint. In this study, we introduce a physics-informed, data-driven framework for real-time avalanche runout prediction that directly links observed avalanche dynamics to modeled snowpack properties. We use almost eight years of automated observations from Vallée de la Sionne, Switzerland, comprising 149 avalanches across a wide range of magnitudes and flow regimes. Avalanche front velocities derived from GEODAR measurements and local terrain slopes are used to estimate spatially varying friction coefficients. The inferred friction coefficients are paired with spatially distributed snowpack properties simulated with Alpine3D at 25m resolution, yielding more than 15,000 friction– snowpack samples. A histogram gradient-boosting regressor is trained on these data to predict Coulomb friction from local snowpack and meteorological conditions. The trained model is then coupled to a mass-point model representing the avalanche paths at Vallée de la Sionne. Avalanches are initiated from an ensemble of potential release locations, with friction predicted from the local snowpack conditions, and propagated downslope until motion ceases. The resulting ensemble provides a distribution of potential runout elevations. By linking friction directly to modeled snow conditions, the framework reduces reliance on event-specific friction calibration and provides a computationally efficient approach for translating simulated snowpack conditions into realtime avalanche runout predictions, with potential applications in operational hazard forecasting."],"kw":"Avalanche dynamics, runout predictions, data-driven model, SNOWPACK.","ty":"O","pp":209,"em":[],"r":3410,"pr":"Bettina Richter"},"228":{"id":"228","t":"Review of long-term climate and avalanche activity at Glacier National Park, B.C., Canada from 1965 to 2025","au":[{"n":"Benjamin Imbach","raw":"Imbach, Benjamin","p":true,"aff":""},{"n":"Jean-Benoit Madore","raw":"Madore, Jean-Benoit","p":false,"aff":""},{"n":"Andrew Jones","raw":"Jones, Andrew","p":false,"aff":""},{"n":"Francis Gauthier","raw":"Gauthier, Francis","p":false,"aff":""},{"n":"Alexandre Langlois","raw":"Langlois, Alexandre","p":false,"aff":""},{"n":"Philippe Gachon","raw":"Gachon, Philippe","p":false,"aff":""}],"ab":["This paper reviews long-term changes in climate and avalanche activity at Glacier National Park (GNP), British Columbia, Canada, updating the record examined by Bellaire et al., (2013) and Bellaire et al., (2016) with more than a decade of additional weather, snow, and avalanche observations. We replace the original ordinary-least-squares trend statistics with Mann-Kendall significance testing and Theil-Sen slope estimation, computed over both the full record (1965 to 2026) and the most recent 30 seasons (1997 to 2026). Trend analysis shows that air temperature warms significantly in all four seasons over the full record, with summer emerging as the strongest warming signal among the four seasons and the only one to show recent acceleration at both stations. Maximum 24-hour snowfall declines significantly and more steeply at the lower-elevation Rogers Pass station than at the higher-elevation Mount Fidelity. Natural avalanche activity increases significantly over the full record but not over the most recent 30 years, while wet and mixed avalanche days in late spring show a marked and accelerating increase."],"kw":"avalanche climate, climate trends, Mann-Kendall trend test, snow cover, wet avalanches, Glacier National Park","ty":"P","pp":210,"em":[],"r":null,"day":"Fri","th":"Weather Forecasting and Climate","pr":"Benjamin Imbach"},"230":{"id":"230","t":"Does It Always Snow in July, or Rain in December? Melt-Freeze Recrystallization in the Midst of a Record Setting Season","au":[{"n":"David Kelly","raw":"Kelly, David","p":true,"aff":""},{"n":"Drew Hardesty","raw":"Hardesty, Drew","p":false,"aff":""}],"ab":["The winter of 2025-2026 set records for below average snowfall. Compared to the winter of 2022-2023, which set records for above average snowfall, one would think the similarities would be few and far between. However, midstorm crusts and near-surface facets are not in tune with seasonal averages. In early April 2026 we observed a lateseason mid-storm melt-layer recrystallization event. In this paper we will discuss how this layer formed, was identified, and preserved, as well as the response that public forecasters took and could take in the future to communicate avalanche hazard from snow and weather events that are not observed in the Central Wasatch on a regular basis."],"kw":"","ty":"P","pp":211,"em":[],"r":null,"day":"Fri","th":"Incidents and Case Studies","pr":"David Kelly"},"232":{"id":"232","t":"Assessing Public Backcountry Avalanche Forecasts","au":[{"n":"Ethan Davis","raw":"Davis, Ethan","p":true,"aff":""},{"n":"Zachary Miller","raw":"Miller, Zachary","p":false,"aff":""},{"n":"Scott Savage","raw":"Savage, Scott","p":false,"aff":""},{"n":"Dallas Glass","raw":"Glass, Dallas","p":false,"aff":""},{"n":"Spencer Logan","raw":"Logan, Spencer","p":false,"aff":""},{"n":"Ethan Greene","raw":"Greene, Ethan","p":false,"aff":""},{"n":"Blase Reardon","raw":"Reardon, Blase","p":false,"aff":""},{"n":"Christine Donnelly","raw":"Donnelly, Christine","p":false,"aff":""},{"n":"Andrew Schauer","raw":"Schauer, Andrew","p":false,"aff":""}],"ab":["Avalanche danger ratings are the cornerstone of a public backcountry avalanche forecast, and the \"Tier 1\" danger — the highest rating across all elevation bands — is its most significant and farreaching component. This project investigates Tier 1 danger ratings at five North American avalanche centers via forecast assessments conducted from 2019 through 2026, using two approaches: one within 24–72 hours of the forecast date and one in the off-season, both leveraging additional observed avalanche and weather information. We ask how often Tier 1 danger changes during assessment and what factors drive those changes. Previous studies found that assessed Tier 1 danger differed from forecast Tier 1 danger in 16–25% of forecasts (Techel and Schweizer, 2017; Statham et al., 2018b; Logan and Greene, 2023; Donnelly and Reardon, 2024); across 15,576 forecast-zone-days, our data show a 15.8% equalweighted change rate, with center-level rates spanning 3.4% to 32.2%. Among changed ratings, 73% were overforecast and 27% underforecast, and almost all moved by a single danger level. Change rates rise steadily with forecast danger and fall with forecaster confidence. Storm Slab and Wet Loose problems are the most volatile. Day 2 Tier 1 ratings change 1.7–4.2 times as often as Day 1 forecasts. Danger level, forecaster confidence, and avalanche problem type predict revision across centers. Forecast assessment can identify recurring sources of mismatch and guide improvements in Tier 1 consistency within a program, but each center's rate reflects its own assessment design as much as its forecasting, so comparing programs will require a shared protocol."],"kw":"regional avalanche forecasting, forecast verification, forecast assessment, avalanche danger, forecaster confidence","ty":"P","pp":212,"em":[],"r":3580,"day":"Tue","th":"Avalanche Forecasting","pr":"Ethan Davis"},"234":{"id":"234","t":"A Preliminary Statistical Assessment of Instability Predictability in Observed Snow Profiles","au":[{"n":"Sondre Wold","raw":"Wold, Sondre","p":false,"aff":""}],"ab":["Observational recordings of snow conditions help avalanche forecasters assess snowpack instability over large areas. In Norway, trained observers submit snow profiles and Extended Column Test (ECT) results through the RegObs platform as part of the national avalanche forecasting service. However, observations collected under field conditions contain unavoidable noise, raising the question of how much information about snow instability is preserved in recorded snow profiles. Using six seasons of observational data from Norway, we investigate this question using ECT outcome as a proxy for snow instability. We train a suite of machine learning classifiers to predict ECT outcome from recorded profiles, using classifier performance as an empirical estimate of the predictive signal in the data. We find that models that process the snowpack layer-by-layer outperform models based on profile-level aggregates, showing that the layered structure of the snowpack carries information that can be lost through aggregation. We also provide an estimation of the association between different grain types and ECT outcome using the pointwise mutual information."],"kw":"instability tests, sequence modeling, data validation, machine learning","ty":"P","pp":213,"em":[],"r":3522,"day":"Mon","th":"Artificial Intelligence","pr":"Sondre Wold"},"235":{"id":"235","t":"A Process for Making Evidence-Based Updates to Course Leader Training Curriculum","au":[{"n":"Ron Funderburke","raw":"Funderburke, Ron","p":true,"aff":""},{"n":"Emma Walker","raw":"Walker, Emma","p":false,"aff":""}],"ab":["The American Institute for Avalanche Research & Education (AIARE) trains avalanche practitioners to effectively teach recreational students. In this model, avalanche professionals can enroll in an Instructor Training Course (ITC) and subsequent Course Leader Training (CLT), where subject matter experts are given tools and practice to deliver AIARE recreational curriculum in a productive learning environment. In 2018, AIARE revised the methodology, curriculum, and sequence for training avalanche education instructors to correspond with two newly introduced levels of professional training, the PRO 1 and PRO 2, which are prerequisites for those courses, respectively. Since then, AIARE has trained 726 instructors and 250 course leaders to enter the avalanche education ecosystem. AIARE’s evaluation of its course leader training revealed performance and effectiveness trends relevant to the entire industry. This paper will review the education research and MEL frameworks utilized to evaluate course leader performance after training, the effectiveness of AIARE’s training curriculum, and the training process from prerequisites to precourse work to in-person training to continuing education. AIARE’s evaluation inspired a three-phase adaptation and update process, which this paper proposes as a model for similar training curriculum updates. We designed a new portrait of training proficiency and corresponding performance criteria based on the most obvious imperatives from research and program evaluation. We deployed three different versions of the CLT curriculum, based on three different design philosophies, and analyzed the performance of those programs. Lastly, we hybridized the successes and addressed the challenges of each curriculum, combining them into a single updated curriculum that will be uniformly instructed beginning in the 2026–27 season. In order to instigate a process as painstaking as program evolution, we propose our research and design process as one pathway others might emulate or improve upon."],"kw":"Avalanche education; Program evaluation; Educational best practices; pedagogy; operational leadership.","ty":"P","pp":214,"em":[],"r":3523,"day":"Mon","th":"Avalanche Education","pr":"Ron Funderburke"},"237":{"id":"237","t":"Operational Strategies for Improving Avalanche Risk Perception Amongst Workers: A Practical Approach to Culture Change","au":[{"n":"Johanna Kelly","raw":"Kelly, Johanna","p":true,"aff":""}],"ab":["The Snowbird Snow Safety team has identified a need to better communicate the avalanche risk analysis process to ski patrollers on the front line. Recently, we have recognized that patrollers have been uninformed of the expectations that we, as forecasters, hold for them regarding the level of residual risk they accept while performing avalanche hazard mitigation. This lack of communication has led to misunderstandings of risk acceptance and misgivings toward the forecasting team. By implementing new operational strategies, our goal has been to address these deficiencies to improve our workplace culture. In this paper we will discuss three operational strategies that have been implemented at Snowbird to shift the culture towards more transparency and mutual trust between ski patrollers and the Snow Safety (forecaster) team. The first operational strategy outlines methodic record-keeping of patrol avalanche involvements, made accessible to both patrollers and forecasters. The second strategy will discuss targeted communication of methods for reducing vulnerability and exposure to patrollers performing avalanche hazard mitigation. This was a crucial step towards getting patrollers and forecasters on the same page with perceived risk, and segued into the question of what is an acceptable level of risk for patrollers? In answering this query, the forecast team developed their third strategy: an operational risk band specifically for patrollers, presented in pre-season training. Since integrating these strategies, we have noticed a shift toward higher levels of reporting avalanche involvements and near-misses, more open discourse about these events, and a stronger relationship between patrollers and the forecasting team. This paper will discuss how these strategies were developed and the challenges faced in communicating them to the team."],"kw":"Risk communication, operational risk band, culture change, risk acceptance","ty":"O","pp":215,"em":[],"r":3392,"pr":"Johanna Kelly"},"238":{"id":"238","t":"Beyond the Slide: Insights from Beneath the Surface of the Snow Safety Industry","au":[{"n":"Ian Snape","raw":"Snape, Ian","p":false,"aff":""},{"n":"Gary Kuehn","raw":"Kuehn, Gary","p":true,"aff":""},{"n":"McKeira Cumming","raw":"Cumming, McKeira","p":false,"aff":""},{"n":"Zhen Goh","raw":"Goh, Zhen","p":false,"aff":""},{"n":"Jeff Montgomery","raw":"Montgomery, Jeff","p":false,"aff":""}],"ab":["Snow safety professionals — patrollers, forecasters, guides, educators, and operational staff — work in some of the most unstable environments on Earth, carrying immense responsibility for others’ safety while making rapid, highstakes decisions in unpredictable conditions. This paper presents findings from a global study of 114 snow safety professionals across North America, New Zealand, and Europe, comparing their experiences against a broader dataset of over 2,540 respondents in other frontline roles. Using Sensemaker® narrative capture methodology, participants shared real-world examples and self-signified their experiences through a structured framework revealing patterns of culture, stress, support, and systemic risk. Results show a profession built on purpose and passion, yet strained by fatigue, moral burden, disrupted recovery, and limited organisational support. Snow safety professionals report a Net Promoter Score of −65, with 79% experiencing a sense of threat from clients, co-workers, or managers. Disrupted sleep following critical incidents is widespread. While leadership in snow safety tends toward consultative approaches, the sector lacks consistent systems for recovery, debriefing, and psychological support. The industry must strengthen recovery systems, decision-making support, and leadership capability, embedding psychological safety and organisational trust to move beyond endurance toward sustainable performance and long-term wellbeing."],"kw":"snow safety, psychological safety, resilience, Sensemaker®, frontline wellbeing, decision-making","ty":"P","pp":216,"em":[],"r":3581,"day":"Tue","th":"Operations and Program Management","pr":"Gary Kuehn"},"239":{"id":"239","t":"Establishing a Collaborative Python Library for Parsing and Post-Processing Snow Cover Simulations: XSnow","au":[{"n":"Florian Herla","raw":"Herla, Florian","p":true,"aff":""},{"n":"Ron Simenhois","raw":"Simenhois, Ron","p":false,"aff":""},{"n":"Simon Horton","raw":"Horton, Simon","p":false,"aff":""},{"n":"Léo Viallon-Galinier","raw":"Viallon-Galinier, Léo","p":false,"aff":""},{"n":"Mathias Bavay","raw":"Bavay, Mathias","p":false,"aff":""},{"n":"Michael Reisecker","raw":"Reisecker, Michael","p":false,"aff":""},{"n":"Pascal Haegeli","raw":"Haegeli, Pascal","p":false,"aff":""}],"ab":["Detailed snow cover models such as SNOWPACK and CROCUS have become valuable tools for avalanche warning services. Increasingly ambitious applications, including gridded simulations, ensembles, and semi-automated products, now produce large multidimensional datasets that are difficult to manage and analyze. In practice, postprocessing has often relied on institution-specific and often ad-hoc solutions. This has strained limited development resources, challenged scalability, and made it difficult to share methods across the international snow and avalanche community. The need for a shared foundation surfaced through AvaCollabra, an international snow and avalanche modeling community, while comparing existing approaches and discussing best practices. This bottom-up initiative resulted in xsnow, an open-source Python library that connects raw snow cover model output with downstream processing applications. Its foundation is a labeled, multidimensional data model that represents collections of profiles across locations, times, slopes, model realizations, and snow layers. A common input-output layer and extension framework allow specialized methods to build on the same foundation and be shared across the community. Several projects already use this foundation for direct model output, interactive profile visualization, community postprocessing extensions, and weather-forcing pre-processing. This paper introduces xsnow’s conceptual architecture and extension philosophy and provides an early view of its emerging ecosystem. As the library continues to evolve, up-to-date tutorials, detailed documentation, and links to external extensions and applications are maintained at https://xsnow.avacollabra.org."],"kw":"snow cover modeling, avalanche forecasting, post-processing, gridded data model, open- source software, community-driven","ty":"P","pp":217,"em":[],"r":3641,"day":"Thu","th":"Modelling and Quantitative Forecasting","pr":"Florian Herla"},"240":{"id":"240","t":"How and Why Are SNOWPACK Models Used Operationally?","au":[{"n":"Zachary Miller","raw":"Miller, Zachary","p":true,"aff":""},{"n":"Simon Horton","raw":"Horton, Simon","p":false,"aff":""},{"n":"Stan Nowak","raw":"Nowak, Stan","p":false,"aff":""},{"n":"Christine Donnelly","raw":"Donnelly, Christine","p":false,"aff":""}],"ab":["Public avalanche forecasters in North America rely on sparse weather station and field observation networks, coupled with numerical weather models, to predict avalanche danger—a challenge complicated by the large size of forecast regions (often exceeding 2500 km²). SNOWPACK models offer a more spatially comprehensive view of avalanche hazards than the sparse traditional data sources afford, yet remain underutilized operationally. This study examines how and why forecasters use SNOWPACK, focusing on two factors driving adoption: organizational familiarity/training and trust in model outputs. We surveyed public avalanche forecasters in Canada and the United States (U.S.) during the 2025– 2026 winter (n = 80, 6 forecast centers) to identify how SNOWPACK was integrated into their workflows. Results suggest that SNOWPACK frequently has an indirect influence on forecaster assessments of danger. Forecasters with longer-term exposure and more structured training reported more frequent integration, while those with more recent or limited exposure described more exploratory use. Specifically, Canadian forecasters, who have more experience and training with SNOWPACK, reported that it influenced their decisions 77% of the time compared to only 57% for U.S. forecasters. The survey also characterized forecaster trust in SNOWPACK outputs. Lower trust was reported following atmospheric rivers, during persistent weak layer formation, and wetting front evolution. To contextualize this self-reported trust, we compared SNOWPACK-derived hazard outputs with forecasted avalanche danger and problems. General regional and seasonal trends aligned well, but problem-specific agreement varied, contributing to periods of lower perceived accuracy. SNOWPACK model outputs and interactive dashboards are an ever-improving toolset for avalanche forecasters. The results of the survey and contextual support of the hazard analysis indicate that SNOW- PACK model utility for public avalanche forecasting depends on a combination of familiarity and training as well as trust developed from applied use. This research supports more widespread operational adoption of models in two ways; first, by informing developments that would make SNOWPACK tools more accurate and useful, and second, by suggesting operational training and practice strategies for working with these tools."],"kw":"avalanche forecasting, snowpack modeling, large-scale operational model chain, spatial variability, avalanche problems","ty":"O","pp":218,"em":[],"r":3489,"pr":"Zachary Miller"},"242":{"id":"242","t":"ATES for Operational Terrain Management in the USA for Motorized and Non-Motorized Groups","au":[{"n":"Lee K. Blazek","raw":"Blazek, Lee K.","p":true,"aff":""}],"ab":["The Avalanche Terrain Exposure Scale (ATES) is widely used to classify avalanche terrain for recreational trip planning, yet its role in structured operational decision-making remains underdeveloped in the USA as opposed to Canada. Professional programs—guiding operations, avalanche education providers, and organized recreation groups —must repeatedly select terrain under changing hazard conditions while managing participants with varying experience, led by staff with different qualifications. This paper adapts ATES from a static terrain classification into a practical tool for Operational Terrain Management (OTM) that explicitly incorporates guide and instructor qualification. We present a structured method and matrices relating ATES class, daily avalanche danger, leader qualification, supervision level, and travel mode to predefined terrain allowances and constraints, with qualification drawn from the American Avalanche Association (A3) pro certifications and membership held by guides, instructors, and supervising staff, on terrain class. It assumes a catalogue of operational terrain units rated using ATES. Limitations for operational use are examined—map-scale resolution, terrain interpretation variability, micro-terrain below regional resolution, and motorized-specific travel—with recommendations for organizations adopting the framework."],"kw":"Avalanche Terrain Exposure Scale (ATES), Operational Terrain Management, Terrain Management, Scales of Travel in Avalanche Terrain, Snowmobiling and Motorized Travel","ty":"P","pp":219,"em":[],"r":3582,"day":"Tue","th":"Snowmobiling and Motorized Access","pr":"Lee K. Blazek"},"244":{"id":"244","t":"Climate-Driven Shifts in Snowpack Conditions Favorable for Wet Snow Avalanches: Insights from Snow Cover Model Simulations","au":[{"n":"Andrea Bruckmeier","raw":"Bruckmeier, Andrea","p":true,"aff":""},{"n":"Christoph Mitterer","raw":"Mitterer, Christoph","p":false,"aff":""},{"n":"Karl Birkeland","raw":"Birkeland, Karl","p":false,"aff":""},{"n":"Eric Sproles","raw":"Sproles, Eric","p":false,"aff":""},{"n":"Erich Peitzsch","raw":"Peitzsch, Erich","p":false,"aff":""}],"ab":["Forecasting wet snow avalanches remains a major challenge due to their temporal and spatial variability. Long-term climate trends are producing more variable and extreme weather, creating conditions outside historical experience, and increasing forecasting uncertainties. To assess how climate change affects the frequency and timing of wet snow avalanches, we examined the long-term conditions that support wet snow formation. Specifically, we ask: Will the onset of wet snow avalanche conditions or season end shift toward the mid century? And will maximum snow height decrease in avalanche starting zones? To address these questions, we analyze long-term snow cover simulations across our study site in Glacier National Park, Montana, located in an intermountain snow climate. We examined trends in simulated snow depth, and timing of liquid water infiltration over the past four decades (1979–2023) using a physically based snow cover model. To force the model with meteorological data, we use the long-term regional hydroclimate reanalysis dataset U.S. Geological Survey CONUS404 with 4 km spatial resolution and 1h temporal resolution. The use of gridded meteorological inputs to drive a one-dimensional point model introduces inherent scale mismatches. To address this limitation, we use multiple grid points within the study area to simulate a more representative, generalized snowpack, and filter the grid points based on elevation to distinguish between upper- and mid-elevation starting zones. Finally, we analyzed shifts in snow depth, melt-out-day, and LWCindex (bulk liquid water content (LWC) normalized by the residual water content). We use snow depth as a proxy for changes in slab thickness, the LWCindex as an indicator of wet snow avalanche conditions, and melt-out date as a measure of shifts in season length. We ran simulations on flat terrain and on north- and south-facing virtual slopes (38°), across midelevation (1,600–1,900 m) and upper-elevation (≥1,900 m) sites for the historical dataset as baseline and a Pseudo- Global-Warming (PGW) dataset to identify a warming driven shift. Across all aspects and both elevation bands, PGW forcing produces a consistent reduction in annual maximum snow depth (median shift −0.15 to −0.26 m, p < 0.001) over 44 seasons, with the largest reductions on north-facing slopes and a modest but significant strengthening of this reduction over the 44-year simulated record. Melt-out starts 10–14 days earlier under PGW across all aspect– elevation combinations (p < 0.001), again most pronounced on north-facing, higher-elevation terrain. The LWCindex threshold-crossing dates likewise shift earlier under PGW, indicating an earlier onset of wet snow avalanche conditions across the domain. Together, these results point to a snowpack that is both thinner and wetter earlier in the season under future warming, with the strongest signal consistently on north-facing slopes at higher elevation. This work lays the groundwork for climate-informed forecasting and mitigation and offers historical context for avalanche operations in a changing climate. Understanding long-term trends can help avalanche professionals interpret current observations, improve wet snow avalanche forecasting, and develop more effective mitigation strategies in a warming climate."],"kw":"SNOWPACK, wet snow, snow depth, PGW, long-term trends, avalanche forecasting","ty":"P","pp":220,"em":[],"r":null,"day":"Fri","th":"Weather Forecasting and Climate","pr":"Andrea Bruckmeier"},"245":{"id":"245","t":"Stability Changes After Weak Layer Collapse: Insights from an Unexpected Dataset","au":[{"n":"Andrea Bruckmeier","raw":"Bruckmeier, Andrea","p":true,"aff":""},{"n":"Erika Birkeland","raw":"Birkeland, Erika","p":false,"aff":""},{"n":"Karl W. Birkeland","raw":"Birkeland, Karl W.","p":false,"aff":""},{"n":"Ron Simenhois","raw":"Simenhois, Ron","p":false,"aff":""},{"n":"Alex Marienthal","raw":"Marienthal, Alex","p":false,"aff":""},{"n":"Erich Peitzsch","raw":"Peitzsch, Erich","p":false,"aff":""}],"ab":["While conducting avalanche mitigation or traveling through the backcountry, avalanche professionals sometimes experience a “whumpf”: a collapse-mode crack accompanied by surface cracking that does not produce an avalanche. These whumpfs are a clear warning sign of instability in the surrounding terrain. But assessing the collapsed slope itself, if it is steep enough to avalanche, carries much more uncertainty. Can slopes that whumpf and are steep enough to slide still avalanche? The answer to this question supports avalanche mitigators and ski guides in assessing whether to open such slopes. Previous research on collapsed slopes is limited to one study conducted before tests that estimate crack propagation propensity, such as the Propagation Saw Test (PST), were developed. This work showed that weak layer shear strength decreased immediately after collapsing and then increased over time. However, no research has examined crack propagation propensity after a whumpf. Studying propagation propensity is key for assessing how whumpfs immediately affect slope stability. To improve our understanding of changes in propagation propensity following weak layer collapse, we conducted PSTs on a test slope in the hours and days after an unexpected collapse occurred on a layer of surface hoar. Two PSTs at our study site three days prior to this collapse provided an estimate of weak layer propagation propensity. PST cut lengths decreased immediately following the collapse, suggesting that the collapse increased the propagation propensity. However, over the next 4-5 hours, PST cut lengths steadily increased at our site, likely due to ongoing sintering and strengthening in the collapsed weak layer. By the end of day two, we were no longer able to initiate propagation, suggesting substantial stabilization of the weak layer. Our results support prior findings and observations suggesting that slopes may remain capable of producing avalanches immediately after a collapse but likely stabilize over the next day or two. Although this research does not provide answers about precisely when a slope becomes stable after a collapse, it does highlight uncertainties in our understanding and interpretation of the stability of slopes that have whumpfed."],"kw":"whumpf, crack propagation, Propagation Saw Test (PST), snowpack stability, avalanche release","ty":"O","pp":221,"em":[],"r":3416,"pr":"Andrea Bruckmeier"},"246":{"id":"246","t":"ISSW- Ski Resort Terrain Expansion: A Tale of Compaction and the Monkey in the Middle","au":[{"n":"Rocket (Richard) Miller","raw":"Miller, Rocket (Richard)","p":true,"aff":""}],"ab":["Lake Louise Ski Resort’s terrain expansion follows our 2019 Long Range Plan approved by Parks Canada. The West Bowl expansion adds 480 acres of avalanche prone terrain. The scale and variability in aspect and elevation create operational complexity. Timely effective compaction is the critical factor. Early season compaction shapes basal layer development and winter stability; missed opportunities allow weak layers to persist and can delay or prevent terrain openings. West Bowl avalanche path is the \"monkey in the middle.” Timely effective compaction provides the optimum opportunity to open the rest of the terrain. Missed opportunities delays all of it. However, effort here must be balanced with core ski area priorities."],"kw":"","ty":"P","pp":222,"em":[],"r":3583,"day":"Tue","th":"Operations and Program Management","pr":"Rocket (Richard) Miller"},"247":{"id":"247","t":"Tracking Water in Snow: Bridging Sensor Data and Model Simulations","au":[{"n":"Andrea Bruckmeier","raw":"Bruckmeier, Andrea","p":true,"aff":""},{"n":"Christoph Mitterer","raw":"Mitterer, Christoph","p":false,"aff":""},{"n":"Robyn Gotz","raw":"Gotz, Robyn","p":false,"aff":""},{"n":"Eric Sproles","raw":"Sproles, Eric","p":false,"aff":""},{"n":"Erich Peitzsch","raw":"Peitzsch, Erich","p":false,"aff":""}],"ab":["Forecasting wet slab avalanches remains one of the most demanding challenges in operational avalanche forecasting. A key obstacle is the difficulty of observing and quantifying liquid water content (LWC) and tracking its infiltration into the snowpack. Field measurements are labor-intensive, highly variable in space, and often influenced by user application or sensor design — making them impractical for forecasting operations. In this study, we evaluated LWC measurements obtained from two capacitive sensors, the SLF SnowPro-17 and -25, and compared them with simulations from the snow cover model SNOWPACK. We analyzed five selected days with pronounced melt events during spring 2025 at Bridger Bowl Ski Area, Montana. The SnowPro-17 measured LWC on the sidewall and the SnowPro-25 was inserted into the pit wall. We then analyzed measurements from the two sensors to assess consistency and potential bias. For each of the five days, we also analyzed liquid water infiltration by layer, comparing field measurements with model-simulated LWC. This allowed us to assess how well the model captured both the timing and magnitude of infiltration processes relative to in-situ observations. Our results show that, the absolute LWC values differ by approximately 1% by vol. on average between measurements from the capacitive sensors, but the timing of liquid water infiltration is largely consistent across both measurements and model simulations. Within our sample, the SnowPro-17 consistently reports higher mean LWC values than the SnowPro-25, and exhibits greater variability, indicated by a larger standard deviation. We found good agreement when we compared in-situ sensor measurements to LWC infiltration in snow cover model simulations. This suggests that, despite measurement challenges and sensor variability, SNOWPACK can provide valuable information on the timing of LWC infiltration. For practitioners, this work highlights that reliable forecasting of wet slab avalanches depends on understanding when and how liquid water reaches critical layers. Because direct LWC measurements are rarely feasible in operational settings, using physically based models may offer a practical pathway forward."],"kw":"liquid water content, SNOWPACK, in-situ measurements, avalanche forecasting","ty":"P","pp":223,"em":[],"r":3643,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Andrea Bruckmeier"},"249":{"id":"249","t":"Lessons Learned from an Unprecedented Season in Southcentral Alaska.","au":[{"n":"Daniel Krueger","raw":"Krueger, Daniel","p":true,"aff":""},{"n":"Andrew Schauer","raw":"Schauer, Andrew","p":false,"aff":""}],"ab":["In the winter of 2024-25, the Chugach National Forest Avalanche Center (CNFAC) in southcentral Alaska experienced an exceedingly dangerous snowpack, with a layer of well-preserved surface hoar that was responsible for at least 46 human-triggered avalanches and 4 fatalities during a six-week period from mid-February through late March. At least three factors– geographic location, widespread distribution, and prolonged sensitivity to human triggering– contributed to these unusually dangerous conditions. This unprecedented snowpack setup required a critical shift in CNFAC operational mindset and public risk communication strategies. This drove the CNFAC’s decision to keep the danger rating at Considerable or higher for 46 consecutive days, doubling the previous record of 23 days during the 2012-13 season. In this paper we discuss how the CNFAC identified and adapted to these conditions, and how the CNFAC mitigated cumulative stress and fatigue during this challenging season. We also discuss how one fatal accident during this avalanche cycle highlights a critical need in avalanche awareness and education in the growing demographic of very capable but less experienced young motorized users. We hope this paper serves to guide decisions made in the future, whether on a professional or recreational level, and that the lessons we learned can be useful when faced with any exceptionally dangerous conditions, regardless of the snowpack specifics."],"kw":"buried surface hoar, risk communication, message fatigue","ty":"P","pp":224,"em":[],"r":3584,"day":"Tue","th":"Avalanche Forecasting","pr":"Daniel Krueger"},"250":{"id":"250","t":"Beyond “Safety First” Framing Decision Making and Risk Management in Guide Training","au":[{"n":"Geoff Osler","raw":"Osler, Geoff","p":false,"aff":""},{"n":"Steve Holeczi","raw":"Holeczi, Steve","p":false,"aff":""}],"ab":["Mountain guiding—and training and assessing guides—involves making complex decisions under uncertainty while balancing exposure and vulnerability to a variety of mountain hazards. Weather, conditions, terrain, and human factors are always changing, and the number of decisions in a day can be overwhelming. A sound decision-making process is critical, but that process depends on how the situation is framed. Framing defines what we’re trying to accomplish and what trade-offs are acceptable. It provides a reference point for decision-making. Without it, individuals are left to interpret objectives and risk tolerance on their own, often leading to inconsistent decisions. The Association of Canadian Mountain Guides (ACMG) Training and Assessment Program (TAP) faces an added layer of complexity. Instructors are training and assessing guides in real environments, with real hazards, while balancing learning, performance, and risk. To support this, framing is made explicit through clearly defined overall goals that are communicated in advance and adapted as conditions change. The paper, and corresponding presentation, outline how the Training and Assessment Program approaches framing in practice, focusing on defining “reasonable” risk, improving instructor consistency, and adapting in complex and uncertain environments."],"kw":"","ty":"O","pp":225,"em":[],"r":null,"pr":"Geoff Osler"},"251":{"id":"251","t":"Keeping People Safe in Our Mountains – Toward an Autoatesbased Avalanche Modeling System for the Southern Alps, Aotearoa New Zealand","au":[{"n":"Philip Elder","raw":"Elder, Philip","p":true,"aff":""},{"n":"Nicolas Cullen","raw":"Cullen, Nicolas","p":false,"aff":""},{"n":"Aubrey Miller","raw":"Miller, Aubrey","p":false,"aff":""}],"ab":["Snow avalanches present risks to people and infrastructure in mountain environments worldwide. In Aotearoa New Zealand, growing participation in alpine recreation and tourism, together with changing snow and weather conditions, is increasing the need for accessible and reliable tools that support avalanche risk management. The New Zealand Avalanche Advisory provides regional forecasts of current avalanche conditions, but there is currently no nationally implemented system for systematically classifying exposure to avalanche terrain. Such terrain information could complement existing avalanche forecasts and support more informed route selection and backcountry travel decisions. The Avalanche Terrain Exposure Scale (ATES) provides an established framework for classifying and communicating exposure to avalanche terrain, while the recent development of AutoATES has enabled terrain classification to be automated over large areas. This study evaluates and adapts the AutoATES framework for application in Aotearoa New Zealand through the development of New Zealand mountain ATES (NZmATES). The modeling framework integrates terrain characteristics, potential avalanche release areas, simulated avalanche runout and vegetation effects to automatically classify terrain according to avalanche exposure. The approach is initially applied to the Craigieburn Range in the Southern Alps, where model outputs are being evaluated and refined using historical avalanche information and local alpine expertise. A graphical user interface has also been developed to facilitate parameter adjustment, model calibration and application across different mountain environments. This pilot study demonstrates the feasibility of applying AutoATES in New Zealand and establishes a framework for systematic validation and expansion of NZmATES across the Southern Alps. Ultimately, NZmATES is intended to complement existing avalanche forecasting by providing detailed, terrain-based information that can be combined with current snowpack and weather conditions to support safer decision making in New Zealand’s mountains."],"kw":"Avalanche Terrain Exposure Scale (ATES), Terrain, Avalanche Hazard, New Zealand","ty":"P","pp":226,"em":[],"r":3585,"day":"Tue","th":"Avalanche Forecasting","pr":"Philip Elder"},"254":{"id":"254","t":"From Raw Data to Decision Support: Derived Variables and Quality Control for Automated Weather Stations","au":[{"n":"Michael Conlan","raw":"Conlan, Michael","p":false,"aff":""}],"ab":["Data from automated weather stations (AWS) are often a critical input for avalanche forecasting. Snow depth, precipitation, snow water equivalent (SWE), wind, and air temperature measurements provide insight into loading and warming processes that influence snow stability. AWS data are susceptible to sensor errors and environmental interference. For example, a rimed anemometer may report persistently low wind speed or constant directions, and a snow depth sensor may report oscillating data due to an uneven snow surface. While some guidance exists for quantitative analysis of AWS data from partner fields such as meteorology and climate science, avalanche forecasting’s needs differ. Avalanche forecasters could benefit from a consistent and meaningful approach to data interpretation and quality control for common AWS sensors, which is described in this paper. Snow-related variables, including amounts of new snow and snowfall rate, are calculated from snow depth sensor measurements. New snow is of primary importance for forecasting, so we describe and compare different calculation methods based on operational experience. Precipitation and SWE variables are derived using similar approaches from precipitation gauge and snow pillow data. Wind variables derived from anemometer measurements include summary statistics such as maximum and mean wind speed, gust, and direction. Air temperature variables include minimum, maximum, and change over defined time periods. We also derive the multi-sensor variable snow-to-liquid ratio. To illustrate the value of these derived variables and establish a common vocabulary for avalanche professionals, we describe the derivations we created and the specific scenarios and weather regimes in which some are more or less appropriate. We also discuss quality-control criteria and objective thresholds for identifying and addressing erroneous data. Across 544 AWS during the 2025–2026 season, at least one threshold flagged 6.9 % of station-hours. The derived variables and quality-control thresholds described in this paper are currently implemented in a weather data tool used by Avalanche Canada’s public avalanche forecasting team. The approach defined in this paper provides a transparent and transferable methodology for standardizing AWS data processing to support avalanche forecasting programs."],"kw":"automated weather station; weather variables; quality control; thresholds; avalanche forecasting","ty":"P","pp":227,"em":[],"r":3586,"day":"Tue","th":"Avalanche Forecasting","pr":"Michael Conlan"},"255":{"id":"255","t":"From Point to Slope: Assessing Weather Station Snow Depth Representativeness Using lidar and Geostatistics","au":[{"n":"Katreen M. Wikstrom Jones","raw":"Jones, Katreen M. Wikstrom","p":true,"aff":""},{"n":"Gabriel J. Wolken","raw":"Wolken, Gabriel J.","p":false,"aff":""},{"n":"Michael Janes","raw":"Janes, Michael","p":false,"aff":""}],"ab":["Weather station data are widely used by avalanche forecasters to validate meteorological forecasts and to assess snowpack characteristics at specific sites. However, when stations are located in terrain that is not representative, due to slope, aspect, or exposure, this extrapolation can introduce systematic over- or underestimation of snow depth at the slope scale. Such representativeness errors propagate uncertainty into avalanche hazard assessments that typically rely on sparse point observations. Alaska Electric Light and Power (AEL&P) operates a hydroelectric transmission line between Snettisham Hydroelectric Facility and Juneau in southeast Alaska, crossing multiple avalanche paths. Along Speel Arm, the line traverses steep fjord walls and avalanche exposure is particularly high. Following a destructive avalanche in 2008, AEL&P implemented an avalanche mitigation program that included the installation of weather stations to monitor snowpack conditions. One weather station is located on a mid-slope bench (“the Balcony”) and the other is at an avalanche diverter structure further downslope (“Diverter 4-4”). Data from these stations are used to assess snowpack stability in nearby avalanche starting zones. In this study, we evaluate the spatial representativeness of weather stations using spatially distributed snow depth information. We conducted seven airborne lidar surveys in 2019- 2023 and produced high-resolution snow depth datasets of the Speel Arm study area. Using geostatistical methods, we characterize spatial snow depth patterns, quantify elevational gradients, and generate difference maps to examine interannual and seasonal variability. We then compare station observations with lidar-derived snow depths using buffer-based sampling and correlation analysis to evaluate their ability to represent slopes-scale conditions and as predictors for absolute and evolutionary snow depth in nearby avalanche starting zones. Results show consistent interannual patterns in snow depth across elevations and persistent late-season snow retention throughout the study area. Our station-focused analysis shows high spatial snow depth variability at the weather station sites. Our distance-weighted correlation model shows that weather station snow depth is not a reliable proxy for snow conditions in selected avalanche starting zones at Speel Arm. Our project findings highlight the limitations of extrapolating point measurements to slope-scale problems while providing guidance for improved weather station placement."],"kw":"Weather stations, Snow Depth, Spatial Representativeness, Snow Prediction, Lidar.","ty":"P","pp":228,"em":[],"r":3644,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Katreen M. Wikstrom Jones"},"256":{"id":"256","t":"Mistake-Based Learning Across High-Risk Disciplines: An Avalanche Professional Development Framework","au":[{"n":"J Aaron Ball","raw":"Ball, J Aaron","p":true,"aff":""}],"ab":["Snow avalanche professionals operate in wicked learning environments, where mistakes are inevitable due to feedback that is absent, inconsistent, or difficult to interpret. Mistakes in avalanche terrain can have catastrophic consequences, yet they are also vital for learning. This presents a fundamental challenge to effectively and safely develop the sensemaking and judgment practitioners need to operate in this high-risk, naturalistic work environment. Other disciplines grappling with this same problem can offer insights into how the learning value of mistakes can be leveraged without causing unacceptable harm. This presentation reports findings from an integrative literature review synthesizing nine articles from military and medical communities of practice. Thematic analysis identified six mistakebased learning strategies and five associated instructional methods, though their application was not uniform across all learning settings. Instead, they were employed in different learning contexts defined by the severity of potential consequences and the degree of learner independence. Three learning contexts were identified: controlled learning environments, supervised practice, and high-stakes operations. These contexts reflect a spectrum of learning conditions, from structured training environments where consequences are controlled and supervision is intensive, to everyday workplace settings where the full range of consequences is possible and supervision is limited or absent. While novices are more often found at one end of this spectrum and experienced practitioners at the other, the contexts are defined by conditions rather than experience level. A first-year novice and a twenty-year veteran operating in the same high-stakes environment have access to the same learning strategies and methods. From these findings, a framework was constructed that maps the identified learning strategies and methods to the three learning contexts, offering avalanche practitioners, trainers, and organizations a practical, context-aware tool for turning inevitable mistakes into deliberate learning opportunities at every stage of a professional avalanche career."],"kw":"mistake-based learning; professional avalanche training; high-risk decision-making; wicked learning environment; learning context","ty":"O","pp":229,"em":[],"r":3434,"pr":"Aaron Ball"},"257":{"id":"257","t":"Tracking Wet Snow Avalanche Frequency and Seasonal Patterns at Alyeska Resort, Girdwood, Alaska, from 1968 to 2026","au":[{"n":"Aleph Johnston-Bloom","raw":"Johnston-Bloom, Aleph","p":true,"aff":""},{"n":"Jeff Bristow","raw":"Bristow, Jeff","p":false,"aff":""}],"ab":["This study uses 58 seasons (1968/69–2025/26) of avalanche records from Alyeska Resort in Girdwood, Alaska, to evaluate changes in the recorded frequency, seasonal timing, and magnitude of wet loose, wet slab, and glide avalanches. The number of months per season with wet avalanche activity increased significantly over the study period (slope = 0.033 months per season, standard error: 0.0104, p = 0.0025). Wet avalanches were recorded more frequently from November through February during the second half of the record, while April remained the most consistently active month. The annual frequency of Size 3 and 4 wet avalanches did not increase significantly, indicating that the clearest change was a broadening of wet avalanche occurrence across the winter rather than an increase in large events. We also used separate winter and spring CatBoost models to evaluate combinations of meteorological and snowpack variables associated with wet slab and glide avalanche days. During independent testing from 2022/23 through 2025/26, the winter model identified 9 of 13 avalanche days and the spring model identified 14 of 24. False positives remained a limitation. The results demonstrate the value of long-term operational records for identifying changes in wet avalanche patterns. They also support ongoing efforts to model interactions between weather and snowpack variables as a potential source of supporting information for operational forecasting."],"kw":"wet snow, climate, avalanche forecasting, machine learning.","ty":"O","pp":230,"em":[],"r":3470,"pr":"Aleph Johnston-Bloom"},"258":{"id":"258","t":"Advancing Accessibility in Avalanche Forecasting Strategies for Interpreting Geospatial Data","au":[{"n":"Tyson Rettie","raw":"Rettie, Tyson","p":false,"aff":""}],"ab":["Building on prior work presented in Visually Impaired Forecasting and Accessible Software (Rettie, 2023), this paper examines advances in accessibility within avalanche forecasting tools. Public forecasts in Canada and Colorado are produced using the AvID 2.0 platform, which introduced flexible forecast boundaries that can be redrawn as conditions evolve. An enhanced accessibility mode allowed a visually impaired forecaster to use all the features with a screen reader instead of the mapbased interface used by sighted forecasters. Over the past three years, the techniques developed for the enhanced accessibility mode in AvID 2.0 have been extended to tools supporting the diverse data sources used in avalanche hazard assessment, including weather stations, avalanche observations, meteogram weather forecasts, and snowpack model dashboards. Each of these tools presents highly spatial or graphical data that are traditionally inaccessible to screen reader users. The primary strategy is to systematically convert spatial data into structured, navigable table formats that retain the relationships and context needed for hazard analysis. While this approach has proven effective for some complex datasets, its applicability is limited, and certain data is still not practical to interpret in this format. Key examples include highly visual data streams such as map-based synoptic weather products and avalanche photos, neither of which can be effectively represented in tabular form. This paper presents the current strategies for making geospatial data accessible to screen reader users and identifies key forecasting resources that remain difficult to navigate. It then explores potential solutions to address these accessibility gaps, including the use of AI to interpret and summarize primarily visual data in a text-based format."],"kw":"Screen Reader, Accessibility, Snowpack Models, Meteograms, Forecasting.","ty":"P","pp":231,"em":[],"r":3587,"day":"Tue","th":"Avalanche Forecasting","pr":"Tyson Rettie"},"259":{"id":"259","t":"Australian Alps Surface Hazard Rating System","au":[{"n":"Craig Sheppard","raw":"Sheppard, Craig","p":true,"aff":""},{"n":"Kyle Boys","raw":"Boys, Kyle","p":false,"aff":""},{"n":"Tyson Rettie","raw":"Rettie, Tyson","p":false,"aff":""}],"ab":["Winter backcountry hazard communication has traditionally focused on avalanches, yet in many alpine environments, snow surface conditions can present an equally significant hazard. In the Australian Alps, hard snow and ice surfaces can result in slide for life conditions (Outdoors, 2025). Despite this, there has been no standardized approach to assessing or communicating surface hazards and associated risk of uncontrolled sliding falls to the public. The Australian Alps Surface Hazard Rating System (AASHRS) was developed through the operational work of the Mountain Safety Collective (MSC) to address this gap. The system assesses surface hardness and spatial distribution, combining these parameters in a decision-making matrix to assign Low, Moderate, or High surface hazard ratings. Each rating provides information on the likelihood of uncontrolled sliding falls, self-arrest potential, and appropriate terrain and travel advice. An anonymous online survey was distributed to backcountry users in Australia to assess awareness, understanding, perceived usefulness, and reported application of the system. A total of 142 responses were received. Awareness of AASHRS was high among respondents, and the majority of respondents reported that the system was useful and influenced their awareness of surface conditions as well as terrain selection. Interpretation of the Moderate and High ratings was strong, while the Low rating was substantially less well understood. Respondents who consulted the Backcountry Conditions Report more frequently were also more likely to report using the rating in terrain selection and finding it helpful. The findings provide an initial evaluation of AASHRS as an operational surface hazard communication tool and identify a specific opportunity to improve communication of the Low rating. Continued operational use and user feedback will support further refinement of the system."],"kw":"Hazard Communication, Risk Communication, Crust, Ice, Slide for Life, Uncontrolled Sliding Falls","ty":"P","pp":232,"em":[],"r":3645,"day":"Thu","th":"Risk Communication","pr":"Craig Sheppard"},"260":{"id":"260","t":"Supporting Psychological Resilience in Mountain Professionals: Early Peer Support Following Critical Incidents","au":[{"n":"Jan Neuspiel","raw":"Neuspiel, Jan","p":true,"aff":""}],"ab":["Mountain professionals, including avalanche forecasters, ski patrollers, mountain guides and helicopter and cat ski operators amongst others work in environments where exposure to traumatic incidents is an unavoidable occupational hazard. While the mountain industries have made advances in technical risk management, avalanche forecasting, rescue capability, and operational decision-making, comparatively little attention has been given to structured postincident psychological support. The Mountain Professional Critical Incident Stress Management (Mountain CISM) Association was established to provide early peer support for mountain professionals following critical incidents. The program adapts internationally recognized Critical Incident Stress Management principles to the unique operational realities of mountain workplaces, emphasizing confidential peer support delivered by experienced mountain professionals rather than therapy or clinical treatment. Peers are trained to International Critical Incident Stress Foundation (ICISF) standards. Since beginning operations in 2023, Mountain CISM has responded to 99 callouts supporting more than 580 mountain professionals from a broad range of organizations. The objective is to provide emotional first aid, assist teams in returning to effective functioning, identify individuals who may require professional mental health care, and strengthen organizational resilience. This paper describes the rationale for establishing Mountain CISM, outlines the program structure and operational model, summarizes experience from the first three years of operation, and discusses lessons learned. It argues that psychological recovery following critical incidents should be considered an essential component of risk management within mountain operations, alongside rescue, investigation, and operational debriefing."],"kw":"Critical Incident Stress Management, Peer Support, Mountain Operations, Psychological Resilience, Critical Incident Response","ty":"P","pp":233,"em":[],"r":3588,"day":"Tue","th":"Mental Health and Wellness","pr":"Jan Neuspiel"},"261":{"id":"261","t":"Machine Learning and Pattern Recognition for Public Avalanche Forecasting","au":[{"n":"Andrew Schauer","raw":"Schauer, Andrew","p":true,"aff":""},{"n":"John Sykes","raw":"Sykes, John","p":false,"aff":""}],"ab":["Avalanche forecasters in the U.S. and Canada use the five-level North American Public Avalanche Danger Scale (NAPADS) as a tool to communicate avalanche risk to backcountry recreationists. Fore
