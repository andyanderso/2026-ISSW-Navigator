ately 1,000 m of roadway. The operating principle is proactive risk management through active avalanche control: rather than passively resisting avalanches, the system triggers smaller, controlled releases that limit snowpack accumulation and reduce the likelihood of large, destructive events. Control missions are initiated remotely over the internet from a computer or smartphone, substantially reducing the need for agency personnel to hand-place explosives or conduct helicopter-assisted control. With a total investment of approximately one million euros, the system is considerably more cost-effective than a one-kilometer avalanche gallery, which would have exceeded ten million euros. It also requires less maintenance and causes less environmental disturbance. Results over the first eight years of operation show a clear improvement in road safety and reliability. Closures have decreased substantially, large-scale snow-clearing operations are no longer required, and personnel exposure has been reduced. Data collected by the radar and weather monitoring systems provides additional insight into snowpack and avalanche behavior, supporting better-informed decisionmaking. The project demonstrates the effectiveness of technology-driven active avalanche control for protecting transportation corridors in alpine terrain and offers a transferable model for North American highway programs facing similar cost and permitting constraints."],"kw":"remote avalanche control systems; active avalanche control; road safety; transportation corridors; avalanche mitigation; Sölden","ty":"P","pp":133,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"Ines Waltl"},"143":{"id":"143","t":"Drone Docking Stations for Photogrammetric Snow Depth and Avalanche Mapping: Potential and Limitations","au":[{"n":"Andreas Stoffel","raw":"Stoffel, Andreas","p":true,"aff":""},{"n":"Yves Bühler","raw":"Bühler, Yves","p":false,"aff":""}],"ab":["A drone docking station is an autonomous hub designed to support the remote operation of drones, thus eliminating the need for on-site personnel. In winter 2025/26, a drone dock was installed at the Weissfluhjoch research site above Davos, Switzerland. Operated by the WSL Institute for Snow and Avalanche Research SLF, the Weissfluhjoch site (2536 m.a.s.l.) is a premier high-alpine facility for snow science. It provides the world's longest continuous series of daily high-altitude snow measurements, dating back to 1936. The DJI Drone Dock 3, which is used at the site, is equipped with a DJI Matrice 4D drone that offers three-directional photography, RTK geo-positioning and terrain following to meet high precision photogrammetric mapping requirements. The drone docking station at Weissfluhjoch aims to monitor the distribution of snow depth with high spatial and temporal resolution within two perimeters. Perimeter A (0.03 km2) covers the research site, where various operational and experimental measurements are conducted. Perimeter B (2.2 km2) includes ski slopes, other ski resort infrastructure, and many active avalanche tracks. Four of these tracks are equipped with Wyssen avalanche towers for proactive remote-controlled avalanche release. The first winter of operation was characterized by a lack of snowfall and long periods of high-pressure weather. Due to this weather pattern and the fact that the permit for autonomous flights beyond visual line of sight (BVLOS) had not been obtained before the end of May, daily data acquisition was not possible yet. Nevertheless, 25 winter flights were performed for each perimeter. The high spatial resolution (0.01 m) data from Perimeter A provides valuable insight into the distribution and variation of snow depth at the research site. Even small-scale wind erosion can be observed. In Perimeter B, the focus of interest is snow depth spatial variability, snow drift and avalanche activity mapping at a spatial resolution of 0.1 m. The drone dock produced high-quality orthophotos and snow depth maps, demonstrating its robust operational potential in the challenging alpine environment. However, the main limitations are the persistent legal constraints on autonomous drone operations and downtime caused by adverse weather conditions, such as precipitation, fog, and high wind speeds and gusts. Sudden air traffic and rapidly changing weather conditions may also endanger the safety of drone operations and precision landings. Comparing flat-field snow depths to the distribution of snow depths in nearby avalanche release areas acquired with high spatial and temporal resolution provides valuable insights that aim to improve future avalanche hazard management. Placing multiple drone docking stations near mountain resort facilities could create a network, enabling continuous regional coverage. Other potential applications include ski resort operations such as precision snowmaking, ski slope supervision and infrastructure inspection."],"kw":"Remote sensing, UAS, drone dock, photogrammetry, snow depth.","ty":"P","pp":134,"em":[],"r":3626,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Andreas Stoffel"},"144":{"id":"144","t":"Observational Study of Snow Cornice Development on Artificial Vertical Sections","au":[{"n":"Takahiro Tanabe","raw":"Tanabe, Takahiro","p":true,"aff":""},{"n":"Kouichi Nshimura","raw":"Nshimura, Kouichi","p":false,"aff":""},{"n":"Taiki Nunokawa","raw":"Nunokawa, Taiki","p":false,"aff":""},{"n":"Yoshihiko Saito","raw":"Saito, Yoshihiko","p":false,"aff":""},{"n":"Yoichi Ito","raw":"Ito, Yoichi","p":false,"aff":""},{"n":"Tsubasa Okaze","raw":"Okaze, Tsubasa","p":false,"aff":""},{"n":"Satoru Adachi","raw":"Adachi, Satoru","p":false,"aff":""},{"n":"Satoru Yamaguchi","raw":"Yamaguchi, Satoru","p":false,"aff":""},{"n":"Sojiro Sunako","raw":"Sunako, Sojiro","p":false,"aff":""},{"n":"Hirofumi Niiya","raw":"Niiya, Hirofumi","p":false,"aff":""}],"ab":["Snow cornices are overhanging accumulations of wind-transported snow that frequently develop along mountain ridges and may trigger avalanches when they collapse. Although previous studies have documented the seasonal evolution of cornices, the short-term processes governing their formation remain poorly understood because continuous field observations are scarce. In this study, we conducted a field observation campaign at Niseko Moiwa Ski Resort, Hokkaido, Japan, during a blowingsnow event from 7 to 8 March 2026. Artificial vertical snow sections were prepared prior to the event, and the temporal evolution of cornice growth was monitored using a 2D line LiDAR. Wind speed, wind direction, blowing-snow mass flux, snow surface elevation were also measured, together with UAVmounted LiDAR surveys and visual observations. The observations revealed rapid cornice development around midnight, during which the cornice thickness increased by several centimeters within 10 min. The vertical profiles showed a repeating pattern consisting of two successive stagse: snow first accumulated several meters upwind of the vertical section, followed by deposition immediately adjacent to the section. Repetition of these stages resulted in progressive outward cornice growth. Simultaneously, snow accumulated beneath the overhang until it merged with the upper snowpack to form a continuous slope. In contrast, no distinctive changes in wind speed, gust factor, or blowingsnow mass flux were associated with the rapid growth period. These observations suggest that cornice growth results from the simultaneous development of the overhanging snow and the underlying snowpack, rather than solely from snow adhering to the underside of the overhang. The results provide new insights into the shortterm snow cornice formation processes and offer valuable information for improving hazard assessment and winter mountain safety."],"kw":"Snow cornice; blowing snow; ski resort; hazard assessment.","ty":"P","pp":135,"em":[],"r":null,"day":"Fri","th":"Snowpack Properties","pr":"Takahiro Tanabe"},"147":{"id":"147","t":"Characterisation of Avalanches in the Dolomites. Study Based on the Webgis Valanghe, a Geographic DB Containing 40 Years of Observations","au":[{"n":"Stefano Dalle Fratte","raw":"Fratte, Stefano Dalle","p":false,"aff":""},{"n":"Roberta Dainese","raw":"Dainese, Roberta","p":false,"aff":""},{"n":"Mauro Valt","raw":"Valt, Mauro","p":false,"aff":""},{"n":"Igor Chiambretti","raw":"Chiambretti, Igor","p":true,"aff":""}],"ab":["The forecast of avalanche run-out is essential information, both in the long term, for adequate planning of the territory and installation of anthropic activities, and in the short term, for the dayto-day management of avalanche forecasting, in relation to the impact on exposed areas and the application of civil protection plans. Over the years, several approaches have been used to identify avalanche-affected areas, from empirical methods based on the terrain to increasingly advanced numerical models of avalanche dynamics; in any case, a robust reference dataset of previous, well-studied avalanches is essential. The work presented focuses on avalanches in the Dolomites within the Veneto Region, in the eastern Italian Alps. The Dolomites are characterised by a highly fragmented morphology, with narrow valleys, abrupt rock cliffs, and limited altitude differences compared with other mountain areas. Available data on avalanche characteristics from other regions may not apply directly to the study area. This paper presents a preliminary study of avalanche sites and events registered in the Veneto Region by technicians at the regional avalanche forecasting centre, the Avalanche Centre of Arabba. The geographic database, WebGIS Valanghe-Veneto (available to the public), contains more than 5000 avalanche sites from the CLPV (Map of probable avalanche locations), obtained through on-site campaigns conducted in the ’80s and ’90s, and descriptions of over 2000 avalanche events observed and documented in detail over 40 years. The paper presents a methodology to automatically classify avalanche size according to the standard classification based on avalanche path characteristics, especially the location of the run-out point on the mountain slope. It developed a model in QGIS to compare avalanche areas (polygons extracted from the WebGIS Valanghe-Veneto) with the available Digital Terrain Model. The selected dataset was then used to study the distribution of avalanche sizes for both events and sites. Avalanche sites, which roughly correspond to the maximum known avalanche event, present –as expected –a higher frequency of larger avalanches, in comparison to the analysis of single events. In a second step, we used the available data to study the characteristics of avalanche sites and events, evaluating the distribution of run-out distance and volume, maximum elevation, elevation difference between the deposition and release areas, and average slope of the release area."],"kw":"Avalanche terrain; Geographical Information System; terrain analysis.","ty":"P","pp":136,"em":[],"r":null,"day":"Fri","th":"Terrain","pr":"Igor Chiambretti"},"148":{"id":"148","t":"Which Buildings Are at Risk? Meet Alarm: An Automated Workflow Linking Avalanche Runout Modelling to Building Risk Assessment for Emergency Management in Norway","au":[{"n":"Leonie Kommerell","raw":"Kommerell, Leonie","p":true,"aff":""},{"n":"Håvard Boutera Toft","raw":"Toft, Håvard Boutera","p":false,"aff":""},{"n":"Gustav Pless","raw":"Pless, Gustav","p":false,"aff":""},{"n":"Karin Bergbjørn","raw":"Bergbjørn, Karin","p":false,"aff":""}],"ab":["During periods of high/extreme avalanche hazard, decision makers need to identify which buildings may be exposed and where field assessments or evacuations should be prioritised. In many parts of Norway, this assessment is challenging because detailed avalanche hazard-zone maps or site-specific warning services are not available. The Avalanche Location Alert Risk Method (ALARM) is therefore being developed as a supplementary tool for periods of high or extreme avalanche danger. ALARM is an automated workflow that combines terrain analysis, potential release-area identification and avalanche runout modelling to assess the exposure of relevant buildings. It uses inputs from the regional avalanche forecast, such as elevation band, aspect and avalanche problem, to identify relevant release areas and models how far dry-snow avalanches could run in different scenarios. The output is a list of exposed buildings, together with maps of modelled avalanche runouts and estimated impact pressures. The aim is to enable experts to focus their time and resources on the most exposed buildings that may require field assessment or evacuation. ALARM provides a catalogue of five precomputed standard scenarios for each of Norway's avalanche forecast regions, excluding Svalbard. It also enables event-specific modelling for selected regions when the standard scenarios are insufficient. The workflow is intended as a decision-support tool and not as a replacement for expert judgement, local knowledge or detailed hazard-zone mapping. Validation against historical events and official hazard zones is ongoing; the present paper therefore demonstrates the method, national-scale implementation and computational feasibility rather than predictive accuracy. Approximately 30,000 simulations can be processed within four hours for a selected region, indicating that ALARM may eventually support time-critical avalanche emergency management once validation is complete."],"kw":"Avalanche exposure, Emergency management, Potential release areas, Runout model- ling, Decision support, Building prioritization","ty":"O","pp":137,"em":[],"r":3461,"pr":"Leonie Kommerell"},"149":{"id":"149","t":"From Warming to Failure: Temperature Effects in Snow-Slab Avalanche Release","au":[{"n":"Claudia Binetti","raw":"Binetti, Claudia","p":true,"aff":""},{"n":"Giuseppe Puglisi","raw":"Puglisi, Giuseppe","p":false,"aff":""},{"n":"Nicola M. Pugno","raw":"Pugno, Nicola M.","p":false,"aff":""}],"ab":["Temperature is widely recognized as a key factor in snow-slab avalanche release, and field observations frequently associate warming with reduced snowpack stability. This issue is increasingly relevant under climate change, yet a rigorous theory that isolates the contribution of temperature to avalanche triggering is still missing. We develop a thermo-mechanical model grounded in Fracture Mechanics and Statistical Mechanics. Building on finite-temperature extensions of the Griffith criterion for crack propagation (Binetti et al. 2025b; Binetti et al. 2025a), weak-layer failure is described as Mode- II fracture with an intermediate perfectly plastic process zone. The model accounts for a finite slab, microstructural discreteness and residual friction along the failed interface. A discrete chain of cohesive units is connected to a continuum shear-lag description, whose continuum limit recovers a Griffith-type formulation. Snowpack failure results from the competition among slab elasticity, weak-layer fracture energy, plasticization, friction and entropy. The resulting critical loads for slab front propagation decrease with temperature through a square-root dependence of the form τcr(T) = Af + Bf √ 1 −T/Tc, with coefficients determined by material, geometrical and frictional parameters. The theory thus provides a quantitative mechanism linking warming to a reduction of the energetic barrier against weak-layer failure."],"kw":"Snow-slab avalanche; Weak layer; Mode-II fracture; Temperature; Statistical Mechanics.","ty":"O","pp":138,"em":[],"r":3454,"pr":"Claudia Binetti"},"150":{"id":"150","t":"Towards an Automated Avalanche Thalweg Analysis to Identify and Compare Avalanche Terrain","au":[{"n":"Paula Spannring","raw":"Spannring, Paula","p":true,"aff":""},{"n":"Christoph Hesselbach","raw":"Hesselbach, Christoph","p":false,"aff":""},{"n":"Andreas Huber","raw":"Huber, Andreas","p":false,"aff":""},{"n":"Anna Wirbel","raw":"Wirbel, Anna","p":false,"aff":""},{"n":"Felix Oesterle","raw":"Oesterle, Felix","p":false,"aff":""},{"n":"John Sykes","raw":"Sykes, John","p":false,"aff":""},{"n":"Alberto Mariani","raw":"Mariani, Alberto","p":false,"aff":""},{"n":"Declan Knies","raw":"Knies, Declan","p":false,"aff":""},{"n":"Jan-Thomas Fischer","raw":"Fischer, Jan-Thomas","p":false,"aff":""}],"ab":["To reduce complexity of avalanche simulation outputs in three-dimensional terrain, individual avalanches can be represented by thalwegs. A thalweg describes avalanche properties and quantitative metrics along the main flow direction. Deriving such metrics at the regional scale requires an automated workflow. We present an automated, objective model-based approach for identifying two-dimensional thalweg representations of avalanches at the regional scale, extending an open-source model chain that delineates potential release areas and simulates their potential intensity and runout using AvaFrame::com4FlowPy. For each release area, the thalweg is computed as the fluxweighted (similar to mass-weighted) main flow direction, from which runout length and maximum impact pressure are derived. Applying this model chain with identical input parameters across four study areas, Davos (Switzerland), Livigno (Italy), Rogers Pass (Canada) and Sellrain (Austria), we compare the resulting distributions to characterize regional differences in avalanche release area, simulated runout length and impact pressure, which are translated to avalanche size. Results show that the terrain in Davos produces the smallest avalanches. 50% of release areas are assigned to dimension size 2, with a median release area of 2 600 m². For runout length and impact pressure, Rogers Pass has the largest proportion of avalanches assigned to size 5. Release area values are highest in Livigno across all percentiles, with a median of 4 200 m². Sellrain, while having the highest simulated avalanche density per unit area, shows the highest median impact pressure (56.3 kPa) among all study areas. These terrain-driven differences demonstrate the ability of the presented approach to objectively quantify and compare avalanche terrain across regions. Additionally, our results support the plausibility of the technical scheme for avalanche size classification used here, underlining its applicability for regional-scale avalanche terrain analysis."],"kw":"Avalanche terrain identification, Avalanche size, Avalanche mobility, Automated model chain","ty":"O","pp":139,"em":[],"r":3394,"pr":"Paula Spannring"},"151":{"id":"151","t":"Tempered Mindset Navigation for Avalanche Risk Decision-Making","au":[{"n":"Kenneth Wylie","raw":"Wylie, Kenneth","p":false,"aff":""}],"ab":["In 1900, no one died in an avalanche because of a buried surface hoar layer; the language to describe that problem did not yet exist. People often treated avalanches as acts of God. Over time, however, careful observation and the naming of processes and behaviours of snow—advanced by pioneers such as André Roch—transformed avalanche understanding and reduced risk. Human factors present a similar challenge. The opportunity is to observe the mindset conditions that shape behaviour and embrace the language that emerges so that we can manage our mindsets, and by extension, our choices more effectively. The difficulty, of course, is that describing human behaviour is far more painful than describing snowpack behaviour. Surface hoar does not grieve after a fatality. We do. Naming the patterns in ourselves can feel uncomfortable, even threatening. Yet once we speak something into existence, it becomes manageable. Agency over mindset creates the possibility for more nuanced control over action. This represents a significant step forward in avalanche education: beyond seeing ourselves as victims of human behaviour and toward becoming active stewards of tempered mindset decisions. All of us can make sound decisions in avalanche terrain. Yet culture, time pressure, peer influence, ingrained habits, insecurity, economic stress, or antique survival mechanisms can pull us off course. When we allow these pressures to go unrecognized, our mindset shifts away from balanced functioning, toward unhelpful extremes. This presentation introduces the language of limiting mindsets, overexpansive mindsets, and a balanced middle path or tempered mindsets (Figure 1). It also presents eight mindset trios that provide a practical language for recognizing both optimal and non-optimal states in avalanche decision-making (Figure 2). Figure 1.0 Mindset Calibration for Avalanche Risk Decision Making Limiting Mindsets Tempered Mindsets Over-Extended Mindsets The Middle Path Balanced Mindset = Better Decisions= Better Outcomes These trios offer a very high-resolution framework for identifying mindset patterns, naming them, and working with them before adversity distorts judgment in avalanche risk decision-making."],"kw":"","ty":"P","pp":140,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"Kenneth Wylie"},"152":{"id":"152","t":"Avalanche Hazard Identification in Emilia-Romagna Appenines: A Statistical Empirical Approach Based on the Run-Out Ratio","au":[{"n":"R. Sabbadini","raw":"Sabbadini, R.","p":false,"aff":""},{"n":"M. Cau","raw":"Cau, M.","p":true,"aff":""},{"n":"G. Anfossi","raw":"Anfossi, G.","p":false,"aff":""},{"n":"F. Fanari","raw":"Fanari, F.","p":false,"aff":""},{"n":"C. Dondi","raw":"Dondi, C.","p":false,"aff":""},{"n":"E. Mazzini","raw":"Mazzini, E.","p":false,"aff":""},{"n":"I. Chiambretti","raw":"Chiambretti, I.","p":false,"aff":""}],"ab":["In this study, a statistical-empirical methodology was developed to rapidly identify potential avalanche hazard zones in the Emilia-Romagna Apennines and assess their interaction with anthropised areas. Using a historical database of 158 avalanche events provided by the MeteoMont service of the Carabinieri Forestali, Potential Release Areas (PRAs) were mapped by analysing a digital terrain model (DTM) for slope angle, plan curvature, and surface roughness. The run-out limits for return periods of 30, 100, and 300 years were simulated for each avalanche path by applying the Run-out Ratio (ROR) method, statistically modeled using the Gumbel distribution. An aggregate hazard indicator was defined to evaluate the probability of interaction with exposed elements, linked to a priority index (PR) on a scale from 1 to 5. The methodology was then applied to over 4,000 undocumented PRAs through morphometric clustering. The results provide an essential decision-making tool for Civil Protection authorities and for long-term avalanche risk mitigation strategies in the region."],"kw":"Potential Release Area (PRA), Avalanche hazard mapping, Northern Apennines, Run- out Ratio, Gumbel distribution, Risk mitigation, Civil Protection, GIS.","ty":"P","pp":141,"em":[],"r":3507,"day":"Mon","th":"Avalanche Dynamics","pr":"M. Cau"},"153":{"id":"153","t":"A Multi-Level Avalanche Risk Assessment Methodology: A Case Study from Northwestern Italy (Aosta Valley)","au":[{"n":"A Rubino","raw":"Rubino, A","p":false,"aff":""},{"n":"M Matzutzi","raw":"Matzutzi, M","p":true,"aff":""},{"n":"B Frigo","raw":"Frigo, B","p":false,"aff":""},{"n":"P Dellavedova","raw":"Dellavedova, P","p":false,"aff":""}],"ab":["The increasing frequency and magnitude of natural extreme events endangering the built environment highlight the need for effective policy-oriented tools to assess, manage, and mitigate the associated risk. This work presents a simple multi-level methodology recently adopted in Italy for the risk assessment of buildings and infrastructures exposed to avalanche hazards, with a focus on supporting risk-informed decision-making. For each exposed element, the procedure provides risk matrices in which five risk classes (low, medium-low, medium, medium-high, high) are defined based on the evaluation of hazard, vulnerability, and exposure. These factors are assessed through simplified and standardized criteria, relying on existing hazard mapping and key characteristics of the exposed assets, including individual buildings and linear infrastructures (network systems). The methodology is designed to be integrated into policy frameworks, providing a basis to support the prioritization of interventions and the optimal allocation of public financial resources. The application of the proposed methodology is shown with respect to a municipality in the Valle d’Aosta region (north-west Italy), considering multiple avalanche basins. The results provide a hierarchical classification of risk, supporting both at the scale of individual buildings within each basin and across different basins within the investigated territory. The strengths and limitation of the proposed framework are discussed, highlighting its potential to bridge the gap between technical risk assessment and operational risk governance in avalanche-prone areas."],"kw":"risk management; built environment; vulnerability; exposure; resource allocation","ty":"P","pp":142,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"M Matzutzi"},"154":{"id":"154","t":"Systematic Evaluation of the Local Criticality of Recent Overloads and Temperature Effects to Mitigate Avalanche Risk for Traffic Roads","au":[{"n":"Camille Ligneau","raw":"Ligneau, Camille","p":true,"aff":""},{"n":"Frédéric Pourraz","raw":"Pourraz, Frédéric","p":false,"aff":""},{"n":"Alain Duclos","raw":"Duclos, Alain","p":false,"aff":""},{"n":"Jill Chevalier","raw":"Chevalier, Jill","p":false,"aff":""},{"n":"Gilles Mauris","raw":"Mauris, Gilles","p":false,"aff":""}],"ab":["The closing of roads due to snow avalanches is a common issue in mountainous regions during winter. The decision to temporarily restrict traffic access to avalanche-exposed roads often relies on human expertise, fed by a large variety of parameters. The diversity of information nature and sometimes the scarce availability of local data can therefore induce a very complex decision-making process, prone to oversights. Developed and practiced for about two decades, a decision-making support process called CRISTAL (ISSW 2023) is now subject to research studies. This approach is based on the criticality of five criteria: topography, current avalanche activity, weak layer properties, recent overloads and temperature effects. It has recently been upgraded to a hierarchical expert system (involving multiple levels of aggregation) based on fuzzy logic, which properly handles the approximate truth coming from scattered field measurements and observations. The system outputs a vigilance mode (relaxed / suspicious / alert / gamble) depending on the criticality of the five criteria. So far, the evaluation of each criterion is done manually by the user, who must personally seek information about the current conditions. To make the system more operational in three French alpine departments (Savoie, Isère, Hautes-Alpes), we aim to automatically gather all available information and process them to assess criticalities in real time for specific slopes. We present here a part of the up-to-date expert system that deals with the meteorological data available in the French Alps. This subsystem, part of the first aggregation level, delivers a level of criticality for the criteria of recent overloads and temperature effects (the parts concerning the other criteria will be treated in separate works). First, the subsystem estimates weather-related variables at the slope scale, such as snow surface temperature, thawing, and recent overloads due to fresh snow, wind-blown snow or rain. Once the local variables are assessed, they are each assigned a fuzzy value (e.g. the amount of fresh snow can be none / low / moderate / high) and processed through a set of fuzzy rules to deliver a level of criticality (e.g. a leeward slope after a strong wind-transport event raises a high criticality for the recent overload criterion)."],"kw":"Avalanches, Traffic roads, Criticality, Expert system, Fuzzy logic.","ty":"O","pp":143,"em":[],"r":3442,"pr":"Camille Ligneau"},"155":{"id":"155","t":"The Development of a Network of Automatic Snow Stations in the Czech Republic in Relation to Climate Change and Other Factors","au":[{"n":"Jan Jirak","raw":"Jirak, Jan","p":false,"aff":""},{"n":"Simon Bercha","raw":"Bercha, Simon","p":false,"aff":""}],"ab":["Over the past two decades, the Czech Hydrometeorological Institute (CHMI) has gradually expanded its manual snow monitoring network with automatic snow-measuring stations. Since 2006, several technologies have been evaluated, particularly snow pillows for measuring snow depth and snow water equivalent (SWE). The resulting network now covers major mountain and highland regions beyond the primary climatological stations and has been further complemented by automatic snow depth sensors. Network development has been driven by the need to maintain reliable long-term datasets for water management, compensate for the declining number of observers in mountain regions, and adapt to climate change, which is shifting suitable monitoring sites to higher elevations. Station locations were selected according to representativeness, wind exposure, vegetation, terrain, and accessibility. CHMI currently operates 60 standalone automatic snow stations, and this network is supplemented by 46 additional lasers and ultrasonic snow depth sensors located at meteorological stations. Long operational experience demonstrate that representative site selection is more important for obtaining reliable SWE observations than the choice of measurement technology itself. Future work will focus on integrating historical and automated observations to ensure consistent longterm SWE datasets."],"kw":"Automatic snow station, snow water equivalent, meteorological data supplementation, climate change, station site selection","ty":"P","pp":144,"em":[],"r":3627,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Jan Jirak"},"156":{"id":"156","t":"Looking Back—30 Years of Impact: A Caltrans GAZEX RACS History","au":[{"n":"Ryan Marvin","raw":"Marvin, Ryan","p":true,"aff":""}],"ab":["Since its introduction in the early 1990s, Gazex Remote Avalanche Control Systems (RACS) have become a central component of avalanche hazard management on several California mountain highways. Prior to the adoption of Gazex, the California Department of Transportation (Caltrans) relied heavily on artillery and hand-delivered explosives to mitigate avalanche hazard, with thousands of rounds fired from 75 mm recoilless rifles each year. Aging military ammunition and increasingly poor reliability ultimately created a need for an alternative mitigation system. Caltrans began installing Gazex exploders in 1992, with early installations at Echo Summit, Carson Spur, Carson Pass, and the June Lake area. Over more than three decades of operation, these Remote Avalanche Control Systems have changed not only the tools available to Caltrans but also the program’s efficiency, safety, timing and the greater philosophy of its avalanche program. Operations that were historically more reactive and labor intensive can now be conducted proactively, rapidly, and with substantially less personnel exposure. Many lessons have been learned during Caltrans tenure with Gazex systems. In the early days, operations were characterized by inadequate maintenance, unnecessarily frequent firing, and limited protocols or documentation. A renewed emphasis on yearly maintenance, and a year-round team of dedicated avalanche personnel has increased system firing reliability to greater than 99% reliability on the present day shot rate amongst all 53 of the state’s exploders. This paper examines more than three decades of RACS use within Caltrans, and the continuing role of conventional and remote avalanche control methods within a modern highway avalanche program. We will discuss the operational problems that led to its adoption, lessons learned during implementation, changes in mitigation strategy and efficiency, lessons learned, and the limitations that remain with the widespread use of remote avalanche control."],"kw":"GAZEX, remote avalanche control, highway avalanche mitigation, Caltrans, avalanche safety, RACS","ty":"P","pp":145,"em":[],"r":3569,"day":"Tue","th":"Operations and Program Management","pr":"Ryan Marvin"},"157":{"id":"157","t":"Study of Snow Physical Properties and Assessmeny of Snowpack Stability to Anticipate Avalanche Hazards in Nunavik (Canada)","au":[{"n":"Laura Guilhot","raw":"Guilhot, Laura","p":false,"aff":""},{"n":"Najat Bhiry","raw":"Bhiry, Najat","p":false,"aff":""},{"n":"Alexandre Langlois","raw":"Langlois, Alexandre","p":false,"aff":""}],"ab":["The current warming observed in northern regions such as Nunavik (Canada) has cascading effects on natural and human systems, potentially leading to deadly disasters in various avalancheprone communities that are increasingly vulnerable to climate-related avalanche occurrence. Furthermore, given ongoing rapid population growth in Nunavik and the associated need for infrastructure development leads to uncertainties for urban development planning, particularly in isolated terrains lacking observations or forecasts capabilities. To support a safe development this study aims to develop new insights on these phenomena and provide decision-making tools for land-use planning. The main objective of this study is to identify how physical properties of snow influence the stability of arctic and subarctic snowpacks and the mechanisms of avalanche triggering in such environments. To achieve this goal, remote sensing methods combined with snowpack modelling are used to assess the vertical properties of the snowpack and how its stability is affected by elements such as topography and meteorology. First, a numerical weather forecasting model (HRDPS) is used to address the lack of automatic weather station in the communities. The atmospheric data provided by the model are validated by automatic weather stations data and used as the input for snow modelling with the physical snow model SNOW- PACK. Then, to determine snow depth, a retrieval algorithm based on C-Band synthetic aperture radar (SAR) observations of the Radarsat Constellation Mission (RCM) will be developed. The snow depth parameter can be used to improve SNOWPACK modelling and simulations are validated by field measurements taken during avalanche seasons in Nunavik. The maps we aim to produce in this study are intended to serve as operational tools for avalanche forecasting and to support safe community development."],"kw":"Snowpack properties, Nunavik, SNOWPACK model, remote sensing","ty":"P","pp":146,"em":[],"r":3570,"day":"Tue","th":"Avalanche Forecasting","pr":"Laura Guilhot"},"158":{"id":"158","t":"From Detection to Decision Support: Expanding the Role of Doppler Avalanche Radar in Hazard Management and Planning","au":[{"n":"Théo St-Pierre Ostrander","raw":"Ostrander, Théo St-Pierre","p":true,"aff":""},{"n":"Heather Hordowick","raw":"Hordowick, Heather","p":false,"aff":""},{"n":"Bret Shandro","raw":"Shandro, Bret","p":false,"aff":""},{"n":"Eoin Trainor","raw":"Trainor, Eoin","p":false,"aff":""},{"n":"Peter Barsevskis","raw":"Barsevskis, Peter","p":false,"aff":""},{"n":"Maxence Carrel","raw":"Carrel, Maxence","p":false,"aff":""},{"n":"Greg Johnson","raw":"Johnson, Greg","p":false,"aff":""}],"ab":["Avalanche mitigation infrastructure, including remote avalanche control systems, bridges, snowsheds, and large earthen diversion or arresting structures, requires significant capital investment and ongoing maintenance. Doppler avalanche radar systems can support infrastructure planning by providing high-resolution spatial and temporal data that inform the optimization of infrastructure selection, configuration, and placement. Event data collected from a steep terrain feature in a high-snowfall region of northwest British Columbia during the 2024-2025 and 2025-2026 winters demonstrate the scale and practical value of these observations. Over this period, the radar system detected more than 8,000 avalanche events within a single monitored area. These observations were collected in conjunction with an operational avalanche forecasting and control program, providing practitioner-based hazard information to support infrastructure planning. In addition to its value as an applied avalanche forecasting tool, this dataset provides planners and asset managers with a quantitative basis for evaluating avalanche frequency and spatial distribution, supporting more informed and defensible infrastructure design decisions. This paper demonstrates how high-resolution radar observations can support both quantitative risk assessment for infrastructure planning and daily hazard forecasting for operational risk management."],"kw":"Doppler Radar, Planning, Operations, Monitoring, Mitigation.","ty":"O","pp":147,"em":[],"r":3409,"pr":"Theo St Pierre Ostrander"},"159":{"id":"159","t":"Climate-Scale Maps of Cold-Season Temperature and Precipitation Trends in the Mountainous Areas of Colorado","au":[{"n":"Valerie Foley","raw":"Foley, Valerie","p":true,"aff":""},{"n":"Jason Konigsberg","raw":"Konigsberg, Jason","p":false,"aff":""},{"n":"Brian Lazar","raw":"Lazar, Brian","p":false,"aff":""},{"n":"Ethan Greene","raw":"Greene, Ethan","p":false,"aff":""}],"ab":["Temperature and precipitation patterns in the Colorado mountains are important factors for a variety of practical and research applications, including avalanche forecasting. We map these changes across the Colorado Avalanche Information Center's (CAIC) forecast area, building on the PRISM-based precipitation mapping of Marraccini et al. (2014) by updating the precipitation record through the 2025/2026 season and adding temperature trend analysis. Using the PRISM Climate Group's 800-meter gridded daily dataset, we compare two overlapping 30- year climate periods (1980/1981–2009/2010 and 1996/1997–2025/2026) for the cold season months of November through April. The maps show that warming varied across Colorado's mountain regions. In the recorded gridded data, nighttime minimum temperatures rise faster than daytime maximums across most of the CAIC forecast area, but station-level sensor correction attributes most of this nighttime signal to a documented SNOTEL sensor transition rather than to climate. The updated precipitation maps show moderate reductions in portions of the Central and Southern Mountains, with some small local increases in parts of the Northern Mountains. We present the maps and supporting analyses developed through this work. These include a freezethaw classification, temperature and precipitation changes grouped by elevation and terrain position, and a station-level sensor correction checked against an independent gridded product. Together, these products are a step toward better characterizing how Colorado's snow and avalanche climate regions are evolving and help place individual seasons in the context of longer-term trends."],"kw":"Weather Forecasting and Climate, Instrumentation and Remote Sensing, Climate Change","ty":"P","pp":148,"em":[],"r":null,"day":"Fri","th":"Weather Forecasting and Climate","pr":"Valerie Foley"},"160":{"id":"160","t":"From What We Think to What We Say: The P.E.A.C.H.E.S. Mnemonic for Communication-Centric Decision Making","au":[{"n":"Justin Borowsky","raw":"Borowsky, Justin","p":false,"aff":""}],"ab":["In the past, research on decision making in avalanche terrain has focused heavily on the psychological heuristic traps that are often a component of avalanche accidents. While understanding these internal shortcuts is foundational, translating that psychological awareness into consistent group action can be challenging. This research frames group decision making not only as a psychological process, but as a visible product of group interaction and verbal communication. Using an inductive qualitative approach, this study sought to identify the critical topics that should be discussed in order to make a decision in avalanche terrain. Twenty Five avalanche education professionals were interviewed and asked to define what they considered to be core components of effective group conversations at decision points. The responses were grouped by themes, given descriptive titles, combined with best practices in small group communication, and organized into a new mnemonic: P.E.A.C.H.E.S. (Pressure, Expectations, Arguments, Consequences, Heuristics, Everyone speaks, and Strategy). The approach to this study shifts away from the psychological paradigm toward a communication-centric framework. By focusing on the external process of conversation rather than the internal process of the individual, P.E.A.C.H.E.S. provides a practical, real-time tool for groups to structure their communication, mitigate heuristic traps, ensure critical ideas are voiced, and developed a strategy before entering high-consequence terrain."],"kw":"Communication, Decision-Making, Heuristics","ty":"P","pp":149,"em":[],"r":3571,"day":"Tue","th":"Decision Making","pr":"Justin Borowsky"},"161":{"id":"161","t":"Using Snowmobiles for Slope Scale Testing and Mitigation","au":[{"n":"Ben Hawkins","raw":"Hawkins, Ben","p":false,"aff":""}],"ab":["As organizations like the Canadian Avalanche Association (CAA) and the Canadian Motorized Backcountry Guides Association (CMBGA) work to uphold high professional standards for snowmobiling within the avalanche industry, some procedures are still lagging in an industry historically oriented towards skiing. While best practices and risks of ski cutting are fairly defined by previous research and professional guidance (Jamieson, 2021; Jamieson et al., 2019; Stimberis, 2018), the use of snowmobiles for slope cuts remains inconsistent and informal across sled-based operations. In these operations, practitioners rely on snowmobiles to access terrain and inform slope-based decisions, yet there is little formal guidance on procedures for using the sled as a slope-scale tool for data collection or hazard mitigation. This paper is motivated by the perceived inconsistency of field practices and the absence of guidance for sled cuts within the industry. It explores whether sled cutting can be summarized in a structured, intentional way that aligns with established principles of ski cutting, while acknowledging the unique risks, opportunities and limitations of snowmobile travel. This paper approaches sled cutting in two parts; sled cutting as data collection (slope-scale observation) and as a control measure (defensive cuts). The guiding question is: Are sled-based practitioners approaching the use of sled cuts with enough consistency to define a set of guidelines for the industry? The paper draws on an internal policy development at Avalanche Canada to adapt an existing ski cutting framework for mechanized use as the start of a broader discussion. The conversation is expanded to subject matter experts through a survey process to identify both the common ground and discrepancies between practitioners. It presents this as a proof of concept rather than a prescriptive standard. Key takeaways highlight the application, advantages, risks and limitations of sled cutting. The goal is to prompt dialogue and support collaborative progress toward guidance on best practices for practitioners. KEY WORDS: Snowmobile, Sled Cutting, Mitigation, Slope-Test."],"kw":"","ty":"O","pp":150,"em":[],"r":null,"pr":"Ben Hawkins"},"162":{"id":"162","t":"The Intersection of Science and Human Behavior in Terrain Management: How Social Media and Artificial Intelligence Are Changing the Culture","au":[{"n":"Erme Catino","raw":"Catino, Erme","p":false,"aff":""}],"ab":["Technology, specifically regarding social media and Artificial Intelligence (AI), is moving at a speed we as society are struggling to keep up with and control. Backcountry skiing and riding is not immune to this phenomenon. A large proportion of backcountry skiers and riders today have moved from basing their tour plan decisions solely from the weather and avalanche forecast, to now incorporating these technological tools into their decision making. While social media (Facebook and Instagram) initially drove this change, applications such as Strava - most notably via their heat map function – and integrating AI into these applications, are changing people’s behavior accessing the backcountry and evaluating terrain. This intersection of science and human behavior is superseding institutional knowledge, giving a false sense of conditions and hazards, and inadvertently opens terrain during periods of higher hazard. We have long observed the trickle-down effect of a slope opening in the field, attracting more skiers and riders based on tracks. However, backcountry users are now utilizing social media and heat maps to observe where others have traveled and are seemingly basing some decisions on such data points, regardless of the warnings of the local avalanche center and recent observations. The sheep mentality and social acceptance isn’t new, and snow professionals regularly urge caution of this risk during periods of persistent weak layer avalanches. Utilizing a website that aggregates and intertwines Strava data with users' photos to create a snow condition report, I have been able to observe several examples of this. By investigating specific dates surrounding sensitive, persistent weak layer avalanche problems, I have collected chronological links demonstrating a relationship between people trusting the opensource data despite recent avalanches and/or forecast which contradicted the stability. Examples such as heat maps that show skin tracks going up the face of avalanche paths rather than traveling on the typical ridgelines, or users choosing terrain in the bullseye of recent avalanche activity without incident, which is then subsequently shared through this tool and attracts more users. While this is post-hoc analysis, there are several examples of backcountry user decision making that counter traditional warnings and forecasts, raising significant speculation about the role of such tools and their prevalence. Presenting this data and its inferences is purely to communicate the use of such technology and educate snow professionals on it, emphasizing the need to adapt to our audience. No shaming is intended in the analysis. This paper will begin to tackle the intersection of science and human behavior and address how AI generated data could influence human behavior in avalanche terrain. This is important for snow professionals and avalanche forecasters because we need to understand what our limitations are with our current tools and tactics in a changing technological environment and culture of backcountry users. As snow professionals we need to be aware and communicate to our audience before they get in trouble utilizing crowd sourced information during periods of higher hazard."],"kw":"","ty":"P","pp":151,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"Erme Catino"},"163":{"id":"163","t":"Validating the Updates to the Avaluator Version 3: Trip Planner and Slope Evaluator","au":[{"n":"James Floyer","raw":"Floyer, James","p":true,"aff":""},{"n":"Keith Robine","raw":"Robine, Keith","p":false,"aff":""}],"ab":["Canada has seen a steady reduction in its 10-year avalanche fatality trend over the past two decades. Throughout this period, the Avaluator framework has been the cornerstone of Avalanche Skills Training courses, suggesting the approach has been broadly successful in helping users conceptualize and manage avalanche risk. In 2025, the Avaluator was updated from version 2 to version 3. This paper presents the rationale and validation behind the key changes to the Trip Planner and Slope Evaluator, drawing on a 60-respondent practitioner survey and a retrospective analysis of avalanche incidents that provides a unique opportunity to both validate the existing framework and visualize how the tool performs against real-world outcomes. The retrospective analysis scored 156 Canadian fatal avalanche incidents from 2007 to 2026 against both versions of each tool. Restricting the comparison to incidents whose scores resolve to a single recommendation, only 3% of incidents fell in the green (Normal Caution) zone of the version 3 Trip Planner, with 26% in yellow (Extra Caution) and 71% in red (Not Recommended). For version 3 of the Slope Evaluator, a single incident, 1% of the sample, fell in the green zone, with 8% in yellow and 91% in red. Overall, results for version 3 compared closely with the previous version 2, with version 3 shifting roughly four percentage points from yellow to red on both tools. That the two versions perform similarly against the historical record indicates the update maintains safety effectiveness and aligns the tools with ATES v2.0, while near-unanimous support among practitioner survey respondents indicates the changes also improve the tools' usability."],"kw":"Avaluator, decision support, avalanche education, Trip Planner, Slope Evaluator","ty":"P","pp":152,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"James Floyer"},"164":{"id":"164","t":"A Decision Support Tool for Assessing the Historical Significance of Storm Totals from Remote Automated Weather Stations","au":[{"n":"Michelle Dalpes","raw":"Dalpes, Michelle","p":true,"aff":""},{"n":"John Sykes","raw":"Sykes, John","p":false,"aff":""},{"n":"Jason Konigsberg","raw":"Konigsberg, Jason","p":false,"aff":""},{"n":"Spencer Logan","raw":"Logan, Spencer","p":false,"aff":""}],"ab":["Regional backcountry forecast centers face persistent challenges in understanding the historical significance of ongoing storms. This situational awareness is critical, as forecasters cannot effectively anticipate avalanche conditions during extreme weather events without recognizing when such events are occurring. Historically, there has been no efficient method to rapidly compare multi-day increases in snow water equivalent (SWE) from Natural Resources Conservation Service (NRCS) SNOTEL stations to those observed during past storms. These data are widely used by avalanche forecasters across Alaska and the western United States to monitor storm progression. Following a historic avalanche cycle in March 2019 in Colorado, forecasters at the Colorado Avalanche Information Center (CAIC) initiated development of a situational awareness tool designed to provide streamlined access to historical SWE data across broad spatial scales and enable comparison with active storm conditions. Forecasters at the Chugach National Forest Avalanche Center (CNFAC) subsequently expanded and automated this tool, transitioning it from a static spreadsheet into a more accessible and dynamic format. This tool is now publicly available for both avalanche professionals and general users via the CNFAC Storm Tracker application. This paper presents the structure and capabilities of the tool and evaluates its utility through a case study of a high-impact storm event. This case study demonstrates how the tool improves identification of anomalous snowfall patterns, supports real-time decision-making, and provides context for forecasting avalanche conditions during ongoing storms. In addition to operational use, the tool includes a retrospective “look-back” capability, allowing users to compare storms of interest with historical events, enhancing both forecasting practice and post-event analysis."],"kw":"Weather Forecasting and Climate, Avalanche Forecasting, Incidents and Case Stud- ies, Instrumentation and Remote Sensing","ty":"P","pp":153,"em":[],"r":3572,"day":"Tue","th":"Avalanche Forecasting","pr":"Michelle Dalpes"},"165":{"id":"165","t":"Walking the Edge: Analysis of a Survey on the Risks of Cornice Mitigation and Risk Normalization","au":[{"n":"Ben Merkle","raw":"Merkle, Ben","p":false,"aff":""}],"ab":["Snow safety practitioners commonly report anecdotes of near misses while performing cornice mitigation work. This study surveyed 51 avalanche practitioners (representing an estimated 19,140 days of cornice mitigation experience) to quantify risks of cornice mitigation, particularly cornice kicking. Results show approximately one near miss per 64 practitioner-days, with one injury per 60 near misses. Compared to ski cutting, cornice mitigation has a lower injury-tonear miss ratio, suggesting it is more likely to have a learning opportunity before an injury occurs. The observed near miss rate is highest during a practitioner’s first 50 days of cornice mitigation work, indicating targeted mentorship for inexperienced staff may reduce accidents. However, risk persists even among experienced practitioners, making the management of risk normalization an ongoing challenge for snow safety operations."],"kw":"Cornice, Cornice Mitigation, Risk Normalization","ty":"P","pp":154,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"Ben Merkle"},"166":{"id":"166","t":"Mountain Roads and Avalanches: Risk Assessment","au":[{"n":"Ludovico Raviglione","raw":"Raviglione, Ludovico","p":false,"aff":""},{"n":"Massimo Raviglione","raw":"Raviglione, Massimo","p":true,"aff":""}],"ab":["Mountain roads, due to their nature, are constantly subject to natural hazards (landslides, rockfalls, debris flows, avalanches, ice, etc.) which, during normal operation, pose a risk to the user who travels on them. In the winter and spring seasons, the main danger is connected with potential avalanche phenomena that interfere with the road sediment, which, if not properly managed, can lead to limitations on use (e.g. temporary interruptions, travel restrictions during time slots, etc.). The risk assessment, contextualized to the geographical, morphological, climatic, snow, vehicle travel, and functionality characteristics of the protection structures, allows for a specific site assessment aimed at defining, based on snow conditions, the risk value for a specific level of avalanche danger. In this work, using the method proposed by Robert Bolognesi - Meteorisk, in reference to the most significant snow precipitation events recorded in recent decades (in particular those from the 2008- 2009 season to the 2025-2026 season) the results of the calculated risk assessments along some mountain road sections of the Province of Biella will be illustrated by evaluating, in the historical period considered, the changes in the level of risk as a function of the climate changes that affected the study area."],"kw":"","ty":"P","pp":155,"em":[],"r":3508,"day":"Mon","th":"Planning and Engineering","pr":"Massimo Raviglione"},"167":{"id":"167","t":"The Run List in Mechanised Skiing: History, Evolution and Current Practice","au":[{"n":"Peter Macpherson","raw":"Macpherson, Peter","p":true,"aff":""},{"n":"Scott Thumlert","raw":"Thumlert, Scott","p":false,"aff":""}],"ab":["Managing exposure to avalanche hazard through terrain selection is the primary avalanche risk mitigation strategy in winter backcountry guiding. The run list is a foundational operational tool that provides structured decision support: guides assess terrain, explicitly select appropriate terrain for the conditions, and communicate daily terrain decisions. Originally conceived at Canadian Mountain Holidays by guide Thierry Cardon, the run list began as a binary open or closed system and has since evolved into a nuanced decision-making tool recognized across the mechanized ski industry. This paper traces the historical origins of the run list, examines the progressive introduction of more sophisticated run treatment, colour coding categories from green and red to yellow and magenta, and describes the formalisation of supporting structures including the yellow flag process and a run coding algorithm. Today, the run list is required for HeliCat Canada membership and plays a central role in most daily guides meetings. Its evolution reflects broader developments in avalanche hazard assessment, organizational risk management, and professional mountain guiding."],"kw":"run list, run coding, mechanized skiing, Canadian Mountain Holidays, terrain selection, avalanche risk management, decision-making","ty":"O","pp":156,"em":[],"r":3423,"pr":"Peter Macpherson"},"168":{"id":"168","t":"Sliding Short: An Argument for Mission-Oriented Avalanche Education in the United States Military","au":[{"n":"Michael Ackerman","raw":"Ackerman, Michael","p":true,"aff":""},{"n":"Mauri DiMeo","raw":"DiMeo, Mauri","p":false,"aff":""}],"ab":["Military units move through avalanche terrain under conditions that fall outside the scope of recreational avalanche education. Missions occur in forecast-denied environments, compressed timelines restrict avoidance, and tactical operations rarely permit discretionary travel. Yet avalanche training delivered to US military units is generally procured from civilian providers building courses to recreational curriculum objectives, and the military maintains no curriculum of its own against which those courses are measured. Units therefore receive several different recreational curricula, shaped by each provider’s interpretation, with no institutional standard defining what a trained service member should know. This paper argues that recreational curricula are unfit for the purpose of preparing military users, and that military avalanche education should be treated as a distinct application with its own curriculum, competency standards, scope of practice, instructor qualifications, and governance, while remaining interoperable with existing recreational and professional pathways. The argument follows the precedent the avalanche industry set when it separated recreational from professional education, and rests on four structural differences: directed rather than discretionary travel, operations without forecast support, a competency asymmetry that recreational courses are not built to address, and the distinction between a technical avalanche forecast and a military operational risk assessment. The paper further argues that currency in this domain cannot be generated internally by an institution that cannot schedule winter, and that a qualification must communicate what its holder has been assessed to do rather than what course they attended. The timing is deliberate. The standard that will govern how these units are prepared is being formalized now, and once written it will remain in force for years. This paper argues for disaggregation and does not attempt curriculum design, which is the subject of subsequent work."],"kw":"avalanche education, military curriculum, risk management, tactical training","ty":"P","pp":157,"em":[],"r":3509,"day":"Mon","th":"Avalanche Education","pr":"Michael Ackerman"},"169":{"id":"169","t":"Operational Meetings in Avalanche Operations: Importance, Challenges, and Future","au":[{"n":"Marc Piché","raw":"Piché, Marc","p":false,"aff":""}],"ab":["Operational meetings remain one of the central decision-making tools in avalanche risk management. In many field programs, they are where weather, snowpack, terrain, operational constraints, human factors, and organizational intent are brought together and turned into a plan. Despite their importance, these meetings are often treated as routine box-ticking exercises, even though they sit at the core of how teams build shared understanding, challenge assumptions, communicate uncertainty, and align risk treatment decisions. This presentation examines the operational meeting as both a legacy practice and a modern problem. It begins with a brief history of how these meetings evolved and why they became such an important part of professional avalanche operations. It then looks at what they still do well: building a shared mental model, supporting defensible terrain and program decisions, and providing experienced practitioners with a structured space to combine data, field observations, and judgment. It also addresses where operational meetings fall short. Common weaknesses include variable quality, time pressure, information overload, inconsistent participation, ineffective meeting space, over-reliance on dominant voices, and difficulty turning growing volumes of information into better decisions. Modern programs face additional challenges from increasing digital inputs, growing teams, communication technology, documentation demands, and the risk that more information creates more noise rather than more clarity. Rather than arguing for more automation or less human judgment, this talk challenges the avalanche community to better define which parts of the meeting process are best done by people and which could be improved through technology. The goal is not to replace discussion, experience, or intuition, but to support them. The presentation frames operational meetings, particularly in guiding operations but with relevance across field-based avalanche work, as an under-examined part of avalanche practice, and invites researchers, developers, and practitioners to collaborate on tools, including AI-enabled tools, that strengthen the process without undermining the human strengths that make it valuable."],"kw":"avalanche operations, operational meetings, human factors, decision support, artificial intelligence","ty":"O","pp":158,"em":[],"r":3424,"pr":"Marc Piché"},"170":{"id":"170","t":"Understanding and Improving a Professional Avalanche Training Program: Initial Findings from the AIARE PRO 1","au":[{"n":"Anne St Clair","raw":"St Clair, Anne","p":true,"aff":""},{"n":"Emma Walker","raw":"Walker, Emma","p":false,"aff":""},{"n":"Sean Zimmerman-Wall","raw":"Zimmerman-Wall, Sean","p":false,"aff":""}],"ab":["Professional avalanche training plays a central role in preparing workers for avalanche operations, yet little research has examined its effectiveness or the factors shaping its outcomes. As part of a phased evaluation of their Pro 1 program, the American Institute for Avalanche Research and Education (AIARE) analyzed records for 315 participants across 24 courses delivered during three operating seasons. To characterize performance across multiple assessments, we classified participants into four classes spanning the assessed proficiency range, from highest to lowest. We then used logistic regression and chi-square tests to examine factors associated with membership in the highest and lowest classes, including participant attributes, course structure and delivery, instructors, and terrain and hazard variables. Age, gender, race, prior training, and industry background were not associated with membership in the highest or lowest proficiency classes. However, associations emerged for participants’ formal education and primary mode of travel, individual courses and instructors, and course size and course types, such as motorized and gender-affinity courses. Terrain and hazard variables were also associated with proficiency class membership. Overall, membership in the highest proficiency class was more common with more complex terrain and higher hazard, whereas membership in the lowest proficiency class was more common under lower hazard and in the absence of slab avalanche problems. Proficiency class membership also varied by venue and mountain region. These patterns raise the possibility that courses with simpler terrain, lower hazard, or no slab avalanche problems may constrain meaningful opportunities for participants to demonstrate proficiency and for instructors to assess it. Further work should test this explanation and determine how programs can support reliable assessment when key conditions do not occur. These questions, together with the other patterns identified, provide direction for further analysis, targeted data collection, and the development of a systematic evaluation program."],"kw":"Avalanche education; professional training; program evaluation","ty":"P","pp":159,"em":[],"r":3510,"day":"Mon","th":"Avalanche Education","pr":"Anne St Clair"},"171":{"id":"171","t":"A Persistent Slab Cycle in the Washington Cascades; a Case Study of Snowpack Variables Affecting the Duration of Observed Avalanche Activity Across Subregions","au":[{"n":"Kathryn J. Warren","raw":"Warren, Kathryn J.","p":false,"aff":""}],"ab":["In the Washington Cascades, rain-on-snow events followed by prolonged high pressure frequently lead to the formation of crust adjacent persistent weak layers (PWLs). When these layers are subsequently buried, avalanche activity or lack thereof can vary in timing, duration, and distribution throughout the different subregions of the Cascades. In the winter of 2023-2024, a rain event followed by prolonged drought conditions formed a crust adjacent persistent weak layer of small, faceted grains. This layer, locally named the Early February Crust/Facets (EFC), was documented throughout the Washington Cascades. After additional snowfall, a widespread natural and human triggered avalanche cycle occurred in February and March of 2024. The observed avalanche activity ranged from 1- 23 days across different subregions. This case study documents the avalanche cycle and analyzes three variables that may contribute to the extent and duration of avalanche activity: weak layer burial depth, cumulative snow water equivalent, and weak layer grain size. The findings show that areas with shallower burial depths and lower SWE amounts saw more prolonged avalanche activity associated with the Early February Facet layer. While these results are consistent with previous research on crust adjacent PWLs, this case study only represents one specific avalanche cycle. Additional persistent slab cycles should be analyzed to determine if burial depth and cumulative SWE values can be used to better predict the extent and duration of avalanche activity associated with crust adjacent PWLs."],"kw":"Persistent slab avalanches, coastal snow climate, case study, faceted snow","ty":"P","pp":160,"em":[],"r":null,"day":"Fri","th":"Incidents and Case Studies","pr":"Kathryn J. Warren"},"172":{"id":"172","t":"To Measure or Not to Measure: How Density-Determination Methods Can Influence Snow Instability Simulated from Observed Profiles","au":[{"n":"Leonardo Zoltan","raw":"Zoltan, Leonardo","p":false,"aff":""},{"n":"Ingrid Reiweger","raw":"Reiweger, Ingrid","p":false,"aff":""}],"ab":["Numerical snow cover models have emerged as valuable tools for avalanche forecasting, simulating snowpack stratigraphy and producing instability metrics. They are especially effective for short-term stability predictions when initialized from an observed snow profile. Snow density is a mandatory input, yet how much the density-determination method influences the instability metrics has received little attention. We investigated this using manual profiles collected across Austria during the 2024/2025 and 2025/2026 winters. For each profile, SNOWPACK was initialized with up to four methods: a grain-shape/hardness parameterization (look-up table), SLF Snow Sensor measurements every 2 cm, one sensor reading in the middle of each layer, and where available a traditional density cutter. All simulations per profile were forced with identical highresolution ICON-D2 weather data. We evaluated three instability metrics, critical crack length (CCL), Punstable and SK38, at the initial profile and after two snowfall events. Methods disagreed at a typical profile by ~50 kg/m³ in average density and ~37 mm in SWE and these differences propagated into the instability metrics. At the initial profile the median across-method spread was 0.24 in Punstable, 0.08 in CCL and 0.09 in SK38, and 13, 20 and 6 cm respectively in the identified slab thickness (up to 95 cm for Punstable). The spreads narrowed after new snow was deposited in the models. For Punstable, all methods agreed on the stability class at every profile by the second snowfall. The identified slab thickness, however, still varied by up to 37 cm across methods. The density-determination method can shift the instability metrics, but especially the slab-thickness estimates, by an operationally relevant margin. Awareness of this method-dependent uncertainty may help in the interpretation of model-from-observation output in operational forecasting."],"kw":"Avalanche forecasting, modelling and quantitative forecasting, snowpack properties, snow density","ty":"P","pp":161,"em":[],"r":3628,"day":"Thu","th":"Modelling and Quantitative Forecasting","pr":"Leonardo Zoltan"},"173":{"id":"173","t":"Start-Zone Terrain and the Occurrence and Timing of Wet Slab Avalanches in Colorado","au":[{"n":"Brandon Levy","raw":"Levy, Brandon","p":true,"aff":""},{"n":"Ron Simenhois","raw":"Simenhois, Ron","p":false,"aff":""},{"n":"Erich H. Peitzsch","raw":"Peitzsch, Erich H.","p":false,"aff":""},{"n":"Ethan Greene","raw":"Greene, Ethan","p":false,"aff":""}],"ab":["Wet slab avalanches (WSAs) release when liquid water reduces the strength of a buried weak layer or interface, and their timing is governed primarily by the snowpack energy balance and the movement of meltwater. We classified 717 WSAs from the Colorado Avalanche Information Center database (2011–2025) into five start-zone terrain categories and analysed the timing of naturally triggered, near- and above-treeline events using rank-based and Bayesian hierarchical methods. Start-zone terrain strongly governs the natural occurrence of WSAs: approximately 64% released in Rocky start zones (Cliffs/Rocks), while only ≈4% occurred on Open Slopes. After controlling for latitude and aspect, Rocky start zones released approximately five days before Open Slopes (90% CrI: 0.6–9.9 days). Latitude was the dominant timing predictor, shifting release by roughly 3–4 weeks from southern to northern Colorado. Cornice start zones concentrated WSA activity in early to mid-spring, with 40 of 41 releasing before mid-May. These findings support start-zone terrain classification as a low-cost addition to observation protocols for improving the spatial targeting of wet slab outlooks."],"kw":"wet slab avalanche; start zone; terrain classification; release timing; Bayesian hierarchical model; Colorado","ty":"P","pp":162,"em":[],"r":3573,"day":"Tue","th":"Avalanche Forecasting","pr":"Brandon Levy"},"174":{"id":"174","t":"Revisiting Avalanche Destructive Scale and Associated Mass Estimates","au":[{"n":"Erich H. Peitzsch","raw":"Peitzsch, Erich H.","p":true,"aff":""},{"n":"John M. Sykes","raw":"Sykes, John M.","p":false,"aff":""},{"n":"Zachary M. Guy","raw":"Guy, Zachary M.","p":false,"aff":""},{"n":"Ron Simenhois","raw":"Simenhois, Ron","p":false,"aff":""},{"n":"Bruce Jamieson","raw":"Jamieson, Bruce","p":false,"aff":""}],"ab":["Avalanche destructive (D) size classifications are essential for forecasting, communication, and risk management, yet size estimation remains one of the more subjective elements of avalanche assessment. Practitioners typically rely on visual impressions of destructive potential, path length, and estimated mass and volume. Recent work indicates that size is often underestimated even by experienced observers, especially when based on photographs or distant observations. Although mass is central to defining destructive size, the empirical foundations of mass–size relationships have rarely been revisited, and expert variability in size assignment could be decreased if more consistent operational tools were available. We evaluated whether a simple, practitioner‑focused calculation tool using slab dimensions, snow density, and snow water equivalent can provide reliable mass estimates that correspond meaningfully with existing destructive size classes. Using this tool, we estimated avalanche mass and compared the results to observer‑assigned D sizes. We also simulated mass outputs using a dense flow avalanche simulation module and compared observer estimates and simple‑tool outputs to recent volume‑based methods for D‑size classification. Across 143 well‑documented dry snow avalanches from multiple avalanche climates, the size estimation tool tends to classify avalanches larger than field-based observers. We found a mean bias of 0.47 D-size units and a typical (mean absolute) disagreement of 0.56. Our results show that 95% of events landed within one whole D-class of each other and 71% within a half-class. Agreement between the simple tool mass estimates and dense flow avalanche simulations was generally strong, though discrepancies emerged in cases with substantial entrainment or complex terrain. We compared the size tool to the simulation module with entrainment (n=4) and without entrainment (n=8). With entrainment, the two methods estimate the same D-size class in 4 of 4 comparable events and 7 of 8 events without entrainment. Also, the simulation module estimates larger sizes than the observer in 7 of 8 cases without entrainment and all 4 cases with entrainment. These findings support that development of practical, mass‑based tools could improve D‑size consistency and emphasize the value of revisiting historical mass–size relationships. The accompanying application offers practitioners an accessible and operationally useful resource for improving D‑size estimation from field observations."],"kw":"Destructive Scale, Avalanche Size, Avalanche Mass.","ty":"O","pp":163,"em":[],"r":3481,"pr":"Erich Peitzsch"},"175":{"id":"175","t":"Before machine learning: validating historical SNOWPACK simulations for avalanche hazard forecasting in Glacier National Park, B.C., Canada.","au":[{"n":"Benjamin Imbach","raw":"Imbach, Benjamin","p":true,"aff":""},{"n":"Francis Meloche","raw":"Meloche, Francis","p":false,"aff":""},{"n":"Jean-Benoit Madore","raw":"Madore, Jean-Benoit","p":false,"aff":""},{"n":"Paul Billecocq","raw":"Billecocq, Paul","p":false,"aff":""},{"n":"Francis Gauthier","raw":"Gauthier, Francis","p":false,"aff":""},{"n":"Alexandre Langlois","raw":"Langlois, Alexandre","p":false,"aff":""},{"n":"Philippe Gachon","raw":"Gachon, Philippe","p":false,"aff":""}],"ab":["Accurate avalanche hazard forecasting depends on reliable snow and weather information, which is often unavailable in the complex mountainous terrain where hazards are greatest. This limits the availability of training data for emerging machine learning approaches to avalanche hazard assessment.This study lays the groundwork for such a model for Glacier National Park (GNP), British Columbia, Canada, by validating snow cover simulations produced by the MeteoIO/SNOWPACK/Alpine3D model chain driven by four gridded meteorological forcing datasets spanning reanalyses, a regional climate model, and a numerical weather prediction model. Each dataset is downscaled using subgridding and terrain-adapted interpolation techniques. Modelled snow cover properties are then compared against an extensive record of snow profiles and instability tests collected by the Avalanche Control Section between the 1999-2000 and 2022-2023 seasons, using the profile similarity approach. This work establishes a validated historical simulation framework upon which future machine learning approaches to avalanche hazard forecasting in GNP can be built."],"kw":"Avalanche forecasting, SNOWPACK/Alpine3D, Model validation, Weak layer identification, Meteorological forcing data, Glacier National Park","ty":"O","pp":164,"em":[],"r":3443,"pr":"Benjamin Imbach"},"176":{"id":"176","t":"Fatal Occupational Injuries of Avalanche Workers in the United States and Canada - 1950 to 2026","au":[{"n":"Ethan Greene","raw":"Greene, Ethan","p":true,"aff":""},{"n":"Spencer Logan","raw":"Logan, Spencer","p":false,"aff":""},{"n":"Joe Obad","raw":"Obad, Joe","p":false,"aff":""},{"n":"Brendan Martland","raw":"Martland, Brendan","p":false,"aff":""},{"n":"Bruce Jamieson","raw":"Jamieson, Bruce","p":false,"aff":""}],"ab":["People working in avalanche safety are exposed to significant hazards at work. Despite the potential for harm, fatal workplace accidents involving avalanche workers are uncommon. While the total number of fatal accidents is relatively small, the fatal occupational injury rate is relatively high compared to other occupations. We present an updated dataset of avalanche worker deaths, examine trends discussed in Greene et al. (2014), and compare the rate of fatal occupational injuries of avalanche workers with industry sectors tracked by government agencies in the United States and Canada. Our estimates of annual fatal occupational injuries per 100,000 workers place the avalanche industry near the top of the list of high-risk occupations, but the size of the industry and the number of accidents make firm conclusions difficult. We present these data to promote industry discussions on acceptable risk in the workplace, professional training programs, and risk management strategies for managers and staff in avalanche safety operations."],"kw":"worker safety, risk management, fatal occupational injuries, avalanche accidents","ty":"O","pp":165,"em":[],"r":3391,"pr":"Ethan Greene"},"177":{"id":"177","t":"Patterns of Glide Avalanche Release: Insights from 23 Years of Observations Along the Going-to-the-Sun Road, Montana, USA","au":[{"n":"Erika Birkeland","raw":"Birkeland, Erika","p":true,"aff":""},{"n":"Maddey Frey","raw":"Frey, Maddey","p":false,"aff":""},{"n":"Sarah Williams","raw":"Williams, Sarah","p":false,"aff":""},{"n":"Erich Peitzsch","raw":"Peitzsch, Erich","p":false,"aff":""}],"ab":["Glide avalanches pose a notable hazard during annual spring snow removal operations along the Going-to-the-Sun Road (GTSR) in Glacier National Park (GNP), USA. Glide cracks consistently form on specific slopes near and above the GTSR. Some glide crack locations produce glide avalanches most years (known as repeater paths), whereas others are less predictable and either release or melt in place. Previous studies of glide avalanches have focused on different meteorological, snowpack, and terrain parameters that influence glide release. The timing of glide avalanche release remains difficult to predict, which can be a challenge. To the authors’ knowledge, no previous work has approached the issue of timing by comparing the chronological release order of glide paths within an operation. To address this, we examine the release order of repeater paths along the GTSR and investigate different topographical factors that may influence release timing. To investigate the timing of glide avalanche release, we analyzed a dataset of annually recorded glide avalanches from 2003 to 2025 along the GTSR from mid-March to June. We identified 359 glide avalanches with starting zones covering all aspects between 1,600 and 2,700 meters, and performed analysis on topographic factors including elevation, aspect, slope angle, and bed surface. Additionally, we assessed the likelihood and sequence of the release of seven repeater paths. Seven repeater paths along the GTSR generate glide avalanches nearly every year (65–100% of the study period), with two paths (Peak 7774 and Peak 7850) releasing first in over half of the years observed (p-value < 0.01). These paths have been informally recognized as “indicator paths,” though this distinction has not been quantified until now. Identifying factors that drive the timing of glide avalanches using a days-scale operational signal can support the safeguarding of infrastructure and personnel. By examining release order and related variables, this study provides practical insights to inform operations managing glide avalanche hazards. Our methods may help forecasters pinpoint indicator paths and potentially recognize the onset of glide avalanche cycles, offering a framework for other operations."],"kw":"avalanche forecasting, glide avalanches, indicator path.","ty":"P","pp":166,"em":[],"r":3574,"day":"Tue","th":"Avalanche Forecasting","pr":"Erika Birkeland"},"178":{"id":"178","t":"Binary Avalanche Detection System (Bads)","au":[{"n":"Michael Dvorsak","raw":"Dvorsak, Michael","p":tru
