distribution was fitted with a lognormal function and used to calculate drainage SWRCs with the Kosugi model. The equivalent diameter obtained by the watershed method mainly represents porebody size, whereas drainage pressure is strongly controlled by the throats connecting adjacent pores. We therefore introduced R_BT, the ratio of pore-body diameter to effective pore-throat diameter, and evaluated the calculated curves against measured SWRCs. With R_BT = 1, the uncorrected model tended to predict drainage at lower suction than observed. Introducing R_BT shifted the characteristic suction scale and improved agreement with the measurements. These results demonstrate the limitation of directly treating watershed-derived equivalent pore-body diameters as capillarythroat diameters and indicate that the size difference between pore bodies and throats should be considered when estimating snow SWRCs."],"kw":"snow water retention curve, equivalent pore-body diameter, X-ray micro-CT, 3D water- shed, Kosugi model","ty":"P","pp":99,"em":[],"r":3561,"day":"Tue","th":"Avalanche Forecasting","pr":"Satoru Yamaguchi"},"104":{"id":"104","t":"Case Study of a Slushflow in Skarmodal, Norway, in 2010","au":[{"n":"Peter Gauer","raw":"Gauer, Peter","p":true,"aff":""}],"ab":["Slushflows are a well-known hazard in Arctic regions and, to a lesser extent, in alpine environments. With ongoing climate change, conditions that promote their release—such as specific weather patterns and snowpack structures— are expected to occur more frequently, increasing their relevance for hazard assessment. Despite this, observational data suitable for the development and validation of numerical models remain limited. Reliable back-calculations with dynamic models require well-constrained initial and boundary conditions, including release area and average release depth, as well as detailed observations of flow dynamics. In particular, run-out distance alone is insufficient for model calibration; velocity and flow depth data along the flow path are essential. This study focuses on the documented slushflow event in Skarmodalen on 16 May 2010, for which front velocities were determined over a distance of approx. 600 m in the central section of the path. Based on these observations, a profile of frontal velocity and a set of initial conditions are derived. These data are then used for back-calculations with a dynamic numerical model. The results contribute to improving the calibration and validation of slushflow models and highlight the importance of detailed field observations for hazard assessment under changing climatic conditions."],"kw":"slush-flow; observations; dynamics","ty":"P","pp":100,"em":[],"r":3498,"day":"Mon","th":"Avalanche Dynamics","pr":"Peter Gauer"},"105":{"id":"105","t":"A Consequence Assessment Framework for Site-Specific Road Avalanche Warning in Norway","au":[{"n":"Markus Eckerstorfer","raw":"Eckerstorfer, Markus","p":true,"aff":""},{"n":"Emil Solbakken","raw":"Solbakken, Emil","p":false,"aff":""},{"n":"Halgeir Dahle","raw":"Dahle, Halgeir","p":false,"aff":""},{"n":"Tore Humstad","raw":"Humstad, Tore","p":false,"aff":""},{"n":"Njål Farestveit","raw":"Farestveit, Njål","p":false,"aff":""},{"n":"Jens Øyen Tveit","raw":"Tveit, Jens Øyen","p":false,"aff":""},{"n":"Eivind Schnell Juvik","raw":"Juvik, Eivind Schnell","p":false,"aff":""},{"n":"Dag Theodor Røsvik Andreassen","raw":"Andreassen, Dag Theodor Røsvik","p":false,"aff":""}],"ab":["Site-specific avalanche warning for roads is a risk-reducing measure that combines an assessment of avalanche likelihood with an impact-based assessment of consequence for the road — whether a given avalanche reaches the road, and what happens to traffic if it does. This consequence dimension is rarely addressed as an explicit, repeatable methodology; site-specific warning has typically relied on qualitative, case-by-case judgment instead. We present a structured, path-specific consequence assessment framework, separating a static preseason consequence matrix per avalanche path from a small set of daily dynamic inputs, combined in an operational likelihood and risk matrix. The framework introduces specific runout length, relative runout length, and consequence classes as methodological contributions to site-specific road avalanche warning. Applied to Rv. 13 Vikafjellet in 2025/26 and two additional corridors since 2024/25, the framework governed daily alert-level decisions alongside active avalanche control, yielding a residual risk comparable to established control programs internationally. We discuss current limitations — particularly the reliance on expert judgment for terrain, traffic scoring, and design avalanches — and outline how the framework could be made more systematic and automated."],"kw":"site-specific avalanche warning, consequence assessment, road avalanche risk, resid- ual risk, impact-based forecasting * Corresponding author address: Markus Eckerstorfer, The Norwegian Public Roads Administration, Norway; email: markus.eckerstorfer@vegvesen.no","ty":"O","pp":101,"em":["markus.eckerstorfer@vegvesen.no"],"r":3441,"pr":"Markus Eckerstorfer"},"107":{"id":"107","t":"Avalanche Forecast Verification and Occurrence in Scotland, 2007–2025","au":[{"n":"Ian N. Durbach","raw":"Durbach, Ian N.","p":true,"aff":""},{"n":"Blair Fyffe","raw":"Fyffe, Blair","p":false,"aff":""},{"n":"Brian Morrison","raw":"Morrison, Brian","p":false,"aff":""},{"n":"Mark Diggins","raw":"Diggins, Mark","p":false,"aff":""},{"n":"Philip A. Ebert","raw":"Ebert, Philip A.","p":false,"aff":""}],"ab":["The Scottish Avalanche Information Service (SAIS) has issued daily avalanche forecasts across Scotland since 1988. In 2016, the service adopted the European Avalanche Danger Scale and structured, matrix-based forecasting guidance. We analysed 11,516 forecasts produced by 63 forecasters across six regions during the 2007/08–2024/25 seasons, together with 3,193 reported avalanches, to describe changes associated with this transition and provide the first comprehensive account of avalanche forecasting and occurrence in Scotland. Exact agreement between forecast and target-day observed hazard rose from 61.2% to 80.8% after the transition, and the multicategory Peirce skill score from 0.535 to 0.665, with scores increased for 11 of 12 adequately sampled forecasters. Calibration between forecast hazard and reported avalanche occurrence also improved. Scores tended to be slightly higher when forecasters verified their own forecasts. Forecast hazard was not elevated at weekends, but reported avalanches were more frequent, which may reflect increased observation.. The analysis is descriptive rather than causal, but provides a quantitative baseline for future verification and practical recommendations for strengthening the verification process."],"kw":"avalanche forecasting; forecast verification; danger level; avalanche occurrence; Scotland","ty":"P","pp":102,"em":[],"r":3562,"day":"Tue","th":"Avalanche Forecasting","pr":"Ian N. Durbach"},"108":{"id":"108","t":"Hunting Mach Cones in Snow: Supershear Fracture & Shock Front Refraction in Layered Slabs","au":[{"n":"Alexandre Pellet","raw":"Pellet, Alexandre","p":false,"aff":""},{"n":"Bastian Bergfeld","raw":"Bergfeld, Bastian","p":false,"aff":""},{"n":"Alec van Herwijnen","raw":"van Herwijnen, Alec","p":false,"aff":""},{"n":"Johan Gaume","raw":"Gaume, Johan","p":true,"aff":""}],"ab":["Supershear crack propagation has recently been identified as an important mechanism in snow slab avalanche release. In this regime, the crack in the weak layer propagates faster than the shear-wave speed of the slab, producing a shock front known as a Mach cone: a striking Doppler-induced signature of supershear fracture. While this phenomenon is well known in earthquake dynamics, its role in snow fracture and avalanche release is only beginning to be explored. For avalanche research and practice, understanding these dynamic fracture processes is important because they may help explain rapid crack propagation over large distances and improve the interpretation of field and experimental observations. Here, we combine numerical simulations and physical snow fracture experiments to investigate supershear fracture in layered snow slabs. Our results show that slab layering has a strong influence on both crack speed and Mach cone geometry. In particular, changes in cone shape and curvature can be explained by wave refraction at interfaces between layers with different mechanical properties. These findings provide new insights into the dynamic processes governing avalanche release and offer a practical framework for detecting and interpreting Mach-cone signatures in future avalanche release experiments."],"kw":"snow slab avalanche, crack propagation, supershear fracture, Mach cone, weak layer, propagation saw test, snow stratigraphy.","ty":"P","pp":103,"em":[],"r":null,"day":"Mon","th":"Avalanche Formation","pr":"Johan Gaume"},"109":{"id":"109","t":"Towards a Technical and Communication Scheme for Avalanche Size Classification","au":[{"n":"Jan-Thomas Fischer","raw":"Fischer, Jan-Thomas","p":true,"aff":""},{"n":"Paula Spannring","raw":"Spannring, Paula","p":false,"aff":""},{"n":"Christoph Hesselbach","raw":"Hesselbach, Christoph","p":false,"aff":""},{"n":"Andreas Huber","raw":"Huber, Andreas","p":false,"aff":""},{"n":"Anna Wirbel","raw":"Wirbel, Anna","p":false,"aff":""},{"n":"Anselm Koehler","raw":"Koehler, Anselm","p":false,"aff":""},{"n":"Betty Sovilla","raw":"Sovilla, Betty","p":false,"aff":""},{"n":"Peter Gauer","raw":"Gauer, Peter","p":false,"aff":""},{"n":"Scott Thumlert","raw":"Thumlert, Scott","p":false,"aff":""}],"ab":["The 1981 Avalanche Atlas is a landmark achievement in snow and avalanche science. It provides a unified, multilingual framework for describing and classifying avalanches in terms of genetics and morphology, serving as a reference for researchers, practitioners, and educators in hazard management worldwide. The presented work is embedded in the IACS working group on International Classification of Snow Avalanches, which aims to update the avalanche classification schemes of the Avalanche Atlas based on 40+ years of developments in avalanche research and practice. It serves as a starting point for discussion within the avalanche community, tackling open classification questions starting from an avalanche-size perspective. As a first step, we highlight the potential of, and challenges facing, existing avalanche classification schemes, with particular focus on avalanche size. To unify existing operational size classifications, we propose the concept of avalanche path and event size, directly connecting relative and absolute size. We further present a first technical and communication scheme based on three independent size criteria - dimension size, runout size, and destructive size - and their corresponding quantifiable characteristics, closely related to current operational schemes. The proposed size classification is designed for forward and backward compatibility, providing a continuous technical and consistent communication scheme that can be used along existing operational size classification schemes while maintaining flexibility for future developments. Finally, we open a discussion bridging the gap between avalanche size, genetics, and morphology, proposing a combination between the established Avalanche Atlas with the presented technical size scheme."],"kw":"","ty":"P","pp":104,"em":[],"r":3499,"day":"Mon","th":"Avalanche Dynamics","pr":"Jan-Thomas Fischer"},"110":{"id":"110","t":"How Backcountry Users Engage with Avalanche Forecasts: Evidence from an Item Response Modelling Approach","au":[{"n":"Jerred Jolin","raw":"Jolin, Jerred","p":false,"aff":""},{"n":"Kelly McNeil","raw":"McNeil, Kelly","p":true,"aff":""}],"ab":["This study examined patterns of avalanche forecast information use among recreationallevel avalanche course completers using data from the Use of Avalanche Center Forecasts (UACF) survey. Responses from 879 recreationallevel avalanche course completers were analyzed with a unidimensional partial credit model (PCM) to develop a Use of Avalanche Forecast Information in Decision Making (UAFIDM) progress variable through an empirically driven, bottom-up approach. This variable represents four qualitatively distinct zones of use of avalanche forecast information among recreational users. Findings reveal four qualitatively distinct zones of forecast use, with most recreational users consistently engaging with summary-zone products while substantially fewer incorporate distributed, effortintensive, and interpretive information sources. This pattern suggests that many recreational users may be making decisions based primarily on simplified summaries, without integrating the underlying data necessary for terrain selection and risk management. The results have direct implications for avalanche education and forecasting practice. Educational programs may need to more explicitly scaffold the transition from recognizing forecast elements to synthesizing information from multiple sources for decisionmaking. For forecasting operations, understanding which forecast elements are most frequently used by different user groups can help forecasters better align communication with user behavior. Identifying where engagement drops off may highlight opportunities to adjust how information is presented, emphasized, or integrated within the forecast to better support a range of users."],"kw":"avalanche forecast, engagement, risk communication","ty":"P","pp":105,"em":[],"r":3563,"day":"Tue","th":"Avalanche Forecasting","pr":"Kelly McNeil"},"111":{"id":"111","t":"Mission-Focused Risk Mapping for Avalanche Control in Glacier National Park","au":[{"n":"Chris Argue","raw":"Argue, Chris","p":true,"aff":""},{"n":"Danyelle Magnan","raw":"Magnan, Danyelle","p":false,"aff":""}],"ab":["Avalanche control for the Trans-Canada Highway (TCH) and Canadian Pacific Kansas City Railway through Rogers Pass in Glacier National Park (GNP) relies on an extensive artillery program using 105 mm howitzers fired from roadside positions, delivered via a partnership between Parks Canada and the Canadian Armed Forces. During control missions, a Parks Canada Mountain Safety Team (MST) forecaster directs artillery fire and observes results from a vehicle on the closed highway, sometimes adjacent to or within the target avalanche path. Since 2011, there have been two incidents where artillery-controlled avalanches have impacted and buried an MST vehicle, fortunately without serious injuries. Following the most recent incident, Parks Canada requested linear risk mapping to better manage exposure during control missions. This paper summarizes methods used to develop risk mapping for the TCH corridor and gun positions to support MST risk management decisions, and the resulting benefits during operational use. Quantitative risk was classified into four classes based on suggested naturalhazard thresholds in Canada and assigned corresponding risk ratings. Mapping was based on 60 years of avalanche occurrence records to estimate avalanche probability, together with field observations collected at a minimum of 50 m intervals along the highway. Worker vulnerability considered entrained timber and the consequences of steep terrain below the roadway. Results are presented independently for the north and south sides of the valley, allowing the MST forecaster to adjust their position once one side has been controlled. The mapping is paired with an internally developed avalanche control Risk Level Framework (RLF), which is used to evaluate mission risk for avalanche control operations based on team factors, environmental conditions, and expected avalanche character. Each risk class includes guidance linked to the RLF to support MST forecaster positioning during control operations. The risk mapping has been used operationally over the past two winters. Key benefits include reduced reliance on visual landmarks and informal heuristics to identify “safe” observation locations, and a more objective basis for managing exposure, particularly during low visibility and nighttime operations."],"kw":"Risk, artillery, avalanche, control, mapping.","ty":"P","pp":106,"em":[],"r":3564,"day":"Tue","th":"Operations and Program Management","pr":"Chris Argue"},"112":{"id":"112","t":"Historical SNOWPACK Reanalysis in Observationally Sparse Enviornments: A Case Study from Slide Mountain, 1986","au":[{"n":"Evan Leonard","raw":"Leonard, Evan","p":true,"aff":""},{"n":"Eric E. Lawrence","raw":"Lawrence, Eric E.","p":false,"aff":""},{"n":"Wendolyn Antibus","raw":"Antibus, Wendolyn","p":false,"aff":""}],"ab":["Mt. Rose Ski Tahoe lacked a formalized avalanche forecasting program until 2008, resulting in a critical observational gap spanning approximately 55 years since resort operations began in 1953. Qualitative records of weather and snowpack are sparse prior to the 2008 season, and data between 2008 and 2018 consists of a mix of scanned paper records and Microsoft Access database, making individual records challenging to query. Institutional knowledge of significant historical avalanche cycles is mostly anecdotal, residing with former patrol personnel no longer affiliated with the operation. To address this data deficiency, we employed the SNOWPACK numerical snow cover model to perform a meteorological and snowpack reanalysis of a major avalanche cycle that occurred in February 1986. Considered among the most consequential events in the documented history of Slide Mountain, the storm produced approximately 32 inches (81 cm) of snow water equivalent (SWE) at the Mt. Rose SNOTEL station and in excess of 20 feet (6 meters) of total snow accumulation at the top of the ski area. The resulting avalanches caused widespread infrastructure damage, closure of public roadways and the release of multiple artificially and naturally triggered avalanches classified up to D4 in size. Primary source documentation for this event is limited to photographic records and a single firsthand narrative account from the assistant patrol director at the time. We created a data pipeline to systematically integrate remotely sensed SNOTEL observations with ECMWF reanalysis data. The weather observations were used to reconstruct simulated stratigraphic profiles with SNOWPACK, enabling assessment of the weak layer and loading conditions that facilitated large-scale avalanche release. This reanalysis framework demonstrates the utility of physics-based snowpack modeling as a tool for reconstructing high-consequence historical events in data-sparse operational environments. Application of this methodology in regions with comparable observational gaps offers a systematic approach to quantifying low frequency high consequence scenarios, assist in accident investigation, inform practitioner safety protocols and enhance infrastructure resilience planning against these high consequence events."],"kw":"","ty":"O","pp":107,"em":[],"r":3468,"pr":"Evan Leonard"},"113":{"id":"113","t":"Applying the Avalanche Danger Scale: Consistency Depends More on the Situation Than the Forecaster","au":[{"n":"Brian Lazar","raw":"Lazar, Brian","p":true,"aff":""},{"n":"Dylan Craaybeek","raw":"Craaybeek, Dylan","p":false,"aff":""},{"n":"Frank Techel","raw":"Techel, Frank","p":false,"aff":""},{"n":"Simon Horton","raw":"Horton, Simon","p":false,"aff":""},{"n":"Mike Cooperstein","raw":"Cooperstein, Mike","p":false,"aff":""},{"n":"Simon Trautman","raw":"Trautman, Simon","p":false,"aff":""},{"n":"Ethan Greene","raw":"Greene, Ethan","p":false,"aff":""}],"ab":["Public avalanche forecasts compress complex hazard assessments into a single danger level to guide backcountry recreationists' terrain choices. Danger increases exponentially between levels, so a one-level difference carries significant behavioral and public safety consequences. A decade after Lazar et al. (2016) demonstrated substantial forecaster disagreement, we repeated the exercise with 144 professional public avalanche forecasters across North America, Europe, and New Zealand, each evaluating ten simulated mountain-range-scale scenarios. Two randomly selected forecasters agreed on the exact danger level only 54% of the time (Krippendorff's ordinal α = 0.65, 95% CI: 0.33 to 0.78), though 96% remained within one level. Agreement did not differ clearly by region or experience. Instead, consistency was dominated by scenario complexity (exact agreement ranged from 41% to 75%). In contrast, agreement on the primary avalanche problem was substantially higher, exceeding 80% consensus on half the scenarios, suggesting that disagreement may stem from danger-scale threshold decisions rather than hazard identification. When respondents deviated from the reference rating, they compressed toward the middle of the scale, over-forecasting low-hazard conditions and under-forecasting high-hazard conditions. Pooling independent forecasters and utilizing the group median significantly raised inter-panel reproducibility. A panel of three increased agreement by 13 percentage points (to 67%), with the first two added forecasters improving agreement more than six times as much per forecaster as subsequent additions. However, group aggregation only reduces random individual noise, leaving shared systematic biases intact. We recommend drafting your ratings independently first, and then discuss them as a group. If you are forecasting solo, an external opinion is valuable, whether from a neighboring office or a model, because a team cannot detect a bias its members share."],"kw":"avalanche danger scale, forecaster consistency, inter-rater reliability, judgment aggre- gation, avalanche problems, public avalanche forecasting","ty":"O","pp":108,"em":[],"r":3488,"pr":"Brian Lazar"},"114":{"id":"114","t":"The Persistence of Social Heuristics in Backcountry Decisionmaking: An Analysis of Resort-Adjacent Users","au":[{"n":"Duncan Knight","raw":"Knight, Duncan","p":true,"aff":""}],"ab":["Avalanche fatalities in recreational backcountry settings remain predominantly linked to human judgment errors rather than environmental unpredictability. As participation in lift-accessed backcountry terrain, commonly referred to as “slackcountry” or “sidecountry”, continues to grow, Sun Peaks Resort on Tod Mountain in the interior of British Columbia offers a valuable context for examining the cognitive and social processes that shape risk perception at the resort boundary. This paper investigates how social heuristics, specifically social proof, familiarity bias, and social compliance, persist among skiers and snowboarders transitioning from managed resort environments into the adjacent uncontrolled backcountry. Data was collected using a descriptive cross-sectional survey (n = 67) distributed among users of the lift-accessed backcountry at Sun Peaks Resort, via online backcountry communities and physical signage at resort boundary access points. The survey captured demographic information, formal avalanche training levels (ranging from no training to professional certification), and responses to scenario-based decision-making questions designed to elicit heuristic patterns. Findings indicate that a majority of respondents reported elevated perceived safety when pre-existing ski tracks were present on a slope, regardless of whether they had consulted the official avalanche bulletin, a pattern consistent with the tracks heuristic and social proof. Critically, this tendency was observed across all training levels, including participants with recreational-level courses and professional-level certification, providing evidence of the Training Paradox, as this study terms it. Social compliance pressures, including reluctance to challenge group decisions, were similarly distributed across experience and training categories. The study treats the Boundary Paradox as an interpretive lens rather than a proven causal mechanism, given the absence of a comparative control group. These findings contribute to the literature on the human factor in avalanche safety and reinforce the need for avalanche education programs to address behavioral and social dimensions of decision-making alongside technical hazard knowledge."],"kw":"Avalanche decision-making, social heuristics, social proof, backcountry skiing, risk per- ception, group dynamics.","ty":"P","pp":109,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"Duncan Knight"},"115":{"id":"115","t":"Avalanche Forecasting for Ice Climbers: Estimating Exposure and Managing Operational Uncertainty","au":[{"n":"Tim Ricci","raw":"Ricci, Tim","p":true,"aff":""}],"ab":["Avalanche bulletins give us the regional picture, but ice-climbing decisions are made at one climb, one start zone, one runout, and often one short section of terrain. This paper looks at how Yamnuska Mountain Adventures (YMA) guides make that translation in day-to-day operations using End-of-Day Program Summaries and Daily Hazard Evaluations from calendar years 2023-2025. We identified 773 waterfall-ice guide-group records on 372 operating dates, representing 640 venue-days and 2,713 client participations. In a manually reviewed subset with standard five-level danger ratings, the Public Bulletin and YMA Localized Forecast agreed in 65 of 69 alpine pairs (94.2%), 70 of 71 treeline pairs (98.6%), and 63 of 68 below-treeline pairs (92.6%). We then applied practitioner estimates of typical avalanche exposure time to 707 records (91.5%). These records represent approximately 380 guidegroup exposure hours and 1,180 person-exposure hours. The venues we used most were not necessarily where exposure accumulated: Junkyards accounted for 327 records but was assigned 0 h of routine sustained exposure under normal use, while Louise Falls accounted for 50 records and about 200 guide-group exposure hours. These estimates are not a risk score; they show where operational time in avalanche terrain accumulates. We describe the decision process as Hazard -> Uncertainty -> Terrain -> Exposure: start with the bulletin, identify what is uncertain, connect the problem to the terrain, then decide how much exposure to accept."],"kw":"avalanche forecasting, ice climbing, spatial scale, uncertainty, exposure, operational risk","ty":"O","pp":110,"em":[],"r":3480,"pr":"Tim Ricci"},"116":{"id":"116","t":"SNOWPACK Model Sensitivity to Observational and Weather Model Inputs","au":[{"n":"Ryan Szczerbinski","raw":"Szczerbinski, Ryan","p":false,"aff":""},{"n":"Travis J. Morrison","raw":"Morrison, Travis J.","p":true,"aff":""},{"n":"McKinley Talty","raw":"Talty, McKinley","p":false,"aff":""},{"n":"Jim Steenburgh","raw":"Steenburgh, Jim","p":false,"aff":""}],"ab":["The SNOWPACK model has shown skill at predicting the formation and evolution of various layers within the seasonal snowpack, including instances of avalanche-conducive properties which have supported human forecasters. While ground truth atmospheric and snowpack observations are ideal for SNOWPACK inputs, weather stations typically experience some intermittent failure, leading to gaps in the observational records. Additionally, they are expensive to install and maintain, and only provide point information, which has limited relevance to broad mountainous regions. In response, some agencies are turning to Numerical Weather Prediction (NWP) model data to entirely drive SNOWPACK over broader spatial scales. While this method improves spatial coverage, it comes at the cost of accuracy. Little Cottonwood Canyon’s Atwater (ATH20) snow study site provides a continuous observational record, which enables an opportunity to study the sensitivity of SNOWPACK results to observed versus NWP inputs. ATH20 site observations and raw and downscaled values from NOAA’s 3-km resolution High-Resolution Rapid Refresh (HRRR) model were each used as inputs to SNOWPACK over the 2025 snow year, as well as various observation- HRRR combinations. Results were validated against manual snow profile observations by quantifying profile similarities with dynamic time warping (DTW). HRRR downscaling improved the rate of SNOWPACK convergence and had a better DTW result than the raw HRRR data compared to ATH20-driven SNOWPACK. All SNOWPACK runs including the fully ATH20- driven performed similarly against the manual snow profiles, indicating a need for manual profile data collection tailored to numerical model validation. We conclude by discussing the organization’s future model validation and operational forecasting intentions."],"kw":"Snowpack and Weather Modeling, Observation-Model Comparisons, Snowpack Proper- ties, Weather Model Downscaling","ty":"P","pp":111,"em":[],"r":null,"day":"Fri","th":"Snowpack Properties","pr":"Travis J. Morrison"},"117":{"id":"117","t":"Enabling Avalanche Victim Localization Through LoRa Technology: The LoRaSNOW Project","au":[{"n":"Michele Girolami","raw":"Girolami, Michele","p":true,"aff":""},{"n":"Andrea Berton","raw":"Berton, Andrea","p":false,"aff":""},{"n":"Fabio Mavilia","raw":"Mavilia, Fabio","p":false,"aff":""},{"n":"Annalisa Maggini","raw":"Maggini, Annalisa","p":false,"aff":""},{"n":"Fabrizio Tagliavini","raw":"Tagliavini, Fabrizio","p":false,"aff":""},{"n":"Renato Zasso","raw":"Zasso, Renato","p":false,"aff":""}],"ab":["Search and Rescue (SaR) operations in snowy environments are particularly challenging due to time constraints and harsh conditions. Climate change has significantly altered snowfall patterns, often producing unstable snowpacks prone to avalanches. At the same time, participation in winter mountain activities has grown, increasing exposure and the likelihood of human-triggered avalanches, which account for most recorded events. These trends highlight the need for both improved avalanche beacon training and complementary technological solutions to enhance victim localization, which traditionally relies on detecting the magnetic field emitted by the target’s device. The LoRaSNOW project aims at investigating the potential of the LoRa (Long Range) wireless technology to support avalanche victim localisation, combining the use of traditional avalanche beacon systems with IoT-ready technologies. Our approach is based on a dedicated experimental methodology designed according to SaR operational requirements and validated through real-world testing. We present an experimental campaign aimed at evaluating LoRa signal propagation in realistic avalanche scenarios. This environment poses two major challenges: the lack of line-of-sight between transmitter and receiver, and signal attenuation caused by the snowpack profile. We consider two SaR scenarios: ground operations, where an operator moves in the field looking for the target according to the traditional self-rescue patterns, and the UAV scenario, where a drone flies over the experimental field collecting and elaborating LoRa signals to localize the target. Experiments were conducted under varying conditions by modifying both burial depth, target orientation and snowpack features. Data were collected across different periods of 2025 using commercial LoRa wireless boards customized for the purpose of the data collection. Regarding the ground operation, we analyse the variation in the LoRa signal over time and with distance from the target. Regarding the UAV scenario, we report some preliminary results on the performance of the localisation algorithm we implemented for target localisation."],"kw":"Avalanche, SaR, LoRa, IoT, UAV, Localization","ty":"P","pp":112,"em":[],"r":3500,"day":"Mon","th":"Avalanche Rescue","pr":"Michele Girolami"},"118":{"id":"118","t":"AvSAR Mindsets: A Companion Framework for the AvGAR","au":[{"n":"Michael Ackerman","raw":"Ackerman, Michael","p":true,"aff":""}],"ab":["The AvGAR is a decision-making tool for assessing and deploying avalanche search and rescue (AvSAR) missions, adapted from the United States Coast Guard's Green-Amber-Red (GAR) risk assessment model. Risk assessment tools that resolve to a numerical score are vulnerable to what practitioners call GARwashing: responders adjust category scores until the sum permits the deployment they already intend. This paper describes AvSAR Mindsets, a companion framework of six named operational postures declared before scoring the AvGAR. Declaring a mindset first fixes the team's stated level of urgency and risk tolerance in advance, so that subsequent scoring is checked against a commitment made when the team was least invested in a particular outcome. The framework follows a line of avalanche-sector work on mindsets, beginning with Atkins (2014), extended to avalanche education by Conger (2022), and first applied to search and rescue by Laverty, whose 2024 presentation directly inspired this work. The six mindsets are organized into three phases: a default state (READINESS), four mobilization states (REHEARSE, RESCUE, RAPID and RECOVERY), and a de-mobilization state (RE- SET) that closes the operational cycle and returns the team to readiness. AvSAR Mindsets are scoped to responses with a known incident and a confirmed subject, which is the activation profile of most avalanche rescue; search is out of scope. This paper presents the framework, maps it onto AvGAR's fixed and malleable categories, and proposes a mindset shift as an explicit trigger for the Tactical Pause. No outcome data are presented, and no claim is made that the framework has improved mission results. The author identifies reported uptake and practitioner observations as such."],"kw":"avalanche rescue, decision making, risk assessment, human factors, search and rescue, mindsets","ty":"P","pp":113,"em":[],"r":3501,"day":"Mon","th":"Avalanche Rescue","pr":"Michael Ackerman"},"120":{"id":"120","t":"Remote Sensing for Avalanche Practice and Science: What Have We Achieved, and How Can We Address What Is Still Missing?","au":[{"n":"Yves Bühler","raw":"Bühler, Yves","p":true,"aff":""},{"n":"Andreas Stoffel","raw":"Stoffel, Andreas","p":false,"aff":""},{"n":"Andrea Manconi","raw":"Manconi, Andrea","p":false,"aff":""}],"ab":["Over the past 50 years, remote sensing has evolved from a classified tool for military applications into a public and often freely available source of information. This major democratization of remote sensing has also had a significant impact on snow and avalanche research and practice. Today, ground-, drone-, airplane-, and satellite-based mapping of avalanche outlines and snow depth distributions has become an important and well-validated component of the avalanche information puzzle. However, the technical potential, particularly of drones and satellites, would enable a much broader application of these tools, aimed at spatially explicit mapping with high spatial and temporal resolution. Key limiting factors include restrictive drone regulations and the high costs associated with certain satellite and airplane data products. Remote sensing-based information on snowpack stability, on the other hand, is not yet operationally available. Although first attempts using ground-penetrating radar have been undertaken, and some results show potential for practical application, further research and real-condition testing within avalanche release areas remain necessary. Here we outline the development of remote sensing from early satellite imagery and aerial photography to recent drone-based data acquisitions and provide an overview of the achievements and operational implementations accomplished by the avalanche remote sensing community. We compile an overview of the remote sensing-based tools that are successfully applied today in snow and avalanche research and identify the most relevant gaps. Based on this assessment, we outline potential tools and approaches to overcome the identified limitations in the future. Remote sensing still holds considerable potential to further advance avalanche science and practice."],"kw":"Remote sensing, drones, satellites, photogrammetry, LiDAR, RADAR.","ty":"O","pp":114,"em":[],"r":3474,"pr":"Yves Bühler"},"121":{"id":"121","t":"From Snow to Sediment: Mapping and Quantifying Dirty Snow Avalanche Deposits","au":[{"n":"Magdalena Koschmieder","raw":"Koschmieder, Magdalena","p":true,"aff":""},{"n":"Johanna Mascher","raw":"Mascher, Johanna","p":false,"aff":""},{"n":"Lukas Winiwarter","raw":"Winiwarter, Lukas","p":false,"aff":""},{"n":"Arnaud Temme","raw":"Temme, Arnaud","p":false,"aff":""}],"ab":["Avalanches have the potential to harm people and livestock as well as damage or destroy infrastructure. Furthermore, avalanches can erode and transport topsoil material and therefore alter soils and landscape on a larger timescale. These so-called dirty snow avalanches evolve from wetsnow full-depth avalanches and mostly appear in spring after rapid warming or rain-on-snow events. While conventional field methods such as snow sampling and mapping of deposits on aerial images have been applied to estimate the amount of material transported by dirty snow avalanches, the specific patterns and amounts of deposition they produce remain poorly quantified. This study aims to bridge this gap by applying uncrewed aerial vehicle (UAV) Structure-from-Motion (SfM) photogrammetry in order to create digital elevation models (DEMs) of difference and map areas and volumes of deposition more accurately. Furthermore, surface debris sampling was employed to directly quantify the sediment mass transported by the avalanches as well as the sediment’s characteristics. We present the results of three avalanches observed and sampled in 2025 and 2026. This includes comparison of DEMs acquired shortly after the event and after the snow deposited by the avalanche has melted, as well as analyses of the sediment properties. We show that the visual appearance of the avalanche deposits and the sediment mass highly depend on the type and characteristics of the transported material."],"kw":"dirty snow avalanches, UAV photogrammetry, remote sensing, spring avalanches, SfM, wet-snow avalanches","ty":"P","pp":115,"em":[],"r":3623,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Magdalena Koschmieder"},"122":{"id":"122","t":"Adapting Avalanche Hazard Mapping to a Changing Climate – Emerging Practical Approaches and Uncertainties","au":[{"n":"Simon Grüter","raw":"Grüter, Simon","p":true,"aff":""},{"n":"Flurina Schnider","raw":"Schnider, Flurina","p":false,"aff":""},{"n":"Damian Steffen","raw":"Steffen, Damian","p":false,"aff":""},{"n":"Stefan Margreth","raw":"Margreth, Stefan","p":false,"aff":""}],"ab":["Avalanche hazard mapping in Switzerland is based on long-established regulations and methods and provides a valuable basis for avalanche risk management in settlement and infrastructure areas. The designation of avalanche hazard zones relies, amongst others, upon data from the past, like weather records and historic avalanche events. The avalanche hazard maps are based on scenarios with a return period of up to 300 years and are used for longterm land-use and infrastructure planning, which is why it is crucial that the hazard map provides robust information on the expected avalanche risk in the next decades. In today’s changing climate, the established methods may not be fully adequate to prepare for the avalanche risk of the future. The Swiss Federal Government therefore requires that climate change be systematically taken into account in hazard assessments. To support this requirement, the Swiss Network of Natural Hazards Experts (FAN) is developing a new methodology that combines historical avalanche activity with projections of future snow-climate conditions. To demonstrate the practical implications of this new methodology, we provide selected case studies of avalanche paths across different elevation ranges and discuss the anticipated changes in local avalanche risk. We provide an insight into how climate change considerations could be included into avalanche hazard assessment. Furthermore, we qualitatively discuss the associated uncertainties and identify open questions and challenges for hazard mapping in a changing climate."],"kw":"climate change, hazard mapping, case study, avalanche path, wet snow avalanche","ty":"P","pp":116,"em":[],"r":3503,"day":"Mon","th":"Planning and Engineering","pr":"Simon Grüter"},"123":{"id":"123","t":"From UAS Snow Depth Surveys to Avalanche Runout: A Model Chain of Avalanche Runout for Highway Forecasting Operations","au":[{"n":"Ron Simenhois","raw":"Simenhois, Ron","p":true,"aff":""},{"n":"Ryan Zarter","raw":"Zarter, Ryan","p":false,"aff":""},{"n":"Valerie Foley","raw":"Foley, Valerie","p":false,"aff":""},{"n":"John Snook","raw":"Snook, John","p":false,"aff":""},{"n":"Mike Cooperstein","raw":"Cooperstein, Mike","p":false,"aff":""},{"n":"Ethan Greene","raw":"Greene, Ethan","p":false,"aff":""}],"ab":["Avalanche programs that protect highways need to know whether an avalanche in a specific path will reach the road. Forecasters estimate this from experience, historical records, weather data, weather models, snowpack observations, and nearby avalanche activity. All of this together still does not tell them whether the snowpack has the structure to fail, producing an avalanche that then runs down on the road with enough force to damage a vehicle or pile up enough debris to block traffic. To help forecasters with this assessment, we built a model chain that predicts the probability an avalanche will reach the highway. We start by determining the snow depth distribution in the start zone from an uncrewed aircraft system (UAS). We use this to initialize a snow structure model (SNOWPACK), which feeds a crackpropagation model, which feeds a debris flow model (AvaFrame’s com1DFA). We ran a 75-member ensemble daily through the 2025–2026 season for an avalanche path (Little Professor) above US Highway 6 on Loveland Pass. On 18 January 2026, a skier triggered a slab avalanche in the path and we used this event to evaluate the results of the model chain. The model identified likely trigger areas at the observed crown and predicted a release outline that overlapped the observed release area, with 63% overlap between the two. Five skiers crossed the same slope that day, 10 to 20 m outside what became the avalanche flank, without triggering an additional avalanche. All members of the simulation ensemble stopped well short of the highway, and so did the observed avalanche. This is a single event, but it provides an encouraging proof of concept as the initialization method and first two links in the model chain predicted the portions of the start zone that did and did not avalanche. This information was passed to the flow model, which showed there was no significant threat to the highway on the day of the avalanche. As UAS become part of more avalanche operations and models of relevant portions of this process improve, this approach could become a vital tool for transportation avalanche safety operations."],"kw":"avalanche forecasting, runout modeling, UAS, photogrammetry, snowpack modeling, crack propagation","ty":"O","pp":117,"em":[],"r":3475,"pr":"Ron Simenhois"},"125":{"id":"125","t":"Graupel, Crusts, Persistent Instability, and Unusual Slab Behavior: Two Case Studies from Mount Shasta, California, USA","au":[{"n":"Christian Jordan","raw":"Jordan, Christian","p":true,"aff":""},{"n":"Eric Falconer","raw":"Falconer, Eric","p":false,"aff":""},{"n":"Hayden MacArthur","raw":"MacArthur, Hayden","p":false,"aff":""},{"n":"Jeremy J. Axelrod","raw":"Axelrod, Jeremy J.","p":false,"aff":""},{"n":"Zach Guy","raw":"Guy, Zach","p":false,"aff":""},{"n":"Nick Meyers","raw":"Meyers, Nick","p":false,"aff":""}],"ab":["These case studies examine two large natural avalanches attributed to graupel/crust combinations on Mount Shasta, California. The first case study details an avalanche in February 2026 which released on a layer of buried graupel above a melt-freeze crust after a major loading event. The graupel layer provided limited feedback before failing ten days after burial – one of the longest documented cases of persistent instability associated with this grain type. A second notable avalanche in April 2026 highlights a graupel/crust combination as a problematic weak layer with widepropagation potential. These case studies provide further evidence that graupel can act as a persistent weak layer, result in widely-propagating avalanches, and challenge forecasting operations."],"kw":"Graupel; Persistent Weak Layer; Persistent Slab; Melt-Freeze Crust","ty":"P","pp":118,"em":[],"r":null,"day":"Fri","th":"Snowpack Properties","pr":"Christian Jordan"},"126":{"id":"126","t":"More Ars What Now? Atmospheric Rivers and the Changing Reality of Avalanche Forecasting","au":[{"n":"Matt MacDonald","raw":"MacDonald, Matt","p":false,"aff":""},{"n":"Wren McElroy","raw":"McElroy, Wren","p":false,"aff":""}],"ab":["Historically, avalanche mitigation programs have been focused on snow avalanche forecasting and control. In this paper, we explore the shifting scope of avalanche programs to incorporate heavy rainfall events and the associated landslide, flooding, and infrastructure damage that can ensue, focusing on recent events affecting the inner South Coast of British Columbia. The North Cascades avalanche program comprises avalanche paths along the section of Trans-Canada Highway 1 running along the deep and steep-walled Fraser Canyon, BC Highway 5 known as the Coquihalla connecting Hope to Merritt with a maximum elevation of 1,244 m, and the portion of BC Highway 3 known as the Crowsnest connecting Hope to Princeton with a maximum elevation of 1,342 m. We review the December 2025 Atmospheric Rivers (ARs) that struck the region, present select AR forecasting tools and discuss proactive transportation closure methods in an attempt to better plan and respond to strong AR and rain-on-snow events."],"kw":"","ty":"O","pp":119,"em":[],"r":3453,"pr":"Matthew MacDonald"},"127":{"id":"127","t":"Grey Zones – Examining Forecasters’ Practices and Perspectives for Communicating Uncertainty in Public Avalanche Forecasts","au":[{"n":"Eeva Latosuo","raw":"Latosuo, Eeva","p":true,"aff":""},{"n":"Pascal Haegeli","raw":"Haegeli, Pascal","p":false,"aff":""},{"n":"Julie Demuth","raw":"Demuth, Julie","p":false,"aff":""},{"n":"Ethan Greene","raw":"Greene, Ethan","p":false,"aff":""}],"ab":["Uncertainty is inherent in avalanche forecasting, yet it is not communicated in a consistent way in public avalanche forecasts. Avalanche forecast users could benefit from clearer and more transparent communication of uncertainty. Developing a systematic approach for communicating uncertainty has potential to enhance the forecast in ways that are useful to a diverse range of forecast users with differing needs. Complementing the results from our survey examining the perspective of forecast users (Latosuo et al., 2024), this research focuses on how avalanche forecasters conceptualize and evaluate uncertainty. An in-depth understanding of forecasters’ current practices and challenges is critical for developing effective and feasible ways to communicate uncertainty when it is a consequential part of the conditions. To address this research need, we conducted qualitative semi-structured interviews with 30 North American avalanche forecasters in the spring 2025. Additionally, we observed numerous forecast team meetings to learn about the specific workflow and communication cultures of participating organizations. Our findings highlight that forecasters carry out nuanced daily examinations of uncertainty, and this information plays a fundamental role in internal conversations of the forecasting team. Spatial and temporal scales matter; large forecast regions amplify spatial uncertainty, while publishing lead times affect forecasters’ certainty about their assessment. The type of avalanche problems adds to the inherent uncertainty in the hazard condition, as do operational constraints and the influence of fatigue or stress on forecasters. Certain conditions prompt explicit uncertainty messaging in the forecasts; however, how forecasters implement the messaging varies considerably. This research offers valuable insight into professional forecasters’ perspective on uncertainty and the challenging trade-offs forecasters juggle when creating forecast products for diverse audiences. Our results inform the broader goal of designing an improved uncertainty communication framework. The lessons learned are applicable to all avalanche practitioners who communicate hazard conditions to non-expert audiences."],"kw":"Avalanche risk communication, Uncertainty, Public avalanche forecasting, User re- search","ty":"P","pp":120,"em":[],"r":3624,"day":"Thu","th":"Risk Communication","pr":"Eeva Latosuo"},"128":{"id":"128","t":"Following the Data: Lessons Learned from a Decade of Mapping Avalanches and Explosive Use","au":[{"n":"Alex Mithoefer","raw":"Mithoefer, Alex","p":false,"aff":""},{"n":"Malia Reeves","raw":"Reeves, Malia","p":false,"aff":""},{"n":"Takahiro Tanabe","raw":"Tanabe, Takahiro","p":true,"aff":""}],"ab":["Taos Ski Valley Ski Patrol has been using GIS mapping software to record explosive use and avalanche activity since 2015. In over a decade, we have deployed more than 17,000 shots of various sizes, triggering more than 4,000 avalanches. This paper reflects on our experience with this method of avalanche documentation, outlines the lessons we learned, and discusses how our operation plans to move forward with GIS technology in the coming years. We hope that sharing our experience will help other practitioners who are collecting similar data. Recording accurate data requires active participation from the entire ski patrol. Consistency in rating and recording avalanches varies within our crew of almost 50 people, and this variability impacts our data quality. Essential data must be recorded while not overwhelming the patroller inputting observations. It is critical to identify which fields must be mandatory (eg. D-size, primary trigger) and ensure they are entered accurately. We began a preliminary investigation of the statistical relationship between explosives use and avalanche occurrences, with our 11 years of data. Analyzing the data helps us identify which techniques are working at our operation by removing our historical bias. For example, while only 27.5% of our explosive shots were airblasts (AB), over 50% of our large (D2 or larger) avalanches were triggered by airblasts. Although some of these differences may be due to varying shot sizes or differing conditions, research shows that airblasts are more effective than shots in the snow (Birkeland, 2026). Taos Ski Patrol has utilized airblasts effectively for decades. Incorporating an in-house review has further emphasized this science to our ski patrol. Another benefit of the preliminary examination of our data is it allows us to look critically at the integrity and usefulness of the data we currently collect, which has led us to make changes to our current system and identify areas that still need improvement. The intention of this paper is to encourage questioning and discover new ways our GIS data can be used to help us improve, not to provide concrete answers."],"kw":"","ty":"O","pp":121,"em":[],"r":3469,"pr":"Alex Mithoefer"},"129":{"id":"129","t":"To Probe or Not to Probe: Evaluating Fine Search Standards and the Role of Probing in Shallow Burial Professional Rescue Scenarios","au":[{"n":"Ben Merkle","raw":"Merkle, Ben","p":false,"aff":""}],"ab":["The first thirty minutes of the avalanche burial survival curve are the steepest, and even small time savings in gaining airway access can improve patient outcomes. During rescue practice competitions at Mt Hutt, New Zealand, the fastest times were consistently recorded by searchers who skipped probing and began shoveling when their transceiver indicated the burial target was less than approximately half a meter deep. This observation sparked the question: does skipping the probing step result in faster airway access times for shallow burials? This study analyzed rescue times for single professional rescuer, shallow burial scenarios (60 centimeters) in a relatively flat, artificial debris field, comparing times with and without probe use. Rescuers (n=25) accessed the burial target’s simulated airway faster when skipping the probing step, saving an average of 39 seconds with a standard deviation of 70 seconds. This finding prompts a holistic risk benefit analysis to see if the benefits of the shorter time to airway access outweigh the extra training, additional rescue decisions, and potential for physical trauma to buried subject. We recommend that professional rescuers carefully consider this tactic’s advantages and disadvantages before implementing it operationally."],"kw":"Avalanche rescue, Professional rescue, Shallow burial, Probe, Fine Search","ty":"P","pp":122,"em":[],"r":3565,"day":"Tue","th":"Avalanche Rescue","pr":"Ben Merkle"},"130":{"id":"130","t":"Assimilating lidar and in-Situ Community Snow Measurements to Improve Snowpack Estimates Across the Western United States","au":[{"n":"David F. Hill","raw":"Hill, David F.","p":true,"aff":""},{"n":"Zachary Butler","raw":"Butler, Zachary","p":false,"aff":""},{"n":"Katreen Wikstrom Jones","raw":"Jones, Katreen Wikstrom","p":false,"aff":""},{"n":"Gabriel Wolken","raw":"Wolken, Gabriel","p":false,"aff":""}],"ab":["Seasonal snowpack supplies a large fraction of water resources across the Western United States, making accurate estimates of snow distribution and melt timing critical for water resource management. However, substantial uncertainty persists due to sparse observations and model limitations, particularly in complex terrain. This study integrates high-resolution airborne light detection and ranging (lidar) data with in-situ observations from SNOTEL, Snow Courses, and the Community Snow Observations project (CSO) to improve snowpack estimation across three critical basins: Lake Tahoe, California; the Central Cascades, Oregon; and Summit County, Colorado. Using SnowModel simulations for water years 2022–2024, we evaluate the impact of different data assimilation strategies. This includes spatially distributed data (lidar-derived snow depth) only, point-based observations (SNOTELs, Snow Courses, and CSO) only, and combined approaches, on model performance in representing snowpack distribution. We further assess how lidar acquisition frequency and the spatial resolution of the input lidar influence model skill to identify minimum data requirements for reliable snowpack estimation. Results indicate that assimilating a snow depth raster at 50 meters yields the most accurate representation of snowpack across all study regions. However, comparable performance is achieved using only point-based observations, a resampled lower resolution snow depth raster, and when combining all available datasets. These findings suggest that point-based and lower-resolution spatially distributed assimilation offers a cost-effective alternative in data-limited settings while still providing meaningful improvements in model performance. Overall, assimilating available snow observations substantially enhances snowpack representation, particularly in complex high-elevation terrain. This research provides practical guidance for optimizing snow data assimilation strategies and improving estimates of snowpack characteristics, with direct implications for water supply forecasting and resource management across the Western United States."],"kw":"snowpack modeling, lidar, data assimilation, community science","ty":"P","pp":123,"em":[],"r":3504,"day":"Mon","th":"Modelling and Quantitative Forecasting","pr":"David F. Hill"},"131":{"id":"131","t":"Using High-Resolution Vertical Temperature Gradients to Forecast Persistent Weak Layer Formation","au":[{"n":"Seth Waterfall","raw":"Waterfall, Seth","p":true,"aff":""},{"n":"John Stimberis","raw":"Stimberis, John","p":false,"aff":""},{"n":"Rachel Griffith","raw":"Griffith, Rachel","p":false,"aff":""}],"ab":["Vertical temperature gradients near the snow surface play a critical role in snowpack metamorphism and atmospheric energy exchange. The near-surface boundary layer strongly influences avalanche formation (Birkeland, 1998; Schweizer and Lütschg, 2001; Slaughter et al., 2009); tracking these micro-climatic shifts provides vital precursor information for avalanche forecasting. However, capturing boundary layer thermal gradients at high temporal and spatial resolutions remains challenging in operational settings. A high-resolution field study conducted at Snoqualmie Pass, WA, USA (921 m) evaluated near-surface energy exchanges above an unbuffered, shallow snowpack. The study site is characterized by exceptionally light ambient airflow and persistently near-saturated relative humidity, creating a highly favorable micro-climate for surface hoar formation (Breyfogle, 1986). To capture these dynamics, a custom vertical thermocouple array measured air temperature profiles at 10-cm increments up to 1.5 m above the snowair interface at 10-second intervals from December 2025 through March 2026, generating more than 15 million data points. High-resolution profiling captured steep boundary layer temperature inversions co-occurring with relative humidity near saturation (averaging 98.5%–99.6%). A focused analysis identified distinct metamorphic drivers across two primary event windows: (1) a January 15–18 cycle where clear-sky nocturnal radiational cooling drove nearsurface temperature gradients exceeding 16.0°C/m, facilitating extensive surface hoar growth; and (2) a mid-February window (Feb 10–13) where strong near-surface temperature gradients (>16.8°C/m) cultivated a secondary surface hoar layer before subsequent storm loading on February 13. Tracking these thermodynamic precursor conditions from growth through surface evolution or storm slab burial demonstrates the operational value of monitoring near-surface boundary layer dynamics. While the January 15–18 surface hoar crystals were destroyed by rain prior to burial, the mid-February surface hoar growth (Feb 10–13) was preserved, forming the structural foundation for a reactive persistent weak layer (PWL) across the forecast zone. Multi-element vertical thermocouple arrays face practical operational deployment constraints across standard automated weather station (AWS) networks—including lowersensor snow burial and diffuse shortwave daytime noise—results are compared with co-located infrared snow surface temperature sensors to evaluate single-sensor proxies for operational study plots."],"kw":"Avalanche Forecasting, Instrumentation and Remote Sensing, Snowpack Properties, Modelling and Quantitative Forecasting","ty":"P","pp":124,"em":[],"r":3566,"day":"Tue","th":"Avalanche Forecasting","pr":"Seth Waterfall"},"132":{"id":"132","t":"The Outdoor Adventure Risk Index: Forecasting Backcountry Evacuation Likelihood from Weather and Visitor Exposure","au":[{"n":"Matthew Sheahan","raw":"Sheahan, Matthew","p":true,"aff":""},{"n":"Peter Tsigaris","raw":"Tsigaris, Peter","p":false,"aff":""},{"n":"Anne Terwiel","raw":"Terwiel, Anne","p":false,"aff":""},{"n":"Yaou Hu","raw":"Hu, Yaou","p":false,"aff":""}],"ab":["Backcountry risk assessment requires practitioners and operators to interpret continually changing environmental conditions alongside uneven patterns of visitor exposure. Although professional judgment remains as a requirement, the likelihood component of risk assessment is often represented categorically rather than estimated from observed outcomes. The Outdoor Adventure Risk Index (OARI) was developed as a probability-based decision support model for estimating evacuation likelihood across monitored backcountry locations and hours. OARI was developed using 511,328 location-hour observations from thirty recreation monitoring locations in Mount Revelstoke and Glacier National Parks, British Columbia, representing 771,212 recorded visitor passes between December 2016 and May 2024. Each location-hour integrates visitor exposure, weather, temporal information, location, and evacuation-relevant incident occurrence. Incidents were spatially and temporally linked to a monitored location before model fitting. An operationally constrained genetic algorithm selected ten forecast-compatible weather variables, which were incorporated into a binomial generalized linear model with a complementary log-log link. Visitor exposure entered the model through a log-exposure offset. The final model achieved a precision-recall area under the curve of 0.010679, ROC-AUC of 0.787008, and Brier score of 0.002216 on held-out historical observations. More importantly for operational prioritization, the highest-ranked 1% of location-hours contained incidents at 10.0 times the rate expected under random ranking, while the highest-ranked 5% produced a lift of 5.5. OARI is not an avalanche-hazard model and does not predict that an evacuation will occur within a particular time or place. It is a dynamic probability signal that is intended to aid in the identification of location-hours that warrant additional operational attention. The results support the feasibility of integrating environmental forecasts and visitor exposure into probabilistic decision support for backcountry safety management."],"kw":"backcountry risk, evacuation likelihood, rare-event prediction, visitor exposure, decision support, search and rescue","ty":"P","pp":125,"em":[],"r":3625,"day":"Thu","th":"Modelling and Quantitative Forecasting","pr":"Matthew Sheahan"},"133":{"id":"133","t":"Motorized Avalanche Rescue Procedures: Adapting Companion Rescue to Machine-Based Travel","au":[{"n":"Jeremy Hanke","raw":"Hanke, Jeremy","p":true,"aff":""},{"n":"Shena Thomas","raw":"Thomas, Shena","p":false,"aff":""},{"n":"Iain Stewart-Patterson","raw":"Stewart-Patterson, Iain","p":false,"aff":""}],"ab":["Established avalanche companion-rescue fundamentals apply to motorized users, but snowmobiles and snow bikes change how they are carried out. Rescue situations are highly dynamic: hazards, information, search areas, personnel, and resource needs can change quickly. Rapid motorized travel can spread riders across large areas. If visual contact is lost, the group may not immediately realize someone is missing, leaving no reliable last-seen point (LSP). This practical paper extends Motorized Avalanche Rescue Procedures (M.A.R.P.), first published in 2023, from machine-use procedures into a broader framework for motorized companion rescue. It draws on multi-season field instruction and rescue simulation, current rescue guidance, electromagnetic-interference (EMI) literature, forensic mortality studies, and selected incident reports. Before Assess-Structure-Search begins, companions regroup in a safe location. Assess confirms scene safety, the missing person or persons, witness/LSP information, clues, and the search area. Structure establishes leadership, searcher positions and areas, probe/shovel roles, machine staging, and communications. Search follows the established search sequence while searchers identify, communicate, and adjust as conditions change. Changes are communicated so the group maintains a common picture, and mental mapping continues throughout. Machines are treated as both rescue assets and interference sources. The 2026 framework follows current UIAA interference guidance and identifies machine-specific EMI testing and controlled rescue scenarios as future research priorities."],"kw":"motorized avalanche rescue; companion rescue; snowmobile; transceiver interference; search management; M.A.R.P.","ty":"P","pp":126,"em":[],"r":3567,"day":"Tue","th":"Avalanche Rescue","pr":"Jeremy Hanke"},"134":{"id":"134","t":"Human Avalanche Exposure: A Missing Link in Real-Time Avalanche Risk Management","au":[{"n":"Jeremy Hanke","raw":"Hanke, Jeremy","p":true,"aff":""},{"n":"Shena Thomas","raw":"Thomas, Shena","p":false,"aff":""},{"n":"Iain Stewart-Patterson","raw":"Stewart-Patterson, Iain","p":false,"aff":""}],"ab":["Regional avalanche forecasts and terrain-classification systems describe avalanche conditions and terrain, but they do not explicitly classify the dynamic layer of human involvement: where people are positioned, whether potential involvement is separate or shared, and who remains ready to respond. Human avalanche exposure extends across disciplines, yet activities can create different human-position patterns in the same avalanche environment. This practical paper presents the Motorized Human Avalanche Positioning System (Motorized HAPS), a practitionerdeveloped system for motorized travel using five descriptive states: None, Single, Separated, Overlapping, and Stacked. The states describe the current human configuration; they are not danger or risk ratings and do not prescribe one acceptable travel state. Motorized HAPS complements avalanche and terrain assessment by making changing human involvement explicit. The Readiness prompt asks who can respond, while rescue capacity is the deeper concept of capable response resources relative to the potential rescue problem. The framework draws on prior motorized travel and rescue work, practitioner experience, literature, and iterative scenario evaluation. It is presented as a motorized system first; transfer to other disciplines should be evaluated rather than assumed. Motorized HAPS remains unvalidated and is offered for field testing, inter-rater evaluation, incident-pattern review, and practitioner refinement."],"kw":"human avalanche exposure; motorized travel; human positioning; avalanche risk management; rescue readiness; decision support","ty":"O","pp":127,"em":[],"r":3390,"pr":"Jeremy Hanke"},"135":{"id":"135","t":"Beyond Level 2: Emerging Models for Advanced Recreational Avalanche Learning","au":[{"n":"Jeremy Hanke","raw":"Hanke, Jeremy","p":true,"aff":""}],"ab":["Recreational avalanche education provides foundational knowledge, rescue skills, terrain management, and decision frameworks, but course completion alone does not establish durable decision capability or readiness for further progression. Current Level-2 curricula already include advanced decision-making frameworks and substantial field application, but two questions remain: are those frameworks well matched to the operating realities and decision needs of different backcountry disciplines, and do learners arrive at Level 2 with Level-1 knowledge and skills that are current and usable enough to engage with advanced material? Where prerequisite fluency is uneven, Level-2 course time may be spent rebuilding foundational capability rather than extending it. The developmental question is therefore how education can better align learner readiness, discipline-specific application, and progression toward reliable, transferable, and well-calibrated decision capability. This paper combines a targeted review of avalanche accident, field-performance, and education research with a rapid scan of five external Canadian advanced/post-Level-2 programs, official Canadian/U.S. pathway comparators, and a separate motorized practitioner case. The external programs converge around terrain and exposure management and deeper observation work; many also include structured decision processes, learner-led decisions, leadership, coaching, and reflection, while terminology, delivery, and published assessment vary. The paper places this advanced stage within a five-stage recreational journey— Awareness → Intro → Level 1 → Level 2 → Level 3 (proposed advanced recreational)—and proposes Progressive Decision Responsibility: Recognize → Apply → Integrate → Adapt → Perform. Motorized Avalanche Skills Training (M.A.S.T.) Level 3 is presented separately as a Soul Rides implementation case. The proposed tier is offered as one input to the North American mapping and alignment process proposed in the companion paper, not as a unilateral standard. Advanced education should be judged by the quality and transfer of the decision process—not by permission to enter more complex terrain."],"kw":"avalanche education, decision capability, transfer, calibration, discipline-specific education, advanced recreational education","ty":"P","pp":128,"em":[],"r":3505,"day":"Mon","th":"Avalanche Education","pr":"Jeremy Hanke"},"136":{"id":"136","t":"Beyond One-Size-Fits-All: Standardizing Avalanche Education Across Backcountry Disciplines","au":[{"n":"Jeremy Hanke","raw":"Hanke, Jeremy","p":true,"aff":""},{"n":"Duncan Lee","raw":"Lee, Duncan","p":false,"aff":""}],"ab":["Recreational avalanche education in North America uses national and provider-based systems to teach hazard recognition, terrain evaluation, decision-making, and companion rescue. Yet similar course labels may not mean the same stage, outcomes, terminology, or discipline-specific application across countries, providers, and travel modes. This matters because recreationists cross regions, change partners, share avalanche terrain, and may need to work together in an incident. This discussion paper reviews Canadian and United States recreational education structures and relevant ISSW literature. It compares four functional categories—Awareness, Introductory Field Awareness, Level 1, and Level 2—and separately examines provider-led post-Level-2 education, shared competencies, disciplinespecific application, procedural compatibility, and proportionate verification. Rather than attempting a complete crosswalk, the paper provides one illustrative comparison and proposes a broader crosswalk: a side-by-side review of how current systems define course stages, terminology, prerequisites, intended outcomes, field requirements, assessment, and provider/instructor expectations. The goal is to identify where the systems already align, where meaningful differences exist, and what should be examined before new standards are considered. Motorized travel is used as a case study. The Whistler Challenge is the authors' call to action at ISSW 2026 for a time-limited North American alignment review that begins with this crosswalk."],"kw":"avalanche education, competency, standardization, progression, quality assurance, discipline-specific training","ty":"P","pp":129,"em":[],"r":3506,"day":"Mon","th":"Avalanche Education","pr":"Jeremy Hanke"},"137":{"id":"137","t":"Forecasting Avalanches in Data-Sparse Central Asia Using SNOWPACK and Weather Modeling with Avalanche Observations","au":[{"n":"Itai Sheleg","raw":"Sheleg, Itai","p":true,"aff":""},{"n":"Doug Chabot","raw":"Chabot, Doug","p":false,"aff":""},{"n":"John Snook","raw":"Snook, John","p":false,"aff":""},{"n":"Jaime Peters","raw":"Peters, Jaime","p":false,"aff":""},{"n":"Walter Steinkogler","raw":"Steinkogler, Walter","p":false,"aff":""},{"n":"Ron Simenhois","raw":"Simenhois, Ron","p":false,"aff":""}],"ab":["Avalanches in Central Asia, particularly in Afghanistan, Tajikistan, and Pakistan, are a persistent hazard, causing hundreds of fatalities in severe winters and routinely destroying homes, infrastructure, and livestock essential for survival. To address this risk, in 2015, Aga Khan Agency for Habitat established a remote avalanche forecasting program supported by external expertise. Following its implementation, it became clear that a primary constraint on forecasting capability is the limited availability of snowpack, weather, and avalanche observations, driven by both geographic remoteness and government restrictions on data sharing. We address this gap by developing a proof-ofconcept framework that fuses heterogeneous, publicly available data sources to support avalanche forecasting in data-sparse regions. Specifically, we combine numerical weather prediction (NWP)-forced SNOWPACK simulations (4 km grid spacing) with opportunistically extracted avalanche observations from social media posts shared by local residents. This approach treats informal reports as weakly labeled observations, enabling the reconstruction of avalanche occurrence in the absence of systematic records. We compiled 69 valley-floor avalanche observations from social media and AKAH field logs across two winters, and matched each to the nearest SNOWPACK station sharing its predominant aspect, reconstructing the associated meteorological and snowpack conditions at 30 virtual stations. Five daily variables drive the model: total snow depth, 24-hour new snow, maximum air temperature (TAmax), the whole-profile minimum natural stability index (Sn38), and the burial depth of the weakest layer. To distinguish avalanche from non-avalanche days, we fit a hierarchical Bayesian logistic regression that gives each station its own baseline avalanche rate while sharing the influence of the five variables across the network. Trained on 2024–2025 and evaluated on the unseen 2025–2026 season, the model ranks avalanche days above quiet ones (AUC-ROC 0.715), and its warnings are about seven times more precise than chance. Total snow depth carries the most weight, followed by weak-layer burial depth, which lowers risk as it deepens. New snow and TAmax both raise risk, with warming weighing about as much as new-snow loading, suggesting that warm, likely rain-influenced storms are at least as important as loading in driving these events. Detection climbs with a station’s accumulated history, from 56% with one recorded avalanche to 100% with three, counting events from any season rather than only the current winter. At a fixed threshold, false alarms do not fall along that same curve, though four of the stations already meet an operational standard of roughly one false alarm per month. This work incorporates a novel data-fusion and weaksupervision framework for avalanche forecasting, integrating NWP-driven snowpack modeling with opportunistic, publicly sourced observations. However, this framework is constrained by a limited event dataset and a model chain that lacks rigorous, component-wise validation, introducing uncertainty in both inputs and predictions. As such, the framework is best interpreted as a decision-support tool rather than a fully autonomous forecasting system. Coupled with expert validation and interpretation, it provides a scalable pathway for developing operational guidance in regions where conventional data streams are sparse or unavailable."],"kw":"Avalanche Forecasting, SNOWPACK, Bayesian Modeling, Central Asia","ty":"O","pp":130,"em":[],"r":3476,"pr":"Itai Sheleg"},"138":{"id":"138","t":"From Human Factors to Human-Technology Factors: An HCI Perspective on Technology in Avalanche Safety","au":[{"n":"Björn Hartmann","raw":"Hartmann, Björn","p":true,"aff":""},{"n":"Jason Smith","raw":"Smith, Jason","p":false,"aff":""}],"ab":["The avalanche safety literature has identified human factors that contribute to accidents, yet researchers note a persistent gap between these insights and effective product design. Meanwhile, interactive technologies are shaping backcountry decision making with or without grounding in theory and research. We broaden the discussion of human factors into “human-technology factors,” examining how technology can both support and undermine judgment in avalanche terrain, from a human-computer interaction (HCI) perspective. We summarize relevant HCI concepts along four dimensions—attention, cognition, trust, and social interaction—and use them to revisit McCammon’s FACETS framework, cataloging ways in which specific technologies may mitigate or exacerbate classic heuristic traps, grounded in accident reports and literature where possible. We identify recurring patterns, including technologies with dual-sided effects and a pervasive “digital expert halo.”"],"kw":"Human factors, human-computer interaction, heuristic traps, interactive technology.","ty":"O","pp":131,"em":[],"r":3408,"pr":"Bjoern Hartmann"},"140":{"id":"140","t":"Avalano – High-Resolution Thermal Profiling for Minimal Invasive Snowpack Analysis","au":[{"n":"Patrick H. Jenewein","raw":"Jenewein, Patrick H.","p":true,"aff":""},{"n":"Marcel Maffey","raw":"Maffey, Marcel","p":false,"aff":""}],"ab":["Avalano is a novel avalanche probe for automated recording of high-resolution temperature profiles throughout the snowpack and addresses a key challenge of traditional snow profiles: time-consuming temperature measurement that is influenced by solar radiation and limited in spatial coverage. Integrated internal temperature sensors in modular probe elements record the vertical temperature gradient (dT/dz) in a single measurement process. The measurement data is transmitted wirelessly to an intuitive smartphone app, which visualizes, stores and exports it. For avalanche observers and operational services, Avalano creates a new quality of objective snowpack diagnosis by making temperature gradients and their variability in time clearly recognizable. The standardized measurement allows several profiles to be systematically recorded in a short time, developments to be tracked and these to be correlated with existing measurement and observation data (e.g. weather, rain, wind), thereby strengthening the basis for a more informed avalanche safety assessment. The primary advantage is the ability to analyze a closed snowpack, maintaining its structural integrity while eliminating errors caused by ambient influences and solar radiation. In the development to date, a fully functional prototype has been realized that automatically measures temperature profiles across the entire snowpack and transmits them to the associated app. Our modular design concept creates a repairable and circular tool without compromising stability of the common snow probe. This paper aims to assess Avalano against traditional methods for recording temperature in the snowpack, explaining the technical concept behind the probe and outlining the possibility for analyzing spatial and temporal variability. The supportive data is made up from a winter snow profile but primary focuses on spring conditions and isothermal snowpacks, gauging the critical 0°C threshold. Combined with the Snow Scope Probe from Propagation Labs, creating a hardness profile of the snowpack, it would thus be possible to examine the snowpack for its two basic components: temperature gradient and degree of hardness, without having to dig a snow pit. Avalano is intended to be leveraged for high quality data analysis paired with experience-based intuition from snow professionals to form the best basis for avalanche observation and forecasting."],"kw":"Avalanche Forecasting, Modelling & Quantitative Forecasting, Snowpack Properties","ty":"O","pp":132,"em":[],"r":null,"pr":"Patrick Jenewein"},"141":{"id":"141","t":"Smart Avalanche Control Reduces Road Closures in the Austrian Alps","au":[{"n":"Ines Waltl","raw":"Waltl, Ines","p":true,"aff":""},{"n":"Brenden Cronin","raw":"Cronin, Brenden","p":false,"aff":""}],"ab":["The Venter regional road between Sölden and Vent in the Austrian Alps has historically been highly vulnerable to avalanches, particularly along a previously unprotected front section. The road averaged more than twenty closures per year, causing economic losses, operational disruption, and safety concerns for both road users and maintenance personnel. Traditional passive protection, in the form of an avalanche gallery, was considered but rejected because of high construction cost and substantial environmental impact. The municipality of Sölden instead issued a public tender, which was awarded to Inauen-Schätti AG. The installation comprises seven Remote Avalanche Control Systems (RACS) Avalanche Master LM2700 and Avalanche Guard LW2700 units — supported by radar monitoring and automated weather stations and integrated with road barriers and traffic control infrastructure. Together these installations protect approxim
