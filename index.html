ent.","ty":"O","pp":299,"em":[],"r":3439,"pr":"Jen Reddy"},"341":{"id":"341","t":"Practical Experiences with the Open-Source Avalanche Simulation Tool AvaFrame","au":[{"n":"Matthias Granig","raw":"Granig, Matthias","p":true,"aff":""},{"n":"Felix Oesterle","raw":"Oesterle, Felix","p":false,"aff":""},{"n":"Engelbert Gleirscher","raw":"Gleirscher, Engelbert","p":false,"aff":""}],"ab":["Since 2023, the open-source avalanche simulation framework AvaFrame has been in operational use. Developed through a cooperation between the Austrian Avalanche and Torrent Control Service (WLV) and the Austrian Research Centre for Forests (BFW), AvaFrame is licensed under the European Union Public Licence (EUPL). The tool is now routinely applied by Austrian governmental organizations for hazard mapping and protection measure planning as well as by engineering offices for safety and technical surveys. AvaFrame comprises 15 functional modules covering input, computation, analysis, visualization, and reporting. A QGIS interface integrates the framework directly into existing practitioner workflows, facilitating both operational use and training courses for quality management. The current development extends the framework along operational and scientific tracks. Operational priorities include long-term user support, powder snow avalanche modelling via a depth-averaged approach, forest avalanche interaction (ForestFrame), snow slides (com5) and enhanced quality management through automated parameter optimization and standardized test catalogues. Scientific topics address entrainment and deposition processes, dam impact forces and systematic model intercomparison. Probabilistic scenario assessment is supported through parameter variation across multiple simulation runs. To support the model validation WLV and BFW recently installed a full-scale avalanche test site near Innsbruck featuring pressure and shear force measurements and radar-based flow measurements in a well-known avalanche path. Beyond snow avalanches AvaFrame expands towards other gravitational mass movements: the experimental module com6RockAvalanche enables the calculation of rock avalanches, while DebrisFrame, developed jointly with the BOKU University, extends the framework to debris flow simulation. Both projects are united under the OpenNHM (Open Natural Hazard Modelling) initiative to provide opensource tools for the assessment of alpine natural hazards."],"kw":"avalanche modelling, AvaFrame, open-source tool, natural hazards, practical use.","ty":"O","pp":300,"em":[],"r":3465,"pr":"Matthias Granig"},"342":{"id":"342","t":"Remote Avalanche Control and Automated Avalanche Detection Systems: Current Practice, Operational Experience, and Implementation Guidance","au":[{"n":"Scott Thumlert","raw":"Thumlert, Scott","p":true,"aff":""},{"n":"Paul Harwood","raw":"Harwood, Paul","p":false,"aff":""},{"n":"Harlan Shepard","raw":"Shepard, Harlan","p":false,"aff":""},{"n":"Tim Glassett","raw":"Glassett, Tim","p":false,"aff":""},{"n":"Cam Campbell","raw":"Campbell, Cam","p":false,"aff":""},{"n":"Eirik Sharp","raw":"Sharp, Eirik","p":false,"aff":""},{"n":"Brian Gould","raw":"Gould, Brian","p":false,"aff":""},{"n":"Alexis Tessier","raw":"Tessier, Alexis","p":false,"aff":""}],"ab":["Remote avalanche control systems (RACS) and automated avalanche detection systems (AADS) are increasingly used to operationally manage avalanche risk, yet comparative information on cost, performance, maintenance, and implementation remains limited. This study synthesized North American operational experience through 33 RACS end-user surveys representing 13 programs, three AADS surveys, and structured interviews with personnel from eight transportation programs. RACS were grouped into four classes by energy source and servicing model: Gas Fixed, Gas Deployable, Explosive Fixed, and Explosive Deployable. Across all classes, average installed cost was $313,100 USD per unit (Q1-Q3: $237,600-358,200 USD), and average annual operating cost was $5,900 USD per unit (Q1-Q3: $3,900-7,500 USD). RACS effectiveness depended on how a system was designed and integrated into operations: well-scaled, fully integrated arrays delivered substantial gains in operational efficiency and meaningful reductions in worker exposure, while supplemental or partially integrated installations delivered less benefit for the significant increase in program complexity. No system class was universally superior. Program workloads generally shifted from winter control operations toward off-season access, aviation logistics, and technical maintenance. Five of 33 arrays were reported to have a negative overall worker-safety effect because servicing and access exposure outweighed the avoided control exposure. These findings are translated into a six-stage decision framework that begins with operational context and control strategy, then addresses operational integration, array design, technology selection, and lifecycle sustainability. The smaller AADS dataset supports only preliminary, directional findings: participating programs described detection as a complementary source of near-realtime confirmation and more robust avalanche occurrence data, but further quantitative study is required before comparative cost or performance conclusions can be drawn."],"kw":"remote avalanche control systems, RACS, automated avalanche detection systems, AADS, transportation corridors, avalanche explosive control","ty":"O","pp":301,"em":[],"r":3444,"pr":"Scott Thumlert"},"343":{"id":"343","t":"Practitioners’ Interpretation of Avalanche Problem Type and Distribution Within the Conceptual Model of Avalanche Hazard","au":[{"n":"Aaron C. Barnett","raw":"Barnett, Aaron C.","p":true,"aff":""},{"n":"Andrew Forsman","raw":"Forsman, Andrew","p":false,"aff":""},{"n":"Eeva Latosuo","raw":"Latosuo, Eeva","p":false,"aff":""},{"n":"Ryan Minton","raw":"Minton, Ryan","p":false,"aff":""}],"ab":["The Conceptual Model of Avalanche Hazard (CMAH) was created to be a systematic, consistent workflow for avalanche hazard and risk assessment. It is a cornerstone decision aid for information exchange between many practitioners. The US lacks a centralized organizational structure for avalanche risk management. As a result, there is a wide variety of parallel operational practices, and it is unknown how many practitioners use CMAH daily. It is also unknown how individual professionals interpret the various components of CMAH in their assessments. We created a survey to investigate how avalanche practitioners engage with CMAH in their daily workflow. We also asked how they interpret the avalanche problem type and distribution steps of CMAH. The survey was distributed to practitioners in the US through personal and professional networks. This analysis is based on 100 survey responses. Of our survey participants, a large majority are at least “very” familiar with CMAH and use it as part of their daily workflow. Interquartile ranges were calculated to gauge consensus amongst practitioners for how frequently an avalanche type has a given distribution. Consensus shifts appear to depend on distribution category and avalanche type. For example, there is good consensus amongst respondents that wind slabs often have a specific distribution. Meanwhile, there is poor consensus on how frequently wind slabs have a widespread distribution. Non-parametric statistical tests were used to identify significant differences between practitioners from different climates and different professions. No results reached statistical significance after correction. Several results suggest items that warrant further study such as differences between Maritime and Continental practitioners. Effective use of structured decision-making workflows depends on consistent interpretation across user groups. Consensus regarding the frequency which practitioners believe different avalanche types have a discrete distribution varies from poor to good on an item-by-item basis. It is worthwhile to seek out ways to improve consensus. Decreasing variability in how practitioners consider avalanche problem type and distribution would improve hazard and risk assessment. We hope that our findings help spur conversations about the nuances of differing interpretations amongst practitioners."],"kw":"Conceptual Model of Avalanche Hazard, Decision Aid, Avalanche Forecasting, Expert Interpretation, Avalanche Type, Distribution","ty":"O","pp":302,"em":[],"r":3425,"pr":"Aaron Barnett"},"344":{"id":"344","t":"A Multi-Source, International Analysis of Avalanche Problem Types in Fatal Incidents (2017–2026)","au":[{"n":"Keith Gale","raw":"Gale, Keith","p":true,"aff":""}],"ab":["Avalanche danger ratings have appropriately received substantial research attention because they provide the primary regional summary of avalanche hazard. In contrast, avalanche problem types—now a central component of operational forecasting under the Conceptual Model of Avalanche Hazard—have received comparatively little quantitative evaluation despite conveying complementary information about the nature, location, and expected behavior of avalanche hazards. This study addresses that gap. It analyzes 883 fatal avalanche incidents (1,239 fatalities) from the 2017– 18 through 2025–26 seasons using the International Fatal Avalanche Database (IFAD), a multi-source international fatal avalanche database drawing records from the United States, Avalanche Canada, seventeen EAWS member nations, Japan, and South America. To the authors’ knowledge, this constitutes the most comprehensive multi-national problem-type fatality analysis yet published. Of 675 classified incidents (877 classified fatalities), the most operationally significant finding is that Persistent Slab (262 deaths; 29.9% of classified fatalities) generates its highest fatality counts at Danger Level 1– Low (38 deaths)—the highest count of any problem type at that level—and 47 at Level 2–Moderate, showing that low-to-moderate ratings do not necessarily mean persistent weak-layer hazard has resolved. Wind Slab accounts for the largest overall share (338 deaths; 38.5%), including 102 deaths at Danger Level 2–Moderate, confirming that regional danger ratings understate problem-specific risk at lower levels. Backcountry skiing and snowboarding accounts for the majority of activity-classified fatalities. Cross-agency classification differences at the Wind Slab/Storm Slab boundary are documented and addressed in the analysis. These findings suggest that Persistent Slab bulletin entries warrant explicit prominence at Low and Moderate danger levels independent of the overall rating, and that cross-agency problem-type harmonization is a prerequisite for further international safety analysis."],"kw":"avalanche problem types, danger scale, persistent slab, fatality analysis, international harmonization ,","ty":"P","pp":303,"em":[],"r":null,"day":"Fri","th":"Incidents and Case Studies","pr":"Keith Gale"},"345":{"id":"345","t":"Making Avalanche Rescue Easier and Faster by Adding Satellite Networks to the Existing Standard","au":[{"n":"Michael Vogt","raw":"Vogt, Michael","p":false,"aff":""}],"ab":["Avalanche Tranceiver search is always very unprecise due to the given technology of the magnetic field which never can give an exact location. Search within this field and following the flux lines is for recreational users very difficult and in a worst-case scenario of an avalanche often impossible. By adding a dedicated GPS grid on the magnetic field of the buried person, the searcher does not have to follow the flux line but will be guided by the avalanche transceiver directly to the buried person. As connecting to all given satellite networks, the precision of the 3D finder is under 10 cm, the searcher does not have to do the time consuming out crossing and probing in the end of the search. The user, searching the victim, just must follow very easily the arrow on the display. The research and development were made together with leading mountain rescue organizations and the German Fraunhofer institute. Field-test show, that the time for the complete search can be reduces by 30% in average. The 3D finder has a dedicated expert mode for professionals with special functions for multi burials situations, deep burials, revert to send and many more."],"kw":"Avalanche transceiver, GPS-Search, Faster.","ty":"P","pp":304,"em":[],"r":3534,"day":"Mon","th":"Avalanche Rescue","pr":"Michael Vogt"},"346":{"id":"346","t":"Applications for Radar Avalanche Detection at North American Ski Resort Operations","au":[{"n":"Reid Nolan","raw":"Nolan, Reid","p":true,"aff":""},{"n":"Nicole Koshure","raw":"Koshure, Nicole","p":false,"aff":""},{"n":"Tim Haggerty","raw":"Haggerty, Tim","p":false,"aff":""}],"ab":["Automated avalanche detection systems (AADS) have been utilized by a wide range of operations but have only recently been adopted by North American ski resorts. We look to share our experiences incorporating Radar Detection into a ski resort operation and highlight some of the unique benefits and challenges of using detection in an environment where high skier volume, snowcat traffic and other resort infrastructure is present in the monitoring area. This poses a challenge to accurate monitoring not found in many past radar installations where the area being monitored is more remote and the avalanche size to impact the resource being protected is typically much larger."],"kw":"Avalanche Detection, Avalanche Forecasting, Radar, Automated Avalanche Detection Systems (AADS), Ski Resort, Avalanche Risk Management","ty":"P","pp":305,"em":[],"r":null,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Reid Nolan"},"347":{"id":"347","t":"Site Suitability, Performance, and Operational Lessons from Six Years of Infrasound Avalanche Monitoring","au":[{"n":"Jerry Mock","raw":"Mock, Jerry","p":true,"aff":""},{"n":"Scott Havens","raw":"Havens, Scott","p":false,"aff":""},{"n":"Aaron Careaga","raw":"Careaga, Aaron","p":false,"aff":""},{"n":"Clark Corey","raw":"Corey, Clark","p":false,"aff":""}],"ab":["Infrasound monitoring uses low-frequency acoustic signals, typically below 20 Hz, to detect and characterize avalanche activity over operationally useful distances. This makes it useful in remote terrain and during periods when direct observation is limited by weather, darkness, distance, or exposure. Infrasound carries great distances due to its low frequency, so arrays can often be placed in locations which are close, but less likely to be destructively hit by an avalanche. As infrasound monitoring becomes more common in operational avalanche programs, clearer guidance is needed on where the method is well suited and where limitations should be expected. Infrasound is generally best suited for detecting larger, energetic avalanches, typically D2 or greater, and for supporting explosive mitigation work with howitzers, hand charges, and similar tools. It can be especially useful in poor visibility, remote terrain without available power, highway corridors, and settings where multiple avalanche paths need to be monitored. Current challenges in signal analysis are focused on detections of small events, slow wet avalanches, and locations with significant cultural noise. Successful operational use depends on careful system design and implementation. Detection confidence is influenced by distance to the avalanche path, terrain geometry, terrain shielding, path orientation, and array placement. Because infrasound sensors record low-frequency sound from all nearby sources, background noise from wind, traffic, aircraft, artillery, construction, and ski area operations can affect both detection confidence and interpretation. Drawing on six years of operational experience and 24 deployed arrays, we address practical considerations including power, telemetry, maintenance, site access, data health, and user expectations. We focus on two questions: what makes a site suitable for infrasound monitoring, and what strengths and limitations should be expected for a given application? By describing what has worked, what has not, and what conditions affect performance, we aim to support more informed use of infrasound in avalanche programs."],"kw":"infrasound, avalanche detection, remote monitoring, site suitability, avalanche mitigation","ty":"P","pp":306,"em":[],"r":null,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Jerry Mock"},"348":{"id":"348","t":"From Zero to Operational: Rapid Deployment of Snow Cover Simulations via the Open Source Framework AWSOME","au":[{"n":"Michael Reisecker","raw":"Reisecker, Michael","p":true,"aff":""},{"n":"Michael Binder","raw":"Binder, Michael","p":false,"aff":""},{"n":"Florian Herla","raw":"Herla, Florian","p":false,"aff":""},{"n":"Christoph Mitterer","raw":"Mitterer, Christoph","p":false,"aff":""}],"ab":["The Avalanche Warning Service Operational Meteo Environment (AWSOME) is an opensource framework for seasonal snow-cover modeling in both research and operational avalanche warning. It addresses the recurring technical effort required to connect meteorological data, snow models, postprocessing, visualization, and deployment into reproducible workflows. AWSOME provides modular tools for acquiring and harmonizing forcing data, running distributed snowpack simulations, initializing models from observations, deriving instability information, and visualizing results. Workflows can range from small standalone experiments to continuously running operational model chains, while sharing the same interfaces and data structures. Open data sources allow workflows to be transferred between regions with little additional setup. The framework is designed to keep technical complexity inside the system rather than passing it on to the user. In this way, AWSOME aims to lower the barrier to state-of-the-art snow-cover modeling, make research workflows easier to reproduce and operationalize, and provide a common foundation for collaborative development across the snow and avalanche community."],"kw":"modeling, forecasting, snowpack, AWSOME","ty":"P","pp":307,"em":[],"r":null,"day":"Thu","th":"Modelling and Quantitative Forecasting","pr":"Michael Reisecker"},"349":{"id":"349","t":"Tracking a Persistent Weak Layer Through Its Dry and Wet Phases Using Simulations Initialized by Snow Pit Profiles in Salzburg, Austria","au":[{"n":"Michael Reisecker","raw":"Reisecker, Michael","p":true,"aff":""},{"n":"Veronika Krieger","raw":"Krieger, Veronika","p":false,"aff":""}],"ab":["During winter 2025/26, the Austrian Alps experienced a pronounced persistent weak layer that produced several dryslab avalanche cycles before a rapid transition to wet-snow instability. At the Avalanche Warning Service Salzburg, seasonal snowpack evolution was simulated operationally with the snowcover modeling framework AWSOME using SNOWPACK runs initialized from manually recorded snow pit profiles. About 250 profiles were assimilated through the season, forming a growing ensemble of point simulations across the warning region. We retrospectively evaluate whether these simulations represented the timing and evolution of instability and wetting. Aggregated Punstable retained the three main dry instability periods of the season, while ensemble spread highlighted uncertainty during the prolonged stabilization of the weak layer. In spring, simulations tracked liquid-water penetration toward the persistent weak layer; deep wetting was generally represented within a time window of approximately three days despite some simulations having evolved for several months since initialization. At the well-monitored Mooserboden site, simulated wetting preceded widespread wet-slab avalanche activity within the hour. The results show that profileinitialized ensemble simulations can complement observations for regional forecasting, while remaining sensitive to initialization quality, meteorological forcing, and terrain representation."],"kw":"modeling, forecasting, accidents, persistent weak layers, AWSOME","ty":"O","pp":308,"em":[],"r":3483,"pr":"Michael Reisecker"},"350":{"id":"350","t":"Saharan Dust Deposition and Avalanches: How Mineral Particles Affect the Snowpack","au":[{"n":"C. Artoni","raw":"Artoni, C.","p":false,"aff":""},{"n":"G. Lorenzoni","raw":"Lorenzoni, G.","p":false,"aff":""},{"n":"M.A.C. Potenza","raw":"Potenza, M.A.C.","p":false,"aff":""},{"n":"B. Delmonte","raw":"Delmonte, B.","p":false,"aff":""},{"n":"C. Mangili","raw":"Mangili, C.","p":false,"aff":""},{"n":"L. Teruzzi","raw":"Teruzzi, L.","p":false,"aff":""},{"n":"V. Raspagni","raw":"Raspagni, V.","p":false,"aff":""},{"n":"V. Maggi","raw":"Maggi, V.","p":false,"aff":""}],"ab":["Saharan dust intrusions are recurring events across the European Alps and other midlatitude mountain ranges, depositing mineral particles onto seasonal snowpacks. This study investigates the formation of melt-freeze crusts associated with Saharan dust deposits and the subsequent development of faceted crystals above and below these crusts, creating persistent weak layers that can trigger avalanche release. Field observations, snow-pit analyses, and laboratory microphysical characterization using the EOS Classizer™ One (Single Particle Extinction and Scattering — SPES — technology; Potenza et al., 2015) and Digital Holography reveal a consistent stratigraphic pattern in which dust-laden layers drive localized thermal anomalies and enhanced vapor pressure gradients. The resulting sequence of hard melt-freeze crusts bounded by mechanically weak faceted layers creates favorable conditions for avalanche release. Crucially, however, the impact of dust deposition on snowpack stability can be either destabilizing, neutral, or even stabilizing, depending on topographic, meteorological and snowpack conditions (Dick et al., 2023). Operational evidence from the Italian Alps and field stability tests confirm that avalanche activity during the spring seasons of 2014 and 2016 was largely associated with Saharan dust layers (Valt and Prola, 2016). These findings have direct implications for avalanche forecasting in regions affected by long-range mineral dust transport."],"kw":"Saharan dust, red snow, melt-freeze crust, faceted crystals, persistent weak layers, wet- snow avalanches, snowpack metamorphism, avalanche forecasting","ty":"P","pp":309,"em":[],"r":null,"day":"Fri","th":"Snowpack Properties","pr":"C. Artoni"},"351":{"id":"351","t":"Experiences on Effective Applications of Site-Specific Avalanche Warning in Avalanche Risk Management","au":[{"n":"Christian Jaedicke","raw":"Jaedicke, Christian","p":true,"aff":""},{"n":"Holt Hancock","raw":"Hancock, Holt","p":false,"aff":""},{"n":"Piotr Kupiszewski","raw":"Kupiszewski, Piotr","p":false,"aff":""},{"n":"Steinar Bakkehøi","raw":"Bakkehøi, Steinar","p":false,"aff":""}],"ab":["Avalanche warning as a mitigation measure was introduced in Norway when the Norwegian Geotechnical Institute’s (NGI) avalanche research station at Fonnbu was established in 1974. Methods, tools and products of the NGI’s warning service have undergone continuous development in the ensuing years, exploring new methods, incorporating international research, and, in later years, European Avalanche Warning Services standards and guidelines. Some of the main milestones included the"],"kw":"avalanche warning, risk management, risk communication","ty":"O","pp":310,"em":[],"r":3466,"pr":"Christian Jaedicke"},"352":{"id":"352","t":"Lessons from the Cerro Cocinero Avalanche: Aerosol Dynamics and Implications for Search and Rescue Operations","au":[{"n":"Cedric Larcher","raw":"Larcher, Cedric","p":true,"aff":""},{"n":"Alejandro Casteller","raw":"Casteller, Alejandro","p":false,"aff":""},{"n":"Luis Schinelli","raw":"Schinelli, Luis","p":false,"aff":""}],"ab":["On August 27, 2010, a large avalanche struck Cerro Cocinero (2,281 m), destroyed a mountain hut and buried three occupants. Due to delayed alert, search and rescue (SAR) operations began two days after the event, under challenging conditions including deep burial, fresh snowfall, and uncertain location data. Initial assessments identified a debris field approximately 300 m long and up to 8 m deep. Early search efforts were hindered by inaccurate GPS positioning and misleading surface indicators, leading to excavation in incorrect locations. Despite systematic probing strategies, including a standard downhill search cone, no evidence of the buried structure was initially found. After several weeks, a detailed field analysis of the avalanche path provided critical new insights. Observations of tree damage patterns indicated that a powerful aerosol phase impacted the refuge at an estimated angle of approximately 70°, prior to the dense flow. This suggested a significant lateral displacement and structural fragmentation of the refuge, challenging the assumption of a purely gravitydriven burial directly downslope. Based on this revised interpretation, a new search area was defined. Recco detector signals identified anomalous targets, leading to the recovery of structural elements and personal equipment. These findings supported the hypothesis that the upper section of the refuge had been displaced and partially filtered through the forest, illustrating a “sieve effect” caused by vegetation interaction with the aerosol cloud. This case study highlights the importance of considering avalanche aerosol dynamics in post-event analysis, particularly for buried structures. It also underlines the limitations of conventional search geometries and the value of combining terrain analysis, vegetation damage interpretation, and technological tools in SAR operations."],"kw":"avalanche dynamics, aerosol phase, search and rescue, recco detection, avalanche impact, field case study","ty":"O","pp":311,"em":[],"r":3433,"pr":"Cedric Larcher"},"354":{"id":"354","t":"O'BellX 1.8: A Modular and Removable Gas System for Avalanche Preventive Release","au":[{"n":"Jean-Guillaume Aldebert","raw":"Aldebert, Jean-Guillaume","p":false,"aff":""},{"n":"Thomas Berger","raw":"Berger, Thomas","p":false,"aff":""},{"n":"Cedric Larcher","raw":"Larcher, Cedric","p":true,"aff":""},{"n":"Johann Query","raw":"Query, Johann","p":false,"aff":""},{"n":"Olivier Rivoal","raw":"Rivoal, Olivier","p":false,"aff":""}],"ab":["The O'BellX range introduces a modular, helicopter-portable gas system for avalanche preventive release, designed for remote or environmentally sensitive areas. This system uses removable, compact gas module that can be deployed, retrieved, and maintained via helicopter without ground personnel. Key features include a patented automatic hook for single-rotation installation/removal, synchronized triggering (\"Multisynch\") for coordinated explosions across 2–10 systems, and an eco-friendly design with zero chemical residues and minimal visual impact. Technical specifications highlight 55–65 m effective range (25 mbar isobar at ground level) and 40–60 shots autonomy. The system’s modularity, mobility, and synchronization make it ideal for isolated paths or protected natural areas, ensuring both safety and environmental compliance."],"kw":"Avalanche prevention, modular gas system, helicopter-portable, synchronized triggering, eco-friendly, removable infrastructure.","ty":"P","pp":312,"em":[],"r":3602,"day":"Tue","th":"Operations and Program Management","pr":"Cedric Larcher"},"355":{"id":"355","t":"Heuristic Traps in Avalanche Risk Assessment and Marketing Manipulation: A Zetetic Approach to Critical Decision-Making","au":[{"n":"Cedric Larcher","raw":"Larcher, Cedric","p":false,"aff":""}],"ab":["Avalanche risk assessment is often compromised by heuristic traps (familiarity, consistency, acceptance, expert halo, social facilitation, scarcity), identified by McCammon as major factors in accidents. These cognitive biases share mechanisms with marketing and mental manipulation techniques (Kotler, Moretti, Edmüller, Wilhelm), such as social proof, anchoring, or authority, which exploit unconscious shortcuts in human judgment. To mitigate these risks, we propose a multidisciplinary framework combining: Zetetics (Henri Broch) as a systematic countermeasure to cognitive biases; Behavioral economics insights (Kahneman, Thaler, Sunstein) to understand and manage biases at a collective level; Nudging as a practical tool to structure prevention and decision-making. Zetetics—the art of systematic doubt— offers a countermeasure by promoting rigorous questioning of assumptions, verification of facts, and resistance to cognitive biases. Integrating zetetic principles into avalanche safety training could significantly reduce accidents caused by flawed decision-making. This novel approach, bridging cognitive neuroscience, marketing, and mountain safety, introduces actionable tools (e.g., checklists, critical thinking workshops) to foster a culture of skepticism and prudence. By addressing the human factors often overlooked in traditional safety protocols, this work proposes a framework to enhance risk evaluation and mitigate the influence of manipulation in high-stakes environments."],"kw":"","ty":"P","pp":313,"em":[],"r":3536,"day":"Mon","th":"Avalanche Formation","pr":"Cedric Larcher"},"356":{"id":"356","t":"Slab Fractures during Dynamic Crack Propagation in Dry-Snow Slab Avalanches","au":[{"n":"Francis Meloche","raw":"Meloche, Francis","p":true,"aff":""},{"n":"Bertil Trottet","raw":"Trottet, Bertil","p":false,"aff":""},{"n":"Grégoire Bobillier","raw":"Bobillier, Grégoire","p":false,"aff":""},{"n":"Johan Gaume","raw":"Gaume, Johan","p":false,"aff":""}],"ab":["Predicting the size of dry-snow slab avalanches remains difficult, limiting hazard assessment despite major advances in the understanding of crack initiation and propagation. In particular, the dynamic processes that control release-zone size remain poorly constrained, especially the role of slab fracture during propagation and its dependence on the recently identified transition from anticrack (weaklayer collapse) to supershear crack propagation. Here, we use Material Point Method simulations of long propagation saw tests (PSTs) to examine how coupled slab and weak-layer fracture control crack propagation and arrest in flat and inclined terrain. We find a strong coupling between propagation regime and slab fracture morphology: anticrack propagation promotes bending-induced fractures that initiate at the slab surface, whereas supershear propagation produces more homogeneous tensile stresses and fractures that initiate mainly near the slab base. In both regimes, the distance at which slab fractures occur, governed primarily by tensile strength, determines whether propagation arrests early or continues through segmented, enechelon fracturing. We propose a release size index based on the ratio between the tensile length and the critical or supercritical crack length, which predicts whether propagation remains bending-dominated in the anticrack or transitions to supershear (pure-tension). This index could be incorporated into snow cover models to improve avalanche-size prediction, inform the design of mitigation structures, and support operational hazard assessment."],"kw":"Slab fracture, crack propagation, avalanche size, release size index.","ty":"O","pp":314,"em":[],"r":3420,"pr":"Francis Meloche"},"357":{"id":"357","t":"Numerical study of the feasibility of a downslope structure to limit avalanche size during avalanche control activity","au":[{"n":"Francis Meloche","raw":"Meloche, Francis","p":true,"aff":""},{"n":"Ron Simenhois","raw":"Simenhois, Ron","p":false,"aff":""},{"n":"Don Sharaf","raw":"Sharaf, Don","p":false,"aff":""},{"n":"Ethan Greene","raw":"Greene, Ethan","p":false,"aff":""},{"n":"Johan Gaume","raw":"Gaume, Johan","p":false,"aff":""}],"ab":["Avalanche defense structures in starting zones are effective, but they are also expensive and visually intrusive; as a result, many highway programs instead rely on active control with explosives. Recent work has shown that crack propagation in the cross-slope direction is slower than in the downslope direction, suggesting that a downslopeoriented structure could arrest propagation and limit release size at a fraction of the cost and visual impact of conventional defense structures. We tested this concept with more than 300 depth-averaged Material Point Method simulations on a simple planar slope, an analytical bowl, and real terrain (Stanley Path, Colorado). We present results considering only buried structures, which locally reduce slab depth and promote tensile fracture of the slab. The slab depth covering the structure was the dominant control, with arrest occurring below 0.15–0.30 m depending on the initial slab density; the structure ratio (height over width) acted as a secondary control, with values of at least 0.5 favoring arrest. The downslope length of the structure should extend to where the slope angle drops below the snow friction angle, and any remaining unprotected gap should not exceed twice the supercritical crack length (≈ 10–15 m at 30◦). These results provide a first set of quantitative design guidelines for a new class of downslope-oriented mitigation structures."],"kw":"Crack arrest, avalanche mitigation structures, release size, numerical modeling, depth- averaged Material-Point-Method.","ty":"P","pp":315,"em":[],"r":3537,"day":"Mon","th":"Avalanche Formation","pr":"Francis Meloche"},"358":{"id":"358","t":"Residual Avalanche Risk Assessment at the Podljubelj Tunnel (Slovenia): A Comparative Methodological Study","au":[{"n":"Mattia Matzutzi","raw":"Matzutzi, Mattia","p":true,"aff":""},{"n":"Barbara Frigo","raw":"Frigo, Barbara","p":false,"aff":""},{"n":"Blaž Komac","raw":"Komac, Blaž","p":false,"aff":""}],"ab":["Avalanche risk to transportation infrastructure remains a critical challenge in alpine regions, particularly where mitigation measures may be insufficient during extreme or compound events. The key objective of this paper is to compare different avalanche risk assessment methodologies by applying them to a single case study under consistent input conditions. The selected approaches use the same inputs obtained from avalanche interference scenarios and traffic data, enabling a direct methodological comparison. The analysis also explores various definitions of the Exposure factor, including static physical (spatial coincidence), dynamic (time-dependent probabilistic presence), and socio-economic factors related to infrastructure relevance. The case study considers a road network in the St. Anna Valley (northern Slovenia), focusing on the residual risk associated with snow avalanche–road interaction on a section protected by the Podljubelj covered avalanche protection tunnel, with the aim of evaluating its effectiveness under different release conditions. Due to the absence of a comprehensive avalanche cadaster, historical avalanche events and snow and meteorological data were analyzed to reconstruct release and interference scenarios. These scenarios were simulated using the RAMMS model to identify critical conditions leading to road obstruction and potential overtopping or lateral bypass of the tunnel. Particular attention was given to multi-event scenarios, where subsequent snow avalanches and pre-existing debris deposits may influence flow behavior and increase the likelihood of infrastructure interference. Based on the simulated scenarios, a quantitative road risk assessment was conducted, including estimation of vehicle blockage probability and individual risk of fatality integrating real traffic data. The use of different methodological approaches, despite identical boundary conditions, highlights the importance of method selection in avalanche risk management and supports the development of more consistent and transparent decisionmaking processes for transportation infrastructure in avalanche-prone environments."],"kw":"Residual risk; Exposure conditions; Traffic risk assessment; Comparative approaches; Avalanche–infrastructure interaction.","ty":"P","pp":316,"em":[],"r":3538,"day":"Mon","th":"Planning and Engineering","pr":"Mattia Matzutzi"},"359":{"id":"359","t":"Empowering Teams: Structured Risk Management and Fluent Leadership in Mountian Rescue","au":[{"n":"Benedikt Friedrich","raw":"Friedrich, Benedikt","p":true,"aff":""},{"n":"Stefan Blochum","raw":"Blochum, Stefan","p":false,"aff":""},{"n":"Silvan Metz","raw":"Metz, Silvan","p":false,"aff":""}],"ab":["The Bavarian Mountain Rescue Service (Bergwacht Bayern) strives for the safest possible operational environment and the most challenging yet safe training conditions. This requires a standardized, user-friendly risk assessment tool that is easy to understand, apply, and teach. We all accept varying levels of risk in our daily lives. Our decisions are being influenced by personal biases and the inherently stressful environment. Factors like fatigue, discomfort, or alertness shape our individual risk tolerance. When navigating complex situations with non-quantifiable variables, decisionmaking becomes highly subjective. To bring our risk assessment closer to an objective evaluation we need a structure to break down these situations into easy to judge factors. During high-stress operations with limited information a structured decision-making tool and fluent leadership offers significant benefits with minimal drawbacks. Developing a new risk assessment scheme from scratch demands significant resources and years of training. To ease uptake and reduce training overhead, the DCMR concept is implemented as a proven concept with familiar terms. D(Dangers) x C (Consequences) – M (Mitigating measures) = R (residual risk) Originally developed for winter guiding, it has been expanded to meet the additional demands of mountain rescue operations beyond standard recreational use. It is applied not only to avalanche-related decisions but also to non-avalanche scenarios in both winter and summer operations. The method is applied in the Bavarian Mountain Rescue Service to assess risks in training situations or even design training scenarios where specific challenges like darkness or height are intentionally introduced but due to specific measures the overall risk remains low. We want to share our learnings and experiences with the outdoor community, particularly with search and rescue and mountain rescue teams. We believe this tool has the potential for widespread use in the field and can contribute to safer operations."],"kw":"mountain rescue, risk management, decision making","ty":"P","pp":317,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"Benedikt Friedrich"},"360":{"id":"360","t":"Protecting Guide Judgment: Operational Risk Tolerance During Periods of Uncertainty","au":[{"n":"Erin Tierney","raw":"Tierney, Erin","p":false,"aff":""}],"ab":["Expert judgment is fundamental to avalanche risk management, yet the experience and intuition that build that judgement is developed from repeated exposure to familiar patterns. When environmental conditions change faster than those patterns can be recalibrated, even highly experienced teams may face increased uncertainty and decisionmaking pressure. This paper examines how Whistler Heli Skiing (WHS), a coastal heli-ski operation in British Columbia, adapted its operational risk management approach in response to increasingly variable snowpack conditions, atypical avalanche behaviour, and changes to familiar glaciated terrain. During the 2023 / 2024 and 2024 / 2025 seasons, WHS experienced prolonged dry periods, intense storm cycles, persistent weak layers (PWL), and changing terrain characteristics that challenged established operational norms supported by decades of guide experience. Following a significant incident early in the 2024 / 2025 season, WHS shifted from communicating operational risk tolerance more implicitly towards developing more explicit operational systems. Key changes included clearer terrain-management protocols, revised decision-making procedures, and enhanced field data collection. A number of other actions were also added that supported operational efficiencies and communications, resulting in more support for workers and their tasks. These measures were not designed to replace guide expertise, but to enhance the structure day to day, as well as establish operational boundaries within which that expertise could be most effectively applied in periods of elevated hazard and uncertainty. Our experience suggests that managing uncertainty is not only a function of improving snowpack knowledge or decision-making. Operations can also reduce decision making burden by clearly defining acceptable risk, limiting unnecessary choices, and assuming responsibility for conservative operational decisions. This allows guides to focus their attention more directly on observations and changing conditions, prioritizing the nuanced judgments that remain essential in complex terrain. This case study explores how operational structure, systems, policies and risk communication can support expert judgment when familiar environmental patterns become less reliable and considers how defining operational risk tolerance supports decision-making during periods of uncertainty."],"kw":"Risk tolerance, Decision-making, Uncertainty, Organizational Change, Intuition.","ty":"O","pp":318,"em":[],"r":3484,"pr":"Erin Tierney"},"361":{"id":"361","t":"Density-Insensitive Determination of Liquid Water Content in Snow Using Microwave Attenuation Measurements","au":[{"n":"Marco Niederberger","raw":"Niederberger, Marco","p":false,"aff":""},{"n":"Michel A. Nyffenegger","raw":"Nyffenegger, Michel A.","p":false,"aff":""},{"n":"Albert Loichinger","raw":"Loichinger, Albert","p":false,"aff":""},{"n":"Fabian Wolfsperger","raw":"Wolfsperger, Fabian","p":false,"aff":""},{"n":"Alec van Herwijnen","raw":"van Herwijnen, Alec","p":false,"aff":""},{"n":"Hans-Dieter Lang","raw":"Lang, Hans-Dieter","p":true,"aff":""}],"ab":["Wet snow avalanche modeling and forecasting remain a significant challenge, in part due to the limitations of currently available instruments for determining liquid water content (LWC) in snow. Current dielectric LWC probes, such as the Denoth Meter (Denoth 1989) and its improvement by Wolfsperger et al. (2023), rely on the real part of the dielectric permittivity of snow. According to well-established dielectric models (Tiuri et al. 1984), this quantity is strongly densitydependent, requiring a priori knowledge or additional measurements of the dry-snow density and limiting the suitability of such instruments for reliable large-scale or automated measurements. In contrast, the imaginary part of the permittivity, responsible for dielectric loss, is density-independent. To leverage this characteristic, the electromagnetic properties of a microstrip transmission line embedded in snow are exploited at microwave frequencies. The electromagnetic fields traveling along this line extend partly into the snow, where dielectric loss allows LWC determination based on simple attenuation measurements without knowledge of the density. This measurement principle was tested in the snow lab using custom hardware, consisting of a measurement unit with a signal generator and a power detector and an external sensor PCB that is inserted into the snow pit wall. Density insensitivity was confirmed for dry-snow densities in the range of 100 to 400 kg/m3, equivalent to an LWC uncertainty of ± 0.25 %vol. Full-wave simulations predict an LWC sensitivity of approximately 2 dB attenuation per one-percent LWC change, which is supported by preliminary lab experiments. The main challenges remain the preparation of homogeneous wet snow with a defined LWC, the non-stationary distribution of liquid water at higher LWC, and the lack of precise reference measurement systems."],"kw":"Liquid Water Content (LWC), Snowpack Properties, Microwave Measurement, Instrumen- tation, Remote Sensing","ty":"P","pp":319,"em":[],"r":null,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Hans-Dieter Lang"},"362":{"id":"362","t":"From Awareness to Application: Ten Years of Consumer-Facing ATES in the United States","au":[{"n":"Andy Sovick","raw":"Sovick, Andy","p":true,"aff":""}],"ab":["The Avalanche Terrain Exposure Scale (ATES) was designed as a communication tool to convey terrain complexity to backcountry recreationists through consumer channels such as guidebooks and mobile apps. Despite two decades of research into ATES mapping methodology, few empirical studies have examined how the general public receives and acts on ATES ratings delivered through US private sector products. In 2016, Beacon Guidebooks introduced the first significant consumer-facing ATES implementation in the United States, and for the following seven years it remained the only one. Three surveys conducted between 2018 and 2023 documented a shift in comprehension among this engaged, guidebook-buying audience: the share reporting low awareness of ATES dropped from 50% to 10%, and active use of ATES in trip planning rose from 15% to 48%. When onX Maps introduced ATES to a much larger and less self-selected backcountry audience in fall 2023, a different picture emerged. Across three winters of behavioral data, users consistently engaged with the simpler slope angle layer at a higher rate than ATES, and the gap widened even after accounting for a below-average snowpack year that suppressed engagement with all terrain layers. A survey of onX users conducted in August 2026 helps explain why. Self-reported comprehension of ATES trails slope angle by a wide margin, but the gap narrows steadily with years of backcountry experience, and use of both layers is concentrated in trip planning rather than in-field decision making. These findings suggest that understanding ATES as a classification and applying it dynamically in the field are separate challenges, and that slope angle's advantage may owe as much to its decades of pre-digital use with a hand-held inclinometer as to its simplicity. Together, this decade of US consumer ATES delivery offers the first empirical account of how the general public receives a terrain communication tool, with direct implications for how such tools are designed, taught, and evaluated."],"kw":"avalanche terrain exposure scale, autoATES, risk communication, terrain visualization, consumer behavior, backcountry recreation","ty":"O","pp":320,"em":[],"r":3398,"pr":"Andy Sovick"},"363":{"id":"363","t":"From Military Outpost to Major Alpine Resort: Operational Development and Digitalization of the Patrol and Rescue Service in the Andermatt–Sedrun–Disentis Ski Resort","au":[{"n":"Carlo Danioth","raw":"Danioth, Carlo","p":false,"aff":""},{"n":"Luc Danioth","raw":"Danioth, Luc","p":false,"aff":""},{"n":"Stefanie Cavaletti","raw":"Cavaletti, Stefanie","p":false,"aff":""},{"n":"David Monn","raw":"Monn, David","p":false,"aff":""},{"n":"Björn Becker","raw":"Becker, Björn","p":false,"aff":""},{"n":"Matthias Pleyer","raw":"Pleyer, Matthias","p":false,"aff":""},{"n":"Walter Steinkogler","raw":"Steinkogler, Walter","p":false,"aff":""}],"ab":["Over the past two decades, Andermatt has grown from a military-influenced mountain village into one of central Switzerland's most significant winter sports centers. Major investments from 2005 onward in hotels, infrastructure, and ski lifts gradually brought the once-separated ski areas of Andermatt, Sedrun, and Disentis together. Today the resulting resort spans 168 km (104.4 miles) of ski runs at elevations between 1’227 and 2’961 m (4’025–9’715 ft), served by 28 modern lifts, making it the largest ski resort in central Switzerland. This rapid growth made a thorough overhaul and digitalization of internal operations necessary. Using the ski patrol and rescue service team as an example this paper shows how a standardized digital documentation system was developed and rolled out to meet both the company's own documentation needs and its legal obligations. Because the region is located on the precipitationheavy main alpine ridge, numerous avalanche release areas have to be assessed for the hazard they pose to ski runs and trails. All release areas and remote avalanche control installations are shown digitally on a topographic map, and blasting locations are logged on that map either manually or via GPS from a handheld radio. The platform brings together the key weather and snow data needed for these assessments, supports team communication through a shared journal, and enables digital documentation of ski run inspections. This paper covers the digitalization process itself, how the platform is used day to day, and the challenges of running a patrol and rescue service in a large Swiss alpine ski resort."],"kw":"","ty":"O","pp":321,"em":[],"r":null,"pr":"Walter Steinkogler"},"364":{"id":"364","t":"Summarizing Ten Winters of Remote Avalanche Control System (RACS) Use Along the Trans-Canada Highway at Three Valley Gap, Revelstoke, Canada","au":[{"n":"Chad Hemphill","raw":"Hemphill, Chad","p":false,"aff":""},{"n":"Alan Jones","raw":"Jones, Alan","p":true,"aff":""},{"n":"Chris Argue","raw":"Argue, Chris","p":false,"aff":""},{"n":"Lisa Dreier","raw":"Dreier, Lisa","p":false,"aff":""},{"n":"Andi Buechi","raw":"Buechi, Andi","p":false,"aff":""},{"n":"Walter Steinkogler","raw":"Steinkogler, Walter","p":false,"aff":""}],"ab":["Three Valley Gap, located 20 km west of Revelstoke, British Columbia, holds the highest Avalanche Hazard Index (AHI) in the province and ranks among the highest-priority avalanche zones along the Trans-Canada Highway (TCH). With traffic volume growth compounding at 1-2% annually, avalanche risk within this corridor has continued to increase. In 2016, eleven Remote Avalanche Control Systems (RACS) were installed at Three Valley Gap, reducing risk to the travelling public, improving worker safety, and shortening closure durations. This paper summarizes the key operational learnings from the decade since implementation, covering operational improvements and technical advances observed over ten winters of use. Operational benefits were evident from the first winter of operation. Average control mission time decreased from up to 60 minutes to approximately 23 minutes, and average closure duration fell from 3.9 hours (2007/08–2015/16) to 2.4 hours (2016/17–2025/26); average annual closure hours dropped from 45.1 to 25.3, a reduction of 44%. Active, high snowfall winters require careful explosive charge management late in the season, with operational decisions needed on whether to reload the system or reserve charges for night-time control while relying on helicopter support during the day. Winters with high freezing levels (e.g., 2024 and 2025) can result in surplus charges requiring detonation at season’s end. The British Columbia Ministry of Transportation and Transit Revelstoke team manages avalanche hazard across a road network extending well beyond the TCH corridor, and RACS-driven efficiency gains – including prioritized treatment of high-risk paths, a shift toward nighttime and early-morning control windows, and reduced pre-mission preparation time – free up resources for this broader avalanche management mandate. This additional capacity is particularly valuable given that traffic queuing in the city of Revelstoke and along the highway during closures also draws on team resources. Close coordination with the Parks Canada Glacier National Park (Rogers Pass) avalanche control team further minimizes corridor-wide traffic impacts."],"kw":"TransCanada Highway 1, RACS, traffic volume.","ty":"P","pp":322,"em":[],"r":3603,"day":"Tue","th":"Operations and Program Management","pr":"Alan Jones"},"365":{"id":"365","t":"Preserving Operational Expertise in Avalanche Services: Knowledge Transfer Across Daily, Seasonal, and Generational Scales","au":[{"n":"Walter Steinkogler","raw":"Steinkogler, Walter","p":false,"aff":""}],"ab":["Effective knowledge transfer is critical to operational continuity and safety in high-risk environments. When knowledge transfer fails, operational risk increases, and if left unaddressed, accumulated expertise may be permanently lost upon personnel turnover. Avalanche forecasting presents a particularly instructive case, as it integrates two fundamentally distinct knowledge types. Explicit knowledge, encompassing rules, scales, models, and standardized procedures, transfers relatively readily through documentation and formal training. Tacit knowledge, however, poses a greater challenge: the pattern recognition, terrain intuition, and judgement under uncertainty that experienced forecasters develop over years of practice resist codification and are therefore most vulnerable to attrition when senior practitioners retire. This distinction is especially consequential in communities of practice operating across diverse cultural and institutional contexts, where experiential knowledge is difficult to externalize and share. The aim of this study was to create a basic survey to establish a baseline understanding of how knowledge transfer occurs within avalanche operations across temporal scales: daily, seasonal, and generational. The survey was tested in semistructured interviews with a small sample of different operation types: ski resorts, road operations, and mountain communities across the Alps. Participants qualitatively described their knowledge transfer practices, principles, and experiences, providing insight into both formal and informal mechanisms through which operational expertise is sustained and transmitted."],"kw":"Knowledge transfer, explicit knowledge, tacit knowledge, SECI model, avalanche fore- casting.","ty":"P","pp":323,"em":[],"r":null,"day":"Thu","th":"Risk Communication","pr":"Walter Steinkogler"},"366":{"id":"366","t":"An Automated Method for Regional Avalanche Alpha-Angle Characterization Based in Western Canada","au":[{"n":"Declan Knies","raw":"Knies, Declan","p":true,"aff":""},{"n":"John Sykes","raw":"Sykes, John","p":false,"aff":""},{"n":"Pascal Haegeli","raw":"Haegeli, Pascal","p":false,"aff":""}],"ab":["The Avalanche Terrain Exposure Scale (ATES) is used to communicate spatial susceptibility to avalanche terrain (Statham and Campbell 2025). Historically, ATES maps were produced manually for small, high-use areas, however, advances in GIS, remote sensing, and automated terrain modelling now enable large-scale mapping (Jamieson and Campbell 2018; Huber et al. 2023). A new SAR-NIF project aims to produce ATES maps across Western Canada using the automated ATES (autoATES) protocol. A key component in autoATES is runout extent, calculated by the statistical runout model FlowPy. FlowPy primarily uses maximum alpha-angle, the angle between the avalanche crown and toe along the path of travel, to compute avalanche runout (D’Amboise et al. 2022; Huber et al. 2024). AutoATES v2.0 used a conservative 18° alpha-angle parameter to capture extreme runouts for all regions. However, a Coast Mountains study reported a minimum alpha-angle of 20.4°, indicating a need for regional calibration (Nixon and McClung 1993). We propose a method for estimating regional avalanche alpha-angle parameters from operational avalanche occurrence records in western Canada. In this workflow, we use FlowPy to model an avalanche thalweg (flow path), statistically estimate a crown location, and locate a toe mass location using operational data to calculate regional alpha-angle distributions. Quality control removes unsuitable avalanche paths from statistics, reducing 153 initial paths to 40 retained. Across retained paths, alpha-angles ranged 21° to 56° for Bear Pass and 24° to 50° for Duffey Lake. Mean alpha-angles were 32° in both regions. The Bear Pass minimum closely matched the 20.4° Coast Mountains minimum, but other results differed (Nixon and McClung 1993). The absence of start-zone data, the operational nature of the dataset, and the limited number of retained paths introduce substantial uncertainty. However, the program can easily accommodate new datasets, improved thalweg routing, or the implementation of alpha-beta or runout-ratio regression models."],"kw":"Automated Avalanche Terrain Mapping; FlowPy; Runout Simulation; Model Validation; Alpha-Angle","ty":"P","pp":324,"em":[],"r":null,"day":"Fri","th":"Terrain","pr":"Declan Knies"},"367":{"id":"367","t":"InfoEx for Professional Avalanche Education: Using the Tool for Course Risk Management and Meeting Student Learning Outcomes","au":[{"n":"Sean Zimmerman-Wall","raw":"Zimmerman-Wall, Sean","p":true,"aff":""},{"n":"Karin Pocock","raw":"Pocock, Karin","p":true,"aff":""},{"n":"Chris Dyck","raw":"Dyck, Chris","p":true,"aff":""}],"ab":["For many avalanche education organizations, the documentation of daily avalanche forecasting and risk management has relied on internally developed paper forms and customized digital spreadsheets. The InfoEx, developed by the Canadian Avalanche Association and utilized by practitioners across the globe, is a daily exchange of technical snow, weather, avalanche and terrain information between subscribers. Its adoption in a wider variety of contexts and organizations has enabled comprehensive documentation of factors related to avalanche forecasting and operational decision-making. Several professional avalanche education entities now use the platform to document operational risk management. In addition, some are using the power of the tool to facilitate meeting student learning outcomes related to hazard assessment using the Conceptual Model of Avalanche Hazard (CMAH) and risk treatment plans. The American Institute for Avalanche Research and Education (AIARE), the Silverton Avalanche School (SAS), and the Canadian Avalanche Association Industry Training Program (CAA ITP) all employ the tool in the delivery of their courses during the winter operating season. The purpose of this study is to define how operations are using the platform, explore the challenges they experience with its design and implementation, record insights related to operational decision-making, and identify emerging best practices in its usage. This information is gained through discussions with program managers tasked with InfoEx integration, review of InfoEx workflows, and synthesis of feedback from the different user groups of trainers and students. Capturing a baseline of how professional avalanche education organizations are currently utilizing the InfoEx can guide future development and implementation of the tool in educational settings. This insight is useful to all avalanche educators who consider ways to improve documentation and data-sharing tasks in their work."],"kw":"","ty":"P","pp":325,"em":[],"r":3539,"day":"Mon","th":"Avalanche Education","pr":"Sean Zimmerman-Wall"},"368":{"id":"368","t":"”Why Can’t They Get Them Out?” Risk, SAR Decision-Making, and Family Communications in Delayed Avalanche Recoveries","au":[{"n":"Amy Holman","raw":"Holman, Amy","p":true,"aff":""},{"n":"Eric Geisler","raw":"Geisler, Eric","p":false,"aff":""},{"n":"Eeva Latosuo","raw":"Latosuo, Eeva","p":false,"aff":""},{"n":"Matthew Lemons","raw":"Lemons, Matthew","p":false,"aff":""}],"ab":["Avalanche training emphasizes immediate search and rescue (SAR), yet operational, environmental, and risk-based constraints can delay recovery for extended periods or prevent it altogether. Drawing on avalanche responder experience, this paper identifies practical lessons for managing risk, sustaining multi-operational-period recoveries, and supporting families facing unresolved loss. It offers recommendations to broaden avalanche education beyond immediate rescue to include delayed recovery operations, responder safety, and family communication. Drawing on Alaska avalanche incidents in which recovery took more than seven days, together with SAR practitioner experience, we identify five recurring factors that delay recovery and complicate decision-making. We examine the limits of standard search and recovery tools and how prolonged operations expose responders to risks equal to or greater than those faced by the original subjects. We conclude with recommendations for managing recovery risk safely across multiple operational periods. Families rarely see the risk assessments that guide recovery decisions and may interpret delays as inaction, insufficient effort, or abandonment. To address this challenge, we discuss communication of hazard-driven decisions, responder safety concerns, and operational limitations, and provide example strategies for engaging families during prolonged or suspended recovery operations. By linking avalanche hazards, SAR decisionmaking, recovery tools, and family communication, this work reframes delayed recovery as a necessary adaptation to risk rather than a failure of response."],"kw":"Avalanche, Recovery, Risk, Family, Communication","ty":"O","pp":326,"em":[],"r":3405,"pr":"Amy Holman"},"369":{"id":"369","t":"Rain-on-Snow (ROS) Events in the Italian Alps and Increased Avalanche Activity","au":[{"n":"M. Valt","raw":"Valt, M.","p":true,"aff":""},{"n":"C. Bee","raw":"Bee, C.","p":false,"aff":""},{"n":"F. Monti","raw":"Monti, F.","p":false,"aff":""}],"ab":["On the southern side of the European Alps (Italian Alps), an increase in the number of rain-on-snow (ROS) events has been observed, including during the winter season. Over the past 10 years, several such events have been observed above 6,560 feet (2,000 meters) in elevation, even in January. Overall, winter precipitation, measured in millimetres of precipitation, has not changed over the past 30 years, but the amount of new snow has decreased at all elevations. In February, the average elevation of the rain/snowfall boundary rose by more than 400 m (1,312 ft) in certain areas. Given these changes in the rain/snow regime, an investigation was conducted to determine whether avalanche activity has changed over the past 30 years. The study, based on daily observations from over 200 manual stations, revealed an increase in the percentage of wet-snow avalanches, especially large ones, over the past 10 years."],"kw":"ROS, SNOW, ALPS, SNOWFALL, WET AVALANCHES.","ty":"P","pp":327,"em":[],"r":3540,"day":"Mon","th":"Avalanche Formation","pr":"M. Valt"},"370":{"id":"370","t":"Widespread Wet Avalanches But a Safe Road: The March 2025 Wet Snow Cycle in Hardanger and Lessons from Site-Specific Forecasting on E134 Haukelifjell","au":[{"n":"Njål Farestveit","raw":"Farestveit, Njål","p":true,"aff":""},{"n":"Markus Eckerstorfer","raw":"Eckerstorfer, Markus","p":false,"aff":""},{"n":"Halgeir Dahle","raw":"Dahle, Halgeir","p":false,"aff":""}],"ab":["On 4–5 March 2025, an extensive wet avalanche cycle struck the Hardanger region of western Norway, closing multiple roads through avalanche debris, slush flows and debris flows, and prompting red-level warnings from Varsom.no. E134 Haukelifjell, a major mountain pass connecting western Norway to the rest of the country, experienced the same meteorological forcing and snowpack conditions but remained open throughout the event. This paper documents the forecast-decision-action sequence behind that outcome, in the first season that site-specific avalanche forecasting and active avalanche control operated together on this road. An Orange alert level was issued two days ahead of the peak of the event, prompting preventive blasting at Pepparstein on 4 March that released a size 3 avalanche before the heaviest rainfall arrived, substantially reducing the load on the starting zone. Much of the precipitation subsequently forecast as snow fell instead as rain, further stabilizing the remaining snowpack, and no avalanches reached the road at any point. SNOWPACK simulations illustrate the wet snow processes involved but served as supporting context rather than as the basis for operational decisions, which relied on field observations, weather forecasts, and structured risk assessment. The case illustrates how early alert level elevation, well-timed preventive control, and continuous tracking of the precipitation phase transition can together keep a mountain road open during a regionally severe avalanche event."],"kw":"wet avalanche, site-specific forecasting, avalanche control, road safety, SNOWPACK, Hardanger","ty":"P","pp":328,"em":[],"r":3604,"day":"Tue","th":"Operations and Program Management","pr":"Njål Farestveit"},"371":{"id":"371","t":"A Practical Example of Avalanche Study and Modelling and Active Triggering Solution Implementation in Uzbekistan","au":[{"n":"C García-Sellés","raw":"García-Sellés, C","p":false,"aff":""},{"n":"S Riba","raw":"Riba, S","p":false,"aff":""},{"n":"T Berger","raw":"Berger, T","p":true,"aff":""}],"ab":["A relevant project has been under progress on behalf of the Ministry of Investment and Foreign Trade (MIFT) of the Republic of Uzbekistan which aims at the development of the international all-season resort of the “Beldersay- Chimgan-Nanay” resort. The first phase of two concerns in particular the construction of a four seasons resort. Beyond the development of the resort, the main driver of the project is to build a cable transport system starting from the resort to the summit of Mount Chimgan at 3309 m altitude. This transport chain includes 2 ropeways system and 4 stations. Some of these infrastructures are highly submitted to avalanche risk. After a mandatory extensive study avalanche phase, the works saw the installation of comprehensive avalanche mitigation in 2026, focused on 4 major high-risk zones. The primary objective was to protect critical pylone infrastructure and slopes with 14 RACS, remotely operated avalanche gas control systems, O’BellxTM. Another key aspect of the project, which posed also a challenge from the perspective of snow conditions, was the analysis of snow and weather conditions in a mountainous region so geographically and conceptually distant from our Alpine and Pyrenean environment, usual business site. The first step was to try to classify the snow climate into one of the three classic categories: continental, intermountain or maritime. The working hypothesis was to assume a continental climate as this area is so far from coastal zones, where, in principle, the typical processes of a continental climate should be fundamental. Nevertheless, cold conditions may be moderated by a latitude like the Mediterranean Pyrenees and by a relatively modest altitude. All this means that we must be aware that a high level of uncertainty must be accepted when modelling reference avalanches, due to the lack of absolute certainty when reconstructing the snow conditions of avalanches with return periods of 100 and 300 years. For this reason, it has been important to maintain close contact with local meteorological authorities and with the academic sector involved in research and modelling of natural hazards. The paper aims at presenting the main outlines of this uncommon project."],"kw":"Gas RACS – Avalanche – Modelling – Tian Shan -","ty":"P","pp":329,"em":[],"r":3605,"day":"Tue","th":"Operations and Program Management","pr":"T Berger"},"372":{"id":"372","t":"When Avalanches Get Wetter: Are Our Building Codes Fit for the Future?","au":[{"n":"Michael L. Kyburz","raw":"Kyburz, Michael L.","p":true,"aff":""},{"n":"Stefan Margreth","raw":"Margreth, Stefan","p":false,"aff":""},{"n":"Betty Sovilla","raw":"Sovilla, Betty","p":false,"aff":""},{"n":"Johan Gaume","raw":"Gaume, Johan","p":false,"aff":""}],"ab":["Avalanche impact pressures on structures remain challenging to predict because avalanche–structure interactions depend strongly on flow regime, snow properties and the geometry of the object. Current guidelines on structural actions predominantly estimate impact pressure using a hydrodynamic approach proportional to density and velocity squared. This approach may not adequately represent slow, wet avalanches, for which frictional, and cohesive effects can contribute substantially to the impact pressure. With wet-snow avalanches becoming more frequent in a warming climate, we assess the robustness and applicability of current guidelines on structural actions under such conditions. To achieve this, we use three-dimensional Material Point Method (MPM) simulations to investigate wet-snow avalanche impacts on structures representative of typical residential buildings. We compare the simulated pressures with predictions from current guidelines on structural actions and a recently proposed equation incorporating frictional and cohesive effects. Our results provide insight into the influence of avalanche width, flow velocity, and material cohesion on impact pressures. We find that the current guidelines generally underestimates impact pressures for slow avalanches, whereas including frictional and cohesive pressure contributions provides better agreement, particularly for wide avalanches. The simulations further reveal a strong dependence of impact pressure on the relative avalanche and structure widths, highlighting the importance of lateral confinement and the resulting mobilized domain in avalanche–structure interactions."],"kw":"Wet avalanche impact loads; Guidelines on structural actions; 3D Numerical modelling; Material Point Method; Climate change","ty":"P","pp":330,"em":[],"r":3541,"day":"Mon","th":"Planning and Engineering","pr":"Michael L. Kyburz"},"373":{"id":"373","t":"Field Intervention and Control of a Glide Avalanche in an Urban Environment Without Explosive Release Options","au":[{"n":"Sergi Riba Porras","raw":"Porras, Sergi Riba","p":true,"aff":""},{"n":"Vicente Medina","raw":"Medina, Vicente","p":false,"aff":""},{"n":"Joan Albós","raw":"Albós, Joan","p":false,"aff":""},{"n":"Carles García-Sellés","raw":"García-Sellés, Carles","p":false,"aff":""}],"ab":["On 17 February 2026, a ~50 m long basal crack developed on a short snow-covered slope immediately above an urban sector of Pas de la Casa, Andorra. The potentially mobilizable volume was estimated at ~2,000 m³ and interpreted as a potential glide avalanche. Exposed elements included façades and, critically, a lower street with intense winter pedestrian and vehicle traffic. Preventive release with explosives was rejected because the basal character of the instability and the very short distance to exposed receptors did not allow the released volume or consequences to be controlled with sufficient confidence. RAMMS:AVALANCHE was used as a rapid consequencescreening tool, not as a release-prediction model. A complete-release scenario reached the lower street and adjacent façades, with representative flow depths of ~2 m and impact pressures of ~40 kPa in exposed sectors. Long-term street closure was also operationally unacceptable. The adopted strategy therefore reduced the mechanically connected release volume by transverse hydraulic pre-cuts and localized water application at the snow-ground interface, promoting controlled sliding of previously isolated blocks. Three principal partial releases were induced before final mechanical removal. The case illustrates how field assessment, consequence modelling and controlled fragmentation can be combined when conventional avalanche-control options are unacceptable in a constrained urban setting."],"kw":"glide avalanche; hydraulic fragmentation; RAMMS; urban risk; avalanche mitigation; An- dorra","ty":"P","pp":331,"em":[],"r":null,"day":"Fri","th":"Incidents and Case Studies","pr":"Sergi Riba Porras"},"375":{"id":"375","t":"RACS for Avalanche Hazard Management on State Roads in Pinzgau, Austria – Planning, Construction, Local Forecasting and Centralized Operation","au":[{"n":"Stefan Oberaigner","raw":"Oberaigner, Stefan","p":false,"aff":""},{"n":"Gottfried Seer","raw":"Seer, Gottfried","p":false,"aff":""},{"n":"Paul Dobesberger","raw":"Dobesberger, Paul","p":true,"aff":""}],"ab":["Road avalanche protection in alpine regions requires not only technical solutions but also well-coordinated organizational structures across multiple stakeholders. This paper presents a case study on the planning, construction, and operation of a RACS (Remote Avalanche Control System) program installed to protect state roads in the municipalities of Saalfelden, Maishofen, and Rauris in the province of Salzburg, Austria. The program was initiated in 2009 and has since grown to eight Wyssen avalanche towers. Project planning and construction were carried out by the federal torrent and avalanche control service, with Wyssen Avalanche Control (WAC) contributing their longstanding expertise during the planning phase. A key organizational feature of this setup is the centralized operation of all RACS – regardless of municipal boundaries – by a single road maintenance authority, which handles storing, loading and triggering of all systems. The decision to initiate avalanche control missions is made by the respective local avalanche commissions of each of the three municipalities involved. Annual maintenance of all systems is carried out by Wyssen technicians, ensuring consistent technical oversight throughout the lifecycle of the infrastructure. Since 2023, all systems have been operated using the Wyssen 2K charge – a new two-component explosive – replacing conventional avalanche explosives previously in use. This transition has been evaluated in terms of operational reliability, handling, and safety. The experience gained over several years of operation demonstrates that a clear division of responsibilities between planning, construction, and operation – combined with a centralized operational model and a defined cost-sharing framework for both construction and ongoing operation – proves highly effective for managing geographically distributed avalanche safety infrastructure. The organizational model presented here may serve as a transferable framework for similar road protection projects in alpine communities. All parties involved have expressed strong satisfaction with both the distribution of responsibilities and the successful implementation across four construction phases, as well as with the smooth running of ongoing operations."],"kw":"avalanche hazard management; avalanche control; RACS; case study","ty":"P","pp":332,"em":[],"r":3606,"day":"Tue","th":"Operations and Program Management","pr":"Paul Dobesberger"},"377":{"id":"377","t":"Snowpack Layer Detection with an IoT Radar: A Comparison with Manual Snow Pit Observations at SODANKYLÄ, Finland","au":[{"n":"Lauri Nieminen","raw":"Nieminen, Lauri","p":false,"aff":""},{"n":"Leena Leppänen","raw":"Leppänen, Leena","p":false,"aff":""}],"ab":["Characterizing the internal stratigraphy of a seasonal snowpack is a fundamental challenge in snow science, shaped by precipitation events, wind redistribution, and temperature-driven metamorphism. The resulting layered structure has direct implications for avalanche hazard assessment and hydrological modelling. Manual snow pit analysis remains the gold standard for stratigraphic observation, yet its labour-intensive nature limits temporal and spatial sampling density, motivating the development of alternative approaches. This study assessed the capability of an IoT radar device to detect and resolve internal snow layers and evaluated its correspondence with manual snow pit observations. In this study, the radar was utilised to detect snow layers based on radar reflections. Fieldwork was conducted at the Arctic Space Centre of the Finnish Meteorological Institute in Sodankylä, Finland, above the Arctic Circle, from January through the end of the winter season. Snow pits were excavated approximately weekly, with full snow profiles recorded at each visit. The snow pits were conducted as part of the routine monitoring activities of the research centre, while the radar unit was deployed alongside as an independent addition. Both datasets were treated separately through their own analysis before being compared against one another. The results are evaluated in terms of the radar's ability to resolve layer boundaries across varying seasonal snow conditions and its consistency with the manual stratigraphic record, contributing to the broader understanding of radar-based methods for autonomous snowpack monitoring."],"kw":"IoT, Radar, Snow stratigraphy, Snowpack","ty":"P","pp":333,"em":[],"r":null,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Lauri Nieminen"},"379":{"id":"379","t":"Constraining µ(I) Parameters for Snow Avalanche Modelling: A Case Study in the Central Apennines, Italy","au":[{"n":"Sophie Fontana","raw":"Fontana, Sophie","p":true,"aff":""},{"n":"Lars Blatny","raw":"Blatny, Lars","p":false,"aff":""},{"n":"Johan Gaume","raw":"Gaume, Johan","p":false,"aff":""},{"n":"Davide Pasquali","raw":"Pasquali, Davide","p":false,"aff":""},{"n":"Marcello Di Risio","raw":"Di Risio, Marcello","p":false,"aff":""}],"ab":["Avalanche hazard assessment and the design of avalanche defensive structures rely on the accurate simulation of avalanche dynamics. This requires past flow behaviour to be inferred from recorded avalanche events, providing constraints for the calibration of the rheological parameters used in avalanche simulations. In this context, the µ(I)rheology provides a physically based description of dense granular flows and offers an alternative to rate-independent formulations. This study therefore investigates the reconstruction of avalanche dynamics through the back-calculation of observed events using a three-dimensional Material Point Method (MPM) solver implemented with the µ(I)-rheology. The MPM framework allows complex topography and boundary conditions to be represented, together with interactions and impacts between avalanches and obstacles, such as structural or natural elements. The approach is applied to two well-documented avalanche events in the Central Apennines (Central Italy) to assess its ability to reproduce observed avalanches and their dynamics. Simulations are calibrated against avalanche path features, including runout distance and maximum and average snow depth within the deposit area, and the simulated loading on affected structures provides an additional reference for evaluating the reconstructed dynamics. This paper provides an initial assessment of the adopted modelling framework and rheological formulation for the simulation of snow avalanche events, showing that it can reasonably reproduce the main observed features of two selected events."],"kw":"Avalanche Dynamics, Incidents and Case Studies, Modelling and Quantitative Forecasting, Rheology, Terrain","ty":"P","pp":334,"em":[],"r":3542,"day":"Mon","th":"Avalanche Dynamics","pr":"Sophie Fontana"},"381":{"id":"381","t":"Avalanche Education for People in Competitive Snowsports","au":[{"n":"Sam Damon","raw":"Damon, Sam","p":true,"aff":""},{"n":"Dale Atkins","raw":"Atkins, Dale","p":false,"aff":""},{"n":"Cindy Berlack","raw":"Berlack, Cindy","p":false,"aff":""}],"ab":["Competitive snowsport athletes perceive dangers and think about risk differently than recreational snowsport enthusiasts. Thus, these athletes require a different approach to learn about avalanche dangers and to reduce their risk to avalanches. Our paper presents the ways in which competitive snowsport athletes are different, and some key considerations we use at BRASS (The Bryce and Ronnie Athlete Snow Safety Foundation) to adapt avalanche education for this audience."],"kw":"Avalanche Education, Competitive Snowsports, Adolescents, Age, Decision Making, Risk Communication, Mitigation.","ty":"P","pp":335,"em":[],"r":3543,"day":"Mon","th":"Avalanche Education","pr":"Sam Damon"},"382":{"id":"382","t":"March Mega Thaw: Forecasting Case Study During a Prolonged Early Spring Heat Event in Utah, 2025–26","au":[{"n":"Nikki Champion","raw":"Champion, Nikki","p":true,"aff":""},{"n":"Jenna Malone","raw":"Malone, Jenna","p":false,"aff":""},{"n":"Jonathan
