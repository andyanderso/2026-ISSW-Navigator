  Thu:[M("Speaker's breakfast","06:30","07:45"),M("Opening words","08:00","08:10"),SS("Advances in Understanding 3"),M("AM break","09:30","10:00"),SS("Avalanche Risk Management 5"),M("Lunch","11:20","12:30"),SS("Avalanche Risk Management 6"),M("PM break","13:45","14:15"),{par:["Focus Session 3","Thu"],st:"14:15",en:"15:30"},{post:"Thu",n:3,st:"15:30",en:"17:30"}],
  Fri:[M("Speaker's breakfast","06:30","07:45"),M("Opening words","08:00","08:10"),SS("Advances in Understanding 4"),M("AM break","09:30","10:00"),SS("Avalanche Risk Management 7"),M("Lunch","11:20","13:00"),SS("Avalanche Risk Management 8"),M("PM break","14:15","14:45"),{par:["Focus Session 4","Fri"],st:"14:45",en:"16:00"},{post:"Fri",n:4,st:"16:00",en:"18:00"}]
};
// session membership lookup for talks
const TALK = {};
S.forEach(s=>s.talks.forEach((id,i)=>TALK[id]={s,i}));

/* ---------- storage ---------- */
const KEY="issw26.favs";
let favs=new Set();
try{const v=localStorage.getItem(KEY); if(v) favs=new Set(JSON.parse(v));}catch(e){}
function saveFavs(){try{localStorage.setItem(KEY,JSON.stringify([...favs]))}catch(e){} updateCount();}
function toggleFav(id){favs.has(id)?favs.delete(id):favs.add(id);saveFavs();return favs.has(id)}
function updateCount(){const c=document.getElementById("favcount");c.textContent=favs.size;c.classList.toggle("hidden",!favs.size)}

/* ---------- time in Whistler ---------- */
function whistlerNow(){
  try{
    const f=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Vancouver",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
    const p=Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
    return {date:`${p.year}-${p.month}-${p.day}`,hm:`${p.hour==="24"?"00":p.hour}:${p.minute}`};
  }catch(e){return {date:"",hm:""}}
}
function todayKey(){const n=whistlerNow();return Object.keys(ISO).find(k=>ISO[k]===n.date)||null}
function isNow(day,st,en){const n=whistlerNow();return ISO[day]===n.date&&n.hm>=st&&n.hm<en}

/* ---------- helpers ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.8l2.5 5.1 5.6.8-4 3.9 1 5.6-5.1-2.7-5 2.7 1-5.6-4.1-3.9 5.6-.8z"/></svg>';
const ICON_SEARCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20" stroke-linecap="round"/></svg>';
const ICON_MAIL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4 7l8 6 8-6"/></svg>';
const ICON_DOC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4M9.5 12h6M9.5 15.5h6"/></svg>';
const ICON_COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5.5A1.5 1.5 0 0014.5 4h-9A1.5 1.5 0 004 5.5v9A1.5 1.5 0 005.5 16H8"/></svg>';
function starBtn(id,label){return `<button class="star" data-star="${id}" aria-pressed="${favs.has(id)}" aria-label="${favs.has(id)?"Remove from":"Add to"} my plan: ${esc(label)}">${STAR}</button>`}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1600)}
function dayLabel(k){return (DAYS.find(d=>d.k===k)||{}).lab||k}
function whereText(it){
  if(it.ty==="O"){const t=TALK[it.id]; if(!t) return "Oral presentation"; return `${dayLabel(t.s.day)} · ${t.s.st}–${t.s.en} · ${t.s.code}, talk ${t.i+1} of ${t.s.talks.length}`}
  const pd=PLAN[it.day]&&PLAN[it.day].find(x=>x.post);
  return `Poster ${it.id} · featured ${dayLabel(it.day)}${pd?` · poster session ${pd.st}–${pd.en}`:""} · ${it.th||""}`;
}
function firstName(n){return (n||"").split(/\s+/)[0]||"there"}
function mailHref(to,it,name){
  const kind=it.ty==="O"?"talk":"poster";
  const subj=`ISSW 2026: ${it.t}`;
  const body=`Hi ${firstName(name)},\n\nI saw your ISSW 2026 ${kind}, "${it.t}", and wanted to follow up.\n\n\n`;
  return `mailto:${encodeURIComponent(to||"")}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
}
function searchHref(a){return "https://www.google.com/search?q="+encodeURIComponent(`"${a.n}" ${a.aff?a.aff:"avalanche snow"}`)}
function paperHref(it){return it.r?`https://arc.lib.montana.edu/snow-science/item.php?id=${it.r}`:PROCEEDINGS}

/* ---------- views ---------- */
function talkRow(id,idx){
  const it=I[id];
  return `<li class="row"><button class="open" data-open="${id}"><span class="num">${idx!=null?String(idx+1).padStart(2,"0"):it.id}</span><span><span class="who">${esc(it.pr)}</span><span class="what">${esc(it.t)}</span></span></button>${starBtn(id,it.t)}</li>`;
}
function sessionCard(s,day){
  const now=isNow(day,s.st,s.en);
  return `<article class="card${now?" now":""}"><div class="chead"><div class="kicker">${esc(s.code)}${now?'<span class="nowtag">Now</span>':""}</div><h3 class="ctitle">${esc(s.t)}</h3><div class="meta">${s.st}–${s.en} · Moderator ${esc(s.mod)}</div></div><ul class="talks">${s.talks.map((id,i)=>talkRow(id,i)).join("")}</ul></article>`;
}
function panelCard(p,st,en,day){
  const now=isNow(day,st,en);
  return `<article class="card${now?" now":""}"><div class="chead panel"><div class="kicker">${p.code} · runs alongside the focus session${now?'<span class="nowtag">Now</span>':""}</div><h3 class="ctitle">${esc(p.t)}</h3><div class="meta">${st}–${en} · Moderator ${esc(p.mod)}</div></div><div class="note">Panel discussion. No abstracts are listed for panels in the program book.</div></article>`;
}
function viewSchedule(day){
  let html=dayBar("s",day);
  html+=`<main class="wrap">`;
  if(day==="Sun"){html+=`<div class="dayoff"><h2>Welcome and icebreaker</h2><p>Sunday evening. No technical sessions.</p></div>`}
  else if(day==="Wed"){html+=`<div class="dayoff"><h2>Public day, field trips, and get outside day</h2><p>No technical sessions on Wednesday.</p></div>`}
  else{
    for(const b of PLAN[day]){
      if(b.m){html+=`<div class="slot minor"><div class="time">${b.st}</div><div class="minor-card">${esc(b.t)} · ${b.st}–${b.en}${isNow(day,b.st,b.en)?'<span class="nowtag">Now</span>':""}</div></div>`;continue}
      html+=`<section class="slot"><div class="time">${b.st}<small>${b.en}</small></div><div>`;
      if(b.s) html+=sessionCard(b.s,day);
      else if(b.par){const fs=byCode(b.par[0]);html+=`<div class="cols two">${sessionCard(fs,day)}${panelCard(PANELS[day],b.st,b.en,day)}</div>`}
      else if(b.post){const now=isNow(day,b.st,b.en);const n=DATA.posters.filter(id=>I[id].day===day).length;html+=`<article class="card${now?" now":""}"><div class="chead posters"><div class="kicker">Poster session ${b.n} and happy hour${now?'<span class="nowtag">Now</span>':""}</div><h3 class="ctitle">${n} featured posters</h3><div class="meta">${b.st}–${b.en} · all posters stay up all week</div></div><a class="linkbtn" href="#/p/${day}">See ${day} posters</a></article>`}
      html+=`</div></section>`;
    }
  }
  html+=`</main>`;
  return html;
}
function dayBar(kind,cur){
  const list=kind==="p"?DAYS.filter(d=>POSTER_DAYS.includes(d.k)):DAYS;
  const tk=todayKey();
  return `<header class="top"><div class="wrap"><div class="brand"><h1>${kind==="p"?"Posters":"Schedule"}</h1><span class="sub">ISSW 2026 · Whistler</span></div><div class="days" role="group" aria-label="Day">${list.map(d=>`<a class="day" href="#/${kind}/${d.k}" aria-pressed="${d.k===cur}"><b>${d.k}${d.k===tk?'<span class="dot" title="Today"></span>':""}</b><span>${d.d}</span></a>`).join("")}</div></div></header>`;
}
let posterTheme={};
function viewPosters(day){
  const ids=DATA.posters.filter(id=>I[id].day===day).sort((a,b)=>+a-+b);
  const themes=[...new Set(DATA.posters.filter(id=>I[id].day===day).map(id=>I[id].th))];
  const sel=posterTheme[day]||"";
  let html=dayBar("p",day)+`<main class="wrap"><p class="intro">${ids.length} featured posters on ${dayLabel(day)}. Posters stay up all week.</p><div class="chips" role="group" aria-label="Theme"><button class="chip" data-theme="" aria-pressed="${!sel}">All themes</button>${themes.map(t=>`<button class="chip" data-theme="${esc(t)}" aria-pressed="${sel===t}">${esc(t)}</button>`).join("")}</div>`;
  for(const th of themes){
    if(sel&&sel!==th) continue;
    const g=ids.filter(id=>I[id].th===th);
    html+=`<h2 class="theme">${esc(th)}<span>${g.length}</span></h2><div class="card"><ul class="talks" style="border-top:0">${g.map(id=>talkRow(id,null)).join("")}</ul></div>`;
  }
  return html+`</main>`;
}
function planItems(){
  const out={};
  for(const id of favs){const it=I[id];if(!it)continue;
    if(it.ty==="O"){const t=TALK[id];if(!t)continue;(out[t.s.day]=out[t.s.day]||{o:[],p:[]}).o.push({id,key:t.s.st+String(t.i).padStart(2,"0")})}
    else{(out[it.day]=out[it.day]||{o:[],p:[]}).p.push({id,key:it.id.padStart(4,"0")})}}
  return out;
}
function viewPlan(){
  const P=planItems();
  let html=`<header class="top"><div class="wrap"><div class="brand"><h1>My plan</h1><span class="sub">${favs.size} starred</span></div></div></header><main class="wrap">`;
  if(!favs.size){html+=`<div class="empty"><b>Nothing starred yet.</b><br>Tap the star next to any talk or poster, in the schedule or on its abstract, and it shows up here in time order.</div></main>`;return html}
  html+=`<div class="actions"><a class="btn primary" href="${planMail()}" target="_blank" rel="noopener">${ICON_MAIL}Email my plan</a><button class="btn" data-copyplan>${ICON_COPY}Copy as text</button></div>`;
  for(const d of ["Mon","Tue","Thu","Fri"]){
    const g=P[d];if(!g)continue;
    html+=`<h2 class="planday">${dayLabel(d)}</h2>`;
    if(g.o.length){g.o.sort((a,b)=>a.key<b.key?-1:1);
      html+=`<div class="card"><ul class="talks" style="border-top:0">${g.o.map(x=>{const t=TALK[x.id];const it=I[x.id];return `<li class="row"><button class="open" data-open="${x.id}" style="grid-template-columns:46px 1fr"><span class="num">${t.s.st}</span><span><span class="who">${esc(it.pr)}</span><span class="what">${esc(it.t)}</span><span class="meta">${esc(t.s.code)} · talk ${t.i+1}</span></span></button>${starBtn(x.id,it.t)}</li>`}).join("")}</ul></div>`}
    if(g.p.length){g.p.sort((a,b)=>a.key<b.key?-1:1);const pd=PLAN[d].find(x=>x.post);
      html+=`<h3 class="theme" style="margin-top:12px">Posters<span>${pd.st}–${pd.en}</span></h3><div class="card"><ul class="talks" style="border-top:0">${g.p.map(x=>talkRow(x.id,null)).join("")}</ul></div>`}
  }
  return html+`</main>`;
}
function planText(){
  const P=planItems();let lines=["My ISSW 2026 plan",""];
  for(const d of ["Mon","Tue","Thu","Fri"]){const g=P[d];if(!g)continue;lines.push(dayLabel(d).toUpperCase());
    g.o.sort((a,b)=>a.key<b.key?-1:1).forEach(x=>{const t=TALK[x.id];const it=I[x.id];lines.push(`  ${t.s.st} ${t.s.code}, talk ${t.i+1}: ${it.t} (${it.pr})`)});
    g.p.sort((a,b)=>a.key<b.key?-1:1).forEach(x=>{const it=I[x.id];lines.push(`  Poster ${it.id}: ${it.t} (${it.pr})`)});
    lines.push("")}
  return lines.join("\n");
}
function planMail(){return `mailto:?subject=${encodeURIComponent("My ISSW 2026 plan")}&body=${encodeURIComponent(planText())}`}
let findQ="";
function viewFind(){
  return `<header class="top"><div class="wrap"><div class="brand"><h1>Search</h1><span class="sub">${Object.keys(I).length} talks and posters</span></div></div></header><main class="wrap"><div class="searchbox"><input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Title, author, keyword, or poster number" value="${esc(findQ)}" aria-label="Search talks and posters"></div><div id="results"></div></main>`;
}
const INDEX=Object.values(I).map(it=>({id:it.id,s:(it.id+" "+it.t+" "+it.au.map(a=>a.n+" "+a.raw).join(" ")+" "+it.kw+" "+(it.th||"")).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}));
function runFind(){
  const box=document.getElementById("results");if(!box)return;
  const q=findQ.trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  if(!q){box.innerHTML=`<p class="hint">Try "surface hoar", "Haegeli", "drone", or a poster number like 302.</p>`;return}
  const terms=q.split(/\s+/);
  const hits=INDEX.filter(x=>/^\d+$/.test(q)?x.id===q:terms.every(t=>x.s.includes(t))).slice(0,80);
  if(!hits.length){box.innerHTML=`<p class="hint">No matches for "${esc(findQ)}". Check spelling, or try one distinctive word.</p>`;return}
  box.innerHTML=`<p class="hint">${hits.length===80?"First 80":hits.length} match${hits.length===1?"":"es"}</p><div class="card"><ul class="talks" style="border-top:0">${hits.map(h=>{const it=I[h.id];const w=it.ty==="O"?`${TALK[h.id]?TALK[h.id].s.day+" "+TALK[h.id].s.st:"Talk"}`:`${it.day} poster ${it.id}`;return `<li class="row"><button class="open" data-open="${h.id}" style="grid-template-columns:1fr"><span><span class="meta"><span class="badge ${it.ty}">${it.ty==="O"?"TALK":"POSTER"}</span>${esc(w)}</span><span class="who">${esc(it.pr)}</span><span class="what">${esc(it.t)}</span></span></button>${starBtn(h.id,it.t)}</li>`}).join("")}</ul></div>`;
}
function viewItem(id){
  const it=I[id];if(!it) return `<main class="wrap"><div class="empty">That item isn't in the program. <a href="#/s">Back to the schedule</a></div></main>`;
  const backLabel=lastList.startsWith("#/p")?"Posters":lastList.startsWith("#/plan")?"My plan":lastList.startsWith("#/find")?"Search":"Schedule";
  const pres=it.au.find(a=>a.n===it.pr)||it.au.find(a=>a.p)||it.au[0]||{n:it.pr};
  const known=it.em&&it.em[0];
  return `<div class="detail"><div class="dbar"><button class="back" data-back>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>${backLabel}</button>
  <button class="dstar" data-star="${id}" aria-pressed="${favs.has(id)}">${STAR}<span>${favs.has(id)?"In my plan":"Add to plan"}</span></button></div>
  <article class="dbody">
   <div class="where ${it.ty}">${esc(whereText(it))}</div>
   <h2 class="dtitle">${esc(it.t)}</h2>
   <div class="presenter"><span class="meta">Presenter</span><span class="pname">${esc(it.pr)}</span></div>
   <div class="actions">
     <a class="btn primary" href="${mailHref(known,it,pres.n)}" target="_blank" rel="noopener">${ICON_MAIL}${known?"Email presenter":"Draft email"}</a>
     <a class="btn" href="${searchHref(pres)}" target="_blank" rel="noopener">${ICON_SEARCH}Find contact</a>
     <a class="btn" href="${paperHref(it)}" target="_blank" rel="noopener">${ICON_DOC}${it.r?"Full paper":"Proceedings"}</a>
   </div>
   ${known?"":`<p class="meta" style="margin:2px 0 0">The program book has no email address for this presenter. Draft email opens your mail app with the subject and greeting filled in; add their address after you find it.</p>`}
   <h3 class="sect">Abstract</h3>
   <div class="abstract">${it.ab.map(p=>`<p>${esc(p)}</p>`).join("")||'<p class="meta">No abstract text in the program book.</p>'}</div>
   ${it.kw?`<p class="kw"><b>Keywords</b> ${esc(it.kw)}</p>`:""}
   <h3 class="sect">Authors</h3>
   <ul class="authors">${it.au.map(a=>{const em=(it.em||[]).find(e=>a.n.split(" ").some(w=>w.length>2&&e.toLowerCase().includes(w.toLowerCase())));return `<li><span class="an"><b>${esc(a.n)}</b>${a.n===it.pr?" · presenting":(a.p?" · corresponding":"")}${a.aff?`<small>${esc(a.aff)}</small>`:""}${em?`<small>${esc(em)}</small>`:""}</span><a class="ib" href="${searchHref(a)}" target="_blank" rel="noopener" aria-label="Search the web for ${esc(a.n)}">${ICON_SEARCH}</a><a class="ib" href="${mailHref(em,it,a.n)}" target="_blank" rel="noopener" aria-label="${em?"Email":"Draft an email to"} ${esc(a.n)}">${ICON_MAIL}</a></li>`}).join("")}</ul>
   <button class="btn" style="margin-top:10px" data-copymsg="${id}">${ICON_COPY}Copy email text</button>
   <p class="foot">From the ISSW 2026 Technical Program Book, abstract page ${it.pp}. ${it.r?"Full paper link goes to the Montana State University ISSW proceedings archive.":"No matching paper was found in the part of the proceedings archive checked; the Proceedings button opens the full 2026 list."}</p>
  </article></div>`;
}

/* ---------- router ---------- */
const app=document.getElementById("app");
let lastList="#/s", scrollMem={}, internalNav=false, curRoute="";
function defaultDay(kind){const t=todayKey();if(kind==="p")return POSTER_DAYS.includes(t)?t:"Mon";return t||"Mon"}
function render(){
  const h=location.hash||"#/s";
  if(curRoute && !curRoute.startsWith("#/i/")) scrollMem[curRoute]=window.scrollY;
  const parts=h.slice(2).split("/");
  let html="",tab="s";
  if(parts[0]==="i"){html=viewItem(decodeURIComponent(parts[1]||""));tab=null}
  else if(parts[0]==="p"){const d=POSTER_DAYS.includes(parts[1])?parts[1]:defaultDay("p");if(parts[1]!==d){history.replaceState(null,"","#/p/"+d)}html=viewPosters(d);tab="p"}
  else if(parts[0]==="plan"){html=viewPlan();tab="plan"}
  else if(parts[0]==="find"){html=viewFind();tab="find"}
  else{const d=DAYS.some(x=>x.k===parts[1])?parts[1]:defaultDay("s");if(parts[1]!==d){history.replaceState(null,"","#/s/"+d)}html=viewSchedule(d);tab="s"}
  const route=location.hash;
  app.innerHTML=html;
  document.querySelectorAll(".nav a").forEach(a=>a.setAttribute("aria-current",a.dataset.tab===tab?"page":"false"));
  if(tab){lastList=route; internalNav=false;}
  curRoute=route;
  if(tab==="find"){const q=document.getElementById("q");runFind();q.addEventListener("input",()=>{findQ=q.value;runFind()});if(!findQ)q.focus({preventScroll:true})}
  const y=tab?scrollMem[route]:0;
  requestAnimationFrame(()=>window.scrollTo(0,y||0));
}
window.addEventListener("hashchange",render);

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const st=e.target.closest("[data-star]");
  if(st){e.preventDefault();const id=st.dataset.star;const on=toggleFav(id);
    document.querySelectorAll(`[data-star="${CSS.escape(id)}"]`).forEach(b=>{b.setAttribute("aria-pressed",on);const sp=b.querySelector("span");if(sp)sp.textContent=on?"In my plan":"Add to plan"});
    toast(on?"Added to my plan":"Removed from my plan");
    if((location.hash||"").startsWith("#/plan")&&!on) render();
    return}
  const op=e.target.closest("[data-open]");
  if(op){internalNav=true;location.hash="#/i/"+op.dataset.open;return}
  if(e.target.closest("[data-back]")){if(internalNav){internalNav=false;history.back()}else location.hash=lastList;return}
  const th=e.target.closest("[data-theme]");
  if(th){const d=(location.hash.split("/")[2])||"Mon";posterTheme[d]=th.dataset.theme;const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(e.target.closest("[data-copyplan]")){copy(planText(),"Plan copied");return}
  const cm=e.target.closest("[data-copymsg]");
  if(cm){const it=I[cm.dataset.copymsg];copy(`Subject: ISSW 2026: ${it.t}\n\nHi ${firstName(it.pr)},\n\nI saw your ISSW 2026 ${it.ty==="O"?"talk":"poster"}, "${it.t}", and wanted to follow up.\n`,"Email text copied");return}
});
function copy(text,msg){
  const done=()=>toast(msg);
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,()=>fallback())}else fallback();
  function fallback(){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){toast("Copy isn't available here")}ta.remove()}
}
updateCount();render();
setInterval(()=>{if(!(location.hash||"").startsWith("#/i/")&&!(location.hash||"").startsWith("#/find")){const y=window.scrollY;render();window.scrollTo(0,y)}},120000);
</script>
