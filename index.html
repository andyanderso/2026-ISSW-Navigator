rture radar (SAR) can repeatedly map avalanche debris over large areas, opening up new opportunities for data-driven approaches for avalanche forecasting. In this study, we take a first step in this direction. We constructed two large datasets for five winters with two operational Sentinel-1 satellites and a typical six-day repeat interval. First, we mapped avalanche debris in Sentinel-1 images across Norway and parts of Sweden. Secondly, we ran the SNOWPACK model forced by numerical weather predictions on a 20×20 km grid, at different elevations and predefined slope angles. A transformer was then trained to use five days of SNOWPACK outputs to predict activity mapped by SAR for the following day. We represented activity with the SAR-detected Avalanche Activity Index (SAR-AAI), a study-specific index that gives larger debris more weight, spreads detections across possible occurrence dates and normalises by modelled runout area. We trained the transformer on four winters and evaluated it on one. Regional mean predicted and reference SAR-AAI had a Pearson correlation of 0.803 when averaged over complete six-day periods, with each value placed at the midpoint of its period. The model followed broad changes in time and space, but produced smoother predictions and underestimated the strongest activity. At the 20 km cell scale, agreement after the same six-day averaging was weaker (r = 0.549). The result is based on a single training run of the machine-learning model and has not been tested on an untouched winter. The SAR dataset is incomplete and contains detection errors and uncertain timing. Thus, the results do not yet show operational forecast skill. Still, predictions based on regional SNOWPACK simulations followed broad changes mapped by Sentinel-1. This is a promising first step towards using SAR avalanche detections with snowpack modelling for avalanche forecasting."],"kw":"avalanche activity; synthetic aperture radar; SNOWPACK; deep learning; remote sensing","ty":"P","pp":266,"em":[],"r":3597,"day":"Tue","th":"Avalanche Forecasting","pr":"Jakob Grahn"},"300":{"id":"300","t":"Integrating Meteorological Uncertainty into Operational Snowpack and Avalanche Hazard Modelling: Initial Explorations in Ensemble Forecasting","au":[{"n":"Jacopo Borsotti","raw":"Borsotti, Jacopo","p":true,"aff":""},{"n":"Martin Metzger","raw":"Metzger, Martin","p":false,"aff":""},{"n":"Pascal Haegeli","raw":"Haegeli, Pascal","p":false,"aff":""},{"n":"Simon Horton","raw":"Horton, Simon","p":false,"aff":""},{"n":"Martin Perfler","raw":"Perfler, Martin","p":false,"aff":""},{"n":"Florian Herla","raw":"Herla, Florian","p":false,"aff":""},{"n":"Fabiano Monti","raw":"Monti, Fabiano","p":false,"aff":""}],"ab":["Snowpack modelling has established itself as a valuable additional source of information for avalanche forecasting. However, translating uncertainty in meteorological inputs into tangible outputs for practitioners remains a challenge. In most operational uses, the required input data is taken from one weather forecast model run (e.g., the HRDPS model in Canada), and the simulations are run in a deterministic mode, producing a single snowpack realization that does not reflect the range of possible snowpack conditions arising from uncertainty in meteorological forcing. Ensemble approaches represent a promising way to address this limitation, as they involve running the model multiple times with slightly perturbed meteorological inputs to explore the range of possible snowpack conditions. While ensemble modelling is widely used in weather forecasting, its application to avalanche forecasting remains limited, in part because the simulations produce immense datasets that are difficult to interpret for operational use. In this pilot study, we explore the use of ensemble approaches for operational avalanche forecasting by examining the effects of perturbations in temperature and precipitation on simulated snowpack stratigraphy and stability. We focus on the 2021/22 winter season at three locations across Canada, where we identify situations involving weak layers to investigate the effects of such perturbations. Our results indicate that even small perturbations can substantially influence the formation and evolution of weak layers, leading in some cases to a wide spread of possible effects that persist throughout the season, while in others their impact remains limited, resulting in more consistent outcomes. Overall, this study highlights how accounting for meteorological input uncertainty can enhance both the interpretation and operational use of snowpack simulations, supporting more robust avalanche forecasting practices. Our approach allows us to estimate uncertainty margins in snowpack stability forecasts, providing an explicit quantification of forecast uncertainty. Moreover, ensemble modeling opens the door to best-member selection strategies, whereby multiple simulations with perturbed meteorological forcing are used to identify the scenario that best aligns with field observations."],"kw":"snowpack modelling; meteorological uncertainty; ensemble modelling; snow stratigraphy; skier triggering","ty":"O","pp":267,"em":[],"r":3412,"pr":"Jacopo Borsotti"},"302":{"id":"302","t":"How Backcountry Skiers Translate Avalanche Bulletins into Decisions: A Season – Long Study in the Sondrio Province (Italy), Winter 2024/25","au":[{"n":"Jacopo Borsotti","raw":"Borsotti, Jacopo","p":true,"aff":""},{"n":"Alberto Mariani","raw":"Mariani, Alberto","p":false,"aff":""},{"n":"Martin Metzger","raw":"Metzger, Martin","p":false,"aff":""},{"n":"Giacomo Villa","raw":"Villa, Giacomo","p":false,"aff":""},{"n":"Luca Dellarole","raw":"Dellarole, Luca","p":false,"aff":""},{"n":"Davide Spini","raw":"Spini, Davide","p":false,"aff":""},{"n":"Federico Martinelli","raw":"Martinelli, Federico","p":false,"aff":""},{"n":"Giulia Geronimi","raw":"Geronimi, Giulia","p":false,"aff":""},{"n":"Fabiano Monti","raw":"Monti, Fabiano","p":false,"aff":""}],"ab":["Public avalanche forecasts are published daily by avalanche warning services to communicate avalanche hazard to the public for a particular area. They typically include the danger level, the prominent avalanche problems, and an overview of current snowpack conditions. Despite the extensive research on avalanche forecasting, one area that has not received attention so far is how individuals’ behavior and perception of avalanche hazard evolve over the course of an entire winter season. In this pilot study, we present the results of daily surveys conducted in the Sondrio province (Italy) throughout the 2024/25 winter season with approximately 40 backcountry skiers of different experience levels: mountain guides and/or members of the mountain rescue, expert skiers, and occasional recreationists. Each evening, after reading the public avalanche forecast for the following day, participants completed a questionnaire on their intended skiing plans and their opinion on the overall ski conditions. This repeated design allowed us to capture how public avalanche forecast information was processed and translated into planned travel behavior under real-world conditions. In particular, it allowed us to identify differences across experience levels and to examine how intended behavior changed as environmental conditions varied. In addition, we conducted a complementary one-time survey across Italy to collect broader information on backcountry skiers, which we used to place the seasonal analysis in a wider context and to examine how these stated preferences translate into actual day-to-day decision-making. By spanning an entire winter season rather than focusing only on isolated events or individuals’ knowledge, this work complements existing literature and offers a wider perspective on how public avalanche forecasts are used in practice. The results contribute to a better understanding of the link between traditional avalanche communication and backcountry decision-making, with potential implications for the design of more effective and user-oriented public avalanche forecasts."],"kw":"avalanche safety; hazard communication; winter backcountry recreation; avalanche danger; avalanche bulletin","ty":"P","pp":268,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"Jacopo Borsotti"},"303":{"id":"303","t":"From the Chic-Chocs to the Sea-to-Sky Corridor: Backcountry User Preparedness","au":[{"n":"Élodie Brousseau-Gaumond","raw":"Brousseau-Gaumond, Élodie","p":false,"aff":""}],"ab":["Backcountry ski touring and splitboarding participation continues to grow across North America, raising the question of how preparedness is expressed among current backcountry users. This paper characterises avalanche safety preparedness among self-guided backcountry groups using two Canadian field datasets: a 2017–18 baseline from the Chic-Chocs (Parc national de la Gaspésie, Québec; 78 groups, 250 individuals) and a 2025–26 study in the Sea-to- Sky corridor (British Columbia; 48 groups, 133 individuals). Trailhead intercept interviews recorded avalanche safety equipment, formal avalanche training, rescue-step knowledge, terrain selection, and comprehension of the day’s public avalanche bulletin, including danger rating and avalanche problem identification. In the Sea-to-Sky sample, 97.9% of groups were fully equipped and 100% had at least one formally trained member. Rescue-step knowledge was also high, with 89.6% of Sea-to-Sky groups naming five or more companion-rescue steps. Despite this, when group leaders were asked to state the day’s official danger rating and avalanche problem(s), only 71.4% matched the Avalanche Canada danger rating exactly and 65.3% correctly identified the forecast avalanche problem. These findings suggest that, in a population where equipment, formal training, and rescue knowledge are widespread, an important dimension of preparedness may lie beyond access to gear and training, in the accurate comprehension and interpretation of avalanche bulletin information in the field."],"kw":"backcountry recreation, avalanche safety, preparedness, avalanche bulletin comprehension, human factors, Sea-to-Sky corridor","ty":"P","pp":269,"em":[],"r":3528,"day":"Mon","th":"Avalanche Education","pr":"Élodie Brousseau-Gaumond"},"304":{"id":"304","t":"Applying Automated Avalanche Terrain Mapping to Wildlife Ecology: A Case Study of Dall's Sheep in Southcentral Alaska","au":[{"n":"Heather K. Thamm","raw":"Thamm, Heather K.","p":true,"aff":""},{"n":"John Sykes","raw":"Sykes, John","p":false,"aff":""},{"n":"Nicholas L. Fowler","raw":"Fowler, Nicholas L.","p":false,"aff":""},{"n":"Thomas D. Lohuis","raw":"Lohuis, Thomas D.","p":false,"aff":""},{"n":"Kyle R. Smith","raw":"Smith, Kyle R.","p":false,"aff":""},{"n":"Erich H. Peitzsch","raw":"Peitzsch, Erich H.","p":false,"aff":""},{"n":"Todd J. Brinkman","raw":"Brinkman, Todd J.","p":false,"aff":""},{"n":"Ophélie H. Couriot","raw":"Couriot, Ophélie H.","p":false,"aff":""}],"ab":["Avalanche hazard has been studied extensively in the context of human risk, but its role in alpine wildlife ecology remains poorly understood. Long-term telemetry studies have revealed that avalanches are an important source of mortality for some mountain ungulates. Investigating the processes underlying these events is challenging because avalanche activity and snowpack conditions are rarely monitored across the spatial and temporal extent of wildlife studies. Recent advances in automated avalanche terrain mapping provide a new opportunity to address this knowledge gap by quantifying wildlife exposure to modeled avalanche terrain across large landscapes. We demonstrate this application using Dall’s sheep (Ovis dalli dalli) in southcentral Alaska, where a 12-year study identified avalanches as the leading known cause of adult mortality. We used GPS locations from 134 adult Dall’s sheep (385 sheep-years) collected between 2012 and 2024 across Chugach State Park and the Talkeetna Mountains, Alaska, USA. We characterized seasonal patterns of terrain exposure using the Automated Avalanche Terrain Exposure Scale and complementary metrics representing potential release areas, runout terrain, slope, and aspect. Guided by previous studies of Dall’s sheep habitat selection, we developed a priori ecological expectations for seasonal exposure and used descriptive summaries of GPS locations to examine patterns of sheep use. Sheep locations occurred almost exclusively within avalanche terrain throughout the year, with Complex terrain accounting for 61–67% of locations across seasons. Winter and spring locations occurred on slightly steeper slopes while simultaneously having lower potential release area values and lower-value runout terrain than summer and autumn locations. Use of south-facing terrain increased from 64% of locations in summer to 70% in autumn and winter and 83% in spring—coinciding with the highest seasonal concentration of avalanche mortality. These descriptive patterns illustrate how complementary avalanche-terrain metrics can reveal patterns of wildlife exposure that would not be apparent from slope angle and aspect alone. Integrating automated avalanche terrain mapping with wildlife telemetry provides a new approach for identifying patterns of terrain exposure to guide further investigation into factors influencing wildlife avalanche risk."],"kw":"Alaska, avalanches, avalanche terrain, Dall’s sheep, hazard mapping, mountain ungulates","ty":"P","pp":270,"em":[],"r":null,"day":"Fri","th":"Terrain","pr":"Heather K. Thamm"},"305":{"id":"305","t":"The Effect of Geometry on the Gas Dynamics in Avalanche Control Gas Exploders","au":[{"n":"Kevin Cheevers","raw":"Cheevers, Kevin","p":false,"aff":""},{"n":"Logan Maley","raw":"Maley, Logan","p":false,"aff":""},{"n":"Elizabeth Ramey","raw":"Ramey, Elizabeth","p":false,"aff":""},{"n":"Matei Radulescu","raw":"Radulescu, Matei","p":true,"aff":""}],"ab":["The avalanche control industry is shifting towards the Remote Avalanche Control Systems (RACS) to protect both public and private infrastructure such as ski areas and transportation corridors. Though these systems originally employed condensed phase (solid) explosives, over recent decades, detonation tubes, also known as gas exploders in the snow community, have become increasingly popular. Currently, the bulk of the research into RACS has been conducted for solid point-source explosives. The growing popularity and prevalence of gas exploders in the field have led to an increase into gas RACS research. From experimental and field pressure measurements on the snowpack, it has been shown that spherical expansion of solid point-source explosions develop different pressure profiles compared to the directional blast waves of gas exploders. There remains a lack of clarity regarding the gas dynamics leading to the observed pressure waves above the snowpack. In this study, we characterize the dynamics of the shock wave driven by a gas exploder through state-ofthe-art numerical simulations and provide a closed form analytical solution that identifies the relevant parameters and scaling laws. The model developed was found in excellent agreement with simulations. The dynamics of the air blast wave established by the detonation tube is shown to consist primarily in a layer of compressed air, driven by the momentum transfer from the combustion products exiting the tube and the slowing down effect of air accumulation in the geometrically growing layer. Calculations of reflection of the compressed air layer with a reflective surface clarifies the momentum transfer mechanism involving the re-direction of momentum as the jet impacts the ground and gets re-directed."],"kw":"Remote Avalanche Control Systems, Gas Dynamics, Shock Dynamics, CFD","ty":"P","pp":271,"em":[],"r":3529,"day":"Mon","th":"Avalanche Dynamics","pr":"Matei Radulescu"},"307":{"id":"307","t":"Canadian Avalanche Fatalities – an Age Demographic Trend Analysis","au":[{"n":"Zoe Cohen","raw":"Cohen, Zoe","p":true,"aff":""},{"n":"Pascal Haegeli","raw":"Haegeli, Pascal","p":false,"aff":""},{"n":"Patrick Mair","raw":"Mair, Patrick","p":false,"aff":""}],"ab":["Across the world avalanche services report around 140 fatalities on average each winter, mainly involving backcountry recreationists. These events deeply impact local mountain communities. Examining patterns in accident data can provide valuable insights into trends in fatal accidents and highlight challenges that need to be addressed with future avalanche safety initiatives. Avalanche Canada recently consolidated the available information about all known fatal avalanche accidents in Canada into a new database which can be accessed at https://incidents.avalanche.ca/. This searchable public database documents 1,077 fatalities from 577 accidents dating back to 1782. In this study, we examine trends in avalanche fatality age demographics over the past 42 seasons. We used quantile regression modelling to gain more insight into trends across the entire age distribution. We conducted this analysis across the entire dataset as well as for the main user-activity groups: backcountry skiing/snowboarding, snowmobiling, and mechanized skiing/snowboarding. We observe that for the overall dataset the age of avalanche fatality victims is getting older, but there are distinct trends in the age distributions of each activity. Snowmobiler fatalities are getting older and the age range is widening; backcountry skier and snowboarder fatalities are getting older at the median, but the oldest fatalities are getting younger; and mechanized skier and snowboarder fatalities are getting older with the greatest increase occurring among younger fatalities. This clearly highlights that avalanche fatality age demographics are changing in Canada. While the current lack of participation data prevents us from providing insights into fatality rates for different age groups, our results provide a comprehensive baseline to compare with in the future and can help to inform future awareness initiatives and safety services that aim to target specific at-risk groups."],"kw":"Fatalities, accidents, trends, demographics.","ty":"P","pp":272,"em":[],"r":null,"day":"Fri","th":"Incidents and Case Studies","pr":"Zoe Cohen"},"309":{"id":"309","t":"How Does Grid Configuration Influence Snowpack Representation? Exploring Spatial Sampling Strategies for Distributed SNOWPACK Modeling","au":[{"n":"Martin Perfler","raw":"Perfler, Martin","p":true,"aff":""},{"n":"Simon Horton","raw":"Horton, Simon","p":false,"aff":""},{"n":"Florian Herla","raw":"Herla, Florian","p":false,"aff":""},{"n":"Michael Binder","raw":"Binder, Michael","p":false,"aff":""},{"n":"Pascal Haegeli","raw":"Haegeli, Pascal","p":false,"aff":""}],"ab":["Avalanche forecasting at the regional scale requires translating spatially heterogeneous snowpack conditions into coherent hazard assessments. Distributed snowpack simulations driven by numerical weather prediction models offer spatially continuous snow and hazard information, but how this information is sampled and aggregated remains a key methodological challenge. Avalanche warning services have adopted different strategies, ranging from semidistributed approaches to fully distributed, high-resolution simulations. However, how these choices affect the information retained for regional hazard assessment remains unclear. This study explores how different levels of spatial aggregation affect the information represented by distributed SNOWPACK simulations. Simulations are conducted across four operational avalanche forecasting regions in western Canada representing maritime, transitional, and continental snow climates: Whistler Blackcomb and Whistler Heliskiing, Glacier National Park, Mike Wiegele Heliskiing, and Banff National Park. Three configurations of HRDPS forcing (2.5 km resolution) are compared: (i) a fully distributed configuration retaining all HRDPS grid points, (ii) a semidistributed configuration aggregating forcing within 15-km hexagons and elevation bands, and (iii) a single-point configuration representing each operation by one aggregated forcing series per elevation band. We compare 24-h new snow amounts (HN24) over the 2025/26 winter season and snowpack stability characteristics derived using QMAH and AvaPro during a selected late-December storm event. The aggregated configurations generally captured typical HN24 conditions and spatially coherent loading events but represented a narrower range of spatial variability. Information retained varied between operations and elevation bands, with local precipitation extremes increasingly lost through aggregation. During the stability case study, both aggregated configurations captured the dominant instability signal during widespread loading and followed the general stabilization trend. Differences became most relevant during stabilization, when aggregated configurations progressively lost the unstable tail of the full-grid distribution representing spatially localized instability. The results highlight the trade-off between computational demand and retained spatial information. The 15-km semi-distributed configuration provides a promising compromise, retaining spatial information beyond a single representative profile while substantially reducing computational demand compared with the fully distributed configuration. However, the appropriate sampling density depends on the spatial variability of the operational domain and the information required for operational hazard assessment."],"kw":"Distributed Snowpack modeling, Grid Configuration, Spatial Sampling, Hazard Assessment","ty":"O","pp":273,"em":[],"r":null,"pr":"Martin Perfler"},"311":{"id":"311","t":"Why SWE Matters: When High Snow Density Hides High Hazard","au":[{"n":"Sara Bogert","raw":"Bogert, Sara","p":true,"aff":""}],"ab":["Mammoth Mountain in the Sierra Nevada Range, California, USA, is characterized by extreme wind speeds and intense snowfall events that produce high-density dry snow. In an attempt to find the largest 24-hour snow event possible, I looked at 24-hour snowfall records and 24-hour snow water equivalent (SWE). This analysis showed that intense snow loading periods from Mammoth met or exceeded the SWE from several U.S. state snowfall records but had half of the snow height of those records. For these storms, forecasting approaches focused on height of new snow (HN) can underestimate hazard. Defining a SWE-based forecasting threshold for extreme loading is essential to characterize unusual hazard in this climate. Several recent severe incidents at Mammoth Mountain occurred within 36 hours of registering 4.25 inches or greater 24-hour SWE, a value close to the 4.7 to 5.71 inch SWE range from the snowfall records. Based on these findings, I propose using 4.0 inches of 24-hour SWE as a forecasting threshold at Mammoth and in similar climates to identify extreme loading that poses potential great risk to avalanche practitioners."],"kw":"24-hour SWE, heavy snowfall, extreme snow loading, snowfall records","ty":"P","pp":274,"em":[],"r":3598,"day":"Tue","th":"Avalanche Forecasting","pr":"Sara Bogert"},"312":{"id":"312","t":"From Salmonella to Snow: Applying Lessons from Public Health, Food Safety and Outbreak Investigations in Avalanche Safety Research","au":[{"n":"Kate Snedeker","raw":"Snedeker, Kate","p":false,"aff":""}],"ab":["Avalanche Safety and outbreak investigations & food safety are topics rarely considered alongside each other. However, at their core, both are focused on keeping the public safe(r) through assessing, analyzing, understanding, mitigating/controlling and communicating risk. Furthermore, whether it be avalanche or outbreak, these processes are happening in a highly complex world where practical, political, scientific, jurisdictional, economic, time pressure and communication factors shape the translation of research and knowledge into action to save lives. This study is intended to examine the commonalities between food safety/outbreak investigations & avalanche safety from the perspective of an epidemiologist & researcher with experience in the avalanche safety realm, and examine some areas where approaches from public health could benefit the examination of avalanche safety research and translation from evidence into actions. The realms of avalanche safety and outbreak investigations/food safety have a great deal in common. Whether it’s snow or bacteria & viruses, nature presents a safety threat that ranges from individual harm to wider economic effects. An avalanche that blocks a major highway harms the economy much as an outbreak that closes restaurants and hospitalizes people. Neither pathogens nor avalanches are risks we can eliminate, only mitigate. We depend on gathering knowledge through experience, analysis and research to reduce the risks, and thus the wider burden of avalanches or pathogens on society. It is how we translate that knowledge into action & how effectively we communicate that determines how effectively we can mitigate that risk. In public health (and medicine), this knowledge translation has been the subject of much research, and from that the concepts of evidence-based practice, evidence-informed practice, systematic reviews, data visualization and methods for communicating to various stakeholder groups have developed and continue to evolve. Systematic reviews in avalanche research have been published, but there is room to explore how other concepts and communications methods might be applied in the context of avalanche safety research."],"kw":"Public Health; Evidence Based Practice, Food Safety, Evidence-Informed Practice","ty":"P","pp":275,"em":[],"r":null,"day":"Thu","th":"Risk Communication","pr":"Kate Snedeker"},"313":{"id":"313","t":"Does Winter Outdoor Recreational Traffic Impact Concentrations of Microplastics in Colorado’s Snowpacks?","au":[{"n":"Belen R. Roof","raw":"Roof, Belen R.","p":true,"aff":""},{"n":"Douglas Castro","raw":"Castro, Douglas","p":false,"aff":""},{"n":"Jake Kurzweil","raw":"Kurzweil, Jake","p":false,"aff":""},{"n":"Noah P. Molotch","raw":"Molotch, Noah P.","p":false,"aff":""}],"ab":["Microplastics have become a growing concern within our natural environments and are increasingly prevalent in remote areas. This research aims to investigate how outdoor recreational traffic influences microplastic concentrations in Colorado’s snowpacks. Snow samples were analyzed from high-traffic, medium-traffic, and pristine areas. Samples were placed in glass jars with metal lids to avoid self-contamination. At some sites, multiple samples were collected, either from different parts of the snowpack or varying geographic features. Particles were separated into two size fractions using a stacked sieving method: ≥250 µm and ≥20 µm. The larger fraction was filtered and manually examined under a dissecting microscope and characterized by shape and color. The smaller fraction underwent digestion and density separation before being filtered onto PES filtration paper via vacuum filtration for visual analysis. Results indicate no statistically significant difference in microplastic concentrations across the three sample sites (Kruskal-Wallis test: p = 0.1621), suggesting that concentration may not solely relate to human traffic. These findings support the hypothesis that microplastics are transported through atmospheric deposition and less through direct human influence in alpine regions. This study addresses an urgent gap in environmental science, especially considering that Colorado's mountain snowpacks are a primary water source for the Western United States."],"kw":"Microplastics; Snowpack; Alpine environments; Recreational traffic","ty":"P","pp":276,"em":[],"r":null,"day":"Fri","th":"Snowpack Properties","pr":"Belen R. Roof"},"314":{"id":"314","t":"Mountain Risk Management Education and Training for PRO Athletes and Film Entorauge","au":[{"n":"John Buffery","raw":"Buffery, John","p":true,"aff":""}],"ab":["The objectives of the winter backcountry entertainment film industry are to capture unique moments of athletes riding in consequential terrain and to convey a heightened aspirational experience of mountain adventure for the audience. While athletes have exemplary mountain travel skills in extreme terrain, there is often a knowledge gap of avalanche hazard awareness, preventive planning and mountain rescue skills. The push for more extreme displays of skill can move athletes and their filmteams to expose themselves to risks they may not fully understand or the knowledge to manage. This oral presentation introduces an immersive education and training program that follows the International Standards Organization (ISO 31000:2018 - Risk Management, 2018) strategy of how to prioritize inputs in making good decisions and reduce epistemic risks to acceptable levels."],"kw":"Risk Maturity, ISO 31000 Risk Management, Self-Rescue, Risk Communication","ty":"O","pp":277,"em":[],"r":3436,"pr":"John Buffery"},"315":{"id":"315","t":"The Danger Zone","au":[{"n":"Steve Conger","raw":"Conger, Steve","p":true,"aff":""},{"n":"Colin Zacharias","raw":"Zacharias, Colin","p":false,"aff":""}],"ab":["Too many avalanche workers have made the decision to position themselves or coworkers, helicopters, snowcats, or vehicles, in the run out of an avalanche path when the risk is too high and avalanches have run full path. This paper introduces the initial part of our investigation to understand the context of the problem and to identify themes that may improve the safety of avalanche workers and those they are responsible for. The information for this investigation is based on a survey directed at avalanche workers in Canada and the U.S. This paper specifically looks at the following topics: a) How to uniformly describe this avalanche character. b) Is there a pattern of surprise among experienced avalanche workers regarding avalanches of this character? c) Is there useful but isolated institutional knowledge that can be shared? d) What are the next steps?"],"kw":"risk, relative size, destructive size, forecasting, professional incidents, near-miss, full- extent","ty":"O","pp":278,"em":[],"r":3431,"pr":"Steve Conger"},"317":{"id":"317","t":"A Spatial Extrapolation Approach to Snowpack Weak Layer Criticality Across Avalanche Release Areas","au":[{"n":"Frédéric Pourraz","raw":"Pourraz, Frédéric","p":true,"aff":""},{"n":"Jill Chevalier","raw":"Chevalier, Jill","p":false,"aff":""},{"n":"Alain Duclos","raw":"Duclos, Alain","p":false,"aff":""},{"n":"Gaëlle Bourgeois","raw":"Bourgeois, Gaëlle","p":false,"aff":""},{"n":"Cédric Perillat-Merceroz","raw":"Perillat-Merceroz, Cédric","p":false,"aff":""}],"ab":["Winter road serviceability in Savoie (northern French Alps) is ensured by the Natural Hazards Service of the Department in collaboration with the consulting firm ALEA. Their operational feedback has enabled the identification and geolocation of 252 avalanche release areas and flow paths likely to impact the road network. These areas are subject to continuous monitoring throughout the winter season, based on the real-time evaluation of the five criteria of the CRISTAL framework. This paper focuses specifically on the “Weak layer criticality” criterion, whose level is assessed using 2 main sources: observations of recent avalanche activity and performance of snowpack stability tests following the ROMANsns protocol, conducted several times per week all over the Savoie Department. However, this observation frequency does not allow full coverage of all 252 potential release areas. It is therefore necessary to extrapolate a criticality value for each site using data derived from spatially distant tests and/or observations. This extrapolation relies on a similarity computation incorporating various snow, meteorological, actinometric, and geospatial features. For some of these features, real-time observations and measures are insufficient; it is essential to model their temporal evolution from the beginning of the winter season. This approach makes it possible to assess whether snowpack stratigraphy across different sectors can be considered comparable. The resulting similarity is then used to estimate the “Weak layer criticality” criterion, at a given point in time, for each elevation band (at 100 m intervals) and for each aspect within the 252 studied areas. The CRISTAL method is subsequently applied to determine the required level of vigilance. The objective of this approach is not to replace human expertise with digital tools, but to enhance it. In a context of high spatial and temporal variability in snowpack stratigraphy, this tool is intended to support experts in their decision-making or to alert them to potentially hazardous situations that they might not have identified as such. Ultimately, the goal is to promote more objective decision-making regarding operational measures to be implemented on the road network of the Savoie Department"],"kw":"Spatial extrapolation; Similarities; Snowpack criticality; Decision-making.","ty":"P","pp":279,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"Frédéric Pourraz"},"319":{"id":"319","t":"Oh, the Stories We Tell … or Not: A Post-Avalanche Case Study from the Godmother Couloir","au":[{"n":"Tove I. Dahl","raw":"Dahl, Tove I.","p":false,"aff":""}],"ab":["How can we facilitate learning through the sharing of difficult experiences for the greater good of the community? This study examines stories told by three skiers caught in a fateful avalanche in the Godmother Couloir of Lyngen, Norway, where two were severely injured. In the backcountry skiing community, stories of personal avalanche experiences are critical for informing safe skiing, but they often remain untold. While avalanche courses and tools support knowledge and skill development, and official accident reports document severe incidents to inform future practice, the valuable telling of stories from personal avalanche experiences remains inconsistent. Fear of harsh judgment can discourage openness, resulting in isolation and lost learning opportunities that could enhance community safety. Situated learning theory suggests that stories are rich learning tools, though community norms shape what is shared or withheld. This is particularly important for what can be learned from disasters. Through semi-structured interviews with all three caught in the avalanche, a thematic interview reveals which stories they told, when, and to whom. Findings reveal storysharing motivations, phases and facilitators, and offers insight into the different purpose and value of possible stories told."],"kw":"Avalanche accident, Story, Storytelling, Situated Learning, Resilience, Learning","ty":"O","pp":280,"em":[],"r":3437,"pr":"Tove I. Dahl"},"320":{"id":"320","t":"Unstructured Data Processing: Asking New Questions of Avalanche Accident Reports and Other Natural Language Documents","au":[{"n":"Bhavya Chopra","raw":"Chopra, Bhavya","p":false,"aff":""},{"n":"Björn Hartmann","raw":"Hartmann, Björn","p":true,"aff":""},{"n":"Aditya Parameswaran","raw":"Parameswaran, Aditya","p":false,"aff":""},{"n":"Shreya Shankar","raw":"Shankar, Shreya","p":false,"aff":""}],"ab":["Statistical analyses are powerful tools for distilling patterns in avalanche accidents. Most such analyses rely on structured data — quantities that can be easily counted or measured — such as forecast danger ratings, burial times, or group sizes. But much of what the avalanche community records lives in unstructured text: accident narratives, crowd-sourced observation reports, and forecast discussions. Finding patterns in such sources has traditionally required manual search and review, which is time-intensive and limits the number of questions one can practically pursue. Recent advances in large language models (LLMs) have given rise to unstructured data processing: the ability to query and transform large collections of text documents using natural language prompts to define the analysis operations. Rather than searching for"],"kw":"large language models, unstructured data processing, visualization, avalanche reports","ty":"P","pp":281,"em":[],"r":3530,"day":"Mon","th":"Artificial Intelligence","pr":"Björn Hartmann"},"321":{"id":"321","t":"Avalanche Control and Mountain Safety in Rogers Pass, British Columbia: A Detailed Description of Program History and Future Challenges","au":[{"n":"Andrew Jones","raw":"Jones, Andrew","p":false,"aff":""},{"n":"Danyelle Magnan","raw":"Magnan, Danyelle","p":false,"aff":""}],"ab":["Situated at the height of British Columbia’s Selkirk Mountains, Rogers Pass is among the most complex and operationally challenging transportation avalanche programs in the world. In a 43km corridor, both the TransCanada Highway (TCH) and CPKC Railway are exposed to 135 avalanche paths that receive an average of 1420cm of annual snowfall. Since the opening of the TCH in 1962, static avalanche defences and mobile artillery avalanche control have formed the basis for mitigating avalanche hazard. Artillery avalanche control is administered through a unique partnership between Parks Canada and the Canadian Armed Forces."],"kw":"","ty":"O","pp":282,"em":[],"r":null,"pr":"Andrew Jones"},"323":{"id":"323","t":"The Rain Finally Stopped: A Historic Atmospheric River Avalanche Cycle at Rogers Pass, BC (2026)","au":[{"n":"Mark Herbison","raw":"Herbison, Mark","p":true,"aff":""},{"n":"Dan Hudson","raw":"Hudson, Dan","p":false,"aff":""},{"n":"Catherine Brown","raw":"Brown, Catherine","p":false,"aff":""},{"n":"Danyelle Magnan","raw":"Magnan, Danyelle","p":false,"aff":""}],"ab":["The transportation corridor through Rogers Pass, exposed to 135 avalanche paths over 43 km of road is one of Canada’s highest snowfall regions (10–14 m annually), has the highest Avalanche Hazard Index in Canada. The risk to the Trans-Canada Highway and the Canadian Pacific Kansas City (CPKC) railway through the corridor is managed by Parks Canada, and the program employs mobile artillery-based avalanche control, delivered through a partnership with the Canadian Armed Forces. During the 2025/26 winter, several notable avalanche cycles occurred; however, an atmospheric river event from March 16–20th produced a prolonged period of elevated hazard. Prior to this event, a persistent weak layer had been the primary concern but was largely mitigated through control efforts. Over the fiveday period, approximately 200 mm of precipitation fell, characterized by rain-on-snow, resulting in widespread natural avalanche activity. This case study examines how risk was managed using road closures and avalanche control. Four avalanche control missions were conducted during the event, during which 271 artillery rounds were fired, allowing the road to reopen daily and minimizing total closure time to 65 hours. The analysis focuses on operational decisionmaking, closure durations, and strategies used to manage personnel exposure and fatigue during sustained highhazard conditions. Observed closure times and control outcomes are compared with alternative mitigation scenarios to evaluate the effectiveness of artillery-based control under extreme weather conditions. Results highlight the operational challenges associated with prolonged atmospheric river events, including increased uncertainty in hazard evolution and constraints on maintaining acceptable highway closure durations. This case study provides insight into managing infrastructure risk and workforce capacity during extended avalanche cycles in a changing climate."],"kw":"Atmospheric River, Historic Avalanche Cycle, Rogers Pass, Highway Avalanche Hazard, Artillery, Parks Canada","ty":"O","pp":283,"em":[],"r":3432,"pr":"Mark Herbison"},"324":{"id":"324","t":"Managing Risk and Access: The Winter Permit System in Rogers Pass, BC","au":[{"n":"Mark Herbison","raw":"Herbison, Mark","p":true,"aff":""},{"n":"Ross Campbell","raw":"Campbell, Ross","p":false,"aff":""}],"ab":["Parks Canada’s Winter Permit System (WPS) in Rogers Pass, within Glacier National Park, is a unique public safety program designed to facilitate winter recreation access within an area of large-scale avalanche hazard management along a major transportation corridor. Since the opening of the Rogers Pass section of the Trans-Canada Highway in 1961, all slopes adjacent to the transportation corridor through Glacier National Park are closed in winter due to the use of live explosives for the avalanche control program. The Winter Permit System was established in 1995 and since then, Rogers Pass has grown into a world-renowned destination for backcountry skiing and riding. What began as roughly 10,000 skier days a season in the early 2000s has grown to more than 25,000 skier days in recent years, reaching a record 32,000 skier days in 2024/25. The transportation corridor through Glacier National Park has the highest Avalanche Hazard Index in Canada and is primarily managed using artillery avalanche control. The WPS allows Parks Canada to open designated Winter Restricted Areas within the highway avalanche control area for winter recreation when avalanche control is not planned or anticipated, ensuring separation between the public and active avalanche control operations. This paper outlines the structure, evolution, and operational framework of the WPS, with a focus on the integration of hazard forecasting, terrain zoning, and user compliance. Based on real-time avalanche hazard assessments and operational requirements, a daily assessment determines if Winter Restricted Areas can be opened for the day to allow access to winter permit holders. To obtain their permit, users must apply and complete a quiz, ensuring awareness of closures and adherence to strict no-go zones during artillery control periods. We examine key components of the system, including communication strategies, enforcement mechanisms, and interagency coordination. The WPS mitigates risk by separating the public from active avalanche control, in an area with high visitation and extensive use of explosives, restricting public access to specific terrain during periods of elevated hazard and where active control operations are taking place. Its effectiveness depends on clear communication, consistent enforcement, and user compliance, all of which contribute to reducing exposure in a complex, highconsequence environment. Winter permit users are reminded that the avalanche control program protects the public along the Trans-Canada Highway but does not make slopes safe for backcountry travel. Lessons learned from Rogers Pass highlight the importance of clear messaging, user education, and adaptive management in complex risk landscapes. The WPS represents a globally relevant model for integrating public recreation with infrastructure protection and operational avalanche risk management."],"kw":"Rogers Pass, Parks Canada, Backcountry, Artillery, Avalanche Control, Winter Permit System, Glacier National Park","ty":"P","pp":284,"em":[],"r":null,"day":"Thu","th":"Risk Communication","pr":"Mark Herbison"},"325":{"id":"325","t":"Improving the Data Basis for the Practical Assessment of Snow Slide Impacts for Practical Avalanche Engineering and Hazard Mapping Applications in Austria","au":[{"n":"Andreas Huber","raw":"Huber, Andreas","p":true,"aff":""},{"n":"Christoph Hesselbach","raw":"Hesselbach, Christoph","p":false,"aff":""},{"n":"Felix Oesterle","raw":"Oesterle, Felix","p":false,"aff":""},{"n":"Matthias Granig","raw":"Granig, Matthias","p":false,"aff":""},{"n":"Christian Tollinger","raw":"Tollinger, Christian","p":false,"aff":""},{"n":"Jan-Thomas Fischer","raw":"Fischer, Jan-Thomas","p":false,"aff":""}],"ab":["Snow slide hazard and risk assessment is increasingly relevant in the operational work of the Austrian Service for Torrent and Avalanche Control (WLV). Estimating potential runout distances and associated impact pressures for these small-scale processes is required in a growing number of applications. While established tools for assessing fullsize avalanches exist, these approaches are often not directly applicable or practical for smaller-scale snow slide processes. Motivated by two major snow slide cycles in North and East Tyrol during the winters of 2019/20 and 2020/21, an adapted model for the numerical simulation of snow slides has been developed, implemented in the opensource framework AvaFrame (https://avaframe.org), and evaluated in accompanying studies. However, in resourceconstrained situations and day-to-day operational settings detailed numerical modeling at the slope scale is not always feasible. In these cases simplified surrogate models or ad-hoc heuristics are desirable to provide rapid preliminary assessments. Realizing this practical demand this study sought to utilize AvaFrame/com5SnowSlide to derive simplified rapid assessment tools for snow slides. We analyzed 2D profiles of 150 snow slide slopes and constructed a set of 15 representative idealized snow slide topographies on which we performed com5SnowSlide simulations with varying release thickness. The resulting model outputs were analyzed and used to derive reducedcomplexity surrogate models for practical hazard assessment. Our results indicate that release thickness and slope inclination are the dominant controls on modeled runout distances and peak impact pressures at the base of slopes prone to snow sliding. Based on these findings we derived two simplified surrogate models for a rapid assessment of the hazard potential in confirmed or suspected snow slide runout areas. Comparison between results of the surrogate models and the actual numerical model for selected case studies shows good agreement. The developed rapid assessment tools enable a quick, conservative, and practical estimation of snow slide impact pressures and runout distances using only a few input parameters. While they do not replace detailed numerical simulations or local expertise, they provide a robust initial assessment for practical applications."],"kw":"Snow slide, avalanche modeling, rapid assessment, surrogate models, avalanche engi- neering","ty":"P","pp":285,"em":[],"r":3531,"day":"Mon","th":"Planning and Engineering","pr":"Andreas Huber"},"326":{"id":"326","t":"Investigating the Relationship Between Ice Particles in Clouds and Precipitation Particles During Snowfall Events: A Case Study at Sonnblick Observatory, Austria","au":[{"n":"Veronika Krieger","raw":"Krieger, Veronika","p":true,"aff":""},{"n":"Julia Burkart","raw":"Burkart, Julia","p":false,"aff":""},{"n":"Christian Maier","raw":"Maier, Christian","p":false,"aff":""},{"n":"Thomas Bachleitner","raw":"Bachleitner, Thomas","p":false,"aff":""},{"n":"Gerhard Schauer","raw":"Schauer, Gerhard","p":false,"aff":""}],"ab":["The Sonnblick Observatory - located at 3,106 m above sea level in the Austrian Alps - provides a unique environment for studying cloud microphysics under in-situ conditions. Operated by the national meteorological service GeoSphere Austria, the observatory is equipped with a wide range of instruments, related to the atmosphere, biosphere and cryosphere. The site combines continuous environmental measurements with year-round human observations of snowfall and snowpack properties. This combination gives us the opportunity to analyze the transformation of ice crystals from their formation through to snowfall. Snow crystals exhibit a wide range of morphologies depending on temperature and supersaturation. Based on these parameters, the Nakaya diagram offers a long-established classification system of crystal shapes. However, as snow and ice are sensitive to changes in temperature, humidity, evaporation and wind, the structure of the precipitation particles is expected to evolve within the cloud, during their descent through the atmosphere, and after deposition on the snow surface. Because of this complexity, the relationship between ice crystals forming within clouds and snowflakes reaching the surface remains insufficiently understood. At Sonnblick Observatory small ice crystals (0.5-200µm) within clouds are documented using a measurement device that takes holographic images (SwisensPoleno Jupiter). Meteorological conditions at the observatory are constantly monitored by standardized instruments (WMO Standard). In addition, the shape of the fallen snowflakes is determined and classified through human observation using a snow grid card. As part of this study, an automatic image classification system was implemented and tested on the holographic images. This made it possible to analyze data across various meteorological conditions and to investigate both how these conditions influence snow crystal shape and how crystals evolve between their formation in clouds and their deposition as snow flake to the surface. Improved understanding of snow crystal evolution can further help us to better comprehend the effects on snowpack formation and its subsequent transformation."],"kw":"ice crystal formation, crystal growth, holographic imaging, Nakaya diagram, in-cloud par- ticles","ty":"P","pp":286,"em":[],"r":null,"day":"Fri","th":"Snowpack Properties","pr":"Veronika Krieger"},"328":{"id":"328","t":"Field-Based Hazard Rating (FBHR): A Decision-Making Framework for Recreationists in Data-Limited Environments","au":[{"n":"Nikki Champion","raw":"Champion, Nikki","p":true,"aff":""},{"n":"Kiira Antenucci","raw":"Antenucci, Kiira","p":false,"aff":""},{"n":"Will McKay","raw":"McKay, Will","p":false,"aff":""}],"ab":["Backcountry recreationists often travel where formal avalanche forecasts, dense observation networks, and real-time snowpack data are unavailable. In these data-limited settings, fragmented observations and heuristic shortcuts can increase uncertainty around terrain selection and exposure. The Field-Based Hazard Rating (FBHR) is a conceptual decision-support framework for use outside forecast coverage or season. It synthesizes five domains—weather, snowpack structure, avalanche problems, uncertainty, and group dynamics—into a conservative day-level rating of LOW (Normal), MODERATE (Selective), or HIGH (Restrictive). LOW reflects generally stable conditions, limited avalanche potential, high confidence, and broad terrain options with normal caution. MODERATE reflects mixed or changing conditions, possible human triggering, information gaps, or group complexity and calls for selective terrain and deliberate exposure management. HIGH reflects unstable snowpack, active loading, widespread or consequential avalanche problems, substantial uncertainty, and/or elevated human-factor risk; avoiding avalanche terrain becomes the primary strategy. FBHR does not replace professional forecasts or regional danger ratings. It provides recreationists a structured way to translate incomplete observations into terrain choices, reduce cognitive load, improve group communication, and favor conservative decisions when confidence is low. This paper presents the framework, its assessment domains, applications, limitations, and opportunities for validation through field use, practitioner feedback, and comparison with existing hazard communication systems."],"kw":"backcountry decision-making, hazard rating, data-limited environments, heuristic traps, human factors, avalanche education","ty":"P","pp":287,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"Nikki Champion"},"329":{"id":"329","t":"Powder, Perception, & the Patriarchy: A Gendered Look at Backcountry Behavior","au":[{"n":"Sarah Petelinsek","raw":"Petelinsek, Sarah","p":true,"aff":""},{"n":"Kailey Mahoney","raw":"Mahoney, Kailey","p":false,"aff":""},{"n":"Nikki Champion","raw":"Champion, Nikki","p":false,"aff":""},{"n":"Rowan Kelner","raw":"Kelner, Rowan","p":false,"aff":""},{"n":"Olivia Pearson","raw":"Pearson, Olivia","p":false,"aff":""},{"n":"Boomer Olsen","raw":"Olsen, Boomer","p":false,"aff":""},{"n":"Peilu Zhang","raw":"Zhang, Peilu","p":false,"aff":""},{"n":"Patrick G. Hughes","raw":"Hughes, Patrick G.","p":false,"aff":""}],"ab":["Gender may influence risk perception, decision-making, and participation in high-risk outdoor environments, yet gender differences among backcountry recreationists in the United States remain poorly characterized. We examined whether gender was associated with backcountry participation, avalanche education, and risk-taking behavior among Utah backcountry users. We performed a cross-sectional analysis of an anonymous online survey administered through the Utah Avalanche Center from January through February 2025. Participants completed demographic questions and validated measures of risk-taking, including the Risk Taking Inventory for High-Risk Sports (RTI), Domain-Specific Risk-Taking Scale (DOSPERT), and Gambler’s Choice. Among 354 participants with complete demographic data, 263 (74%) identified as men and 91 (26%) identified as women. Women were significantly younger than men (p < 0.001). Women had lower mean RTI scores than men (1.46 ± 0.46 vs. 1.58 ± 0.52; p = 0.002) and lower DOSPERT scores (3.26 ± 0.58 vs. 3.52 ± 0.63; p < 0.001), while Gambler’s Choice scores did not differ significantly (p = 0.16). Educational participation also differed: women reported higher Avalanche Level 1 completion than men (91.9% vs. 83.8%), although this difference was not statistically significant (p = 0.071), whereas men were more likely to report Backcountry 101 participation (34.8% vs. 12.5%; p = 0.041). Despite these differences, women and men reported similar levels of backcountry participation, including days per season, user type, and primary method of travel. These findings suggest that gender may be associated with differences in reported risk-taking and educational experiences without corresponding differences in overall backcountry engagement. Understanding these differences may help avalanche educators consider how users with different experiences and relationships with risk engage with backcountry education."],"kw":"Gender; Backcountry recreation; Avalanche education; Risk-taking behavior; Risk perception; Decision-making","ty":"P","pp":288,"em":[],"r":null,"day":"Thu","th":"Risk Communication","pr":"Sarah Petelinsek"},"330":{"id":"330","t":"Avalanche Warning Signs on Highways: A Practitioner's Framework for Design, Placement, and Risk-Based Standardization","au":[{"n":"Eirik Sharp","raw":"Sharp, Eirik","p":true,"aff":""},{"n":"Cam Campbell","raw":"Campbell, Cam","p":false,"aff":""},{"n":"Scott Thumlert","raw":"Thumlert, Scott","p":false,"aff":""}],"ab":["This paper examines how transportation agencies design, place and deploy avalanche warning signage, and proposes a framework for standardizing those decisions. Avalanche warning signage is a critical component of risk management for transportation corridors in avalanche-prone regions. Avalanche hazard and risk assessment, and operational risk management on highway corridors are generally mature practices, but the deployment of signage is not. Once an agency knows where its avalanche paths are, it must determine which of them carry signage, what that signage says, where each sign should stand, and which road users it addresses. Neither the Manual on Uniform Traffic Control Devices nor the Vienna Convention on Road Signs and Signals treats avalanches as a distinct hazard class, so agencies develop signage policy independently. We reviewed the signage practices of 10 agency programs in the Transportation Avalanche Research Pool, across North America, New Zealand and Norway, and found little consistency in signage deployment between agencies. Much of the variation is a defensible response to context, but the decisions are made in isolation, without reference to peer practice or to the evidence on sign effectiveness, which risks the inconsistent messaging that erodes driver compliance. In response, we propose a framework for agencylevel signage manuals spanning deployment thresholds, placement criteria and sign design, supported by maintenance and records. The framework standardizes the basis on which signage decisions are made while allowing for local context."],"kw":"avalanche signage, highway avalanche risk management, transportation infrastructure.","ty":"P","pp":289,"em":[],"r":null,"day":"Thu","th":"Risk Communication","pr":"Eirik Sharp"},"331":{"id":"331","t":"A Systematic Framework for Designing and Evaluating Avalanche Risk Reduction Interventions","au":[{"n":"Anne St Clair","raw":"St Clair, Anne","p":true,"aff":""},{"n":"Pascal Haegeli","raw":"Haegeli, Pascal","p":false,"aff":""},{"n":"Kelly McNeil","raw":"McNeil, Kelly","p":false,"aff":""}],"ab":["In response to emerging problems or opportunities, such as avalanche incidents or technological advances, avalanche safety service providers face decisions about what risk reduction intervention is needed and how it should be designed. Interventions may include avalanche forecasts, education programs, operational protocols, and decisionsupport tools. These decisions are often made with limited resources or evidence to guide them, amid growing expectations for responsive and effective services. These circumstances call for a systematic process for designing and evaluating interventions, yet avalanche safety service providers lack a structured approach. To address this gap, we synthesized and adapted approaches from risk research, environmental management, and public health program planning and evaluation into a theoretically grounded and practice-focused framework. The framework’s eight steps guide practitioners through defining the scope, engaging affected populations, and diagnosing the risk problem; identifying feasible targets for change; designing and implementing an intervention; and evaluating its implementation, intended changes, and effects on risk. The process is iterative and can be adapted across service contexts and scales, from individual products and programs to broader service systems. For service providers, this process helps direct limited resources toward meaningful opportunities to influence risk and makes intervention reasoning explicit and testable. For researchers, it provides a common structure for connecting findings across studies to build cumulative knowledge about what works, for whom, and under what conditions, including when findings may be transferable."],"kw":"Avalanche risk reduction; intervention design and evaluation; decision-making","ty":"O","pp":290,"em":[],"r":3450,"pr":"Anne St Clair"},"332":{"id":"332","t":"Avalanche Path-Specific Critical Wind Envelopes for Start-Zone Loading in Complex Terrain","au":[{"n":"Seth Hewie","raw":"Hewie, Seth","p":true,"aff":""},{"n":"Eirik Sharp","raw":"Sharp, Eirik","p":false,"aff":""}],"ab":["Wind loading is a key mechanism of slab avalanche formation, and forecasting requires detailed local terrain and climatological knowledge. Models of wind-driven snow redistribution exist at this scale, but not in a form an avalanche forecaster can apply on shift. We present a methodology that derives loading behaviour from terrain and physics rather than from an avalanche occurrence record, for programs where only limited historical data are available. The method couples the GEM-HRDPS numerical weather prediction model with the WindNinja diagnostic downscaling model and corrects the result using the Winstral Sx wind-shelter index following Vionnet et al. (2021). Validation against an independent ridgetop automated weather station shows that the GEM-HRDPS model underestimates strong ridgetop wind speed by 4.88 m/s, and that downscaling reduces the bias to 2.62 m/s. We then treat loading as two separate processes: erosion in an upwind fetch area, and deposition in the lee feature. Wind loads the path only if it erodes the fetch, blows from the fetch toward the lee feature, and then slows enough for snow to settle. For each fetch and wind direction, these conditions reduce to a band of wind speeds, bounded below by erosion and above by deposition. Applied to four fetch areas around one avalanche path, the method identifies three that load in wind the site produces routinely, and one physically able to load but needing more wind than the limited record contains. The output is a per-fetch envelope of loading directions and speeds for operational use."],"kw":"weather forecasting and climate, avalanche forecasting, avalanche formation, terrain","ty":"O","pp":291,"em":[],"r":3459,"pr":"Seth Hewie"},"333":{"id":"333","t":"“Safe Until It Isn´t”: Practitioner Perspectives on Riding Steep Couloirs in the Backcountry","au":[{"n":"Tim Dassler","raw":"Dassler, Tim","p":true,"aff":""},{"n":"Tarjei Westerlund","raw":"Westerlund, Tarjei","p":false,"aff":""}],"ab":["Steep couloir riding concentrates multiple hazards, such as avalanches, cornices, rockfall, and fall risk, into terrain leaving little room for error. Despite this, couloir riding is growing in popularity, driven by social media, advancements in equipment, sources of information and increased accessibility to suitable terrain. However, this specific backcountry activity receives little attention in both recreational avalanche education and research. We examined how experienced practitioners approach planning, decision-making, and execution of steep couloir riding; which knowledge and skill sets they consider essential, and how avalanche education contribute to these essentials. We conducted semistructured interviews with 24 experienced couloir riders from Scandinavia, the European Alps, North America, and the British Isles, ranging from 2 to 25+ years of riding couloirs. Data were analyzed using Systematic text condensation, a thematic cross-case method conducted stepwise during data collection. Results are presented as condensates: synthesized first-person accounts that retain practitioners' voices while representing patterns across the sample. Five themes emerged: reading and timing terrain; habituation and unreliable feedback; partners and personal capability; the draw and its shadow; and the limits of formal education. Practitioners did not describe seeking risk, but waiting: watching lines for seasons until the mountain grants opportunity, with maximal control, not to conquer conditions but to stay responsive to terrain and conditions that cannot be made safe. Drawing on the concept of resonance, we interpret the fascination drawing riders to the practice as a meaningful relationship with the uncontrollable (German: Das Unverfügbare). Predictability nurtures alienation, and resonance cannot arise unless some elements extend beyond our control. For education, participants converged: courses are necessary but structurally insufficient, because couloir judgement is grown through participation and mentorship rather than delivered content in a learning environment where outcomes do not reliably track decision quality."],"kw":"","ty":"O","pp":292,"em":[],"r":3438,"pr":"Tim Dassler"},"334":{"id":"334","t":"Do Forecasters Agree When Given the Same Information? Inter-Forecaster Agreement on Avalanche Problem Likelihood Under the EAWS and CMAH Frameworks","au":[{"n":"Olav Kvåle Myksvoll","raw":"Myksvoll, Olav Kvåle","p":false,"aff":""},{"n":"Tim Dassler","raw":"Dassler, Tim","p":true,"aff":""},{"n":"Gerit Pfuhl","raw":"Pfuhl, Gerit","p":false,"aff":""}],"ab":["Regional avalanche forecasting is a judgement-based process in which experts integrate heterogeneous and uncertain information when assessing avalanche problems. Although operational studies document inconsistency in avalanche assessments, they generally compare forecasters working from different observations, regions, or times. Differences in ratings may therefore reflect both differences in the information available and differences in its interpretation. We used a controlled survey in which 147 practicing forecasters (108 EAWS forecasters and 39 CMAH forecasters) received the same baseline scenarios, rated the likelihood of each avalanche problem, selected two additional information factors, and then re-rated the problems. For each problem, participants assigned a likelihood rating on a 1–6 scale when they judged the available information sufficient to support such a rating; otherwise, they selected the explicit response “No information on the degree of presence.” We describe these response distributions and quantify inter-forecaster agreement among 1–6 ratings using Krippendorff’s ordinal α. Among responses initially indicating insufficient information to support a likelihood rating, a hierarchical Bayesian logistic model examined associations between self-selected information pairs and subsequent transition to a 1–6 rating, accounting for respondent and scenario-by-problem variation. Agreement estimates ranged from approximately 0.30 to 0.65 and changed in both directions after additional information. The response distributions distinguish whether forecasters considered the supplied information sufficient for rating from how dispersed the ratings were among those who assigned one. The transition model identifies self-selected information pairs associated with higher or lower modelled probabilities of moving from insufficient information to a 1–6 rating; because information pairs were selfselected, these associations are not causal. This framework separates likelihood ratings, perceived sufficiency of the supplied information, and inter-forecaster agreement when forecasters receive identical baseline information. We discuss implications for forecaster education."],"kw":"","ty":"P","pp":293,"em":[],"r":3599,"day":"Tue","th":"Avalanche Forecasting","pr":"Tim Dassler"},"335":{"id":"335","t":"Snow Creep and Glide Field Measurements: Improvements for Design of Gas-Based Remote Avalanche Control Systems","au":[{"n":"Adam Davis","raw":"Davis, Adam","p":false,"aff":""},{"n":"Anton Avchyan","raw":"Avchyan, Anton","p":false,"aff":""}],"ab":["Snow creep and glide forces in alpine environments contribute to structural damage and midwinter failure of remote avalanche control systems (RACS), particularly affecting near-land-surface components such as gas lines. Models that describe sustained gravitational forces in slowly deforming snowpack exhibit notable regional bias and rely on limited field validation in North America. Although some validation exists for large structures such as snow-supporting structures and lift towers, significantly less attention has been paid to forces acting at the snow-ground interface, where land-cover properties strongly influence creep and glide behavior. This gap is critical for gas-based RACS, where gas lines extend through starting zones, exposing large segments of near-surface infrastructure to snow pressure. This work reviews the current literature on snow creep and glide in engineering design, including foundational European and American guidelines, and recent advances in field instrumentation and monitoring. The review identifies key limitations in existing models, particularly the uncertainty associated with ground-surface coefficients, the need for standardized treatment of surface conditions, and the lack of direct force measurements at the snow-ground interface. These limitations suggest that current design practices may not adequately represent realworld loading conditions for near-surface infrastructure. To address this gap, the study proposes a field-based conceptual framework to directly measure basal creep and glide forces and evaluate the influence of ground surface characteristics."],"kw":"Planning and Engineering; RACS Installation and Maintenance; Snow Creep; Glide","ty":"P","pp":294,"em":[],"r":3532,"day":"Mon","th":"Planning and Engineering","pr":"Adam Davis"},"336":{"id":"336","t":"Measuring Cumulative and Low-Level Blast Overpressure Exposure of Avalanche Workers","au":[{"n":"Allie Fredbo","raw":"Fredbo, Allie","p":true,"aff":""},{"n":"Amanda Geisler","raw":"Geisler, Amanda","p":false,"aff":""},{"n":"Ken Thompson","raw":"Thompson, Ken","p":false,"aff":""}],"ab":["Avalanche workers operate in complex environments with numerous hazards. One risk is exposure to blast overpressure (BOP) from explosive events. Explosives are inherently dangerous and no exposure is without risk. Research in military and law enforcement sectors has suggested that even relatively low levels of BOP, with peak overpressure of 0.25 psi (1.72 kPa) may be associated with physiologic and neurologic changes. Cumulative BOP exposure has been associated with increasing symptom severity. Reported symptoms include difficulty with memory and concentration, mood changes such as irritability and frustration, sleep disturbances, hearing difficulties, impaired reaction time and balance. Blast exposure among avalanche workers remains understudied. The work presented here expands upon published data by Thompson et al. (2023) in which avalanche workers wore pressure sensors to measure BOP during routine mitigation work. To improve the accuracy of measured exposures, the number of sensors worn by participants was increased from one to three. With this change, a blast event was ~1.6 times more likely to result in a recorded exposure. Data presented here was collected between 2024-2026 at four operations with 49 unique participants. In total 458 explosives were deployed, resulting in 48 recorded events (10.48%), with average peak overpressure exposure was 1.15 psi (7.9 kPa), maximum of 2.28 psi (15.72 kPa), and average positive impulse of 3.31psi⋅ms (22.82 kPa⋅ms). Sensor data also demonstrated that some participants experienced multiple exposures within minutes to hours. These values may be overstated due to the presence of atypical waveforms with uncertain significance. Despite this limitation, the measured exposures provide a framework for discussion and comparison with adjacent industries. Given the widespread use of explosives for avalanche mitigation, blast exposure remains an important topic in occupational hazard discussions. Awareness of blast exposures alone allows for adjustment of individual risk and recognition of symptoms. This work also provides support for avalanche programs to employ riskreduction strategies applicable for their operation. Continued focus on the risk associated with cumulative blast exposure will guide safer explosives use practices and support longevity of career practitioners."],"kw":"Worker Safety, Explosives, Blast Overpressure, Cumulative Low-Level Blast","ty":"O","pp":295,"em":[],"r":3393,"pr":"Allie Fredbo"},"337":{"id":"337","t":"Monitoring of Avalanches Using DAS: From Release to Flow Motion Detection","au":[{"n":"Cristina Pérez-Guillén","raw":"Pérez-Guillén, Cristina","p":true,"aff":""},{"n":"Pascal Edme","raw":"Edme, Pascal","p":false,"aff":""},{"n":"Andri Simeon","raw":"Simeon, Andri","p":false,"aff":""},{"n":"Johannes Aichele","raw":"Aichele, Johannes","p":false,"aff":""},{"n":"Alec van Herwijnen","raw":"van Herwijnen, Alec","p":false,"aff":""},{"n":"Andreas Fichtner","raw":"Fichtner, Andreas","p":false,"aff":""},{"n":"Johan Gaume","raw":"Gaume, Johan","p":false,"aff":""}],"ab":["The destructive power of snow avalanches and the uncertainty in predicting them demand reliable monitoring systems in mountain regions. Distributed Acoustic Sensing (DAS) provides a novel approach by transforming fibre-optic cables into dense arrays of seismic sensors with metre-scale spacing over kilometre distances. During the 2025-2026 winter season, we installed 3 km of fibre-optic cable across two avalanche release areas near Davos, Switzerland, to investigate the potential of DAS for monitoring avalanche release and flow motion. The system continuously recorded strain rate along the cable at a spatial resolution of 2 m and a sampling frequency of 1000 Hz, decreasing to 200 Hz during periods of low danger level. For avalanches releasing across the fibre, the DAS measurements captured a distinct signal associated with the initial fracture and release processes, followed by a moving signal generated by the downslope avalanche flow. To explore the continuous dataset, we converted the DAS recordings into video-like spatio-temporal representations in which avalanche signals can be distinguished from numerous natural and anthropogenic sources. During the winter, 15 avalanches were independently documented in the monitored release areas, of which 11 were detected by DAS, including events at distances of up to approximately 300 m from the fibre. These observations demonstrate the potential of DAS to monitor both avalanche release processes and subsequent flow over large areas."],"kw":"Avalanche Detection, Distributed Acoustic Sensing (DAS) Monitoring, Avalanche Release","ty":"O","pp":296,"em":[],"r":3413,"pr":"Cristina Pérez Guillén"},"338":{"id":"338","t":"Avalanche Forecasting on the Verge: Ephemeral Snowpacks, Climatic Shifts, and the Evolution of Arizona’s Winters","au":[{"n":"W Tanner Porter","raw":"Porter, W Tanner","p":true,"aff":""},{"n":"Paul Dawson","raw":"Dawson, Paul","p":true,"aff":""},{"n":"Mathieu Brown","raw":"Brown, Mathieu","p":true,"aff":""},{"n":"Troy Marino","raw":"Marino, Troy","p":false,"aff":""},{"n":"Len Necefer","raw":"Necefer, Len","p":false,"aff":""},{"n":"David Lovejoy","raw":"Lovejoy, David","p":false,"aff":""}],"ab":["Arizona seems an improbable ski locale given North America's mountainous geography, yet its high-elevation sky islands support multiple winter backcountry zones and several ski areas, served by two of the lowest-latitude avalanche centers in the country. The Kachina Peaks Avalanche Center (Arizona's only nonprofit avalanche center) serves a local user base accustomed to low-tide, variable, and ephemeral snowpacks relative to other western ranges, and the Sonoran Avalanche Center (the first for-profit avalanche center in operation) humorously raises user-group awareness of climate change and non-snow avalanche activity. The 2025–2026 season, characterized by nearaverage precipitation punctuated by extreme warm periods and mid-season rain events even at the highest elevations, raises a question with implications well beyond Arizona: was this an anomaly or a preview? We examine historic patterns of winter snowfall, precipitation, temperature, and inter-storm intervals across Northern Arizona's forecast area to characterize the trajectory of ephemeral snowpack conditions in the Southwest. Our findings suggest that while a fully non-snow avalanche-forecasting future is not on the near-term horizon, the frequency of highly irregular snowpacks and extreme weather events that drive avalanche activity is rising. We emphasize that while the mechanics remain the same, the type, frequency, and distribution of historical patterns may be turning a new page. This finding supports the continued need for snow avalanche forecasting and outreach, while also pointing to the need for longerterm adjustments in operations and messaging. Equally important, ephemeral and feast-or-famine snowpacks present a distinct risk communication challenge. Established literature on hazard perception suggests that infrequent, high-variance, and seasonally unstable hazards are systematically underweighted by the public, and that forecaster credibility is harder to build and sustain when \"normal\" conditions are themselves in flux. Thus, avalanche centers operating on the climatic margins are functioning as early case studies for the broader community when communicating risk under non-stationary winters — including how to frame uncertainty, sustain user engagement across lean seasons, and prepare the public for an eventual expansion into forecasts that include related recreational hazards (obstacles, access challenges, rain-on-snow events, or even debris flows) without eroding public attention to the core snow forecast."],"kw":"Avalanche forecasting, climate change, risk communication, machine learning, snow- pack variability","ty":"P","pp":297,"em":[],"r":3600,"day":"Tue","th":"Avalanche Forecasting","pr":"W Tanner Porter"},"339":{"id":"339","t":"Helicopter Operations in Avalanche Terrain: A Framework for Pilot Education","au":[{"n":"Christopher Templeton","raw":"Templeton, Christopher","p":true,"aff":""},{"n":"Seth Waterfall","raw":"Waterfall, Seth","p":false,"aff":""}],"ab":["Helicopter operations in mountainous winter environments present unique hazards that are often under-addressed in standard mountain flying curricula. While technical guidance for landing on snow is abundant, there remains a critical information gap regarding safe operations within the specific \"imperfect world\" of active avalanche terrain. Utilizing over 25 combined years of high-altitude mountain flight experience and case study analysis, the study identifies two key directives for operational safety. It examines the mechanical relationship between helicopter weight, whether dispersed as rotor wash or concentrated on small surface areas like skids or wheels, and snowpack failure in buried weak layers. The study further explores heuristic traps which pilots may be more subject to, such as familiarity and the \"expert halo,\" which frequently skew risk assessments in professional aviation and rescue contexts. Our paper establishes a framework for pilot and crew awareness, emphasizing the necessity of formal avalanche training and the application of technical decision-making to mitigate the inherent dangers of these environments."],"kw":"Avalanche Education, Decision Making, Risk Management","ty":"P","pp":298,"em":[],"r":3533,"day":"Mon","th":"Avalanche Education","pr":"Christopher Templeton"},"340":{"id":"340","t":"Adapting the Response Assessment and Decision-Making Support (Radems) Tool for Avalanche Hazard and Terrain Evaluation in U.S. Search and Rescue Operations","au":[{"n":"Jennifer A. Reddy","raw":"Reddy, Jennifer A.","p":true,"aff":""}],"ab":["Search and rescue (SAR) teams in the United States are increasingly called to respond in avalanche terrain, yet most operate without a standardized scope of practice or training requirement governing who may assess avalanche hazard and risk for a mission. The Response Assessment and Decision-Making Support tool (RADeMS) originated in a BCSARA-led, SAR-NIF–funded project (2012– 2013) It provides a general risk-versus-capability framework for SAR decision-making, but it was never built with an embedded avalanche hazard and terrain assessment component. In British Columbia that function is filled upstream by Emergency Management BC's (EMBC) 2.08 GSAR Winter Response policy. Most U.S. avalanche search and rescue (AvSAR) teams have no equivalent policy, and many field rosters lack a qualified avalanche professional to forecast avalanche hazard or assess the avalanche risk. This paper describes an avalanche-focused adaptation of RADeMS: embedding a rapid Dangerator-based danger rating, an estimated ATES assessment of the travel route and incident site, and a qualification check confirming that the assessor's training is sufficient for the resulting danger/terrain combination. If any mission where the maximum ATES rating is Complex or Extreme and the danger rating for the travel route or incident site is High or Extreme, a hard escalation rule requires that the mission be assessed instead through a full Conceptual Model of Avalanche Hazard (CMAH) worksheet and avalanche operations plan completed by an avalanche professional, rather than relying on rapid screening alone. These outputs feed RADeMS's existing Operational Risk and Response Capability scores, plotted on a risk matrix to structure a GO / review / reduce-risk conversation. More broadly, this paper argues that U.S. teams operating without an externally mandated scope of practice carry the full burden of building their own defensible, auditable reasoning for committing or withholding personnel."],"kw":"RADeMS, avalanche search and rescue (AvSAR), ATES, Dangerator, risk assessm
