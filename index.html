 remains for backcountry users. The mitigation strategy has transitioned from using long-range artillery to Remote Avalanche Control Systems (RACS), which are supported by a comprehensive monitoring system. This transition has significantly reduced the exposure of inhabited buildings to overhead artillery shells while also supporting centralized management of event data and mitigation management. This monitoring system includes the automatic detection of avalanches and people using Doppler radar, which allows for detection and monitoring to occur independent of weather and time of day. Event and person detection work by analyzing waves that are reflected by an object and received by the radar at a different frequency than the original signal. The frequency shift allows the radar to measure the avalanche’s velocity and, with additional processing techniques based on the travel time, determine its position. Event detection facilitates RACS verification and supports forecasting efforts. The people detection component supports verifying that areas subject to active mitigation measures are clear of human presence. This combined approach of mitigation, forecasting, and monitoring exemplifies an integrated, state-of-the-art method to manage complex avalanche hazards in heavily trafficked corridors."],"kw":"Avalanche radar, Mitigation, Monitoring","ty":"P","pp":64,"em":[],"r":3612,"day":"Tue","th":"Operations and Program Management","pr":"Théo St-Pierre Ostrander"},"62":{"id":"62","t":"From Hazard Assessment to Action in Site-Specific Avalanche Operations","au":[{"n":"Aaron Careaga","raw":"Careaga, Aaron","p":true,"aff":""},{"n":"Scott Havens","raw":"Havens, Scott","p":false,"aff":""},{"n":"Don Sharaf","raw":"Sharaf, Don","p":false,"aff":""},{"n":"Dave Richards","raw":"Richards, Dave","p":false,"aff":""},{"n":"Clark Corey","raw":"Corey, Clark","p":false,"aff":""}],"ab":["Frameworks such as the Conceptual Model of Avalanche Hazard (CMAH; Statham et al., 2018) provide a structured basis for characterizing avalanche hazard. However, the translation from hazard rating to operational action remains inconsistently formalized in site-specific settings (Jaedicke et al., 2024; Langeland and Steinkogler, 2023; Clark and Haegeli, 2018). This gap is especially relevant where a single hazard assessment may require different actions for separate assets depending on their vulnerability: a small avalanche may present low concern for occupied heavy machinery but be unacceptable where personnel are exposed on foot. Langeland et al. (2018) proposed the Operational Specific Avalanche Risk Matrix (OSARM) to bridge hazard characterization and mitigation planning, but published accounts of operational use remain limited. During the 2025–2026 season, practitioners at seven sitespecific operations configured asset-specific hazard action matrices within a digital CMAH-based forecasting workflow within SnowObs. Each matrix mapped forecast likelihood and destructive size to operational action levels based on the vulnerability and exposure time of the elements at risk. This coupling allowed a single hazard assessment to produce different guidance for different assets under the same conditions. Forecasts were linked to field observations, prior assessments, and narrative reasoning, so the assessment and reasoning behind each forecast remain reviewable alongside the data. Across 140 forecast days, the primary value of the matrices was not in replacing forecaster judgment but in making the reasoning behind mitigation recommendations more explicit and reviewable. Practitioners described them as a structured check on assumptions going into the forecast rather than a new source of guidance. In practice, the matrices made asset-specific thresholds more explicit and gave forecasters a more reviewable and repeatable basis for briefings and operational communication. This is consistent with how pre-flight checklists function in aviation, where structured protocols formalize expert judgment rather than replace it. This is an early report from a limited number of site-specific projects. We make no claims about forecast accuracy or safety outcomes. We present an initial operational account of configurable hazard action matrices that extend the OSARM concept into daily operational use within a digital forecasting workflow."],"kw":"avalanche hazard assessment, CMAH, site-specific forecasting, hazard action matrices, operational decision support, OSARM","ty":"P","pp":65,"em":[],"r":3619,"day":"Tue","th":"Avalanche Forecasting","pr":"Aaron Careaga"},"64":{"id":"64","t":"Decision-Making Under Constraint: How SAR Teams Navigate Avalanche Terrain When Destination and Timing Are Fixed","au":[{"n":"Brad Hefta-Gaub","raw":"Hefta-Gaub, Brad","p":true,"aff":""},{"n":"Erik Olson","raw":"Olson, Erik","p":false,"aff":""},{"n":"Jim Hirshfield","raw":"Hirshfield, Jim","p":false,"aff":""}],"ab":["Search and Rescue (SAR) teams often operate in avalanche terrain under conditions fundamentally different from those assumed by standard recreational or professional avalanche decision frameworks. Unlike guides, ski patrollers, or recreationalists, SAR teams cannot choose their objective or defer to better timing. Destination and schedule are externally imposed by the mission, leaving responders with limited discretion to avoid hazard exposure. This paper presents findings from an anonymous survey of 91 avalanche-capable SAR responders across nine US states and one Canadian province. The survey examines how responders assess hazard, select routes, manage team exposure, and navigate organizational pressures during avalanche-terrain missions. Respondents report that SAR decisions feel more constrained and time-pressured than non-SAR travel, with near-universal terrain-based mitigation. The core challenge is managing exposure in terrain that cannot be avoided. Results highlight opportunities to improve SARspecific training, mission planning, and integration with regional avalanche forecasting resources."],"kw":"Search and Rescue, Avalanche Terrain, Decision Making, Human Factors, Operational Constraints, Avalanche Education","ty":"O","pp":66,"em":[],"r":3388,"pr":"Brad Hefta-Gaub"},"65":{"id":"65","t":"Operationalizing Avalanche-Terrain SAR Decisions: The King County Winter Response Team Model","au":[{"n":"Erik Olson","raw":"Olson, Erik","p":true,"aff":""},{"n":"Brad Hefta-Gaub","raw":"Hefta-Gaub, Brad","p":false,"aff":""},{"n":"Jim Hirshfield","raw":"Hirshfield, Jim","p":false,"aff":""}],"ab":["Avalanche-terrain Search and Rescue (SAR) missions in King County, Washington occur across a large and complex operational area. Potential missions span multiple mountain passes, four separate avalanche forecast zones, and a wide variety of terrain types and elevations. Additionally, regional avalanche forecast bulletins are typically issued around 18:00 for the next day. Many SAR missions start late in the afternoon or evening, near the end of the current forecast period. These spatial and temporal mismatches mean that incident commanders often lack a fresh, zonespecific forecast at the moment they must make GO, DELAY, or NO-GO decisions. To address this challenge, Ski Patrol Rescue Team (SPART), in partnership with other King County SAR units, developed the Winter Response Team: a rapid-activating cell of avalanche-experienced responders who convene immediately after an avalancheexposed mission notification. The team reviews all relevant recreational forecasts, then augments them with current, mission-specific information using a formalized briefing process. This brief incorporates information and observations sourced directly from on-duty forecasters and snow-safety staff at nearby ski areas. It integrates real-time professional observations with local terrain knowledge to provide targeted, mission-specific decision support for SAR team leaders. The overall outcome is a preliminary GO, DELAY, or NO-GO recommendation, along with suggested access routes and key mitigation considerations delivered to incident command before field deployment decisions are finalized. This paper describes the Winter Response Team operational model, the context in which it is used, and its information inputs, workflow, and briefing product. Using anonymized case examples from recent King County missions, we discuss the strengths and limitations of the model. Ideally other SAR organizations operating in similar circumstances will find transferable techniques and ideas."],"kw":"Search and Rescue, Avalanche Terrain, Mission Planning, Incident Command, Ava- lanche Forecasting","ty":"O","pp":67,"em":[],"r":3403,"pr":"Erik Olson"},"68":{"id":"68","t":"Lawyers Creek – Managing Avalanche Risk in the Omineca Mountains of British Columbia, Canada.","au":[{"n":"Mark Vesely","raw":"Vesely, Mark","p":true,"aff":""},{"n":"Greg Johnson","raw":"Johnson, Greg","p":false,"aff":""}],"ab":["The Omineca Mountains are made up of a series of remote ranges located in north central British Columbia, Canada. Due to their remote nature, published avalanche climate data is limited for these ranges. In the winter of 2021-22, 6 Point Avalanche Control managed avalanche risk for an exploration project in this region. This operational program observed avalanche climate data from 3 different areas including notable experiences in managing a road through 2 high elevation passes. This paper summarizes completed work, avalanche climate observations, and provides a reference for future practice in the Omineca Mountains."],"kw":"Omineca Mountains, Operations, Avalanche Climate","ty":"P","pp":68,"em":[],"r":3620,"day":"Tue","th":"Operations and Program Management","pr":"Mark Vesely"},"69":{"id":"69","t":"Patrolling the Snow Surface Energy Balance","au":[{"n":"Austin Finnell","raw":"Finnell, Austin","p":true,"aff":""}],"ab":["Avalanche professionals usually build snowpack intuition from weather cues they can directly observe, including sun, cloud cover, air temperature, and wind. This study asks whether those cues account for what actually controls snow surface temperature. A minimal one dimensional snow surface energy balance model was developed and forced with observations from the Senator Beck Basin Study Plot in Colorado from 1 January to 28 February 2026. The model was tuned with measured station data to create a baseline simulation. The baseline model reproduced observed snow surface temperature well, with MAE = 1.05 °C, RMSE = 1.53 °C, and r = 0.962. To test the model’s response, downwelling longwave, absorbed shortwave, sensible heat, and latent heat were independently changed by ±10%, ±20%, and ±30% in separate runs. At every perturbation level, scaling downwelling longwave produced the largest increase in RMSE. A 10% reduction in downwelling longwave increased RMSE by 1.09 °C, compared with 0.05 °C for sensible heat, 0.04 °C for absorbed shortwave, and 0.01 °C for latent heat. Within this model and record, snow surface temperature RMSE was most responsive to proportional changes in downwelling longwave radiation. A simple air temperature proxy for snow surface temperature performed far worse than the energy balance model, with RMSE = 7.21 °C, about 4.7 times the baseline error. These results suggest that practitioners may underestimate the contribution of longwave radiation to snow surface conditions, not because other variables are unimportant, but because longwave acts continuously without a visible signal and is therefore easy to omit from a mental model. In this two month record at one station, changing LW↓ by a given percentage produced a larger response than changing absorbed shortwave, sensible heat, or latent heat by the same percentage. As snow modeling becomes more common in avalanche forecasting, understanding longwave influence can help users interpret model results and reconcile differences between snow surface temperature, air temperature, and visible weather conditions."],"kw":"Snowpack Properties, Instrumentation and Remote Sensing, Weather Forecasting","ty":"P","pp":69,"em":[],"r":null,"day":"Fri","th":"Snowpack Properties","pr":"Austin Finnell"},"70":{"id":"70","t":"Are You Behaving Out There?: Student Reported Behavior Changes After Recreational Avalanche Education in Alaska","au":[{"n":"Michael A. Kerst","raw":"Kerst, Michael A.","p":true,"aff":""},{"n":"Eeva Latosuo","raw":"Latosuo, Eeva","p":false,"aff":""}],"ab":["Formal avalanche education has existed in Alaska since 1976. The Alaska Avalanche School (AAS) is the primary provider of this education and serves both recreationalists and professionals. Limited formal research exists on the actual impacts of these educational experiences on student behaviors, and this study is the first to assess the impacts of the AAS Recreational Level 1 curriculum on student behaviors in the backcountry. The study was conducted using two surveys. One survey was a retrospective post-test questionnaire given to students that examined the self-reported behavioral impacts of the AAS Level 1 curriculum on students’ avalanche risk management behaviors. Respondents answered questions on 14 important behaviors identified from the American Avalanche Association Recreational Level 1 course guidelines. The survey was distributed to students who had completed the AAS Level 1 course in the 2023-2024, 2024-2025, and 2025-2026 seasons, and was distributed during the 2025-2026 season. The second survey, given to instructors, focused on understanding which Level 1 learning objectives were most valuable, and which learning environments were most effective for student learning, according to instructors. The student survey respondents were mostly male (61%) skiers (71%), with 2-5 seasons of experience (48%), and spent 6-10 days in the backcountry per season (34%). Instructors were relatively early-career (40% with 2–5 seasons), taught skiers/ snowboarders (75%), and taught up to the rec 2 level. Participants in the student survey reported significant increases in 13 out of 14 behaviors after taking the course. Instructor survey results prioritized field-based teaching over classroom presentations, emphasizing terrain identification and travel techniques as the most critical skills for backcountry safety. Comparing the two survey results, instructors highly valued terrain-related behaviors, yet the student survey results did not reflect higher degrees of change for terrain-related behaviors. The results from this research will be valuable for refining recreational avalanche curricula and understanding the impact of different educational environments on the quality of these curriculums. Additionally, this study will provide practitioners with insights into the behaviors of recreational users with basic avalanche safety training."],"kw":"Avalanche education, decision making, Alaska, backcountry behaviors, recreational courses","ty":"P","pp":70,"em":[],"r":3494,"day":"Mon","th":"Avalanche Education","pr":"Michael A. Kerst"},"71":{"id":"71","t":"Daily Avalanche Probability Indication Maps: First Operational Experience in Davos, Switzerland","au":[{"n":"Julia Glaus","raw":"Glaus, Julia","p":true,"aff":""},{"n":"Pia Ruttner","raw":"Ruttner, Pia","p":false,"aff":""},{"n":"Lukas Stoffel","raw":"Stoffel, Lukas","p":false,"aff":""},{"n":"Johan Gaume","raw":"Gaume, Johan","p":false,"aff":""},{"n":"Yves Bühler","raw":"Bühler, Yves","p":false,"aff":""}],"ab":["Avalanche risk management in ski resorts, along traffic routes, and for exposed buildings relies mainly on point-based measurements, field observations, avalanche cadastres, avalanche bulletins, and expert judgment, particularly during storms with limited visibility. At Brämabüel (Davos), three major avalanche paths threaten a cross-country ski track and the Dischma road, requiring timely operational decisions such as road closures or avalanche control, which could have considerable economic impact. During the 2025/26 winter season, we implemented and tested an operational workflow that generates daily, spatially explicit probability indication maps of avalanche runout for direct use by local experts. The approach relies on an avalanche dynamics model that simulates both snow entrainment and the powder cloud. The model is driven by snowpack simulations forced by meteorological station data, low-cost lidar sensor and camera imagery. By coupling dynamic avalanche modeling with measurement-based information on snow cover, the framework provides a practical tool for near-real-time hazard assessment. During a storm event from 16–22 February, a spontaneous avalanche released at night, significantly depleting the release area. A subsequent artificial release remained small. Such changes in snow depth, which strongly affect avalanche formation and release, are not captured by station-based modeling. The lidar information helps to interpret the probability indication maps of the following days or even provides the basis to update them. This case study demonstrates how integrating modeling and remote sensing improves situational awareness and supports more robust decision-making under challenging observational conditions such as snowfall. The approach adds a complementary perspective for practitioners and will be tested across larger regions and different climatic conditions, while its effective use depends on defining robust decision thresholds (e.g., for road closures) in close collaboration with practitioners."],"kw":"Avalanche Dynamics, Road Safety, Forecasting, Probability, Hazard Assessment","ty":"O","pp":71,"em":[],"r":3473,"pr":"Julia Glaus"},"72":{"id":"72","t":"The State of the Snowpack: A Community-Based Approach for Transforming How Avalanche Forecasts Are Interpreted and Applied","au":[{"n":"Morgan Dinsdale","raw":"Dinsdale, Morgan","p":true,"aff":""},{"n":"Jason Wishlow","raw":"Wishlow, Jason","p":false,"aff":""},{"n":"Catherine Paone","raw":"Paone, Catherine","p":false,"aff":""}],"ab":["Avalanche forecasts are widely accessed, but access alone does not ensure understanding or safe decision-making. Despite ongoing advances in forecasting, a persistent gap remains between public avalanche forecasts and professional observations, and how backcountry users interpret and apply this information in real-world decisionmaking. Improving this connection requires new approaches to engaging with avalanche information. State of the Snowpack Public Safety Society(SOTS) is a community-based approach designed to address this gap by influencing how avalanche forecasts are interpreted and applied. Through structured, recurring live events shared via livestream, qualified professionals (Canadian Avalanche Association Level 2-certified or greater) interpret current conditions and engage directly with their backcountry communities. These events translate snowpack conditions into local, experience-based narratives, facilitate dialogue among diverse user groups, and reinforce public avalanche forecasts. Within this setting, participants move beyond reading forecasts toward actively interpreting them—comparing perspectives, challenging assumptions, and developing a shared understanding of conditions across terrain and user groups. This process supports improved risk literacy and more informed decision-making. Community-based avalanche education is not new, but it has traditionally been delivered through one-off events with limited reach and consistency. SOTS systematizes this approach into a repeatable, scalable model through a consistent event structure delivered regularly across regions and amplified through livestream and digital platforms. This creates continuity, expands access, and sustains engagement beyond the room. Since 2019, SOTS has grown into a nationally coordinated network spanning British Columbia to Quebec. During the 2025/26 season, SOTS chapters delivered 40 free events in 10 communities, engaging over 4,400 participants, with thousands more reached digitally. In March 2026 alone, SOTS content generated over 50,000 views. SOTS demonstrates how structured, community-driven interpretation of avalanche conditions can strengthen the link between avalanche information and public behaviour, offering a scalable, transferable approach with relevance for avalanche safety practitioners and communities worldwide."],"kw":"Risk communication; Decision making; Avalanche forecasting; Community-based education; Public safety; User behaviour","ty":"P","pp":72,"em":[],"r":null,"day":"Thu","th":"Risk Communication","pr":"Morgan Dinsdale"},"73":{"id":"73","t":"A Review of Avalanche Release Mechanisms: From Anticrack Propagation to Supershear Fracture","au":[{"n":"Johan Gaume","raw":"Gaume, Johan","p":true,"aff":""},{"n":"Alec van Herwijnen","raw":"van Herwijnen, Alec","p":false,"aff":""},{"n":"Jürg Schweizer","raw":"Schweizer, Jürg","p":false,"aff":""}],"ab":["Dry-snow slab avalanches are responsible for most avalanche fatalities, making understanding of release mechanisms essential for forecasting and hazard assessment. Slab avalanche release is now understood as a sequence of coupled mechanical processes: failure initiation in a buried weak layer, onset of crack propagation, dynamic crack propagation, and ultimately slab fracture, crack arrest, and release. Over decades of research, conceptual models of avalanche release have emerged, ranging from weak layer shear failure to collapse-driven anticrack propagation, often treated as competing explanations. In this review, we bring together laboratory experiments, field observations, numerical simulations, and analytical models, from which a unified perspective on slab avalanche release emerges. Across these approaches, consistent evidence shows that the type of crack propagation depends on the situation, in particular slope angle. On gentle terrain and in propagation saw tests, propagation is typically slow (< 60 m s−1), associated with weak layer collapse and slab bending. On steep slopes, the propagating crack can accelerate and become dominated by weak layer shear failure, with characteristics consistent with supershear fracture. Crack speeds may then exceed the slab shear wave velocity (> 100 m s−1). This suggests that these two propagation regimes, collapse-driven and shear-dominated, appear to describe different situations of the same dynamic process. The relative importance of collapse and shear depends on slope angle, the resulting stress state, and the weak layer failure envelope. Together, these findings help reconcile previously competing theories of slab avalanche release and highlight the need to consider both collapse-driven and shear-dominated crack propagation regimes. Further work is needed to assess whether this framework applies to natural avalanche release, or whether slab viscoelastic relaxation and weak layer ductile-to-brittle transition lead to partly different release mechanisms."],"kw":"dry-snow slab avalanche, avalanche release, weak layer, failure initiation, crack propaga- tion, anticrack, supershear fracture, slab fracture.","ty":"O","pp":73,"em":[],"r":3414,"pr":"Johan Gaume"},"74":{"id":"74","t":"Thermal UAS Use During a Nighttime Search at Vail Pass, Colorado","au":[{"n":"Drew Gibson","raw":"Gibson, Drew","p":true,"aff":""},{"n":"Austin Finnell","raw":"Finnell, Austin","p":false,"aff":""},{"n":"Aaron J. Parmet","raw":"Parmet, Aaron J.","p":false,"aff":""}],"ab":["Summit County Rescue Group (SCRG) deployed an unmanned aircraft system (UAS) equipped with a thermal camera during an overnight response for a missing individual near Vail Pass, Colorado, on 7–8 March 2026. The subject was overdue in avalanche terrain during Considerable hazard, and nighttime field searching quickly reached limits where further travel would have exposed rescuers to unacceptable risk. SCRG’s UAS team used thermal imagery to identify a recent avalanche, with two ski tracks entering the start zone and only one visible exit track. That finding shifted the mission from a broad overdue search to a focused avalanche response, reduced rescuer exposure to hazardous terrain in the dark, and helped align incoming resources. Here, we present the incident timeline, key operational decision points, and lessons learned from using a DJI Matrice platform with a thermal camera as a nighttime avalanche search tool. The case highlights how UAS observations changed the search problem and provides practical lessons for UAS tasking, sensor use, deployment, staffing, and mission coordination during nighttime winter searches."],"kw":"Search and Rescue, Instrumentation and Remote Sensing, Avalanche Response, Case Studies, Unmanned Aircraft System, Thermal Imaging.","ty":"P","pp":74,"em":[],"r":null,"day":"Fri","th":"Incidents and Case Studies","pr":"Drew Gibson"},"75":{"id":"75","t":"Reconciliation in Practice: Embedding Indigenous Knowledge into Avalanche Education","au":[{"n":"Dylan M. Murray","raw":"Murray, Dylan M.","p":true,"aff":""}],"ab":["This paper examines how integrating Indigenous Knowledge Systems (IKS) can redefine human-land relationships within avalanche education and contribute to sustainable and equitable approaches to land stewardship (United Nations, 2007). The Six R's framework: Relationship, Respect, Relevance, Reciprocity, Responsibility, and Representation (Kirkness and Barnhardt, 1991; Tsosie et al., 2022) provides guiding principles for incorporating a more holistic understanding of cultural, historical, and ethical perspectives into avalanche education that both challenge and work alongside the primarily technical mindset that prioritizes data and efficiency that already exists in avalanche education. Current Diversity, Equity, and Inclusion (DEI) initiatives in the snow and avalanche industry have increasingly focused on improving access for BIPOC participants through scholarships and grants. At the same time, less attention has been given to developing meaningful relationships between Indigenous communities and organizations, educators, and operators. This paper proposes moving beyond symbolic inclusion by embedding land acknowledgments, storytelling, guided reflection, and Indigenous partnerships into avalanche education. These practices encourage participants to consider not only avalanche hazards, but also their relationships and responsibilities to the landscapes they enter. Integrating IKS into avalanche education provides an opportunity to expand technical decision-making that includes a more holistic approach and considers cultural, historical, ethical, and place-based perspectives. In doing so, avalanche education can contribute to greater relational accountability, landbased responsibility, and reconciliation."],"kw":"Indigenous Knowledge; DEI; Reconciliation; Human-Land Relationships","ty":"P","pp":75,"em":[],"r":null,"day":"Thu","th":"Diversity, Equity, Inclusion","pr":"Dylan M. Murray"},"76":{"id":"76","t":"An Operational SNOWPACK Modeling and Visualization Pipeline for Ski Resort Avalanche Forecasting","au":[{"n":"Eric E. Lawrence","raw":"Lawrence, Eric E.","p":true,"aff":""},{"n":"Wendolyn Antibus","raw":"Antibus, Wendolyn","p":false,"aff":""}],"ab":["Numerical models of snow stratigraphy have long served avalanche forecasting where in situ observations are challenging, typically in infrastructure protection and backcountry settings. We implemented Sastrugi, a modeling and visualization pipeline based on the SNOWPACK model, at Mt Rose Ski Tahoe over the 2025–26 season that ran alongside resort avalanche operations. The pipeline provides the forecast team with automated daily morning email reports and an interactive visualization application offering four views of the simulated snowpack: a short-term upper snowpack forecast, an overview across all aspects, a seasonal history, and a detailed profile. We discuss data and model validation with a heterogeneous station network, examine the sensitivity of simulation outcomes to meteorological inputs and compare incoming longwave radiation parameterizations. A ski resort’s accessible observation environment lets model output inform targeted snowpack observations. Comparisons against roughly twenty validation pits showed modeled profiles reproducing the season’s principal structures (early-season facets, buried crusts, and a rain-on-snow wetting front) in undisturbed terrain, with the largest divergences where avalanche control and skier traffic rework the snowpack. Short-term forecast outputs show promise for anticipating new snow and wet snow instabilities over the coming day. Finally, we assess the first season and outline priorities for moving the system into the forecast process proper, including evaluating recent stability models."],"kw":"snowpack modeling, avalanche forecasting, SNOWPACK, ski resort operations, snow stratigraphy, interactive visualization","ty":"P","pp":76,"em":[],"r":null,"day":"Thu","th":"Modelling and Quantitative Forecasting","pr":"Eric E. Lawrence"},"77":{"id":"77","t":"Challenges with Remote Avalanche Control Systems (RACS) Troms County, Northern Norway","au":[{"n":"Andreas Persson","raw":"Persson, Andreas","p":true,"aff":""},{"n":"Mariia Pihlainen","raw":"Pihlainen, Mariia","p":false,"aff":""},{"n":"Kaja Krogh","raw":"Krogh, Kaja","p":false,"aff":""},{"n":"Una Bratlie","raw":"Bratlie, Una","p":false,"aff":""},{"n":"Simen Bekkevoll","raw":"Bekkevoll, Simen","p":false,"aff":""},{"n":"Håvard Haukenes","raw":"Haukenes, Håvard","p":false,"aff":""}],"ab":["Troms County Council (TFK) operates two different Remote Avalanche Control Systems (RACS). Along County Road 7768 in Grøtfjorden, 11 Wyssen towers are installed (Krogh et al., 2022). Along County Road 7940 on Arnøya, 23 O'BellX+ units are installed by MHM AS, supplied by MND Safety (Berger et al., 2024). TFK is generally satisfied with the performance of both systems, and it’s clear that RACS works very well as a mitigation method. This article, however, will focus on the challenges encountered, rather than the successful operational outcomes. In Grøtfjorden, we have experienced occasional failed detonations (duds). The issue was particularly prominent during the 2023/24 season and was caused by faulty detonators. There have been no duds after changing the supplier of detonators. The handling of duds varies depending on operational conditions and the assessed risk level. The occurrence of duds and partial detonations creates additional stress for involved personnel and requires specific mitigation measures before the road can reopen. The incidents in Grøtfjorden have demonstrated that duds can occur, and despite improvements made it is reasonable to assume that a residual risk will always remain. Consequently, there has been a need to develop improved procedures for handling duds in Grøtfjorden. On Arnøya it quickly became evident that the selected trigger points were far from optimal. As the first winter progressed, several units were increasingly affected by heavy snow loading. In March 2025, a natural size-D3 avalanche destroyed one unit, and two additional units were damaged by other avalanches. Based on our experience, these issues were likely caused by a combination of limited planning time, an incomplete understanding of the design limitations of the system, and an unclear distribution of responsibilities regarding the detailed design of installation points. To avoid similar challenges in future projects, several important steps have been identified and acknowledged. A thorough understanding of avalanche dynamics, and the design limitations of the proposed RACS system is essential. Based on the lessons learned from Arnøya, it is our belief that primary responsibility of the detailed design should rest with the infrastructure owner, rather than the RACS supplier."],"kw":"RACS, Grøtfjorden, Duds, Arnøya, Damaged","ty":"P","pp":77,"em":[],"r":null,"day":"Fri","th":"Incidents and Case Studies","pr":"Andreas Persson"},"78":{"id":"78","t":"A Methodological Framework to Assess Avalanche Bulletin Understanding and Terrain Selection: A Proof of Concept in Andorra","au":[{"n":"B Aguirre-Noguera","raw":"Aguirre-Noguera, B","p":true,"aff":""},{"n":"EI Farías-Torbidoni","raw":"Farías-Torbidoni, EI","p":false,"aff":""},{"n":"J Revuelto","raw":"Revuelto, J","p":false,"aff":""},{"n":"M Llena","raw":"Llena, M","p":false,"aff":""},{"n":"A Margalef","raw":"Margalef, A","p":false,"aff":""},{"n":"M Pons","raw":"Pons, M","p":false,"aff":""}],"ab":["Understanding how backcountry users interpret and act upon avalanche hazard information and terrain remains a central challenge in avalanche hazard management. This study presents an integrated methodological framework linking avalanche hazard communication, users’ hazard perception, and terrain selection under real-world conditions, providing insights into how users combine these sources of information when managing avalanche risk. The primary objective is to assess whether users’ terrain choices are consistent with the spatial distribution of avalanche hazard described in the Avalanche Bulletin, and to what extent terrain selection is used as a risk mitigation strategy. The approach combines structured surveys, drone-based remote sensing, GNNS tracking, geographic information systems (GIS), and statistical analysis to bridge the gap between stated and observed behaviour. Data collection was conducted in the western Pyrenees (Andorra) and comprised two complementary components. Structured surveys captured user characteristics, avalanche education and experience, use and understanding of the Avalanche Bulletin, information used for itinerary planning, perceived avalanche hazard distribution, and planned route choices. Drone imagery and GNNS tracking were used to characterize observed movement patterns and terrain use under different avalanche danger conditions. These datasets were analyzed in relation to daily Avalanche Bulletin information and Avalanche Terrain Exposure Scale (ATES) classifications. The complete field dataset enabled the evaluation of relationships between Avalanche Bulletin information, drone-derived observations, and ATES terrain classification, as well as between Avalanche Bulletin information and survey responses. However, fully integrating survey, drone, and Avalanche Bulletin data remains methodologically challenging. Drone observations are subject to temporal uncertainty because operational and weather constraints prevented daily flights. During periods of meteorological stability, observed tracks may therefore represent activity accumulated over several days rather than conditions corresponding exclusively to the flight date. The results provide a basis for refining the methodology, with future work focusing on improving the temporal alignment between the three data sources and quantifying and reducing uncertainty associated with drone-derived observations. This will support a more robust assessment of the relationships between communicated hazard, perceived risk, and observed decision-making, contributing to humancentred approaches to avalanche safety and improved understanding of how Avalanche Bulletins inform risk management decisions."],"kw":"","ty":"P","pp":78,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"B Aguirre-Noguera"},"79":{"id":"79","t":"Avalanche Activity Monitoring and Alarming at Mottec, Valais, Switzerland – a Combined Approach to Ensure Construction Site Safety","au":[{"n":"Ólafur Stitelmann","raw":"Stitelmann, Ólafur","p":true,"aff":""},{"n":"Théo St-Pierre Ostrander","raw":"Ostrander, Théo St-Pierre","p":false,"aff":""},{"n":"Maxence Carrel","raw":"Carrel, Maxence","p":false,"aff":""},{"n":"Ivan Sanchez","raw":"Sanchez, Ivan","p":false,"aff":""},{"n":"Marc Délèze","raw":"Délèze, Marc","p":false,"aff":""}],"ab":["The Mottec power plant is part of the hydropower facility operated by Forces Motrices de la Gougra, located in the Val d’Anniviers, Valais, Switzerland. It is a high head (600 m) pump-storage power plant with water stored in the Turtmannsee reservoir. Renovation works to a subterranean penstock require regular helicopter flights to transport and unload material in a zone exposed to avalanche hazard. The unloaded material must then be moved within the access tunnel leading to the penstock. Uninterrupted operation of the construction in winter is key to the progress of the renovation works. Local avalanche experts set up a safety concept stating that during days with avalanche danger 4 or 5, none of the workers are allowed to exit the tunnel. To be able to work during avalanche danger 3 days, an avalanche radar connected to alarming units was installed and operated in the 2025 / 2026 avalanche season. The alarm system uses Doppler radar to detect avalanches by analyzing reflected waves. When an avalanche occurs, the reflected signal returns to the radar at a different frequency than the emitted signal. This frequency shift enables the system to calculate the avalanche’s velocity, and location by applying additional processing based on signal travel time. Once detection occurs alarms are activated so affected workers can evacuate the construction site, and exposed roadways can be closed. The zone being monitored lies at an elevation significantly higher than the sites requiring alarm response, because of this, there is ample time to react. Detection and alarming additionally support mitigative and forecasting efforts as event verification, or lack thereof steers the response in terms of mitigative actions. These combined factors have expanded the operational setting for construction and maintenance works which can occur at avalanche danger 3 level. This illustrates adaption and innovation to meet the increasing demands on vital infrastructure through utilizing state of the art technology in parallel with proven forecasting and mitigation schemes."],"kw":"Avalanche Radar, Alarming System, Hydro-power plant.","ty":"P","pp":79,"em":[],"r":3621,"day":"Tue","th":"Operations and Program Management","pr":"Ólafur Stitelmann"},"81":{"id":"81","t":"A Study of Repeating Persistent Slab Avalanches Along the Park City Ridgeline: The Effects of Removing New Snow Above a Weak Layer","au":[{"n":"Mike Craig","raw":"Craig, Mike","p":true,"aff":""}],"ab":["Slide paths containing shallow snow depths can present a more unpredictable hazard. When a thick slab is unable to form above a persistent weak layer (PWL) to begin the healing process, it may be possible for weak layers to remain active through an entire season. This case study, from the Park City (PC) Ridgeline (Utah) during the 2024-25 season, documents how starting zones remained thin & weak due to repeated persistent slab avalanche release, as terrain adjacent to the “repeater” paths began to strengthen much earlier. The goal is to better understand and quantify how removing stronger snow above a PWL can lead to delayed strengthening and future reactivity. Field observations, snow profiles, weather data and avalanche activity are combined throughout three major cycles in upper elevation, northerly aspects (Intermountain snowpack). Early-season drought produced a shallow snowpack with continuous near surface faceting that became reactive during loading events in late December. Weak layers were then left exposed in starting zones with no slab above. Snow profile data suggests these weak layers were unable to heal during extended high-pressure periods and remained prone to reactivation with subsequent loading events. In contrast, adjacent terrain that did not avalanche maintained deeper and more uniform slab development, allowing faceted layers to strengthen more quickly. Repeater avalanche paths required significant slab thickening without additional avalanche release to reduce temperature gradients and allow faceted grains to round and strengthen. Sintering of these weak layers occurred in mid-March and coincided with spring warming trends and two prolonged storm cycles with evenly-distributed precipitation over roughly 48- and 36-hour periods. When new snow is removed above a PWL, healing is delayed and the weak layer can remain reactive well after surrounding terrain has stabilized. RAC systems, hand charges and other explosives can create the “repeater avalanche path scenario” as they can strip the slab leaving behind exposed weak layers and a shallow snowpack with thin future trigger locations. Repeater avalanches (whether released naturally or artificially) can create dangerous hazard throughout the season, requiring the use of more explosives and necessitating longer closures during persistent slab avalanche cycles."],"kw":"SLAB FORMATION, SHALLOW SNOWPACK, REPEATER SLIDE-PATH, PERSISTENT WEAK LAYER","ty":"P","pp":80,"em":[],"r":3495,"day":"Mon","th":"Avalanche Formation","pr":"Mike Craig"},"82":{"id":"82","t":"Reevaluating the “10 Contributory Factors”: Data-Driven Methodology for Avalanche Activity Prediction","au":[{"n":"David E. Gluckman","raw":"Gluckman, David E.","p":true,"aff":""},{"n":"Steven Clark","raw":"Clark, Steven","p":false,"aff":""}],"ab":["In operational practice, many avalanche forecasters rely primarily on subjective experience to provide risk assessments. Long-standing ideas of contributory factors are referenced today, yet remain unrefined in the context of destructive avalanche activity and contemporary forecasting techniques. In this work, we evaluate the \"10 Contributory Factors\" through a multivariate framework of machinelearning classifiers, using a decade of high-confidence meteorological, snowpack, and avalanche activity data from Little Cottonwood Canyon, Utah. These classifiers, trained on our parameterization of the 10 Factors across a range of forecast length and hindsight interval combinations, predict an operationally actionable avalanche hazard target. Our models achieve balanced accuracies of 86% and 83% at 24- and 12-hour foresight lengths, respectively. Snowpack instability metrics, derived from physicallybased snow cover simulations, emerge as dominant predictors of avalanche activity. This reinforces contemporary snowpack modeling as a core component of data-driven forecasting. Our approach offers avalanche operations an achievable path toward generating powerful, data-driven insights. Further, our results demonstrate the potential of data-driven methods to provide objective, quantitatively grounded support for operational decision-making."],"kw":"Avalanche forecasting, contributory factors, machine learning, data-driven models","ty":"P","pp":81,"em":[],"r":3558,"day":"Tue","th":"Avalanche Forecasting","pr":"David E. Gluckman"},"83":{"id":"83","t":"Whumpfing of a Persistent Depth Hoar Weak Layer: Analysis of a Rare Combination of Manual Stability Tests and Automated Snow Measurements","au":[{"n":"Benjamin Walter","raw":"Walter, Benjamin","p":true,"aff":""},{"n":"Christoph Marty","raw":"Marty, Christoph","p":false,"aff":""},{"n":"Fabian Wolfsperger","raw":"Wolfsperger, Fabian","p":false,"aff":""},{"n":"Alec van Herwijnen","raw":"van Herwijnen, Alec","p":false,"aff":""},{"n":"Francesco Pellegrini","raw":"Pellegrini, Francesco","p":false,"aff":""},{"n":"Alexandra von der Esch","raw":"von der Esch, Alexandra","p":false,"aff":""},{"n":"Yiyao Chen","raw":"Chen, Yiyao","p":false,"aff":""},{"n":"Kalin Markov","raw":"Markov, Kalin","p":false,"aff":""}],"ab":["Whumpf sounds indicate the collapse of a buried weak layer and are associated with fracture propagation over distances of tens of meters without avalanche formation. We investigated a whumpf event triggered on 26 February 2026 at the well instrumented Weissfluhjoch test site, Switzerland, during repeated dynamic loading of a non-isolated snow column. Field observations were combined with snow stratigraphy, automated snow-height and pressure-based snow water equivalent measurements. The event produced a surface settlement of approximately 7 mm and a rapid increase in the pressure recorded by snow scales, followed by relaxation toward pre-event pressures over 2–3 hours. We interpret these observations as evidence of rapid stress redistribution within the snowpack during fracture propagation due to strain softening, followed by a slower recovery toward pre-whumpf conditions through slab hardening associated with sintering and progressive bond strengthening."],"kw":"Depth Hoar, Persistent Weak Layer, Whumpf, Fracture Propagation, Snow Stability","ty":"P","pp":82,"em":[],"r":null,"day":"Fri","th":"Snowpack Properties","pr":"Benjamin Walter"},"84":{"id":"84","t":"Recent Advances in Measuring Snow Physical Properties: Density, Specific Surface Area, and Liquid Water Content","au":[{"n":"Benjamin Walter","raw":"Walter, Benjamin","p":true,"aff":""},{"n":"Valentin Philippe","raw":"Philippe, Valentin","p":false,"aff":""},{"n":"Leah Gaillard Festa","raw":"Festa, Leah Gaillard","p":false,"aff":""},{"n":"Michael Lombardo","raw":"Lombardo, Michael","p":false,"aff":""},{"n":"Lars Mewes","raw":"Mewes, Lars","p":false,"aff":""}],"ab":["Accurate measurements of snow density, specific surface area (SSA), and liquid water content (LWC) are essential for studying snow metamorphism, snow physical properties, snow processes, and for developing snow cover models. We present recent advances in three different snow measurement techniques developed and applied at the WSL Institute for Snow and Avalanche Research SLF. First, the SnowImager instrument enables rapid, high-resolution optical measurements of SSA and density, with ongoing developments targeting spatially resolved LWC measurements. Second, a unique ten-year record of daily SnowMicroPen measurements at Weissfluhjoch demonstrates the potential for monitoring the seasonal evolution of snow density, SSA, and stratigraphy at unprecedented temporal and vertical resolution. Finally, preliminary time-domain nuclear magnetic resonance measurements show a strong linear response to LWC and indicate the potential for highly accurate reference measurements. Together, these complementary techniques provide new opportunities for efficient snow characterization, process studies, model validation, and the generation of high-quality datasets for machinelearning applications."],"kw":"Snow microstructure, Density, Specific surface area, Liquid water content, Cryosphere monitoring.","ty":"P","pp":83,"em":[],"r":null,"day":"Fri","th":"Snowpack Properties","pr":"Benjamin Walter"},"85":{"id":"85","t":"Testing of Drone Avalanche Control in Jasper National Park","au":[{"n":"Amanda Bischke","raw":"Bischke, Amanda","p":false,"aff":""}],"ab":["Recent technological and regulatory advances in drones have enabled the technology to become a new avalanche control tool. The flexible use of drones has the potential to allow for more geographic versatility than Remote Avalanche Control Systems (RACS) and to reduce human exposure to flight hazards from helicopter-based missions. In August 2025, Transport Canada issued a Special Flight Operations Certificate to AVSS, allowing for the Canadianowned, designed, and manufactured Precision Avalanche Management System (PAMS) to move into testing with explosives. Missions were conducted in Jasper National Park in February and March 2026. The Canadian regulatory framework is evolving with the technology and at the time of testing also required compliance with or approvals from Natural Resources Canada, provincial occupational health and safety, and Parks Canada. The first mission focused on validating flight capabilities and the ignition system in a mountain environment. The drone proved to be a reliable tool for avalanche control from valley bottom, utilizing less than half of the battery’s capacity per flight. The second mission assessed operational efficiency, yielding one shot every 15 minutes. Mountain and ‘lab’ testing of over 300 drops demonstrated a reliable system, with a >99% initiation rate, a >98% drop rate and a >99% target accuracy. One misfire occurred due to the breaking of the crimped pull wires. The pilot was able to utilize the drone to deploy a secondary charge that destroyed the misfire. The hazard was mitigated right away, avoiding human exposure from approaching the charge and bypassing the standard one hour wait time. Industry feedback from the trials indicates that widespread adoption depends on operational efficiency. The majority of the time during these missions was spent in the air, flying from staging to targets. A multi-charge payload would reduce operational time. Furthermore, the industry has requested the ability to deploy larger explosive charges, such as ANFO bags over the 5lb cast boosters."],"kw":"Drone, Avalanche control, RPAS, UAS","ty":"O","pp":84,"em":[],"r":3460,"pr":"Amanda Bischke"},"86":{"id":"86","t":"Scaling Operational SNOWPACK Modeling: Infrastructure Challenges at the 2.5 Km NWP Grid Resolution","au":[{"n":"Bryce Schroers","raw":"Schroers, Bryce","p":true,"aff":""},{"n":"Simon Horton","raw":"Horton, Simon","p":false,"aff":""}],"ab":["Avalanche Canada runs a SNOWPACK simulation every morning, so that forecasters begin the day with modelled snow profiles and stability indices. Until recently the chain simulated about 1,200 points on a coarse grid aggregated from finer terrain, smoothing away spatial variability a forecaster needs to see. To give uniform coverage instead, we moved it onto the fully distributed 2.5 km HRDPS weather-model grid: 41,127 points, each simulated as a flat field plus four virtual slope aspects. The snow physics absorbed the resulting thirty-fold increase, but the storage beneath it did not. The limit we reached was not the volume of data but the number of files holding it: SNOWPACK writes its results as text, one set per simulated profile, so a single morning update now produces 1.1 million of them. Finding, creating and describing those files cost 22.5 million filesystem requests before a single byte of data moved, roughly eighteen per file. Requests, not bandwidth, set the ceiling on the shared network filesystem: the day’s fastest data transfer used 17 % of its request budget, while a bookkeeping peak on one sixth as much data used 52 %. We describe a SNOWPACK output plugin that writes profiles, time series and restart state into Zarr, which keeps large arrays as a few compressed pieces rather than many small files. We chose Zarr because our post-processing is moving to xsnow, a Python library that reads these stores directly. The plugin is not a faster writer (it costs about 8 % more processor time), but it asks far less of the filesystem: 4.8 times fewer objects, 3.2 times less data, and 411,270 restart-state files no longer written. At production’s own concurrency the modelling stage finishes in 48.8 minutes instead of 97.9. Because each job writes its own store rather than sharing one, adding jobs keeps making it faster: eight times as many brings the forecast segment alone down to 11.8 minutes. Value by value against the text output, the simulated snowpack is unchanged. Halving the modelling time puts profiles in front of forecasters earlier and opens the door to a second daily run, ensembles, and finer grids."],"kw":"snowpack modelling, operational forecasting, high-performance computing, data formats, model output, cloud infrastructure","ty":"P","pp":85,"em":[],"r":null,"day":"Thu","th":"Modelling and Quantitative Forecasting","pr":"Bryce Schroers"},"87":{"id":"87","t":"Insights into Avalanche Flow Regimes from a High Precipitation, High Relief Region in New Zealand","au":[{"n":"Aubrey Miller","raw":"Miller, Aubrey","p":true,"aff":""},{"n":"Pascal Sirguey","raw":"Sirguey, Pascal","p":false,"aff":""},{"n":"Perry Bartelt","raw":"Bartelt, Perry","p":false,"aff":""},{"n":"Nicolas Cullen","raw":"Cullen, Nicolas","p":false,"aff":""},{"n":"Yves Bühler","raw":"Bühler, Yves","p":false,"aff":""}],"ab":["Snow avalanches in high-relief maritime mountains may release from cold alpine snowpacks yet descend through the rain-snow transition into warm, saturated or snow-free terrain. This creates complex flow behavior that is difficult to characterize and where observations and distributed snowpack modelling are limited. Four winter seasons (2021– 2024) in two adjacent paths above Hooker Lake, Aoraki Mount Cook National Park, New Zealand were examined. A timelapse camera network and PlanetScope imagery documented 197 avalanches, while nearby weather stations characterized release meteorology. Principal component analysis and clustering of daytime events identified three meteorological regimes: a) moderate precipitation and higher wind speeds, b) colder snow loading and c) extreme precipitation. Five avalanches (Size 4-5) spanning these conditions were examined with photographs, meteorology and, for the largest event, RAMMS::EXTENDED modelling. The example avalanches show that substantial new snow and wind loading can persist in high-elevation release zones while rain, warming and snow depletion affect the lower track. The bestdocumented transition produced a powder cloud in the upper track that dissipated while its dense core slowed, entrained sediment and entered Hooker Lake. The only Size 5 avalanche observed released overnight from connected wind-loaded areas, travelled approximately 2.5 km and left debris covering approximately 40 ha of the lower track and lake. Dynamic modelling reproduced the runout and flow patterns, with simulated core flow heights exceeding 10 m and over 378,000 m³ deposited within the observed extent. These results demonstrate that release conditions alone may not represent the flow regime encountered further downslope. Forecasting and hazard planning in high-relief terrain should therefore account for cold-to-warm transitions, sediment entrainment and rapid changes in snow availability across elevation—processes likely to become increasingly relevant as climate change affects hazards."],"kw":"Flow regime change, large avalanche, maritime, RAMMS, New Zealand","ty":"O","pp":86,"em":[],"r":3429,"pr":"Aubrey Miller"},"88":{"id":"88","t":"Snow Avalanche Exposure and Consequences in Norway","au":[{"n":"Håvard B. Toft","raw":"Toft, Håvard B.","p":true,"aff":""},{"n":"Pierrick S. Nicolet","raw":"Nicolet, Pierrick S.","p":false,"aff":""},{"n":"Tore Humstad","raw":"Humstad, Tore","p":false,"aff":""}],"ab":["This study provides a national overview of snow avalanche exposure and consequences in Norway across three key sectors: buildings, roads, and backcountry travel. By combining multiple national and regional datasets, we quantify where people, infrastructure, and activities are exposed to avalanche hazard and describe the human and societal consequences associated with avalanche events and disruptions. The exposure of buildings is assessed by combining the national building registry with the most recent avalanche hazard indication maps, which delineate areas potentially affected by snow avalanches with a target return period of 1000 years. This provides a national estimate of the number and spatial distribution of buildings and residents located within avalanche-prone terrain. Avalanche exposure on the public road network is assessed using data from the Norwegian Public Roads Administration, including records of avalanches affecting roads and the frequency and duration of road closures. By combining traffic operation data with traffic volumes, we quantify exposure in terms of the number of vehicles potentially affected by avalanche-related disruptions. Recreational exposure is examined using beacon checker data, submitted GPS tracks, and a wisdom-ofthe-crowds approach to estimate current backcountry skiing activity and reconstruct changes in participation between 2005 and 2025. In addition, we examine observed avalanche consequences, including fatalities, injuries, near misses, search and rescue operations and healthcare impacts. Together, these analyses provide a national description of how snow avalanche exposure and consequences are distributed across the Norwegian society and how their relative importance differs between sectors."],"kw":"Avalanche, Exposure, Consequences, Buildings, Roads, Recreation","ty":"P","pp":87,"em":[],"r":null,"day":"Thu","th":"Risk Communication","pr":"Håvard B. Toft"},"89":{"id":"89","t":"A Method to Count Backcountry Skiers from Bluetooth Low Energy Signals","au":[{"n":"Håvard B. Toft","raw":"Toft, Håvard B.","p":true,"aff":""},{"n":"Vegard Vereide","raw":"Vereide, Vegard","p":false,"aff":""},{"n":"Ingeborg Bruflot","raw":"Bruflot, Ingeborg","p":false,"aff":""},{"n":"Aron Widforss","raw":"Widforss, Aron","p":false,"aff":""},{"n":"Eirik Gravdal","raw":"Gravdal, Eirik","p":false,"aff":""},{"n":"Olav K. Myksvoll","raw":"Myksvoll, Olav K.","p":false,"aff":""},{"n":"Audun Hetland","raw":"Hetland, Audun","p":false,"aff":""}],"ab":["Quantifying the number of people participating in backcountry skiing is essential for understanding patterns of use, user characteristics, and exposure to avalanche hazard. However, monitoring backcountry use remains challenging due to the dispersed, unregulated, and remote nature of these areas. Existing approaches often rely on surveys, manual observations, or indirect methods, each with limitations in spatial coverage, scalability, and cost. This study presents the development and evaluation of a scalable method for quantifying backcountry use based on Bluetooth Low Energy (BLE) sensing. The method builds on a multi-year development process, progressing from proof-ofconcept to large-scale deployment. Initial testing in the Tromsø region during 2022–2023 confirmed that the prototype worked by comparing its counts with the number of people observed using a time-lapse photography. Subsequent deployments included 30 devices (2023–2024), where a firmware issue reduced the operational period, followed by smaller-scale validation deployments in Sogndal (2024–2025). The most recent phase (2025–2026) includes 50 devices deployed in Lyngen and 8 in Sogndal. The sensing approach is based on detecting nearby BLE devices as a proxy for human presence. A key challenge in BLE-based counting is the potential for repeated detections of the same individual and variation in device detectability. To address this, the method is validated using time-lapse photography to identify the number of backcountry skiers, enabling calibration of detection ratios and uncertainty estimates. The results show that BLE sensing provides a cost-effective, scalable, and flexible method for monitoring backcountry use in remote areas, with strong potential to improve estimates of exposure in avalanche terrain and support more effective avalanche warning services."],"kw":"Counting, Backcountry skiing, BLE","ty":"P","pp":88,"em":[],"r":null,"day":"Thu","th":"Risk Communication","pr":"Håvard B. Toft"},"90":{"id":"90","t":"Comprehension Validation of the Revised EAWS Danger Scale Descriptors: Lessons from a Large-Scale European End User Survey on Avalanche Risk Perception","au":[{"n":"Philip A. Ebert","raw":"Ebert, Philip A.","p":true,"aff":""},{"n":"Frank Techel","raw":"Techel, Frank","p":false,"aff":""},{"n":"Matthias Walcher","raw":"Walcher, Matthias","p":false,"aff":""},{"n":"Benjamin Reuter","raw":"Reuter, Benjamin","p":false,"aff":""},{"n":"Igor Chiambretti","raw":"Chiambretti, Igor","p":false,"aff":""},{"n":"Lorenzo Bertranda","raw":"Bertranda, Lorenzo","p":false,"aff":""},{"n":"Montse Bacardit Peñarroya","raw":"Peñarroya, Montse Bacardit","p":false,"aff":""},{"n":"Jaka Ortar","raw":"Ortar, Jaka","p":false,"aff":""},{"n":"Mark Diggins","raw":"Diggins, Mark","p":false,"aff":""},{"n":"Karsten Müller","raw":"Müller, Karsten","p":false,"aff":""},{"n":"Gerit Pfuhl","raw":"Pfuhl, Gerit","p":false,"aff":""}],"ab":["The descriptors of the European avalanche danger scale, in use since 1993, are being revised. In June 2025 EAWS forecasters agreed on a new provisional wording and, in doing so, provided its content validation. Because the descriptors are first of all a public communication tool, we ran a comprehension validation: a survey testing whether end users read the wording as forecasters intend. It ran online from 3 February to 8 April 2026 in six languages and retained 17,335 responses after cleaning, of which 15,749 were completed. All wording comparisons were randomised between subjects. We evaluated each proposal against three conditions: correctness (do users recover the order forecasters intend?), simplicity (how easy is the task?), and increase (does the wording convey how much the danger increases from level to level?). For avalanche occurrence the main finding is reassuring: all four wording variants were ranked accurately (83–92 % correct), and most differences that reach significance in the pooled data do not survive within individual languages. Only the variant that drops the distribution wording is clearly weaker. On the increase condition the variants do separate. Respondents placed the four statements on a continuous danger scale; wording level 2 as “in some places” rather than “in a few places” moves it closer to level 3 and shrinks the perceived difference between moderate to considerable from 36 % to 31 % of the distance between levels 1 and 4 (Cohen’s d = 0.39, p < 0.001). For size and impact the wording effect is large: adding size class words (small, medium, large, very large) to the impact wording raised accuracy from 61 % to 95 % and self-reported ease from 4.7 to 6.1 (Cohen’s d = 1.04). Most of that failure comes from using “bury and kill” at both levels 1 and 2, which makes them hard to tell apart. We also report how users read seven phrases that forecasters already use. For avalanche occurrence, the largest differences are between languages rather than between wordings."],"kw":"Avalanche danger scale, risk communication, risk perception, descriptors, multilingual communication","ty":"P","pp":89,"em":[],"r":null,"day":"Thu","th":"Risk Communication","pr":"Philip A. Ebert"},"92":{"id":"92","t":"Arizona’s Elevation Snow Density Study on the San Francisco Peaks","au":[{"n":"David B K Pedersen","raw":"Pedersen, David B K","p":false,"aff":""},{"n":"David W Lovejoy","raw":"Lovejoy, David W","p":false,"aff":""}],"ab":["Variability in storm snow density along an elevation gradient has been frequently observed, however, systematic attempts to correlate these variables have not. In this study, storm snow depths and densities were sampled from five study sites ranging in elevation from 2174m to 3536m on the western aspects and base of San Francisco Peaks, Coconino County, Arizona. Over four winters (2020-21 through 2023-24) near-synchronized sampling was conducted when precipitation parameters met specific protocols. Each site was paired with an automated weather station to enable further analysis of factors contributing to densification. Findings are potentially useful for snow water resource assessment and prediction, as well as, to assess the immediate impact of storm snow loading on preexisting weak layers, and the potential for destabilization of the seasonal snowpack."],"kw":"snow density, snow water equivalent, San Francisco Peaks","ty":"P","pp":90,"em":[],"r":null,"day":"Fri","th":"Snowpack Properties","pr":"David B K Pedersen"},"93":{"id":"93","t":"Cause of Death in Avalanches in Colorado, USA: A 31-Year Review","au":[{"n":"Spencer Logan","raw":"Logan, Spencer","p":true,"aff":""},{"n":"Dale Wang","raw":"Wang, Dale","p":false,"aff":""},{"n":"Alison Sheets","raw":"Sheets, Alison","p":false,"aff":""},{"n":"Ethan Greene","raw":"Greene, Ethan","p":false,"aff":""}],"ab":["We examined the causes of death for 178 avalanche fatalities in Colorado, USA, between 1995 and 2026. We utilized data from the Colorado Avalanche Information Center (CAIC) database and official records from county coroners, including autopsy when available. Asphyxiation is the primary cause of death, accounting for 65% of fatalities, while trauma accounts for 22%. Annual fatalities showed high volatility without a significant linear trend. There was an increase in the proportional deaths attributed to asphyxiation in the 2016 to 2025 period. We calculated Injury Severity Score (ISS) for 100 cases. Victims assigned trauma as cause of death had significantly higher ISS scores than those who died from asphyxiation. Some victims assigned asphyxiation also exhibited significant traumatic injuries, underscoring the importance of autopsies when possible. We found no significant differences in the cause of death based on activity or avalanche type, suggesting that the asphyxiation-to-trauma ratio is a persistent characteristic of avalanche fatalities in Colorado. Our findings reinforce the continued importance of interventions to reduce the potential for asphyxiation--avoidance, reducing burial depth, and rapid rescue. Serious traumatic injuries among almost a quarter of victims highlight the need for rescuers to be prepared for both burial and complex trauma scenarios. Future research will continue to leverage improved collection methods for non-fatal avalanche injuries to further refine our understanding of these hazards."],"kw":"avalanche fatalities, avalanche accidents, asphyxia, trauma.","ty":"P","pp":91,"em":[],"r":3496,"day":"Mon","th":"Avalanche Rescue","pr":"Spencer Logan"},"94":{"id":"94","t":"A Process for Making Evidence-Based Updates to Recreational Avalanche Curriculum Tools","au":[{"n":"Emma Walker","raw":"Walker, Emma","p":true,"aff":""},{"n":"Ron Funderburke","raw":"Funderburke, Ron","p":false,"aff":""},{"n":"Kelly McNeil","raw":"McNeil, Kelly","p":false,"aff":""},{"n":"Aaron Ball","raw":"Ball, Aaron","p":false,"aff":""}],"ab":["The AIARE fieldbook is the primary tool instructors use to deliver AIARE recreational avalanche courses, as well as a post-course planning and reference tool for backcountry travelers. Although the fieldbook has been a cornerstone of AIARE's curriculum for nearly two decades, it has not undergone a significant update since the 2017–18 season. The empirical foundation for the revision discussed in this paper comes from two previous studies: a three-year investigation of how AIARE 1 courses influence backcountry behaviors and a survey-based examination of fieldbook value, use patterns, and barriers. Using information from these studies to guide them, AIARE's team of curriculum specialists developed and filtered updates through multiple stakeholder groups at each step. Stakeholders included the researchers behind both studies, AIARE's Technical Committee, and a working group of approximately 70 instructors and course providers. This paper presents the fieldbook's updated learning outcomes, the techniques used to achieve them, and the start-to-finish process for making evidencebased curriculum updates that will improve the effectiveness of AIARE's recreational avalanche courses."],"kw":"Avalanche education; Program evaluation; Action-oriented learning outcomes; Educational best practices; Pedagogy.","ty":"P","pp":92,"em":[],"r":3497,"day":"Mon","th":"Avalanche Education","pr":"Emma Walker"},"95":{"id":"95","t":"The Last Frontier of Avalanche Safety: Public Information, State Agencies, and Nonprofits in Alaska","au":[{"n":"Tim Rogers","raw":"Rogers, Tim","p":true,"aff":""}],"ab":["For the last fifty years, Alaska has led the United States in cumulative, per capita avalanche deaths, with the second most fatalities and the second smallest population base. Since 2001, there have been almost 50 fatalities in the state, all of which were recreational and the majority occurred in an area not covered by a current avalanche forecast. Alaska is also one of the youngest states, being established just 67 years ago. Throughout the state’s relatively short history, several avenues have been explored to address avalanche safety, including developing state agency avalanche programs and establishing a statewide avalanche forecast center. While some of these efforts have been successful and remain ongoing, others were abandoned, and in their place a number of community-supported, nonprofit organizations have been established to educate, alert, and respond to avalanche hazard and accidents throughout Alaska. This paper explores the ways in which these nonprofit organizations have filled the gaps left by the failure of the state’s original avalanche warning system, and what role nonprofit organizations play in Alaska’s future public avalanche safety network. Key findings include the identification of an unfunded mandate that assigns responsibility to the Department of Pubic Safety to develop a statewide avalanche warning system, an overview of the variety of nonprofit organizations and their role in supporting avalanche safety initiatives throughout Alaska, and identification of several ways that state and municipal government agencies can support nonprofit agency work."],"kw":"Alaska, Public Safety, Nonprofit, Avalanche Centers","ty":"P","pp":93,"em":[],"r":3559,"day":"Tue","th":"Operations and Program Management","pr":"Tim Rogers"},"96":{"id":"96","t":"Changes in Avalanche Fatalities by Activity and Associated Challenges in Winter Outdoor Recreation in Japan","au":[{"n":"Degawa Azusa","raw":"Azusa, Degawa","p":true,"aff":""}],"ab":["In Japan, 214 fatal avalanches have occurred over the past 35 years (1991–2025), resulting in 316 deaths. Of these, 84% (267) of the fatalities belonged to the winter outdoor recreation category. The activities included mountaineering, backcountry skiing or snowboarding, snowshoe hiking, snowmobiling, mountain stream fishing, and skiing at ski resorts. The fatalities included people enjoying these activities as leisure and commercial guided tours. The changes in the number of fatalities for each of these winter outdoor activities were summarized as follows: (1) Mountaineering fatalities, which accounted for about 70% of all fatalities in the 1990s, declined in the 2000s, and have not changed significantly since then; (2) Skier fatalities have increased significantly between 2006 and 2016, but have declined in recent years; (3) Major accidents with more than three fatalities have decreased; (4) Snowboarder fatalities are slightly increasing; (5) Half of the skier fatalities in the last 10 years have been foreign nationals, with many accidents involving expert skiers such as guides or professional skiers. This paper reports on the changes in the number of fatalities by activity, and the effectiveness and challenges of the various safety measures implemented by our organization thus far. At the same time, this paper expresses a strong sense of urgency about the increasing number of fatalities among those who visit Japan in search of \"JAPOW\" snow, and highlights the need for cooperative relationships with specialized institutions in various countries."],"kw":"Avalanche Accidents,","ty":"P","pp":94,"em":[],"r":null,"day":"Fri","th":"Incidents and Case Studies","pr":"Degawa Azusa"},"97":{"id":"97","t":"Field Identification of Long-Term Trends in Mixed Forms: A Comparison of Photo Analyzed Grains and Morphological Processes Observed by Snowpack","au":[{"n":"Claire G. Bicknell","raw":"Bicknell, Claire G.","p":true,"aff":""},{"n":"Eeva Latosuo","raw":"Latosuo, Eeva","p":false,"aff":""}],"ab":["Rounding Faceted Particles (FCxr) and Faceted Rounded Particles (RGxf), previously known as mixed forms, are unique in that they are categorized by both shape and metamorphic processes. This study investigates whether infield practices that use corner shape to infer metamorphic processes can reliably determine whether a grain is faceting or rounding. This was tested by comparing photo-analyzed corners of grains in the field to metamorphic processes simulated by SNOWPACK. Over an 8-week period in the Talkeetna Mountains of Alaska, four layers of mixed forms were tracked across 16 samples in a study plot. Corner angles of the individual grains were then measured from highresolution photographs and classified using a threshold angle of 119.1° derived from an expert-classified grain library. The corresponding layer processes were then modeled using SNOWPACK, with representative meteorological inputs from weather models and nearby stations. A logistic regression analysis found the lack of a statistically significant relationship between corner angle classification and modeled metamorphic behavior (p = 0.215), and a low agreement rate of 47% between angle-based and simulated classifications. These results suggest corner angle alone may not be a reliable indicator of metamorphic processes in the field. These findings suggest field classifications of mixed forms should prioritize grain shape over the inferred process. Field observations may still provide valuable morphological insights, but interpreting metamorphic processes likely requires a combination of observations, weather history, and simulation tools."],"kw":"Faceted Round Particles, Rounding Faceted Particles, Metamorphosis, SNOWPACK","ty":"P","pp":95,"em":[],"r":null,"day":"Fri","th":"Snowpack Properties","pr":"Claire G. Bicknell"},"99":{"id":"99","t":"Drones in the Mountains: The Jasper Visitor Safety Remotely Piloted Aircraft System (RPAS) Program","au":[{"n":"Darren Farley","raw":"Farley, Darren","p":true,"aff":""}],"ab":["Jasper Visitor Safety is responsible for avalanche forecasting, avalanche control, and search and rescue (SAR) across Jasper National Park, an approximately 11,000 km² park in the Canadian Rockies, Alberta. The park’s remote character and limited seasonal access to rescue helicopters prompted Jasper Visitor Safety to develop an in house Remotely Piloted Aircraft System (RPAS, or drone) program with the aim of training staff as competent pilots and using drones for search and rescue and, ultimately, avalanche control. This paper describes the program’s aims, current fleet and equipment, training pathway, and operational experience to date. Drones have proven their value in several search and rescue operations, including night searches with infrared imaging, initial assessment of possible avalanche burials, and delivery of survival equipment to subjects. In parallel, Jasper Visitor Safety has supported live testing of drone delivered avalanche control and sees the drone as a complement to, rather than a replacement for, avalanche control with helicopters. Current limitations include line of sight radio range, payload flight endurance, and reduced performance relative to helicopters in poor weather and long control missions. The paper concludes that RPAS meaningfully extends the reach, safety, and cost-efficiency of a remote mountain avalanche and rescue program."],"kw":"RPAS, UAV, drone, avalanche control, search and rescue, Jasper National Park","ty":"O","pp":96,"em":[],"r":3389,"pr":"Darren Farley"},"100":{"id":"100","t":"The Challenge of Shortening the Closure Period of a Mountain Pass Road in Winter – the Example of the Gotthard Pass","au":[{"n":"Stefan Margreth","raw":"Margreth, Stefan","p":true,"aff":""},{"n":"Philipp Oberender","raw":"Oberender, Philipp","p":false,"aff":""}],"ab":["The Gotthard axis is one of the most important north-south traffic corridors through the Alps. For road traffic, it comprises the 17-km-long road tunnel and the pass road, which is closed in winter. The duration of the winter closure of the pass road depends mainly on seasonal snow and avalanche conditions and averages around 194 days. In late winter, traffic jams extending up to 22 km develop in front of the road tunnel. Therefore, in 2025, the Swiss Federal Roads Office commissioned a study to determine the conditions under which the pass road could open earlier, aiming to reduce traffic jams. Three opening options were examined: option 1 involves only organizational measures; option 2 includes minor structural mitigation measures amounting to CHF 140 million; and option 3 consists of comprehensive structural mitigation measures amounting to CHF 370 million. The three options were assessed with respect to normative safety targets and using a cost-benefit analysis to compare the benefit of reduced traffic jam duration at the road tunnel with the costs due to risks to pass road users and road safety personnel. The dominant risk to the road due to avalanches was quantified. Further risks include rockfalls, icing and snow drifts. The effect of climate change on the evolution of these risks was also evaluated. The study showed that, for all three options, the benefits of shortening the winter closure period are smaller than the costs."],"kw":"avalanche mitigation, avalanche risk, climate change, cost-benefit analysis, pass road.","ty":"P","pp":97,"em":[],"r":null,"day":"Mon","th":"Planning and Engineering","pr":"Stefan Margreth"},"101":{"id":"101","t":"Using Modified Propagation Saw Tests to Track Incremental Changes in Snowpack Stability","au":[{"n":"Itai Sheleg","raw":"Sheleg, Itai","p":true,"aff":""},{"n":"Bruce Jamieson","raw":"Jamieson, Bruce","p":false,"aff":""},{"n":"Karl W. Birkeland","raw":"Birkeland, Karl W.","p":false,"aff":""},{"n":"Dave Gauthier","raw":"Gauthier, Dave","p":false,"aff":""},{"n":"Ron Simenhois","raw":"Simenhois, Ron","p":false,"aff":""}],"ab":["Backcountry avalanche forecasters issue daily snowpack stability assessments to guide danger ratings and travel recommendations. Stability trends are usually clear during active cycles or prolonged dry periods, but knowing when the snowpack has stabilized enough to lower danger ratings, or how stability evolves during gradual loading, remains difficult, especially after a storm, when tests sometimes indicate instability with no avalanches occurring, leaving it unclear whether that reflects lingering instability or an overly conservative test. We modified the standard Propagation Saw Test (PST100) to better track stability through these transitions: extending the column to 200 cm (PST200) to capture longer-distance crack propagation, recording critical cut length, propagation distance, and saw distance to the column end; then removing 5 cm of weak layer along the column’s long axis (R5PST200) to increase sensitivity to changes in propagation over time. During winter 2025–26, we ran 23 sets of all three variants near the SNOTEL/ USGS stations on Berthoud Pass, Colorado, during and after four loading events, and compared results with avalanche activity within 3.5 km. R5PST200 tracked stability consistent with observed activity, typically indicating stabilization within two to three days after avalanches stopped; PST200 generally indicated stable conditions, while PST100 remained largely unstable throughout. Despite the small sample and unusual season, the method shows promise as a field-based tool for tracking trends in snowpack stability over time to support operational forecasting."],"kw":"propagation saw test, crack propagation, snowpack stability, avalanche forecasting","ty":"P","pp":98,"em":[],"r":3560,"day":"Tue","th":"Avalanche Forecasting","pr":"Itai Sheleg"},"102":{"id":"102","t":"Water Retantion Curve of Snow from X-Ray Microstructuer","au":[{"n":"Satoru Yamaguchi","raw":"Yamaguchi, Satoru","p":true,"aff":""},{"n":"Satoru Adachi","raw":"Adachi, Satoru","p":false,"aff":""},{"n":"Takafumi Katsushima","raw":"Katsushima, Takafumi","p":false,"aff":""}],"ab":["Because most meltwater movement within a snowpack occurs under unsaturated conditions, the snow water retention curve (SWRC) must be represented appropriately. Conventional SWRC parameterizations are based primarily on snow grain size and density, whereas their relationship to the pore structure that directly controls water retention and drainage remains insufficiently understood. In this study, the three-dimensional pore structure of snow was measured by X-ray micro-computed tomography (X-ray μCT). The pore space was segmented using a three-dimensional watershed method, and an equivalent pore-body diameter distribution was derived from the volume of each segmented pore region. The
