e,"aff":""},{"n":"William Tidd","raw":"Tidd, William","p":false,"aff":""},{"n":"Christopher Casebeer","raw":"Casebeer, Christopher","p":false,"aff":""},{"n":"Eric Bressler","raw":"Bressler, Eric","p":false,"aff":""}],"ab":["Detecting avalanche events in real-time remains a challenge for ski resorts, transportation agencies, railways, and avalanche mitigation professionals. Existing solutions are often cost prohibitive, labor intensive, or limited in coverage. This paper presents the Binary Avalanche Detection System (BADS): a low-cost, scalable sensor network designed to provide binary (yes/no) real-time detection of avalanche and shock events, i.e. explosive detonations from avalanche mitigation work. The core innovation and design elements of BADS is a bespoke enclosure, a pressure sensor and amplifier, and algorithm chain for detection. The enclosure features an acoustic ear with a custom membrane and orifice to modulate air flow. The customized pneumatic filter integrated into the housing rejects ambient pressure changes while capturing pressure transients characteristic of avalanches and shocks (Marcillo et al. 2012; Anderson et al. 2018). Field deployments during the 2025-2026 season at Kirkwood Mountain Resort (CA), Powder Mountain (UT), and Jackson Hole Mountain Resort (WY) yielded 132 corroborated events: 33 confirmed avalanches and 99 confirmed shocks. Avalanche events produced characteristic pressure signatures within a 30 second window, while shocks produced much shorter, higher frequency signatures. Wind noise, the primary interference source, has proven distinguishable in most scenarios. A machine learning (ML) algorithm trained on the confirmed events is in active development and has demonstrated promising early detection performance. Two deployment architectures have been tested and validated: 1) a wired Power-over-Ethernet (PoE) network with nodes spaced up to 600 meters apart, and: 2) a wireless system capable of transmitting over/around ridgelines and from under 3+ meters of snowpack at distances exceeding one mile. The wireless architecture utilizes standalone nodes running local inference and transmitting alerts to a solar-powered base station with cellular uplink. For the 2026-2027 season, a 75 node deployment is planned across the northwestern US and Alaska with nodes installed beneath remote avalanche control systems (RACS) and in well-documented natural slide paths. This expanded dataset will be used to refine the detection algorithm and explore correlation between pressure spike duration and avalanche runout distance and footprint. BADS represents a practical, affordable path toward widespread automated avalanche detection for operational safety applications."],"kw":"avalanche detection, differential pressure sensor, remote sensing, avalanche mitigation, machine learning","ty":"P","pp":167,"em":[],"r":3575,"day":"Tue","th":"Avalanche Forecasting","pr":"Michael Dvorsak"},"180":{"id":"180","t":"An Evaluation of Existing Anemometer Technology to Determine High Reliability in Heavy Riming Environments","au":[{"n":"Evan Salke","raw":"Salke, Evan","p":true,"aff":""},{"n":"Reid Nolan","raw":"Nolan, Reid","p":false,"aff":""},{"n":"Scott Quirsfeld","raw":"Quirsfeld, Scott","p":false,"aff":""},{"n":"Gordon Bease","raw":"Bease, Gordon","p":false,"aff":""}],"ab":["Accurate, high-resolution measurements of wind speed and direction are critical data for avalanche forecasting. As maintaining traditional Taylor SE anemometers becomes increasingly challenging, we need to evaluate alternative technologies for their long-term accuracy and reliability. Historically, competing instruments have demonstrated poor performance in heavily rimed environments. Recent advances in harmonic acoustic resonance technology enable significantly smaller sensor designs compared to conventional ultrasonic anemometers. The reduced physical size supports ice-free operation with substantially lower power requirements for unit heating, improving feasibility for remote installations where power capacity is limited. Additionally, digital data transmission allows high resolution data collection, remote calibration, and user-defined configuration. Two winter seasons of field-testing anemometers from FT Technologies resulted in almost no data loss due to riming and reliable performance under severe weather conditions. We plan to further evaluate these instruments and compare them against established anemometer systems. Sensor precision and resolution can be verified through direct comparison of units in close installed proximity."],"kw":"Anemometer, Rime, Wind, Instrumentation, Sensor","ty":"P","pp":168,"em":[],"r":3629,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Evan Salke"},"182":{"id":"182","t":"Forecasting Storm-Snow Avalanches Using a Combined Shear and Anticrack Instability Matrix","au":[{"n":"Benjamin H. Silberman","raw":"Silberman, Benjamin H.","p":true,"aff":""},{"n":"Eric R. Pardyjak","raw":"Pardyjak, Eric R.","p":false,"aff":""},{"n":"Dhiraj K. Singh","raw":"Singh, Dhiraj K.","p":false,"aff":""},{"n":"Jim Steenburgh","raw":"Steenburgh, Jim","p":false,"aff":""},{"n":"Steven Clark","raw":"Clark, Steven","p":false,"aff":""},{"n":"Travis Morrison","raw":"Morrison, Travis","p":false,"aff":""},{"n":"Jack Eskeland","raw":"Eskeland, Jack","p":false,"aff":""}],"ab":["Forecasting storm-snow avalanches remain challenging due to limited access to the mechanical properties of snow during active snowfall and the lack of a unified framework that captures multiple failure modes. This work presents a physics-based avalanche decision-support system that combines a shear-strength stability index (SIₛₕ) with an anticrack stability index (SIant) to generate a more comprehensive stability matrix. This stability matrix is designed to provide a practical tool for identifying unstable storm-snow conditions and distinguishing between shear-driven and anticrack-driven failure mechanisms. The proposed framework leverages real-time measurements from a Differential Emissivity Imaging Disdrometer (DEID) to capture snow microstructure and density, which are used to drive both stability indices. These indices are combined into a two-dimensional decision matrix that enables intuitive interpretation of snowpack stability for avalanche practitioners. To extend beyond nowcasting, the stability matrix is coupled with output from the High-Resolution Rapid Refresh (HRRR) weather model, allowing forecasts of storm-snow instability up to 48 hours in advance. Model performance will be evaluated using georadar detections, infrasound records, and manual avalanche observations within Little Cottonwood Canyon, Utah. These datasets will be combined with additional storm-specific information such as precipitation intensity and detailed Utah Department of Transportation (UDOT) mitigation records, to inform how these avalanches failed, and on what layer of snow. Preliminary results of model validation with georadar and infrasound avalanche detection systems will be presented. Additional results will include comparisons with avalanche observations submitted to the Utah Avalanche Center. These model comparisons will be visualized through clear, informative graphics for easy interpretation by snow operationalists."],"kw":"avalanche forecasting, storm-snow, anticrack, shear strength, stability index, densification","ty":"O","pp":169,"em":[],"r":3455,"pr":"Benjamin Silberman"},"183":{"id":"183","t":"Dry-to-Wet Transitional Avalanches: Inferences Made Using Infrasound Surveillance","au":[{"n":"Jeffrey Johnson","raw":"Johnson, Jeffrey","p":true,"aff":""},{"n":"Scott Havens","raw":"Havens, Scott","p":false,"aff":""},{"n":"Timothy Glassett","raw":"Glassett, Timothy","p":false,"aff":""},{"n":"Chris Stinson","raw":"Stinson, Chris","p":false,"aff":""},{"n":"Steven Clark","raw":"Clark, Steven","p":false,"aff":""},{"n":"Jerry Mock","raw":"Mock, Jerry","p":false,"aff":""},{"n":"Hans-Peter Marshall","raw":"Marshall, Hans-Peter","p":false,"aff":""},{"n":"Leighton Watson","raw":"Watson, Leighton","p":false,"aff":""}],"ab":["The maritime climate of Turnagain Arm, near Anchorage, Alaska, provides snow conditions conducive to the generation of frequent large avalanches, which begin as dry powdery slab releases from as high as 1200 meters above sea level and transition to a wet avalanche, or slurry, by the time they reach sea level. This study identifies and characterizes the infrasound and low-frequency acoustic signatures (below 50 Hz) associated with these rapid gravitydriven snow mass movements by examining a sequence of eight avalanches triggered by howitzer artillery during an Alaska Department of Transportation hazard mitigation campaign on January 30th, 2026. Using coincident video, we quantify these mass movements in terms of their infrasonic source intensities, signal durations, and infrasoundinferred descent velocities and use the infrasound signal morphology to characterize the dynamics of these avalanches. Specifically, we are able to differentiate wet versus dry flow signal characteristics and energetics (which are higher frequency and lower intensity for wet debris). We also use the infrasound avalanche dataset to document multiple flow pulses (within an individual avalanche) and discuss isolated discrete infrasonic pulses possibly associated with flow accelerations or decelerations."],"kw":"avalanche monitoring, infrasound, transitional avalanches","ty":"P","pp":170,"em":[],"r":3511,"day":"Mon","th":"Avalanche Dynamics","pr":"Jeffrey Johnson"},"184":{"id":"184","t":"D-Scale Versus Infrasound: Remote Quantification of Avalanche Size","au":[{"n":"Jeffrey Johnson","raw":"Johnson, Jeffrey","p":true,"aff":""},{"n":"Jerry Mock","raw":"Mock, Jerry","p":false,"aff":""},{"n":"Steven Clark","raw":"Clark, Steven","p":false,"aff":""},{"n":"Laurie Delaney","raw":"Delaney, Laurie","p":false,"aff":""},{"n":"Scott Havens","raw":"Havens, Scott","p":false,"aff":""},{"n":"Owen Walsh","raw":"Walsh, Owen","p":false,"aff":""},{"n":"Gustavo Behar","raw":"Behar, Gustavo","p":false,"aff":""}],"ab":["Infrasound monitoring is an established technology for detecting and mapping the progression of both triggered and natural snow avalanches and has been shown to be particularly effective in Little Cottonwood Canyon (LCC) in Utah, USA. This empirical study makes use of an ensemble of hundreds of triggered dry avalanches occurring in LCC, starting in 2023, to understand the relationship between infrasonic intensity and frequency content, infrasonic signal duration, and avalanche size. Specifically, we compare size estimates, using forecaster’s determination of Avalanche Destructive Force (D-Scale) to develop a scaling relationship, which accounts for distance from avalanche source to infrasound sensor location. This regression permits avalanche infrasound intensity, and signal duration, to then be used for remote quantification of avalanche size during periods of time when infrasound is collected, but direct visual observations are not possible. Furthermore, we are able to discuss the advisable maximum distances for infrasound sensor deployments in order to capture avalanches of size D1, D2, and D3."],"kw":"avalanche monitoring, infrasound, D-Scale, size estimation","ty":"P","pp":171,"em":[],"r":3630,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Jeffrey Johnson"},"186":{"id":"186","t":"Segmentation of Backcountry Skiers and Snowboarders in Japan Based on Recreation Specialization: A Cluster Analysis","au":[{"n":"Masashi Nagai","raw":"Nagai, Masashi","p":true,"aff":""},{"n":"Nao Yoshizawa","raw":"Yoshizawa, Nao","p":false,"aff":""},{"n":"Yasukazu Hama","raw":"Hama, Yasukazu","p":false,"aff":""},{"n":"Masanori Take","raw":"Take, Masanori","p":false,"aff":""}],"ab":["Backcountry skiing and snowboarding (BCSS) involve serious mountain hazards such as avalanches and falls, requiring participants to manage risks appropriately. In recent years, participation in BCSS in Japan has increased due to abundant snow conditions and growing inbound tourism demand, making safety an important issue. Previous studies have primarily focused on safety measures at the regional or community level, while perspectives that examine participants as heterogeneous groups and consider differences in their characteristics remain insufficient. Therefore, it is necessary to segment participants appropriately and to consider approaches to safety management and education based on their characteristics. Although recreation specialization has been widely used in recreation research as a framework for explaining involvement in activities, studies that systematically segment BCSS participants based on its multidimensional components remain limited. This study aimed to segment BCSS participants in Japan using the multidimensional components of recreation specialization and to describe the structural characteristics of the resulting groups. An online survey was conducted with 1,309 participants in Japan. Three dimensions were measured: behavioral (experience and participation frequency), cognitive (skiing and climbing skills, avalanche knowledge, and equipment specialization), and affective (attraction, self-expression, and centrality in daily life). Scores were calculated for each component, and cluster analysis was performed to segment participants into distinct groups. The analysis identified six clusters. The behavioral and cognitive dimensions showed broadly corresponding patterns across clusters, reflecting the accumulation of experience and the development of skills and equipment specialization. In contrast, the affective dimension did not necessarily co-vary with these dimensions and showed a relatively independent pattern. Multiple clusters had similar levels of behavioral and cognitive specialization but differed in affective involvement, and one cluster was characterized by particularly high affective involvement despite relatively lower experience and equipment scores. These results indicate that BCSS participants in Japan cannot be adequately explained by experience and skill alone. Instead, they are differentiated by multidimensional profiles that also include affective involvement. This heterogeneity may also inform targeted safety communication. These findings provide a basis for developing more targeted avalanche education and information provision that account for differences in participant characteristics across clusters."],"kw":"Backcountry skiing; Recreation specialization; Cluster analysis; Participant segmenta- tion; Japan","ty":"P","pp":172,"em":[],"r":3512,"day":"Mon","th":"Avalanche Education","pr":"Masashi Nagai"},"187":{"id":"187","t":"Bending Stress Model for Snow-Buried Trees: Hysteresis Effects of Crown Snow and Accumulated Snow Loading","au":[{"n":"Daiki Yokoyama","raw":"Yokoyama, Daiki","p":true,"aff":""},{"n":"Takafumi Katsushima","raw":"Katsushima, Takafumi","p":false,"aff":""},{"n":"Kenichi Yoshimura","raw":"Yoshimura, Kenichi","p":false,"aff":""}],"ab":["Climate change is projected to increase wet snowfall in regions that continue to receive snow under rising temperatures. Wet snow has a higher water content and density than dry snow, so it accumulates on tree crowns more readily and increases the crown snow load. Snow-buried trees, the understory species and the saplings of canopy species buried within the snowpack, experience greater mechanical strain and higher mortality than snowexposed trees. Because they are the next generation of the canopy and the understory, their survival directly determines forest regeneration. However, no structural-mechanics-based bending stress model has been developed specifically for snow-buried trees. We developed a bending stress model that accounts for the load hysteresis arising from the sequential application of a crown snow load and a snowpack pressure load. The crown snow load, applied as a concentrated tip load, is the snow that adheres to the crown; the snowpack pressure load, applied as a distributed load, is the force the surrounding snowpack exerts on the buried trunk, including both the weight of the snow and the pressure from its settlement (termed the accumulated snow loading in the title). At each step the trunk form deformed by the previous step was carried over, and the bending stress was calculated from the curvature change using large deformation theory. The model was validated against field measurements from 12 snow-buried Japanese beech, and the agreement was close. Simulations gave two key findings. First, the snowpack pressure load, not the crown snow load, is the direct driver of the bending stress that can break a trunk. Second, an increased crown snow load amplifies the bending stress during the snowpack pressure phase, acting as an indirect but significant risk factor. These results indicate that future increases in the crown snow load driven by wetter snow will indirectly but substantially increase the bending stress in snow-buried trees, with implications for trunk-breakage risk and forest regeneration."],"kw":"biomechanics; trunk deformation; large deformation theory; simulation; wet snowfall","ty":"P","pp":173,"em":[],"r":3632,"day":"Thu","th":"Modelling and Quantitative Forecasting","pr":"Daiki Yokoyama"},"188":{"id":"188","t":"From Compaction to Failure: Creep Acceleration and Buckle Formation in a Gliding Snow Beam","au":[{"n":"Grégoire Bobillier","raw":"Bobillier, Grégoire","p":false,"aff":""},{"n":"Johan Gaume","raw":"Gaume, Johan","p":false,"aff":""},{"n":"Alec van Herwijnen","raw":"van Herwijnen, Alec","p":false,"aff":""},{"n":"Christophe Ancey","raw":"Ancey, Christophe","p":false,"aff":""}],"ab":["Glide-snow avalanches are difficult to predict and mitigate and can pose major challenges for the protection of roads, ski resorts, and buildings. They occur when the entire snow cover slowly slides downslope before suddenly releasing as an avalanche. The physical processes involved in the release of glide-snow avalanches remain poorly understood. To investigate snowpack deformation during gliding, we developed a laboratory tilt test under controlled cold-room conditions. A 1.67 m long snow beam rested on a temperature-controlled glass bed tilted at 30°; at the downslope end, an instrumented stop representing the mechanical support of a retention zone recorded the force, while the deformation of the beam side wall was monitored. Each test comprised a cold phase and a warm phase, during which the bed surface was heated above 0 °C to generate liquid water at the snow–glass interface. During the cold phase, most of the slope-parallel load was progressively transferred from the downslope stop to the basal interface. Within minutes of heating, this load returned to the stop and then remained nearly constant until failure. Under this constant load, deformation evolved from secondary to tertiary creep while the beam lost 55 % of its thickness, so that its density increased by a factor of about 2.5. Over the same interval the apparent compressive viscosity decreased by a factor of about 45, suggesting that viscous softening induced by the liquid water dominated the deformation response regardless the elastic stiffening expected from densification. Failure occurred abruptly within one buckle as the apparent strain rate approached 10-4 s-1. These observations support a release scenario in which loss of basal resistance, progressive rheological softening and localized deformation lead to delayed failure without any increase in external loading. If similar rate-dependent behavior occurs at the slope scale, the temporal acceleration of surface deformation may provide a precursory signal for glide-snow avalanche forecasting."],"kw":"Glide-snow avalanche release, tilt test, basal detachment.","ty":"P","pp":174,"em":[],"r":3514,"day":"Mon","th":"Avalanche Formation","pr":"Grégoire Bobillier"},"189":{"id":"189","t":"Glide-Snow Avalanche Mechanics: Velocity-Dependent Snow-Ground Interfacial Friction","au":[{"n":"Grégoire Bobillier","raw":"Bobillier, Grégoire","p":false,"aff":""},{"n":"Rosa Schnebli","raw":"Schnebli, Rosa","p":false,"aff":""},{"n":"Miguel Cabrera","raw":"Cabrera, Miguel","p":false,"aff":""},{"n":"James Glover","raw":"Glover, James","p":false,"aff":""},{"n":"Alec van Herwijnen","raw":"van Herwijnen, Alec","p":false,"aff":""},{"n":"Johan Gaume","raw":"Gaume, Johan","p":false,"aff":""},{"n":"Christophe Ancey","raw":"Ancey, Christophe","p":false,"aff":""},{"n":"Jürg Schweizer","raw":"Schweizer, Jürg","p":false,"aff":""}],"ab":["Glide-snow avalanches occur when the entire snow cover slowly slides downslope and suddenly releases and forms an avalanche. The physical processes controlling glide-snow avalanche initiation remain poorly understood, making their prediction and mitigation difficult. Although liquid water at the snow-ground interface is recognized as a key precursor of glide-snow avalanche release, its role in controlling snow-ground interfacial friction and glide dynamics remains largely unknown. To investigate how liquid water affects snowground interfacial friction, we conducted direct shear tests of snow over a temperature-controlled slate surface across a wide range of normal stresses and shearing velocities. Under dry conditions, the interface exhibited strain-softening behaviour described by a Mohr-Coulomb model with a time-dependent cohesive contribution, while shear velocity had no significant effect. Under wet conditions, the amount of measured liquid water did not systematically affect interfacial shear strength; instead, velocity became the dominant control. Slow sliding involved low friction, whereas faster sliding produced higher peak and residual shear resistance. We describe this behaviour using a velocity-dependent Mohr-Coulomb law. Peak strength increased through both cohesion and friction, whereas during sustained sliding the residual cohesion remained approximately constant and rate strengthening is mainly carried by the frictional term. The kinetic friction angle increased strongly with velocity and approached a plateau above approximately 2 mm s-1. This rate strengthening provides stabilizing feedback during gliding: a steady sliding velocity can exist when basal resistance balances the driving stress, whereas no equilibrium is possible once the maximum basal resistance is exceeded, leading to accelerated sliding. These results provide a constitutive description of the wet snow-ground interface that can be implemented in slope-scale models of glide-snow avalanche initiation."],"kw":"glide-snow avalanche, snow-ground interface, rate-dependent friction","ty":"O","pp":175,"em":[],"r":3456,"pr":"Grégoire Bobillier"},"190":{"id":"190","t":"A Practitioner’s Perspective on Tools for Understanding Wind Fields, Snow Drift, and Snow Distribution","au":[{"n":"Holt Hancock","raw":"Hancock, Holt","p":true,"aff":""},{"n":"Kjersti Gisnås","raw":"Gisnås, Kjersti","p":false,"aff":""},{"n":"Peter Gauer","raw":"Gauer, Peter","p":false,"aff":""},{"n":"Nikolas Aksamit","raw":"Aksamit, Nikolas","p":false,"aff":""},{"n":"Anna Poltronieri","raw":"Poltronieri, Anna","p":false,"aff":""},{"n":"Christian Jaedicke","raw":"Jaedicke, Christian","p":false,"aff":""},{"n":"Anders Kleiven","raw":"Kleiven, Anders","p":false,"aff":""}],"ab":["Understanding how, where, and when snow accumulates due to blowing and drifting snow processes plays a key role in avalanche forecasting, hazard mapping, and design of structural mitigation measures. Despite the recognized importance of wind redistribution in controlling avalanche activity and the availability of multiple tools to simulate wind and snow conditions in mountain environments, avalanche workers still experience challenges incorporating snow drift processes into operational workflows. In this work, we use spatially-distributed snow height measurements obtained from terrestrial laser scanning (TLS) at two sites in Norway during the 2024/2025 winter season to validate and compare a range of approaches for parameterizing snow drift and predicting snow distribution. We simulate or recreate the observed snow distribution patterns using methods spanning a continuum of model complexity from semiempirical, terrain-based parameterizations, to open-source wind field models, to physically-based numerical models representing snow particle trajectories. We evaluate model outputs against TLS-derived snow height changes to assess each approach’s ability to capture key features of snow deposition and erosion in the context of practical avalanche work. Our results highlight the strengths and limitations of different modeling approaches and provide insight into how model complexity, spatial resolution of forcing data, and computational efforts influence model output utility. These findings will help to support practitioner decision-making when selecting tools appropriate for specific forecasting, planning, or engineering applications."],"kw":"snow drift, blowing snow, wind, avalanche forecasting, planning.","ty":"O","pp":176,"em":[],"r":3457,"pr":"Holt Hancock"},"191":{"id":"191","t":"Replicating Slab Avalanche Initiation: A Field Test for Controlled Anticrack Nucleation","au":[{"n":"Valentin Adam","raw":"Adam, Valentin","p":true,"aff":""},{"n":"Yannik Werner","raw":"Werner, Yannik","p":false,"aff":""},{"n":"Jakob Schöttner","raw":"Schöttner, Jakob","p":false,"aff":""},{"n":"Melin D. E. Walet","raw":"Walet, Melin D. E.","p":false,"aff":""},{"n":"Florian Rheinschmidt","raw":"Rheinschmidt, Florian","p":false,"aff":""},{"n":"Philipp Weißgraeber","raw":"Weißgraeber, Philipp","p":false,"aff":""},{"n":"Alec van Herwijnen","raw":"van Herwijnen, Alec","p":false,"aff":""},{"n":"Philipp L. Rosendahl","raw":"Rosendahl, Philipp L.","p":false,"aff":""}],"ab":["Failure nucleation in slab avalanches is typically hidden beneath the snowpack, which, among other factors, makes this phenomenon so mysterious and difficult to predict. What if we could make this initiation visible? We propose a field experiment that reproduces failure initiation in a weak snow layer under controlled loading and captures the process of fracture initiation. As the field of fracture mechanics has developed rapidly over the past decades, so has our understanding of the release processes of dry-snow slab avalanches. When a porous weak layer beneath a skier or mountaineer is subjected to localized loading, failure initiates in the form of an anticrack, a collapse-type fracture that propagates along the weak layer and can ultimately release a slab avalanche. While fracture initiation in engineering materials is well described within the framework of finite fracture mechanics (FFM), snow stability assessment still largely relies on simplified stress-based or empirical approaches. Recent progress has enabled the independent measurement of both governing material properties of weak layers: strength, the resistance to local failure under stress, and fracture toughness, the resistance to crack growth in terms of energy. This creates the opportunity to apply a physically consistent finite fracture mechanics criterion to weak layer fracture initiation. However, experimental validation of such a criterion has remained a critical gap. In this study, we propose an experimental framework for validating this criterion. Weak layer strength and fracture toughness are measured independently, while a novel complementary anticrack nucleation test (ANT) replicates fracture initiation under controlled loading conditions. The ANT enables the measurement of the critical initiation load and the finite initiation length, which can subsequently be compared with the corresponding analytical predictions. Such a validation would represent a key step towards materialparameter-based prediction of failure loads and opens the path to directly relating measurable snow mechanical properties to snow stability assessment."],"kw":"Dry-snow slab avalanches, fracture initiation, finite fracture mechanics, release potential, stability assessment, field test","ty":"O","pp":177,"em":[],"r":3415,"pr":"Valentin Adam"},"192":{"id":"192","t":"How Snow Deforms Under Loading: An Experimental Approach Using Cyclic Bending","au":[{"n":"Alec van Herwijnen","raw":"van Herwijnen, Alec","p":true,"aff":""},{"n":"Daan Leeflang","raw":"Leeflang, Daan","p":false,"aff":""},{"n":"Jakob Schöttner","raw":"Schöttner, Jakob","p":false,"aff":""},{"n":"Louis Berger","raw":"Berger, Louis","p":false,"aff":""},{"n":"Marcel Piecuch","raw":"Piecuch, Marcel","p":false,"aff":""},{"n":"Florian Rheinschmidt","raw":"Rheinschmidt, Florian","p":false,"aff":""},{"n":"Philipp Weißgraeber","raw":"Weißgraeber, Philipp","p":false,"aff":""},{"n":"Philipp Rosendahl","raw":"Rosendahl, Philipp","p":false,"aff":""},{"n":"Valentin Adam","raw":"Adam, Valentin","p":false,"aff":""}],"ab":["Snow exhibits a time-dependent mechanical response that depends on density, temperature, microstructure, and loading rate. However, rapid experimental methods to characterize this response are limited, particularly for measurements that can eventually be transferred to the field. We present a cyclic three-point bending method to characterize the short-time mechanical response of snow. Rectangular snow beams are repeatedly loaded and unloaded while force and actuator displacement are recorded. The measured response shows pronounced force relaxation and is represented using a generalized Maxwell model with an equilibrium spring and two Maxwell elements, yielding a total stiffness and two characteristic relaxation times. Experiments on snow with different densities showed a strong increase in stiffness with density, while the relaxation times remained comparatively similar. Additional experiments over a range of temperatures showed changes in both stiffness and relaxation times as the snow approached the melting point, with the shortest relaxation times observed for wet snow. The method requires only force and displacement measurements and a complete experiment takes approximately ten minutes. Cyclic three-point bending therefore provides a simple approach for systematically investigating the short-time constitutive response of snow and its dependence on environmental and structural conditions."],"kw":"Snow mechanics, constitutive behavior, three-point bending, Viscoelasticity, mechanical testing","ty":"P","pp":178,"em":[],"r":null,"day":"Fri","th":"Snowpack Properties","pr":"Alec van Herwijnen"},"193":{"id":"193","t":"Know Your Enemy. Know Your Technology – a Process-Oriented Approach to Mitigating Interference Effects During Avalanche Rescue","au":[{"n":"Dieter Kotlaba","raw":"Kotlaba, Dieter","p":true,"aff":""}],"ab":["Electromagnetic interference can complicate avalanche rescue searches by reducing receiving range or causing unstable indications. Potential sources of interference include personal electronic devices, metallic and magnetic objects, electrical or electronic infrastructure, and atmospheric electrical activity. Their effects depend, among other factors, on the specific combination of avalanche transceiver and interfering source, the distance, and the operating mode. This paper considers interference separately for transmit and search mode and combines published studies with qualitative internal observations and practical measurements. The 20 cm recommendation in transmit mode and the 50 cm recommendation in search mode are discussed as important practical guidelines. In particular, practical implementation in search mode shows that this recommendation alone does not guarantee interferencefree searching. The paper focuses on a conceptual six-step process. It is intended to support advanced users and professional organizations in considering potential interference during preparation, detecting it during a search, and adapting their procedures to the specific device."],"kw":"Avalanche rescue, avalanche transceiver, electromagnetic interference","ty":"P","pp":179,"em":[],"r":3515,"day":"Mon","th":"Avalanche Rescue","pr":"Dieter Kotlaba"},"194":{"id":"194","t":"The Evolution of Voice Navigation in Ortovox Avalanche Transceivers","au":[{"n":"Dieter Kotlaba","raw":"Kotlaba, Dieter","p":true,"aff":""}],"ab":["Voice navigation was first integrated into an avalanche transceiver by ORTOVOX during the 2021/22 season. Starting with the model DIRACT VOICE, voice commands, wording, and softwarebased trigger logic have been continuously developed. Two manufacturers now offer a total of five avalanche transceiver models with voice functionality. Software-defined events that trigger voice commands may include changes in device state, direction, or distance. Two peer-reviewed studies by Wallner et al. indicate that voice guidance can reduce stress and support learning. This paper describes the evolution of voice commands from DIRACT VOICE to FOCUS VOICE and FOCUS PRO and discusses the benefits of voice navigation for training and emergency use. It is based on the author’s direct involvement in the development of these devices, internal ORTOVOX product development information, systematic field observations, and qualitative interviews with avalanche course instructors. Voice commands do not replace the visual user interface or training. They complement both, particularly when the rescuer’s visual attention should remain focused on the avalanche debris."],"kw":"Avalanche rescue, avalanche transceiver, voice navigation, verbal commands, user in- terface, stress","ty":"P","pp":180,"em":[],"r":3516,"day":"Thu","th":"Avalanche Rescue","pr":"Dieter Kotlaba"},"195":{"id":"195","t":"Machine Learning for Automated Avalanche Terrain Exposure Scale Classification – a Comparison of Two Approaches","au":[{"n":"Kalin Markov","raw":"Markov, Kalin","p":true,"aff":""},{"n":"Yves Bühler","raw":"Bühler, Yves","p":false,"aff":""},{"n":"Andreas Huber","raw":"Huber, Andreas","p":false,"aff":""},{"n":"Momchil Panayotov","raw":"Panayotov, Momchil","p":false,"aff":""}],"ab":["Backcountry travel in mountainous regions in Bulgaria has increased significantly in recent decades, heightening the need for effective avalanche risk management. The Avalanche Terrain Exposure Scale (ATES), first introduced in 2004 in Canada, classifies mountain terrain based on its potential exposure to avalanche hazards. Whereas early applications relied on expert-based manual mapping, subsequent studies introduced semi-automated and fully automated workflows. The most recent approaches introduce machine learning methods for automated terrain classification according to ATES criteria. In this study, we compared two machine learning approaches (ATES 1 and ATES 2) for ATES classification for the territory of Pirin National Park, Bulgaria, one of the most popular regions in the country for backcountry skiing. Both approaches used the same training data, a Random Forest model with the same architecture and hyperparameters, and shared input features of slope and percent canopy cover. They differed in the remaining input features used for training procedures and they also used different approaches for determining the potential avalanche release areas (PRA). In addition, in model ATES 1, the runout modelling was performed using AvaFrame/com4FlowPy, while in ATES 2 - from RAMMS::Avalanche runout modelling. The resulting ATES models were evaluated on a set of 36 separate validation polygons distributed throughout the territory of Pirin National Park. The validation polygons were labelled by three independent experts and located outside the valley where training occurred. Both models performed similarly well with respect to calculated performance metrics. In model ATES 1, the pixel-based accuracy was 87%, with 94% of the polygons classified correctly (when taking the majority classification for each polygon). For model ATES 2, both metrics were very similar, with the pixel-based accuracy being 86% and the polygon-based – 92%. The most classification errors occurred in the challenging terrain class for both models. The results demonstrate the ability of machine learning models to generalize well across entire mountain ranges and to adapt robustly to varying input feature sets. At the same time, they indicate that mapping the challenging ATES terrain class remains difficult for predictive models and is therefore associated with the most errors."],"kw":"avalanches, ATES, machine learning, com4FlowPy, RAMMS, Bulgaria","ty":"P","pp":181,"em":[],"r":3517,"day":"Mon","th":"Artificial Intelligence","pr":"Kalin Markov"},"196":{"id":"196","t":"Evaluating Simulations Against Measured Radar Spectra from an Avalanche Event","au":[{"n":"Peter Gauer","raw":"Gauer, Peter","p":true,"aff":""},{"n":"Callum Tregaskis","raw":"Tregaskis, Callum","p":false,"aff":""},{"n":"Anselm Köhler","raw":"Köhler, Anselm","p":false,"aff":""},{"n":"Anna Wirbel","raw":"Wirbel, Anna","p":false,"aff":""},{"n":"Richard Koschuch","raw":"Koschuch, Richard","p":false,"aff":""}],"ab":["One major purpose of avalanche test sites such as Ryggfonn is to obtain measurements that can be used to characterize avalanche dynamics and to support the development, calibration, and benchmarking of numerical models. Observations often consist of point measurements or observed quantities differ from the direct result variables of numerical models which are mostly flow thickness and flow velocity in a terrain-following or cartesian coordinate system. Furthermore, simulations are subject to uncertainties in input parameters, such as release height and snow properties, for individual events. Consequently, developing robust methods for comparing observations with model results is a task in its own right. In this paper, we present an approach for comparing radar measurements with model outputs. To this end, MTI plots and range-gate spectra derived from radar measurements are compared with corresponding synthetic MTI plots and range-gate spectra generated from model outputs. Although the two types of data are not fully comparable, the comparison reveals discrepancies between measurements and simulations and highlights shortcomings in the current modelling approaches."],"kw":"avalanche dynamics; measurements; radar velocity spectra; synthetic spectra","ty":"P","pp":182,"em":[],"r":3518,"day":"Mon","th":"Avalanche Dynamics","pr":"Peter Gauer"},"197":{"id":"197","t":"From Field Observations to Analysis: Changing Snowpack and Avalanche Conditions in the Aosta Valley (NW Italian Alps)","au":[{"n":"Simone Laurent Roveyaz","raw":"Roveyaz, Simone Laurent","p":false,"aff":""},{"n":"Eloïse Bovet","raw":"Bovet, Eloïse","p":false,"aff":""},{"n":"Andrea Debernardi","raw":"Debernardi, Andrea","p":false,"aff":""},{"n":"Nathalie Durand","raw":"Durand, Nathalie","p":false,"aff":""},{"n":"Stefano Pivot","raw":"Pivot, Stefano","p":false,"aff":""}],"ab":["In recent years, avalanche forecasters in the Aosta Valley have observed significant changes in snowpack characteristics and avalanche dynamics due to climate change. The main observations include a higher rain–snow transition elevation, reduced snow-cover duration at lower elevations, and changes in average snowpack depth, while high-elevation snowfall remains relatively stable but highly variable. Forecasters report increasingly complex and rapidly evolving winter conditions, including prolonged dry periods, extreme snowfall events, high-elevation rainfall, and intense temperature fluctuations. The resulting spatial and temporal variability in avalanche hazard directly affects operational forecasting, increasing uncertainty in hazard assessment and backcountry route selection. To quantify these observations, this study analyzes nivometeorological data and the Regional Avalanche Cadastre using manual measurements together with numerical modelling. The ultimate objective is to improve understanding of these processes, assess their effects on snowpack stability, and evaluate their implications for avalanche forecasting and risk management in a changing climate."],"kw":"snow-cover monitoring, historical database, climate change.","ty":"P","pp":183,"em":[],"r":null,"day":"Fri","th":"Weather Forecasting and Climate","pr":"Simone Laurent Roveyaz"},"198":{"id":"198","t":"A Routing Algorithm for Ski Touring in Norway","au":[{"n":"Peder Undheim","raw":"Undheim, Peder","p":true,"aff":""},{"n":"Jan Ketil Rød","raw":"Rød, Jan Ketil","p":false,"aff":""},{"n":"Håvard B. Toft","raw":"Toft, Håvard B.","p":false,"aff":""}],"ab":["An increasing number of Norwegians engage in ski touring in winter mountains. With growing traffic in avalanche terrain, there is a need for tools that can support safer travel and help reduce avalanche accidents. In the Alps, Skitourenguru uses terrain data to automatically generate routes between two locations. Inspired by this approach, this study investigates how a similar routing algorithm can be adapted to Norwegian conditions. An important challenge in developing such tools is the risk of unintended negative effects. While routing algorithms aim to support better decisions, they may also encourage uncritical reliance on suggested routes or create a false sense of safety. By simplifying complex decision-making processes, they can reduce users’ active engagement and understanding of avalanche terrain. This study therefore emphasizes the design of a tool that supports rather than replaces user judgment. The algorithm is based on a raster cost surface representing avalanche exposure and terrain preferences for ski touring, derived from parameters such as slope angle, potential release areas, trails, and forest cover. Routing is performed using least-cost path analysis, and the study explores the use of track data to better reflect realistic travel patterns. To avoid overly prescriptive guidance, particular emphasis is placed on how results are presented, introducing a route corridor that represents a range of near-optimal routes rather than a single path. This approach aims to support flexible route planning while maintaining active user involvement. A user interface has been developed to enable intuitive interaction and allow user-defined routing preferences. The algorithm has been tested across six study areas in Norway representing diverse terrain types and touring contexts. Results show that the generated routes generally correspond well with expert-defined routes, while also revealing limitations in certain terrain settings, particularly in steep and complex mountain terrain. The study highlights both the potential and limitations of automated routing approaches, and underscores the importance of designing decision-support tools that maintain user engagement and critical thinking in avalanche terrain."],"kw":"routefinding, GIS, terrain, ski touring, decision making","ty":"O","pp":184,"em":[],"r":3395,"pr":"Peder Undheim"},"199":{"id":"199","t":"Dynamic Crack Propagation Speed Transition in Multilayer Systems","au":[{"n":"Shubo Zhang","raw":"Zhang, Shubo","p":false,"aff":""},{"n":"Nicola M. Pugno","raw":"Pugno, Nicola M.","p":false,"aff":""}],"ab":["The dynamic propagation of cracks in solids is widely observed in nature, such as in snow avalanches. Pioneering studies have demonstrated that the upper limit of crack velocity is constrained by the energy transport speed of the medium—typically corresponding to the relevant elastic wave speeds. Recently, a transition from sub-Rayleigh, mode I-dominated to supershear, mode II-dominated crack propagation during snow slab release was reported (Trottet et al., 2022) and further evidenced (Bergfeld et al., 2025). An energy characteristic length scale was introduced (Buehler et al., 2003) to demonstrate the possibility of supersonic crack propagation in hyperelastic solids, which was later extended (Pugno, 2026) with a self-consistent definition to describe the crack propagation speed transition from a farfield average to a localized value in multilayer systems. In this work, we validated this crack speed transition in multilayer systems through numerical simulations and further investigated how this transition occurs in heterogeneous and asymmetric systems. Our findings indicate that it is possible to control the speed of dynamic crack propagation through external loading by appropriately designing composite materials."],"kw":"Dynamic crack propagation, Snow avalanche, Multilayer system.","ty":"P","pp":185,"em":[],"r":3519,"day":"Mon","th":"Avalanche Dynamics","pr":"Shubo Zhang"},"200":{"id":"200","t":"Mobile Drone Docking Stations to Support Site-Specific Avalanche Observations and Forecasting","au":[{"n":"Halgeir Dahle","raw":"Dahle, Halgeir","p":true,"aff":""},{"n":"Ruben Jacobsen","raw":"Jacobsen, Ruben","p":false,"aff":""},{"n":"Knut Inge Orset","raw":"Orset, Knut Inge","p":false,"aff":""},{"n":"Tore Humstad","raw":"Humstad, Tore","p":false,"aff":""}],"ab":["During periods of elevated avalanche hazard, field observations may be restricted due to safety concerns, limited accessibility, or rapidly changing conditions. This can increase uncertainty in decisions related to road closures, reopening, and emergency response. This paper presents the design, technical configuration, and operational use of a trailer-mounted drone docking station developed to increase the availability of site-specific avalanche observations along avalanche-exposed roads. The mobile system enables repeated, remotely operated flights without permanent infrastructure and can be rapidly relocated according to operational needs and changing avalanche conditions. The station combines a UAS with high-resolution RGB and thermal imaging, a web-camera, airspace monitoring, independent power supply, and remote communications. During the 2025/2026 winter season, 85 UAV missions were conducted from two mobile drone stations, resulting in 38 observations published in Regobs natural hazard database. The imagery documented recent avalanche activity, controlled avalanche releases, release areas, deposition areas, and impacts on road infrastructure. The results indicate that mobile drone stations can complement weather stations, remote cameras, field observations, and snowpack information by increasing the frequency and availability of direct, site-specific observations while reducing the need for personnel to enter avalanche terrain. Mobile drone stations therefore have potential as a complementary observation system for avalanche forecasting, road management, and emergency response."],"kw":"site-specific forecasting, road avalanche warning, mobile drone station, autonomous","ty":"P","pp":186,"em":[],"r":3633,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Halgeir Dahle"},"201":{"id":"201","t":"Shallow But Still Long: Peculiar Avalanche Activity in Northern Norway","au":[{"n":"Matrin Ahrland Stefan","raw":"Stefan, Matrin Ahrland","p":true,"aff":""},{"n":"Holt Hancock","raw":"Hancock, Holt","p":false,"aff":""},{"n":"Peter Gauer","raw":"Gauer, Peter","p":false,"aff":""}],"ab":["Between December 3rd and 4th, 2025 some peculiar natural avalanches occurred in Tverrbotn adjacent to the Andersdalen valley, approx. 20 km south of Tromsø in Northern Norway. Weather preceding the event included modest (<20 cm) snowfall amounts accompanied by light to moderate southeasterly winds at ridgetop . This snow fell on a stable snowpack with locally weak, lightly faceted snow surfaces, developed during a period of colder, clear weather in the days prior. Limited avalanche activity was reported in the region following the snowfall, with a single thin, wide crown on a southwest aspect at 900 m serving as a notable exception. Upon investigation of this crown on December 7th, observers discovered multiple soft slab avalanches in an adjacent drainage that had in places ran 6-700 m to the valley floor. These avalanches had very thin crowns (5 to 10 cm) and were accompanied by extensive cracking that propagated into lower-angle terrain, indicating high fracture propagation potential. Our curiosity was piqued for two reasons. First, our experience led us to believe that the regional weather patterns preceding the event rarely produce noteworthy avalanche activity. While weather and snow conditions specific to the investigated drainage may have controlled these avalanches, they were subtle enough to be no longer evident under observation several days post-event. Second, relatively minor new-snow accumulations and thin slabs nevertheless resulted in comparatively long runouts. Simulating these avalanches can help illustrate how interactions among slab characteristics, propagation potential, and entrainment allow even thin, soft slabs to reach long runouts. We hope this case study illustrates how the analysis of unusual, but by no means extreme, avalanche events can contribute to improved avalanche forecasting in situations characterized by high spatial variability. It also demonstrates how simulation tools can be used to investigate the processes that allow relatively thin slabs to produce unexpectedly long runouts."],"kw":"shallow avalanches, field observations, avalanche modeling.","ty":"P","pp":187,"em":[],"r":null,"day":"Fri","th":"Incidents and Case Studies","pr":"Matrin Ahrland Stefan"},"202":{"id":"202","t":"Observations from Areal Surveillance of Avalanche Activity Using Roadside Distributed Acoustic Sensing","au":[{"n":"Guro K. Svendsen","raw":"Svendsen, Guro K.","p":true,"aff":""},{"n":"Antoine Turquet","raw":"Turquet, Antoine","p":false,"aff":""},{"n":"Tore Humstad","raw":"Humstad, Tore","p":false,"aff":""}],"ab":["From January 2025 to January 2026 we used Distributed Acoustic Sensing (DAS) to record avalanche activity in the valley of Lavangsdalen, Troms, Norway. The monitored road in the valley crosses seven avalanche zones, and has significant traffic, with an average annual daily traffic (ADT) of 3,920 vehicles. The campaign also benefited from an existing infrasound detection system, enabling benchmarking and the development of a broader catalog of events. The campaign used existing commercial telecom fiber infrastructure, so installation requirements were minimal, with the sensing unit conveniently located in the nearest city, 30 kilometers from Lavangsdalen. Of 131 avalanche events identified by the infrasound system, 83 had a detectable signature in the DAS data. We consider key characteristics and implications for how DAS can contribute to automated monitoring for areal surveillance of snow avalanche activity through the example of two focus events. The signal observed from the events has a strong contribution from acoustic, not seismic propagation."],"kw":"DAS, snow avalanche dynamics, road safety, warning systems","ty":"P","pp":188,"em":[],"r":3634,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Guro K. Svendsen"},"203":{"id":"203","t":"Large Avalanches in Forested Terrain in Pirin Mountains – Treering and Numerical Simulations Analysis","au":[{"n":"Momchil Panayotov","raw":"Panayotov, Momchil","p":true,"aff":""},{"n":"Nickolay Tsvetanov","raw":"Tsvetanov, Nickolay","p":false,"aff":""},{"n":"Violeta Kotova","raw":"Kotova, Violeta","p":false,"aff":""},{"n":"Valentin Balov","raw":"Balov, Valentin","p":false,"aff":""},{"n":"Yves Bühler","raw":"Bühler, Yves","p":false,"aff":""},{"n":"Perry Bartelt","raw":"Bartelt, Perry","p":false,"aff":""},{"n":"Peter Bebi","raw":"Bebi, Peter","p":false,"aff":""}],"ab":["Pirin National park in Bulgaria is refuge of some of the best-preserved endemic Pinus peuce and Pinus heldreichii forests in the world. Due to the steep slopes and abundant snowfall the forests territories are periodically affected by avalanches. Meanwhile tourism has grown, especially after the construction of Bansko ski resort, which additionally increases the importance of the protection functions of forests. However, this role as well as the complex interaction between forests and avalanches are not well studied and understood. In our study we aimed at reconstructing past large-magnitude avalanches (LMAs) in forested terrain in the proximity to Bansko resort and Yavorov mountain chalet in the Pirin Mountains. This terrain has clear signs of large avalanches in the past as well as recently observed cases, some of which causing human fatalities. We combined tree-ring analysis, satellite images and historical aero-photos to evaluate the effects of LMAs on forests. With the use of the avalanche-simulation software RAMMS::EXTENDED we calculated the scenario parameters of large avalanches and compared the outputs with the reconstructed and observed outlines of big avalanches. Analysis of more than 700 tree-ring cores showed that large avalanches occurred in the studied areas almost every decade. During the 1950s to the 1980s there were years with wide-spread large avalanches, which occurred simultaneously in different avalanche tracks and valleys. In the last decades LMAs seem to have decreased in frequency but still occur occasionally. An example was the deadly avalanche in forested terrain on 08.03.2015 in the vicinity of Yavorov Chalet. Our avalanche dynamics simulations showed that avalanches with large starting areas, release depth of snow at the starting zone of 100 cm and parameters typical for 100-year return period dry snow avalanches could cause the extent of damages reconstructed by the tree-ring analysis for the largest avalanches. The observed and recorded larger avalanches in the last decade would better fit to 10 or 30-year return period scenarios. Our study highlights the importance for better evaluation of the actual protection role of forests and the chances of avalanches in forested terrain despite the widespread perception of such territories as safe."],"kw":"avalanches, dendrochronology, RAMMS::EXTENDED, Pirin Mountains, Bulgaria.","ty":"O","pp":189,"em":[],"r":3430,"pr":"Momchil Panayotov"},"204":{"id":"204","t":"Revising the European Avalanche Danger Scale: Process, Final Proposal, and Implications for Public Communication","au":[{"n":"Karsten Müller","raw":"Müller, Karsten","p":true,"aff":""},{"n":"Frank Techel","raw":"Techel, Frank","p":false,"aff":""},{"n":"Christoph Mitterer","raw":"Mitterer, Christoph","p":false,"aff":""},{"n":"Philip A. Ebert","raw":"Ebert, Philip A.","p":false,"aff":""},{"n":"Ben Reuter","raw":"Reuter, Ben","p":false,"aff":""},{"n":"Veronika Krieger","raw":"Krieger, Veronika","p":false,"aff":""},{"n":"Igor Chiambretti","raw":"Chiambretti, Igor","p":false,"aff":""},{"n":"Anne Dufour","raw":"Dufour, Anne","p":false,"aff":""},{"n":"Guillem M. Bellido","raw":"Bellido, Guillem M.","p":false,"aff":""},{"n":"Lorenzo Bertranda","raw":"Bertranda, Lorenzo","p":false,"aff":""}],"ab":["The European Avalanche Danger Scale (EADS) is the central framework for communicating regional avalanche danger in Europe. Since its introduction in 1993, the scale has supported harmonized danger levels across warning services and has become a key reference in avalanche education and public warning products. However, operational forecasting workflows have evolved. Modern forecasting workflows increasingly rely on structured decision-support tools, while the EADS is increasingly used as a public communication tool. The European Avalanche Warning Services (EAWS) therefore revised the EADS through a structured process combining scientific literature, analyses of operational EAWS Matrix usage data from 2022 to 2025, an international user survey with more than 17,000 valid responses, and two review rounds among EAWS member services. The revision was guided by three principles: simplicity, accuracy and differentiation. The final proposal separates technical descriptions for forecasters from the public danger scale. It replaces the former stability and likelihood descriptors with user-oriented descriptions of avalanche occurrence and avalanche size, adds advice for backcountry travel, and includes an optional column for public safety authorities. This paper describes the EAWS revision process, presents the final proposal to be voted on at the upcoming General Assembly, and briefly explains the main choices and remaining decisions before implementation."],"kw":"Avalanche danger scale; avalanche hazard; risk communication; avalanche forecasting; EAWS; European Avalanche Warning Services","ty":"O","pp":190,"em":[],"r":3448,"pr":"Karsten Müller"},"205":{"id":"205","t":"Snow Water Equivalent Retrieval from Sentinel-1 InSAR Using a Collocated Active Reflector and GNSS Refractometry","au":[{"n":"Paolo Perret","raw":"Perret, Paolo","p":false,"aff":""},{"n":"Pedro Espín-López","raw":"Espín-López, Pedro","p":false,"aff":""},{"n":"Guido Luzi","raw":"Luzi, Guido","p":false,"aff":""},{"n":"Martina Lodigiani","raw":"Lodigiani, Martina","p":false,"aff":""},{"n":"Lorenzo Silvestri","raw":"Silvestri, Lorenzo","p":false,"aff":""},{"n":"Tommaso Congiu","raw":"Congiu, Tommaso","p":false,"aff":""},{"n":"Fabrizio Troilo","raw":"Troilo, Fabrizio","p":false,"aff":""},{"n":"Francesco Zucca","raw":"Zucca, Francesco","p":false,"aff":""},{"n":"Marco Pasian","raw":"Pasian, Marco","p":false,"aff":""}],"ab":["Spaceborne C-band interferometry is sensitive to changes in snow water equivalent (SWE), but it needs a phase reference that is absolute, unambiguous, and restricted to dry snow. We address that requirement with a station that combines a ground-flush C-band active reflector (AR) with a collocated GNSS refractometry antenna, installed at 2166 m in the Aosta Valley, Italian Alps. Both instruments sit at ground level and spend the winter beneath the snowpack. This paper describes the station, characterises the ground reference it produced over the winter of 2025–2026, and gives a first reading of the radar side. The GNSS antenna returned half-hourly SWE from 19 November to 17 May, 179 days at 82 % availability, with an observed maximum of 292 mm w.e. on 15 March. Against 22 manual snow pits dug beside the station, the 18 that could be paired show a bias of −4.7 mm and a root mean square difference of 14.4 mm, closer during accumulation (12.3 mm) than during ablation (17.9 mm). Compared with a SNOWPACK simulation driven by the local weather station, the GNSS record shows a small but seasonally structured bias, about +13 mm while the pack builds and −13 mm while it melts. On one of the two Sentinel-1 tracks that image the site, the interferometric phase of the reflector, converted with the dry-snow relation and referenced to the GNSS at activation, follows the GNSS record to 6.6 mm and the pits to 10.6 mm through the dry season, once the integer cycles hidden by storms are restored, here by hand. The reflector’s signal falls to the clutter level at melt onset, marking the end of the dry-snow regime. The station therefore delivers an autonomous, verifiable SWE reference next to a controlled radar target whose phase can be read as SWE. Automated resolution of the phase ambiguity and the transfer of the reference to the surrounding basin are the subject of ongoing work."],"kw":"snow water equivalent, GNSS refractometry, active radar reflector, InSAR, Sentinel-1, alpine snowpack","ty":"P","pp":191,"em":[],"r":3635,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Paolo Perret"},"206":{"id":"206","t":"Developing a Novel Field-Based Compactive Viscometer","au":[{"n":"Benjamin H. Silberman","raw":"Silberman, Benjamin H.","p":true,"aff":""},{"n":"Eric R. Pardyjak","raw":"Pardyjak, Eric R.","p":false,"aff":""},{"n":"Ashley Spear","raw":"Spear, Ashley","p":false,"aff":""},{"n":"Dhiraj K. Singh","raw":"Singh, Dhiraj K.","p":false,"aff":""}],"ab":["Accurate prediction of storm-snow instability requires understanding how snow density (ᶝᵆ) evolves during active snowfall, yet key mechanical properties such as compactive viscosity (ηₛ) remain understudied due to limited in situ observations. Compactive viscosity governs the rate of densification and directly influences snow stability and avalanche propagation, but existing parameterizations rely primarily on laboratory data or post-storm measurements that do not capture natural storm conditions. A framework is proposed to evaluate ηₛ using a Differential Emissivity Imaging Disdrometer (DEID), which measures snow density and microstructural properties on a snowflake-bysnowflake basis, enabling a physics-based parameterization of densification in real time. To accomplish this, we present a novel field-based viscometer designed to measure ηₛ of freshly fallen snow during and immediately after storms. Due to anomalous weather conditions during the 2025–2026 winter season, the dataset of in situ viscosity measurements is currently limited. Preliminary results therefore focus on instrument development, calibration, and the theoretical framework linking strain rate, applied stress, and densification. These results will demonstrate the feasibility of capturing real-time rheological behavior in lowdensity storm-snow and establish the methodology for future data collection. Ongoing and future work will expand the dataset during the 2026–2027 winter season and integrate viscosity parameterizations into a broader avalanche forecasting framework. Specifically, ηₛ-derived densification models will be incorporated into a coupled shear and anticrack stability system, enabling improved prediction of stormsnow instability using both real-time observations and numerical weather prediction. This research addresses a critical gap in avalanche science by using a novel field measurement technique for stormsnow densification and providing a pathway toward remotely operated physics-based forecasting tools."],"kw":"compactive viscosity, storm snow, densification, DEID, snow mechanics","ty":"P","pp":192,"em":[],"r":3576,"day":"Tue","th":"Snowpack Properties","pr":"Benjamin H. Silberman"},"207":{"id":"207","t":"Evolution of Avalanche Mapping in Veneto over 40 Years: From CLPV to a Webgis-Based System","au":[{"n":"Germano Dorigo","raw":"Dorigo, Germano","p":false,"aff":""},{"n":"Carlo Bee","raw":"Bee, Carlo","p":false,"aff":""},{"n":"Giovanna Burelli","raw":"Burelli, Giovanna","p":true,"aff":""},{"n":"Roberta Dainese","raw":"Dainese, Roberta","p":false,"aff":""},{"n":"Igor Chiambretti","raw":"Chiambretti, Igor","p":false,"aff":""}],"ab":["The WebGIS-Valanghe portal represents a significant technological tool, developed by the Arabba Avalanche Centre of ARPA Veneto, with the technological support of ESRI Italia, that allowed to consolidate over four decades of data on avalanches and protection measures into a single platform, aiming to create a dynamic resource to support territorial planning and public safety. Methodologically, the project involved a multi-year effort (2005–2017) to digitise an array of legacy 1:25000-scale paper maps, re-aligning them with the 1:10000 Regional Technical Map (CTR) for enhanced spatial precision. The primary component of the system is the Map of avalanches probable location (CLPV). This fundamental thematic resource identifies potential release and runout zones based on historical archives, eyewitness accounts, and stereoscopic aerial photointerpretation. The resulting geodatabase encompasses approximately 8500 avalanche sites across 111 municipalities of the Veneto Region, mostly located in the Dolomites. Moreover, it contains a comprehensive registry of approximately 300 defence structures and over 2000 documented historical events, summarised in standardised models known as Mod. 7 AINEVA. This information also serves as an important basis for calibrating dynamic avalanche simulation models in the eastern Italian Alps, pending the availability of more detailed data. Technically, the infrastructure uses ArcGIS Enterprise and Geocortex technologies, offering a flexible interface accessible at various levels to the public and registered professionals across a variety of operating systems and devices. By design, the system is flexible enough to adapt to changes, whether natural or anthropogenic. For example, it integrates new hazards associated with the 2018 Storm Vaia, during which extensive windthrows occurred, as well as the subsequent bark beetle epidemic, both of which created additional potential release areas. The new avalanche paths were identified alongside those influenced by climaterelated factors, such as rain-on-snow events and increased snow-gliding activity. Furthermore, it can easily be integrated when new protection measures are implemented. It is crucial to note that this tool is not a risk map, as it does not account for event frequency, runout dynamics, or defined return periods. It only provides an overview of the study area and the localisation of several classes of information. Nevertheless, WebGIS-Valanghe represents a valuable repository of mountain knowledge, ensuring that information is continuously updated and readily accessible to support new safety challenges and further research goals."],"kw":"Avalanche mapping, Geographic Information System, Avalanche cadastre.","ty":"P","pp":193,"em":[],"r":null,"day":"Fri","th":"Terrain","pr":"Giovanna Burelli"},"208":{"id":"208","t":"Monitoring Snow Cover in Remote Regions Using Radar Interferometry: Application to the Radarsat Constellation Mission (RCM)","au":[{"n":"Marie-Clara Delage","raw":"Delage, Marie-Clara","p":false,"aff":""},{"n":"Alexandre Langlois","raw":"Langlois, Alexandre","p":false,"aff":""},{"n":"Benoît Montpetit","raw":"Montpetit, Benoît","p":false,"aff":""}],"ab":["Snow cover is highly variable in space and time, making its characterization particularly challenging in remote and complex environments. Synthetic Aperture Radar (SAR) offers promising capabilities for large-scale snow monitoring under all-weather and day-night conditions. This study investigates the potential of C-band Interferometric Synthetic Aperture Radar (InSAR) data from the RADAR- SAT Constellation Mission (RCM) to estimate snow depth and snow water equivalent (SWE). The approach is evaluated across two contrasting environments: the deep, maritimeinfluenced snowpack of Rogers Pass, British Columbia, and the Arctic and subarctic snow conditions of Nunavik, Quebec. Sequential RCM SLC acquisitions are processed to generate interferometric phase time series, which are calibrated using in situ snow observations to retrieve changes in SWE. The resulting estimates are compared with field measurements and outputs from the physically based SNOWPACK model to assess their accuracy and robustness. This research aims to evaluate the potential and limitations of RCM InSAR for characterizing the spatial and temporal variability of snow cover and to support the development of improved snow and geohazard monitoring approaches in remote regions."],"kw":"Remote sensing, Snow, InSAR, RCM, Alpine","ty":"P","pp":194,"em":[],"r":3636,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Marie-Clara Delage"},"209":{"id":"209","t":"Early Detection of Snowpack Wetting Using Sentinel-1 Data: Linking Seasonal Snowpack Dynamics and Glacier Melt Under Cloud-Covered Conditions on the BRØGGER Peninsula, Svalbard","au":[{"n":"Jean-Michel Friedt","raw":"Friedt, Jean-Michel","p":true,"aff":""},{"n":"Eric Bernard","raw":"Bernard, Eric","p":false,"aff":""}],"ab":["Seasonal snow cover plays a fundamental role in controlling the timing, spatial distribution and intensity of glacier melt in the High Arctic. In Svalbard, winter warming, rain-on-snow events and earlier spring melt modify snowpack structure and promote transitions between dry snow, wet snow, refreezing and runoff. Observing these transitions at the glacier scale remains challenging because optical satellite observations are frequently affected by cloud cover and limited illumination. Synthetic Aperture Radar (SAR), and particularly Sentinel-1 C-band observations, provides an alternative because radar acquisitions are independent of cloud cover and solar illumination and are sensitive to changes in the dielectric properties of snow associated with liquid water. This study investigates the spatial and temporal dynamics of snowpack wetting across small glaciers of the Brøgger Peninsula, western Spitsbergen, using Sentinel-1 time series acquired between 2022 and 2025. Rather than attempting a direct inversion of snow water content, we use a relative, hypsometrically normalized approach designed to characterize the timing and vertical extent of snowpack transitions. Backscatter profiles are extracted along longitudinal glacier flowlines and transformed into a normalized elevation coordinate. Deviations from a winter reference state are used to identify statistically significant reductions in backscatter associated with the transition from cold, relatively dry snow towards wetter conditions. The resulting time– altitude information is summarized using a normalized hypsometric index, allowing comparison among glaciers with different elevation ranges. The Sentinel-1 observations are interpreted jointly with meteorological observations from Ny-Ålesund, including air temperature, precipitation and snow-cover information. Ground-based automated photography from the Austre Lovén glacier basin provides an independent local reference for interpreting major snowline and surface-state transitions. Across the 19 analysed glaciers, the radar time series reveal a coherent regional seasonal signal but also substantial differences in the timing, duration and vertical development of wet-snow conditions. The mean annual duration of detected wet-snow conditions is approximately 78 days over the 2022–2025 period. The onset of widespread wetting generally occurs after sustained positive-temperature forcing, while warm and wet periods associated with rain-on-snow conditions produce pronounced increases in the vertical extent of the radarderived wet-snow signal. The results demonstrate the potential of Sentinel-1 time series for regionalizing observations of snowpack state across Arctic glaciers while emphasizing that radar backscatter remains an indirect proxy of snow wetness. The proposed framework therefore provides a spatially distributed diagnostic tool rather than a direct measurement of liquid-water content or glacier melt."],"kw":"Sentinel-1; SAR; wet snow; snowpack; glacier melt; Svalbard","ty":"P","pp":195,"em":[],"r":3637,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Jean-Michel Friedt"},"211":{"id":"211","t":"Validation of SNOWPACK Simulations Using a Low-Cost Weather Station in Southern Norway","au":[{"n":"Bert Kruyt","raw":"Kruyt, Bert","p":true,"aff":""},{"n":"Markus Landrø","raw":"Landrø, Markus","p":false,"aff":""},{"n":"Håvard Boutera Toft","raw":"Toft, Håvard Boutera","p":false,"aff":""},{"n":"Rasmus Haury","raw":"Haury, Rasmus","p":false,"aff":""},{"n":"Eirik Stave","raw":"Stave, Eirik","p":false,"aff":""},{"n":"Jostein Aasen","raw":"Aasen, Jostein","p":false,"aff":""},{"n":"Karsten Müller","raw":"Müller, Karsten","p":false,"aff":""}],"ab":["Snow-cover models are increasingly used to support avalanche forecasting, but their reliability must be demonstrated under prevailing climatic conditions before they can become part of operational workflows. We present a first validation of the SNOWPACK model for Norway using repeated snow-profile observations collected during the winter of 2025/26 at two sites representing continental and maritime snow climates. Simulations forced with numerical weather prediction (NWP) data and measurements from low-cost weather stations were compared with observed snowpack evolution. The results show that errors in meteorological forcing, particularly a cold bias in NWP air temperature, strongly influence simulated snow depth and snowpack structure. Including explicit soil layers improved the simulation of temperature gradients and depth-hoar formation, while modifications to melt-freeze crust metamorphism improved agreement with observed grain-type evolution. Across both sites, however, simulations tended to overestimate the occurrence of melt forms and rounding facets relative to observations. Overall, SNOWPACK reproduced the main characteristics of the observed snowpacks when appropriate forcing data and model settings were used. The study provides an important first step toward the operational use of SNOWPACK in avalanche forecasting in Norway and highlights areas where further model development is needed."],"kw":"Validation, Modelling, SNOWPACK, Norway, case-study.","ty":"P","pp":196,"em":[],"r":3638,"day":"Thu","th":"Modelling and Quantitative Forecasting","pr":"Bert Kruyt"},"212":{"id":"212","t":"SAR Remote Sensing as a Support Tool for Operational Avalanche Forecasting","au":[{"n":"Alberto Mariani","raw":"Mariani, Alberto","p":true,"aff":""},{"n":"Jacopo Borsotti","raw":"Borsotti, Jacopo","p":false,"aff":""},{"n":"Martin Metzger","raw":"Metzger, Martin","p":false,"aff":""},{"n":"Giacomo Villa","raw":"Villa, Giacomo","p":false,"aff":""},{"n":"Luca Dellarole","raw":"Dellarole, Luca","p":false,"aff":""},{"n":"Martin Ahrland Stefan","raw":"Stefan, Martin Ahrland","p":false,"aff":""},{"n":"Franz Livio","raw":"Livio, Franz","p":false,"aff":""},{"n":"Fabiano Monti","raw":"Monti, Fabiano","p":false,"aff":""}],"ab":["Synthetic Aperture Radar (SAR) remote sensing has increasingly been exploited for snow and avalanche research to derive spatially explicit information. For example, models have been developed to detect wet snow, measure snow depth, and reconstruct avalanche activity by identifying avalanche deposits. These models have demonstrated their effectiveness in retrieving snow cover information over time, allowing the derivation of valuable historical records for specific regions. Such information is crucial for avalanche-related land-use planning, which relies on the occurrence and extent of past extreme avalanche events. It also supports the development of reference datasets to validate and improve snowpack and avalanche hazard modelling approaches. However, the role of SAR in operational avalanche forecasting remains less straightforward, as SAR data are typically collected at multi-day intervals and primarily provide information on current or past conditions, whereas public avalanche forecasts are issued daily to support short-term forecasting. This temporal mismatch raises an important question: how can SAR data meaningfully contribute to operational avalanche forecasting? In this study, we address this question from the perspective of a forecaster. Rather than viewing SAR as a standalone tool, we frame it as an additional layer of information that can support field observations and the monitoring of snowpack conditions. Using real-case examples from the Livigno Avalanche Center (Italy) and Tromsø (Norway), we show how SAR-derived information can help update or confirm the spatial distribution of key avalanche-relevant features and highlight areas where field evidence is sparse. Specifically, we show how SAR-derived products are translated into the improvement of avalanche forecasting throughout a winter season. Overall, this work argues that the value of SAR for operational avalanche forecasting lies not only in snowpack monitoring, but also in its ability to provide independent, spatially extensive snapshots that can strengthen the forecast process, improve the consistency of public avalanche forecasts, and bridge gaps between field observation and snowpack spatial variability."],"kw":"Synthetic Aperture Radar; remote sensing; wet snow; snow depth; avalanche deposits.","ty":"O","pp":197,"em":[],"r":3477,"pr":"Alberto Mariani"},"213":{"id":"213","t":"Modeling Wind Slabs with the SNOWPACK Model","au":[{"n":"Bert Kruyt","raw":"Kruyt, Bert","p":true,"aff":""},{"n":"Nander Wever","raw":"Wever, Nander","p":false,"aff":""},{"n":"Karsten Müller","raw":"Müller, Karsten","p":false,"aff":""}],"ab":["Computer simulations of snowpack stratigraphy and stability are increasingly being used to assist avalanche forecasting. These models make information about the snowpack continuously available, even in remote locations where observations are sparse. This approach has proven useful for widespread and long-lived avalanche problems such as persistent weak layers or wet snow avalanche problems. Wind slabs on the other hand, are harder for computer models to predict, since their formation can depend on localized terrain features that may not be resolved by the spatial resolution of the forcing data. Additionally, the weak layer formed by a wind-slab problem is often shortlived, which makes model validation challenging. As a result, wind slab problems have not been well represented in the SNOWPACK model. However, the SNOWPACK model has seen continuous development over recent years to calculate snow erosion by wind based on surface snow properties, and to derive snow transport rates. Here we present new and improved functionality to describe the formation of wind slabs with the SNOWPACK model, based on these recent model developments. We describe how densification through wind can be modeled using the redeposit mode, and how this mode is used in an advanced wind redistribution scheme. We show how the new redistribution scheme, in combination with virtual slopes, can be applied to model the formation of wind slabs. Lastly, we implemented changes to the drift index to yield a more realistic wind slab indicator for forecasters. This refined index can be calculated for each individual slope aspect, providing some generalized information about the aspects where wind slabs are likely to be found. These developments mark a small but important step forward in the use of snow models in avalanche forecasting."],"kw":"Snow, Wind, Modeling, SNOWPACK, AWSOME.","ty":"O","pp":198,"em":[],"r":3478,"pr":"Bert Kruyt"},"214":{"id":"214","t":"Funding the Forecast: Comparing Approaches to Avalanche Risk Management","au":[{"n":"Liz Daniel","raw":"Daniel, Liz","p":true,"aff":""}],"ab":["Winter backcountry recreation has grown dramatically in recent years. Despite this surge, annual avalanche fatalities in the US have remained stable for the last three decades. This juxtaposing trend is largely attributed to avalanche safety programs. The structure and stability of these programs directly shape their performance and effectiveness; structure encompasses operational architecture (staffing, governance, partner networks, and service dissemination), while stability refers to the financial mechanisms sustaining operations. When funding is unreliable, operations follow: staff positions go unfilled, forecast coverage shrinks, and public risk communication erodes, undermining a program’s ability to reduce avalanche fatalities. Understanding how US avalanche programs are structured and funded, and how those models compare with peer countries, helps identify which models best support durable, effective public safety services. This study is a comparative policy analysis examining avalanche programs in the US and peer countries across North America, Europe, and New Zealand. Using a literature review, expert informant surveys, semi-formal interviews, and comparative analysis of 12 programs across seven countries, the study evaluates differing organizational approaches to identify policy recommendations that could improve the long-term efficacy and stability of US avalanche programs. Findings indicate that organizational structure explains how a program is funded and staffed, but does not reliably predict its effectiveness or funding stability. Instead, whether funding is legally protected— through legislated mandates or multi-year contracts—is the stronger predictor of program durability. Based on these and additional findings, this research recommends standardizing multi-year funding mechanisms, strengthening cohesion among US avalanche centers, preserving existing nonprofit partnerships, and adopting reach-based metrics alongside fatality data to mor
