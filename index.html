 Morgan","raw":"Morgan, Jonathan","p":false,"aff":""}],"ab":["The 2025–26 winter in Utah produced a complex snowpack shaped by persistent weak layers, multiple rain-on-snow events, extended high-pressure periods, and record low snowfall. Persistent slab was a forecasted avalanche problem for over one hundred consecutive days, from December 2, 2025 to March 14, 2026. Entering mid-March, the snowpack still held intact persistent weak layers, while surface conditions varied widely by elevation and aspect. From March 14–30, Utah experienced a prolonged period of record or near-record warmth. Salt Lake City reached 27°C (80°F) on March 19, the earliest reading in recorded history, and set a new March record high of 27°C (81°F). Few mountain locations saw a meaningful overnight refreeze during this period. As free water moved deeper into the snowpack, avalanche danger oscillated repeatedly between MODERATE and CONSIDERABLE, with wet loose, wet slab, and glide avalanches as the primary concerns. Forecasters faced elevated uncertainty about the timing, distribution, and destructive potential of wet slab releases, particularly in terrain containing older persistent weak layers. This case study examines the meteorological setup of this historic heat event, the avalanche cycle that followed, and the differences between public and operational forecasting perspectives during this complex, prolonged wet cycle. Unlike prior short-lived warming events, the sustained nature of this period reduced the reliability of standard assumptions such as overnight refreezes and predictable daily stability trends, requiring continual reassessment of danger ratings, travel advice, and public messaging. This event illustrates how prolonged warm periods can rapidly shift avalanche problems and challenge traditional spring forecasting frameworks in intermountain and continental snow climates."],"kw":"wet slab avalanches, persistent weak layers, spring warming event, avalanche forecast- ing, snow climatology, Utah","ty":"P","pp":336,"em":[],"r":null,"day":"Fri","th":"Incidents and Case Studies","pr":"Nikki Champion"},"386":{"id":"386","t":"The Avalanche Test Site in Lech Am Arlberg, Austria: Past, Present and Future","au":[{"n":"Alexander Prokop","raw":"Prokop, Alexander","p":true,"aff":""},{"n":"Nicola Agostinetti","raw":"Agostinetti, Nicola","p":false,"aff":""},{"n":"Stefan Muckenhuber","raw":"Muckenhuber, Stefan","p":false,"aff":""},{"n":"Stefan Graf","raw":"Graf, Stefan","p":false,"aff":""},{"n":"Thomas Gölles","raw":"Gölles, Thomas","p":false,"aff":""},{"n":"Richard Koschuch","raw":"Koschuch, Richard","p":false,"aff":""},{"n":"Stefan Wallner","raw":"Wallner, Stefan","p":false,"aff":""},{"n":"Birgit Schlager","raw":"Schlager, Birgit","p":false,"aff":""},{"n":"Benedikt Anwander","raw":"Anwander, Benedikt","p":false,"aff":""},{"n":"Florian Singer","raw":"Singer, Florian","p":false,"aff":""},{"n":"Bernhard Grasemann","raw":"Grasemann, Bernhard","p":false,"aff":""}],"ab":["For more than 20 years a unique avalanche test site in the ski resort of Lech am Arlberg, Austria at the slopes of Mohnenfluh Mountain is used for snow and avalanche research. Located close to Warth-Schröcken, which is considered the snowiest ski resort in the Alps that records an impressive average annual snowfall of approximately 10,7 m of fresh snow and its south-east exposure loaded by predominant north-westerly winds in 2200 altitude meters serve as perfect conditions for scientific analyses of different processes regarding snow properties and snow processes as well as avalanche release and avalanche dynamics. 6 avalanche-blasting towers allow for controlled remote triggering of avalanches in multiple paths, with typical avalanche release width ranging from 10 to 80 m and avalanche lengths ranging from 50 to 350 m. In an average winter about 50 to 100 avalanche events can be analyzed. In the past, pioneering work was conducted at the test site such as the first terrestrial laser scanning measurements of snow surfaces scientifically analyzed for snow and avalanche research or the first detections of avalanche events using distributed acoustic and seismic fiber optic sensing. Moreover sophisticated snowdrift models were validated at the test site and the functionality of avalanche protection measures was tested and improved. At the moment the scientific measurements focus on an accurate knowledge of 3-dimensional conditions of snow pack properties and avalanche events in high temporal resolution. Next to common automatic weather and snow sensors, 4 automatic LiDARs survey spatial snow depth at any time in parts of the test site and in combination with manual conducted LiDAR measurements full spatial snow depth at the test site is collected. Additionally acoustic and seismic distributed fiber optic sensing deliver high resolution (1 – 5 m) data of snow pack properties and avalanche events. Two avalanche radars detect automatically avalanches and deliver avalanche speed measurements. To summarize data about size, speed and intensity in terms of seismic signals of avalanche events is collected in high accuracy and temporal resolution and satellite remote sensing data is validated. We present and discuss the current measurement set-up and the data quality delivered and we invite researches interested in such data to join us at our research site!"],"kw":"avalanche, snow properties, test site, Alps.","ty":"P","pp":337,"em":[],"r":null,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Alexander Prokop"},"390":{"id":"390","t":"Visualization of Run Usage History and Observations as a Decision-Making Aid During Periods of Persistent Weak Layer Avalanche Risk","au":[{"n":"Tristen Rasmussen","raw":"Rasmussen, Tristen","p":true,"aff":""},{"n":"John Forrest","raw":"Forrest, John","p":false,"aff":""},{"n":"Ryan Merrill","raw":"Merrill, Ryan","p":false,"aff":""}],"ab":["Management of persistent weak layer (PWL) avalanche risk to guests and workers in the Helicopter Skiing Industry is of critical importance. PWL avalanches are large, destructive, and can be remotely triggered, making them very difficult to manage. The risk management process of deciding which terrain to ski during periods of PWL is complex and involves many factors. The outcome of this process is ultimately terrain choice, which has several different levels: generation of a daily run list, specific run selection by lead guides in the field, and how each run is skied. Generation of a run list involves more than an avalanche hazard rating and simple terrain characteristics (Hageli Atkins, ISSW 2016). Knowledge of past terrain usage, avalanche activity history, and relevant snow profiles are all important factors in this decision. Currently this information is available in different sources. Evaluation of this data is very time consuming when generating a run list for an operation with several hundred runs. The goal of this paper is to present a novel map based visual decision aid for run list terrain selection during periods of PWL risk. A new heatmap algorithm for visualization of terrain usage history is proposed, combined with relevant weather, avalanche observations, and snow profiles. This information is consolidated and displayed on a map to enable efficient evaluation of runs to consider or avoid. Resulting in increased efficiency in run list generation and improved operational safety during periods of PWL risk. Background: A heatmap is a method of visualizing complex density or usage intensity data using a visual color scale on a GIS map. Heatmaps are now familiar parts of modern life when we use applications such as traffic maps (Google Maps) or outdoor apps (Strava). This paper will include examples based on data collected at Northern Escape Heli-Skiing during the 2025/26 season using the MtnOps Operational Support System."],"kw":"Avalanche Forecasting, Terrain Usage, Decision Tools.","ty":"O","pp":338,"em":[],"r":3485,"pr":"Tristen Rasmussen"},"391":{"id":"391","t":"AutoATES V3.0: Automated ATES Mapping at Scale Across Western Canada","au":[{"n":"John Sykes","raw":"Sykes, John","p":true,"aff":""},{"n":"Declan Knies","raw":"Knies, Declan","p":false,"aff":""},{"n":"Pascal Haegeli","raw":"Haegeli, Pascal","p":false,"aff":""},{"n":"Kristin Anthony-Malone","raw":"Anthony-Malone, Kristin","p":false,"aff":""},{"n":"Grant Statham","raw":"Statham, Grant","p":false,"aff":""}],"ab":["Avalanche Terrain Exposure Scale (ATES) maps help backcountry travelers understand how exposed a piece of terrain is to avalanche hazard. Making those maps by hand is slow and expensive, so they exist for only a few highuse areas. Producing consistent maps for every avalanche forecast region in western Canada, 400,000 km², is a different problem: it removes the option of local tuning. This paper describes the working autoATES v3.0 model for that production run, and the changes from autoATES v2.0 that the domain forced. A domain-wide Sentinel-2 forest product, built from paired summer and winter scenes at 10 m spatial resolution, supplies a consistent canopy layer from the Coast Range to the Rockies. The classifier uses the area of openings in that canopy (gap area, in hectares), not average canopy percentage, as the forest variable. Treeline is estimated per forecast subregion rather than as a single elevation. Elevation comes from a global 30 m surface model, chosen for consistency over a lidar patchwork. Potential release areas and runout are each produced as a typical scenario and a more inclusive infrequent scenario, so low-angle persistent-weak-layer terrain can be represented without compromising the typical layer. The ATES classifier follows the published ATES v.2 technical model: floors for the bold defaults, then an averaging step for the remaining evidence. Typical and infrequent PRA and runout are the regional calibration surface. Canadian production maps use both scenarios and classes 0–4; the same method can rate a typical scenario alone as classes 1–4, with Simple as the default. Observed avalanches and expert maps answer different questions; neither is ground truth. Connaught Creek, mapped independently of autoATES, is the transfer test: the classifier agrees with the expert consensus at the same level that three mappers agree with each other. Maps edited from an autoATES draft are how the reference set can grow. Finished maps will be hosted by Avalanche Canada and made freely available. A bestpractices document is in development. The aim is a defensible, consistent product for western Canada, not a closer fit to any one expert map."],"kw":"Automated avalanche terrain mapping; Avalanche Terrain Exposure Scale (ATES); runout simulation; model validation; trip planning","ty":"P","pp":339,"em":[],"r":null,"day":"Fri","th":"Terrain","pr":"John Sykes"},"392":{"id":"392","t":"Prediction of the Destructive Size of Dry Slab Avalanches from Field Measurements","au":[{"n":"DM McClung","raw":"McClung, DM","p":false,"aff":""},{"n":"Nicola Pugno","raw":"Pugno, Nicola","p":false,"aff":""}],"ab":["In this paper we present estimates of the Destructive Size of dry snow slab avalanches based on field measurements of initial dimensions. The dimensions are combined with fracture line data from dry slab avalanches to predict, statistically, the initial mass released. The results should be of use as guidelines for backcountry travelers, avalanche forecasters and as input to avalanche dynamics applications."],"kw":"Dry slab avalanche, Destructive Size, Statistical prediction","ty":"P","pp":340,"em":[],"r":null,"day":"Thu","th":"Risk Communication","pr":"DM McClung"},"394":{"id":"394","t":"Backcountry Terrain Use Patterns Under Varying Avalanche Forecast Conditions in the Canadian Rockies: Insights from Strava Activity Data","au":[{"n":"Marc Pons","raw":"Pons, Marc","p":true,"aff":""},{"n":"Colin Bergeron","raw":"Bergeron, Colin","p":false,"aff":""},{"n":"Julie Heinrichs","raw":"Heinrichs, Julie","p":false,"aff":""}],"ab":["Understanding how backcountry recreationists adjust their terrain choices in response to avalanche hazard remains a key gap in avalanche risk research. Although prior studies have inferred skier behaviour from GPS tracks, online engagement, or mobile phone records, few combine spatially explicit recreation data with avalanche terrain classification and detailed forecast information, including both danger ratings and avalanche problem types. We examine backcountry activity across two case study areas in the Canadian Rockies using an integrated methodology combining Strava activity data, Avalanche Canada forecasts (danger rating and problem type), and Avalanche Terrain Exposure Scale (ATES) maps to quantify how use is distributed across terrain classes under varying hazard conditions. Results show that temporal factors—especially weekends and seasonal progression—are the primary drivers of overall activity, consistent with findings from the Swiss Alps. However, a critical discrepancy emerged between Strava heatmap data, which captures broader user bases across all terrain types and Strava Metro data. While Mount Revelstoke (predominantly road-accessible terrain) shows reliable terrain-danger relationships with ~174,000 recorded trips, Rogers Pass and Glacier National Park (high-exposure backcountry terrain) yielded sparse Metro activity despite heatmap evidence of substantial recreational use. This indicates that terrain selection patterns can be reliably assessed for road-accessible recreation but not for avalanche-exposed backcountry populations using Metro filtering alone. We assess both the potential and critical limitations of Strava as a scalable, privacy-respecting proxy for backcountry use in mountain areas. Despite systematic biases toward accessible terrain and younger, technologyadopting user populations, our analysis demonstrates that evaluation of user behavior relative to temporal avalanche conditions is achievable using crowdsourced activity data. Strava heatmap analysis confirmed that activity is distributed across terrain classes at landscape scales; however, standard Metro data downloads do not provide the temporal granularity required for daily hazard-behavior analysis, particularly in remote backcountry terrain. To overcome this critical limitation, we recommend an API-based workflow for acquiring segment-level activity counts at daily and monthly resolution, combined with heatmap validation and local expert consultation. This integrated approach enables characterization of how diverse user populations respond to avalanche conditions in both roadaccessible and high-exposure terrain, supporting robust, scalable monitoring of recreation-hazard dynamics when data limitations are properly acknowledged and addressed. We propose an integrated API-based methodology combining daily/monthly Strava segment data, heatmap validation, and terrain analysis for future studies of backcountry user response to avalanche conditions. Such frameworks can support efforts to incorporate spatially explicit recreation dynamics into avalanche communication frameworks and wildlife–recreation interaction models while maintaining awareness of population-specific data biases."],"kw":"","ty":"O","pp":341,"em":[],"r":3399,"pr":"Marc Pons"},"396":{"id":"396","t":"Characterizing Differences Among Automated Avalanche Terrain Mapping Approaches: A Multi-Institution Comparison at Rogers Pass, Canada","au":[{"n":"John Sykes","raw":"Sykes, John","p":true,"aff":""},{"n":"Stephan Harvey","raw":"Harvey, Stephan","p":false,"aff":""},{"n":"Paula Spannring","raw":"Spannring, Paula","p":false,"aff":""},{"n":"Christoph Hesselbach","raw":"Hesselbach, Christoph","p":false,"aff":""},{"n":"Kalin Markov","raw":"Markov, Kalin","p":false,"aff":""},{"n":"Pascal Haegeli","raw":"Haegeli, Pascal","p":false,"aff":""},{"n":"Grant Statham","raw":"Statham, Grant","p":false,"aff":""}],"ab":["Automated avalanche terrain mapping has become an established approach for communicating avalanche terrain exposure to public and professional backcountry users. Several groups have developed automated workflows that implement the Avalanche Terrain Exposure Scale (ATES) framework at scale by identifying start zones, simulating runouts, and assigning ATES classes. These approaches share the same class definitions but differ in how they parameterize release areas, represent forest, and translate terrain and avalanche characteristics into class ratings. This study compares four automated implementations at Connaught Creek in Rogers Pass, British Columbia, Canada. All products were generated on shared 5 m elevation and forest-cover data and compared against an ATES map produced manually and independently by three experts. Six avalanches from a high-magnitude rain-on-snow cycle, mapped by the local forecast team, provide an independent reference for the runout layers. All products show moderate to strong ordinal agreement with the expert map (quadratic-weighted kappa 0.59–0.73, which treats adjacent-class disagreements as less severe than distant ones); most differences are a single ATES class. The products differ more in the direction of disagreement than in its magnitude, reflecting the slope angle at which each escalates ratings and whether forest is used to reduce ratings. Release areas diverge most below 30°; runout layers are more similar, with typical-magnitude layers reaching 70–79 % of the mapped valley-bottom avalanches and largermagnitude layers reaching 90–98 %. The closest automated product matches the level of agreement among the independent mappers themselves (exact agreement 65 % versus 63 %, weighted kappa 0.73 versus 0.71). The differences between each group’s map outputs are modeling choices shaped by regional snow climate and design philosophy, not errors in applying a shared ATES framework. The comparison does not rank the products; it clarifies the trade-offs so that shared, flexible workflows can support regionally appropriate maps while drawing on collective institutional knowledge."],"kw":"Automated avalanche terrain mapping; Avalanche Terrain Exposure Scale (ATES); runout simulation; model comparison","ty":"O","pp":342,"em":[],"r":3400,"pr":"John Sykes"},"398":{"id":"398","t":"A Study of the Physical Properties of Slab Cohesion and Its Impact on the Stability of the Snow Cover","au":[{"n":"Megan Cramb","raw":"Cramb, Megan","p":true,"aff":""},{"n":"Alexandre Langlois","raw":"Langlois, Alexandre","p":false,"aff":""}],"ab":["Unconsolidated snow, particularly during or immediately following a storm, is often expected to release as loose avalanches. However, there are numerous instances of slab avalanches releasing from conditions where the snow was more cohesive than expected. These types of avalanches, often termed a ‘soft slab’, or similar, are inconsistently reported using various terminology. This research project proposes a threshold value of cohesion, based on measurable snowpack properties. Snowpack test results from Extended Column Tests and Compression Tests are presented and correlated to snowpack properties, measured using the InfraRed Integrating Sphere (IRIS), Blade Hardness Gauge (BHG), and Hand Hardness (HH) observations. Based on these results, a threshold value for identifying slab cohesion is proposed, to aid in determining whether storm snow is more likely to release as a dry loose or slab avalanche."],"kw":"Cohesion, Slab Development, Storm Slab, Dry Loose, Soft Slab, Unconsolidated Snow","ty":"P","pp":343,"em":[],"r":null,"day":"Fri","th":"Snowpack Properties","pr":"Megan Cramb"},"400":{"id":"400","t":"An Extraordinary Winter in Tirol: Persistent Weak Layers, Prolonged Instability, and Communication Challenges","au":[{"n":"Matthias Walcher","raw":"Walcher, Matthias","p":true,"aff":""},{"n":"Patrick Nairz","raw":"Nairz, Patrick","p":false,"aff":""},{"n":"Bengt Haunerland","raw":"Haunerland, Bengt","p":false,"aff":""}],"ab":["The 2025/26 winter season in Tirol, Austria, was characterized by an unusually widespread basal persistent weak layer (PWL) that remained relevant until the end of the season. A very dry start produced a shallow early-season snowpack, while rain to high elevations on December 9, followed by warm and wet conditions, formed a widespread melt-freeze crust. Continued faceting beneath this crust resulted in a pronounced layer of large faceted crystals and depth hoar across much of the forecasting territory. January snowfall and wind formed sufficiently cohesive slabs, triggering a sharp rise in avalanche danger that remained predominantly Considerable or High for approximately eight weeks. Conditions culminated in the second half of February, when repeated loading produced a widespread natural avalanche cycle. Avalanche danger was rated High for ten consecutive days. Within one week, seven fatal avalanche accidents resulted in ten deaths. Across the season, 287 avalanches involving people were documented, almost three times the ten-year average. The PWL remained relevant into spring and became highly reactive again after the first major warming events in early April. The prolonged instability created several forecasting and communication challenges. These included selecting an Avalanche Problem that adequately represented observed snowpack behavior, maintaining user attention during weeks of similar warning messages, and reaching user groups who did not routinely seek avalanche information. Lift-assissted off-piste skiers proved particularly difficult to reach during the February accident period. The season also highlighted the importance of strong information networks, continuous reassessment, and team resilience during prolonged operational pressure. Our experience emphasizes the need for clearer and more consistent guidance in the application of standardized Avalanche Problems, adaptive communication strategies that evolve with the hazard situation, and flexible approaches for reaching specific user groups when they are most exposed."],"kw":"persistent weak layer, avalanche forecasting, prolonged instability, avalanche communi- cation, lift-accessed terrain, operational resilience","ty":"O","pp":344,"em":[],"r":3491,"pr":"Matthias Walcher"},"402":{"id":"402","t":"Did Publishing Avalanche Danger Sub-Levels Change the Behaviour of Forecasters and Forecast Users?","au":[{"n":"Frank Techel","raw":"Techel, Frank","p":true,"aff":""},{"n":"Leonie Sch¨afer","raw":"Sch¨afer, Leonie","p":false,"aff":""},{"n":"Antoine Zaninetti","raw":"Zaninetti, Antoine","p":false,"aff":""},{"n":"Sascha Brunner","raw":"Brunner, Sascha","p":false,"aff":""},{"n":"C´elia Lucas","raw":"Lucas, C´elia","p":false,"aff":""},{"n":"Günter Schmudlach","raw":"Schmudlach, Günter","p":false,"aff":""},{"n":"Ross Purves","raw":"Purves, Ross","p":false,"aff":""}],"ab":["Avalanche danger levels compress complex avalanche conditions into five categories, inevitably hiding variation within a level. A fundamental question in risk communication is whether communicating within-level differences explicitly changes how people make decisions. The Swiss avalanche warning service provides a rare opportunity: in winter 2022/23 it began publishing sub-level modifiers (−, =, +) that forecasters had already assigned internally for six winters, while leaving the forecasting methodology unchanged. We evaluated behavioural responses across the full decision chain, from tour planning, through terrain choices in the field, to outcomes, and compared forecasting practice before and after publication. Forecasting practice changed little overall. The only notable shift occurred within danger level 2, where forecasters assigned 2+ more frequently, likely because the published modifier communicates “close to level 3 (considerable)” without issuing level 3. In contrast, we found little evidence that publication altered recreationists’ decisions at any stage of the decision chain. Instead, users already appeared to respond to within-level differences before they were made explicit, suggesting that this information was already conveyed through bulletin wording and the observed snow conditions. Publishing sub-levels thus made within-level differences in avalanche danger explicit, without evidence of the behavioural changes that some critics had feared."],"kw":"avalanche forecasting, avalanche danger, risk communication","ty":"P","pp":345,"em":[],"r":3607,"day":"Tue","th":"Avalanche Forecasting","pr":"Frank Techel"},"403":{"id":"403","t":"Photogenic Avalanches: What Makes an Observer Photo Useful for Estimating Avalanche Size?","au":[{"n":"Andy Moderow","raw":"Moderow, Andy","p":true,"aff":""},{"n":"Jeremiah Lance","raw":"Lance, Jeremiah","p":false,"aff":""},{"n":"Ben Crosier","raw":"Crosier, Ben","p":false,"aff":""},{"n":"Eeva Latosuo","raw":"Latosuo, Eeva","p":false,"aff":""}],"ab":["People entering the backcountry rely on avalanche forecasts for up-to-date knowledge about the avalanche hazard. In return, backcountry travelers support avalanche forecast centers by sharing their snowpack and avalanche observations on public observation platforms. These submissions often include photos in addition to written information. Avalanche centers in southcentral Alaska get hundreds of photos of avalanches seasonally from the public and professionals recreating in the forecast area. Avalanche forecasters then use these photos to assess avalanches they have not seen firsthand, though these photos are not always as informative as they could be. Our main objective is to identify the photo characteristics that best support avalanche size estimation, so that destructive potential can be estimated accurately, consistently, and reliably from observational photos. As a proof of concept, we distributed an online survey to 13 professional public avalanche forecasters in Alaska and asked them to estimate the size of ten avalanches using public observation photos. In addition to size, forecasters also described the photo qualities that helped with sizing, their confidence in their assessment, and their prior knowledge of the pictured avalanche or slope. In this pilot phase, we found that reference objects played a major role in supporting sizing consistency between professionals, and that photo angle/completeness – including a clear view of the crown, track, and debris – supported more confidence and consistency in size assessments. In the coming season we plan to collect additional data to build on these preliminary findings, to identify best practices for observers when photographing avalanches. This guidance could be utilized by avalanche forecast centers to educate public observers on how to take higher-quality photos and thereby improve forecasters’ ability to estimate avalanche size from images."],"kw":"Avalanche forecasting, avalanche size, observations, photos","ty":"P","pp":346,"em":[],"r":3608,"day":"Tue","th":"Avalanche Forecasting","pr":"Andy Moderow"},"405":{"id":"405","t":"Managing Avalanche Hazard on a Major Road During an Extreme Snowfall Event in Northern Norway, March 2025","au":[{"n":"Jacob Berg Lofthus","raw":"Lofthus, Jacob Berg","p":true,"aff":""},{"n":"Ole-Andre Helgaas","raw":"Helgaas, Ole-Andre","p":false,"aff":""}],"ab":["During March 2025, an exceptional avalanche cycle affected the E6 highway corridor in Langfjorden, Finnmark, Northern Norway. Persistent snowfall throughout the month, followed by increased precipitation intensity and subsequent warming, resulted in a prolonged period of very high avalanche hazard. On 21 March 2025, more than 15 avalanches were artificially released during a DaisyBell operation, nine of which reached the highway. Several avalanches occurred in terrain with no previous historical records. This paper documents the meteorological conditions, avalanche activity, operational decisions, and lessons learned."],"kw":"Avalanche cycle, Daisybell, Highway safety, Avalanche control, Norway","ty":"P","pp":347,"em":[],"r":null,"day":"Fri","th":"Incidents and Case Studies","pr":"Jacob Berg Lofthus"},"406":{"id":"406","t":"Is Arctic Snow Different from Alpine Snow? Following Up on the Discussion in Regards to Avalanche Forecasting","au":[{"n":"Alexander Prokop","raw":"Prokop, Alexander","p":true,"aff":""},{"n":"Bernhard Hynek","raw":"Hynek, Bernhard","p":false,"aff":""},{"n":"Eric Bernard","raw":"Bernard, Eric","p":false,"aff":""},{"n":"Jean-Michel Friedt","raw":"Friedt, Jean-Michel","p":false,"aff":""},{"n":"Florian Tolle","raw":"Tolle, Florian","p":false,"aff":""}],"ab":["A discussion at recent ISSWs elaborated on the question if Arctic snow is different from Alpine snow and in what way. Rather than using a physical snow pack model in regions close to the Arctic Circle and investigating its results in terms of snow properties and snow instability we like to focus here on practical examples of daily avalanche forecasting in regions closer to the North Pole such as Svalbard or Greenland. Those regions are meteorological dominantly affected by the North Atlantic Current that transports warm water masses to the North, which influences the avalanche climate. This and other obvious differences in Arctic climatic boundary conditions such as no or little solar radiation during winter months, lower sun angle in spring, stronger and longer lasting winds , and colder air temperatures result in different challenges for avalanche forecasters and different processes and avalanche problems have to be analyzed than in the Alps. Therefore we analyze typical avalanche events of the past with existing meteorological and snow pit data that represent such different processes of avalanche initiation. We focus on process understanding and how avalanche forecasters can address the challenges of Arctic snow pack properties."],"kw":"avalanche forecasting, Arctic snow pack, process analysis.","ty":"P","pp":348,"em":[],"r":3609,"day":"Tue","th":"Avalanche Forecasting","pr":"Alexander Prokop"},"407":{"id":"407","t":"A Modified Extended Column Test to Assess the Likelihood of Snowmobile Triggering and Propagation of Persistent Weak Layers","au":[{"n":"Iain Stewart-Patterson","raw":"Stewart-Patterson, Iain","p":true,"aff":""},{"n":"Jeremy Hanke","raw":"Hanke, Jeremy","p":false,"aff":""}],"ab":["The Extended Column Test (ECT) is a well-established instability test for evaluating both fracture initiation and propagation propensity within slab avalanche problems. Its utility, however, is largely constrained to weak layers buried at depths of less than approximately one metre. Beyond this threshold, the likelihood of obtaining meaningful results diminishes due to insufficient stress transmission from the applied loading. In these deeper scenarios, skier triggering probability decreases, whereas snowmobile-triggered avalanches remain comparatively more likely. Snowmobiles generate a substantially greater stress field within the snowpack, with an estimated pressure bulb three to five times that of a skier. This increased load facilitates the activation of deeper persistent weak layers (PWLs), which may otherwise appear unreactive to skier triggering and skier-based instability tests. While Deep Tap tests and Propagation Saw tests can provide insight into fracture propagation characteristics, they do not directly quantify the probability of initiation under dynamic loading conditions typical of motorized use. Of the 140 InfoEx subscribers, only a small subset (approximately five operations) are snowmobilebased. Consequently, machine-triggered avalanche incidents (classified as Ma, Mr, or Mc) are underrepresented in the dataset. This bias is further exacerbated by underreporting within the recreational snowmobiling community, where avalanche involvement is often normalized and not systematically documented. Concurrently, advancements in snowmobile technology and riding techniques, particularly maneuvers such as bow ties and wheelies on short-track, turbocharged machines, result in deeper stress penetration into the snowpack. The Modified Extended Column Test (MECT) is designed to better approximate the increased depth and magnitude of the pressure bulb generated by a snowmobile. To achieve this, surface snow is selectively removed from the test column to a depth corresponding to the measured track penetration of the machine. Excavation is limited to the shovel loading area, while the remaining overburden is left intact to preserve the in situ stress distribution across the column. Loading is then applied following the standard Extended Column Test (ECT) protocol, ensuring consistency in force application and enabling comparison with established ECT results."],"kw":"Snowmobiling and Motorized Access","ty":"P","pp":349,"em":[],"r":3610,"day":"Tue","th":"Snowmobiling and Motorized Access","pr":"Iain Stewart-Patterson"},"408":{"id":"408","t":"Inferring Avalanche Dynamics and Magnitude from Infrasound Source Location and Energy Proxy","au":[{"n":"G. Ulivieri","raw":"Ulivieri, G.","p":false,"aff":""},{"n":"M. Ripepe","raw":"Ripepe, M.","p":false,"aff":""},{"n":"G. Lacanna","raw":"Lacanna, G.","p":false,"aff":""},{"n":"F. Biagioli","raw":"Biagioli, F.","p":false,"aff":""},{"n":"D. Chen","raw":"Chen, D.","p":false,"aff":""},{"n":"L. Dreier","raw":"Dreier, L.","p":false,"aff":""},{"n":"W. Steinkogler","raw":"Steinkogler, W.","p":false,"aff":""},{"n":"D. Magnan","raw":"Magnan, D.","p":false,"aff":""}],"ab":["Infrasound is nowadays routinely used for avalanche detection, but its potential to constrain avalanche dynamics and magnitude remains poorly quantified. We investigated this capability within the Avalanche Detection Network (ADN) at Rogers Pass, British Columbia, using two IDA systems with direct line of sight to avalanche paths. Dual-array backazimuth triangulation was used to track the dominant coherent infrasonic source during avalanche propagation. The localised source migrated from the release area toward the deposition zone, consistent with a runout of 1504 m and a mean source-centroid speed of 24.7 m/s. Independent Doppler radar (LARA) observations give a comparable runout of 1518 m and a mean speed of 20.5 m/s. The time-dependent 3-D source-to-array distance was then used to correct the recorded infrasonic amplitude for first-order geometrical spreading and to define the Infrasonic Avalanche Energy proxy (IAVE). IAVE is calculated as the time integral of the Hilbert envelope of the distance-corrected infrasonic pressure. Analysis of 27 avalanches shows that IAVE increases systematically across independently assigned Parks Size classes at both arrays. Empirical regressions of log10(IAVE) against the numerical Parks Size classes yield nearly identical slopes at the two IDA systems (0.934 and 0.939) and R2 values of 0.971 and 0.995, respectively. This near-unit scaling is noteworthy because successive whole classes of the Canadian avalanche Size scale themselves correspond approximately to order-of-magnitude increases in characteristic avalanche mass and destructive potential. Localisation-related uncertainty is small compared with the observed within-class variability, with median 95% relative uncertainties of 0.41% and 0.26%. These results indicate that multiarray infrasound can retrieve first-order avalanche dynamics and suggest that IAVE may provide an empirical proxy for avalanche magnitude. Further validation across the larger ADN catalogue is required to assess the influence of avalanche flow dynamics, source-generation mechanisms, terrain, and propagation conditions."],"kw":"Infrasonic Detection of Avalanches IDA , avalanche dynamics, infrasonic avalanche en- ergy proxy.","ty":"P","pp":350,"em":[],"r":null,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"G. Ulivieri"},"409":{"id":"409","t":"A GIS-Based Methodology for Real-Time Prioritization of Avalanche Control Operations in the Ordino ARCALÍS Ski Area, Andorra","au":[{"n":"Sergi Riba Porras","raw":"Porras, Sergi Riba","p":true,"aff":""},{"n":"Joan Viladomat","raw":"Viladomat, Joan","p":false,"aff":""},{"n":"Carles García-Sellés","raw":"García-Sellés, Carles","p":false,"aff":""}],"ab":["Prioritizing avalanche control operations in ski areas requires the integration of terrain susceptibility, snowpack evolution, operational exposure, and expert judgement within a decision framework that is fast enough for real-time use. This study presents a geographic information system (GIS)- based methodology to support prioritization of preventive avalanche-control shots in the Ordino Arcalís ski area, Andorra. The objective is to identify which potential release areas should be treated first according to their relative instability and their capacity to affect ski runs, lifts, buildings, access routes, or other spaces containing exposed people and infrastructure. The workflow integrates four components: avalanche-cadastre and historical information, geomorphological analysis, snow and weather monitoring, and numerical avalanche-dynamics modelling. The spatial database contains 57 potential release areas identified and refined from the avalanche cadastre, topography, photo interpretation, field surveys, and operational knowledge. Recent loading is monitored using automatic snow-weather stations and evaluated over 24, 48, and 72 h windows; this information is complemented by snow profiles, stability tests, and direct observations. An initial threshold of 40 cm of new snow is based on approximately three decades of operational experience by ski-patrol managers, avalanche blasters, and avalanche forecasters at Ordino Arcalís, and is treated as an empirical operational criterion requiring retrospective verification and future recalibration. Current conditions are linked to a library of precomputed RAMMS::AVA- LANCHE simulations using several release depths and two representative snow configurations to estimate runout and intersections with exposed elements. Final prioritization is based on three binary criteria — recent loading, evidence of instability, and potential consequence — and is always subject to expert validation. The method is intended to improve the efficiency, traceability, and safety of PIDA decisions without replacing the judgement of the avalanche-control manager."],"kw":"avalanche control; GIS; numerical modelling; snowpack stability; decision rules; Ordino Arcalís.","ty":"P","pp":351,"em":[],"r":3611,"day":"Tue","th":"Operations and Program Management","pr":"Sergi Riba Porras"},"410":{"id":"410","t":"Characterizing Consistency of Snowpack Stability Across Different Operational Model Chains","au":[{"n":"Martin Metzger","raw":"Metzger, Martin","p":true,"aff":""},{"n":"Michael Binder","raw":"Binder, Michael","p":false,"aff":""},{"n":"Martin Perfler","raw":"Perfler, Martin","p":false,"aff":""},{"n":"Christoph Mitterer","raw":"Mitterer, Christoph","p":false,"aff":""},{"n":"Fabiano Monti","raw":"Monti, Fabiano","p":false,"aff":""}],"ab":["Regional and site-specific avalanche forecasting increasingly relies on snowpack simulations to complement weather forecasts and sparse field observations. Their operational value, however, depends not only on the snow cover model but also on the meteorological forcing, the initialization strategy, and the postprocessing used to translate simulated stratigraphy into stability information. Retrospective evaluations quantify a model’s past agreement with regional forecasts and observations, yet forecasters need an indicator of reliability during the forecasting process itself. Consistency across independent model chains may serve as such an indicator, helping to identify when simulated stability information can provide robust decision support. To investigate this, we contrast three model chains for the Euregio warning region (Tyrol, South Tyrol, Trentino): simulations forced by (i) automatic weather station measurements, (ii) numerical weather prediction (NWP) data, and (iii) NWP data but initialized with observed snow profiles. For the 2025–2026 winter we assess how forcing and initialization affect simulated stability and quantify the consistency among the chains over time. Stability is derived through two conceptually different postprocessing approaches: the physics-based SK38_CCL index, linking skier-induced failure initiation and crack propagation, and the machine-learning Punstable index, which estimates the probability of instability with a random forest trained on observed profiles. Building on the assumption that higher consistency indicates greater reliability, we identify situations in which the simulated information appears robust and periods in which chains or indices diverge. The three chains agree well and robustly capture the exceptional avalanche period of 18–25 February 2026; the profile-initialized chain, however, is reliable mainly where it is regularly refreshed with recent profiles. Consistency is largely governed by the agreement of the accumulation forcing (reflected in snow depth) and by profile freshness, and it drops transiently during rapid-loading events. These findings provide practical guidance on when modeled snowpack stability can support operational avalanche forecasts and when it should be interpreted with caution."],"kw":"Avalanche forecasting, Snowpack stability, AWSOME, Consistency","ty":"P","pp":352,"em":[],"r":3613,"day":"Tue","th":"Avalanche Forecasting","pr":"Martin Metzger"},"411":{"id":"411","t":"Initial Explorations on How Skitourenguru Affects Users’ Trip Planning and Avalanche Safety Practices","au":[{"n":"Pascal Haegeli","raw":"Haegeli, Pascal","p":true,"aff":""},{"n":"Günter Schmudlach","raw":"Schmudlach, Günter","p":false,"aff":""}],"ab":["Skitourenguru (STG) supports backcountry skiers by automatically combining public avalanche forecast information with terrain characteristics to provide route-level risk ratings. While online tools like this can help users plan backcountry trips, their effects on users’ decision-making, confidence, and avalanche safety practices have not been examined in detail. Using responses to an online survey conducted during the 2025/26 winter season, this study explores how STG users incorporate the platform into their trip planning process, how strongly they rely on its risk assessments, what benefits they perceive, and how its use influences interest in further avalanche safety education. Responses from 851 survey participants indicate that STG is primarily used to obtain first impressions of route suitability and identify lower-risk trip options. Median reported reliance on STG risk assessments was 67 with distinct peaks and varying with route familiarity and avalanche danger level. Consulting STG increased median trip-planning confidence from 67 to 82, but we observe distinct subpopulations. Participants valued faster trip planning and improved understanding of how avalanche forecasts apply to terrain. STG did not reduce interest in further avalanche safety education. This study contributes to a growing body of research to better understand the effectiveness of avalanche risk communication tools and provide scientific evidence to guide future developments. Having a comprehensive perspective of the benefits and potential unintended negative impacts of a product is critical for understanding its overall effectiveness."],"kw":"Decision support tools, trip planning, automation.","ty":"P","pp":353,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"Pascal Haegeli"},"412":{"id":"412","t":"Multi-Season Comparison Between SMP, Snow Scope, and Ram Penetrometers","au":[{"n":"Coleman Kane","raw":"Kane, Coleman","p":true,"aff":""},{"n":"Dylan Elder","raw":"Elder, Dylan","p":false,"aff":""},{"n":"Kelly Elder","raw":"Elder, Kelly","p":false,"aff":""},{"n":"HP Marshall","raw":"Marshall, HP","p":false,"aff":""},{"n":"Katherine Gura","raw":"Gura, Katherine","p":false,"aff":""}],"ab":["Evaluating snow hardness is an important component of assessing avalanche hazard. Persistent slab problems can often be identified from hard-over-soft layering in manual snow profiles. The hand hardness scale is the most common method for measuring hardness, but it can be subjective and requires the time and labor-intensive process of digging snow pits. However, it is a key metric in the yellow flag indices, a parameter checklist used to identify potential persistent slab avalanche instability from manual snow profiles. Cone penetrometers provide a more objective alternative to the hand hardness scale, allowing practitioners to increase spatial and temporal sampling and minimize observer bias. The ram penetrometer has long been an industry standard, and measures penetration resistance with repeated blows from a hammer. The SnowMicroPen (SMP) is a high-resolution (4µm) digital cone penetrometer that measures resistance force at a much higher resolution (0.01 N) than the ram, as it is driven through the snow at a constant speed. The Snow Scope is a relatively newer instrument designed specifically for use in the backcountry. The instrument folds into the user’s backpack similar to an avalanche probe and displays profiles on a smartphone via Bluetooth connection. Using two seasons of coincident field measurements (174 ram profiles, 357 SMP profiles, 714 Snow Scope profiles), we evaluate and compare all three penetrometers’ ability to detect changes in hardness and accurately measure the hardness of soft layers. Additional consideration is given to evaluating the depth repeatability of the Snow Scope. We show the Scope performs similarly to the SMP in both depth estimation and measured force, and that that the ram is still a relevant instrument."],"kw":"Ram penetrometer, SnowMicroPen, Snow Scope, yellow flags, lemons, hardness, stratig- raphy","ty":"P","pp":354,"em":[],"r":null,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Coleman Kane"},"414":{"id":"414","t":"A Machine Learning Surrogate for Alpine3D SNOWPACK Simulation: Persistence-Based Evaluation and a Path Toward Snowdrift","au":[{"n":"Brandon Hurd","raw":"Hurd, Brandon","p":true,"aff":""},{"n":"Pierre Etienne Mache","raw":"Mache, Pierre Etienne","p":false,"aff":""}],"ab":["Distributed snow-cover models such as Alpine3D and SNOWPACK provide spatially detailed information on snowpack evolution, surface energy balance, and terrain-driven variability that is relevant to avalanche operations. The drawback is the computational cost of high-resolution, multiseason simulations, which limits repeated scenario testing, ensemble analysis, and rapid visualization. This paper presents a physics-supervised graph neural network surrogate for selected gridded Alpine3D/SNOWPACK outputs over a Kananaskis Country case-study domain in the Canadian Rockies. The foundation model was trained on multiple winter seasons and evaluated on a fully held-out season. The model represents the distributed domain as a graph and uses terrain, previous snow state, meteorological forcing, and time to predict selected snow-state and process variables. The first evaluation compared absolute snow height (HS) and snow water equivalent (SWE) predictions with a copy-previous-hour persistence baseline. Although the model achieved R² values of 0.99886 for HS and 0.99939 for SWE, persistence performed better, with R² values of 0.99992 and 0.99998. For this reason, hourly changes were reconstructed from predicted process variables. The reconstructed changes achieved positive skill against persistence of 0.373 for ΔHS and 0.795 for ΔSWE, with the strongest performance during melt and runoff. A separate frozen-checkpoint test on 290 corrected-2022 timesteps and approximately 312 million valid cell observations retained positive flux-reconstructed skill of 0.479 for ΔHS and 0.461 for ΔSWE. This provides evidence of robustness to the corrected forcing lineage within the same domain. End-to-end inference required 23.8 s per predicted hour on the 1.12-million-cell domain, compared with 432 s per simulated hour for the measured Alpine3D workflow. This represents an approximately 18× system-level wall-clock speedup across different GPU and CPU hardware. The foundation teacher uses simple radiation and does not include wind-driven snow transport. Higher-fidelity physics extensions are being evaluated, but they remain preliminary and are not reported as validated results. The objective is not to replace Alpine3D, SNOWPACK, or field observations. The objective is to determine which teacher-model processes can be reproduced by a graph surrogate, how that reproduction should be evaluated, and what validation is required before operational use."],"kw":"graph neural network, Alpine3D, SNOWPACK, snowpack modelling, avalanche forecasting, persistence baseline","ty":"P","pp":355,"em":[],"r":3544,"day":"Mon","th":"Artificial Intelligence","pr":"Brandon Hurd"},"418":{"id":"418","t":"How Do People Read the Forecast? Two Seasons of Section-Level Digital Analytics in Canada","au":[{"n":"Stan Nowak","raw":"Nowak, Stan","p":true,"aff":""},{"n":"Nick Rigby","raw":"Rigby, Nick","p":false,"aff":""},{"n":"Eeva Latosuo","raw":"Latosuo, Eeva","p":false,"aff":""},{"n":"Pascal Haegeli","raw":"Haegeli, Pascal","p":false,"aff":""}],"ab":["Understanding how recreationists use avalanche forecasts is critical to ensure their effectiveness. While previous research has largely relied on self-reported surveys, behavioral telemetry provides a unique, empirical window into how users actually consume these products in the real world. Using two full winter seasons of behavioural telemetry from Avalanche Canada’s website and mobile application, comprising millions of forecast views, sections reached, and dwelling durations, we examined how engagement varies across different avalanche conditions and whether actual use aligns with the intended communication goals and design of the forecast. We found that viewership progressively drops off with deeper sections of the forecast, with roughly a third of views reaching the end of the page. As danger rises, the share of views that reach deeper sections falls. Overall forecast dwell times suggest a mix of reading, scanning, and likely skipping sections entirely. Greater forecast use is associated with reaching deeper sections but shorter dwell times. While these patterns suggest efficient and committed information seeking, we caution that rapid scanning could leave users vulnerable to missing critical details in the forecast. To address this, we outline design interventions that balance efficient information retrieval with the need to intentionally prompt deliberate reflection, highlighting key avenues for future research."],"kw":"behavioural telemetry, information foraging, risk communication, public avalanche forecasts","ty":"O","pp":356,"em":[],"r":3451,"pr":"Stan Nowak"},"419":{"id":"419","t":"Towards an Operational Avalanche Forecasting Tool Using Ramms::extended","au":[{"n":"Cam Campbell","raw":"Campbell, Cam","p":true,"aff":""},{"n":"Eirik Sharp","raw":"Sharp, Eirik","p":false,"aff":""}],"ab":["Recent advances in remote sensing enable real-time estimation of snow depth in avalanche starting zones. An emerging opportunity for avalanche forecasting is the incorporation of these data with avalanche simulations to estimate the potential avalanche runout distance for a given release volume. This could help predict whether it is possible for avalanches to reach a specific element at risk with the current conditions. Recent studies have explored the potential for RAMMS::Extended simulations, initialized with measured or modelled snowpack and weather data, to forecast avalanche runout distances. While these approaches are promising, they require further research into the appropriate model parametrization to accurately simulate non-extreme events before they can be broadly implemented as a predictive tool. Avalanche Path 51 is located on Highway 99 (i.e., Duffey Lake Road), approximately 85 km northeast of Whistler, Canada, in the Coast Mountains of southwestern British Columbia. It is the most active avalanche path along this corridor with an average of three events per year reaching the road. It has a highly channelized 1100 m long track that results in unique avalanche dynamics, with relatively low release volumes of often less than 5000 m3 running the full length of the path. Combined with a 46-year record of approximately 1500 avalanche observations, these physical characteristics make Path 51 a strong candidate for exploring RAMMS::Extended parameterization for non-extreme event simulation. This paper provides some promising initial results from fitting RAMMS::Extended simulations to observed late-season low-volume avalanches in Path 51. The results are intended to support the development of a forecasting tool that estimates runout distances based on measurable parameters such as release volume, snow temperature, and air temperature."],"kw":"Release volume; runout distance; RAMMS::Extended; model parameters; avalanche forecasting","ty":"P","pp":357,"em":[],"r":null,"day":"Thu","th":"Modelling and Quantitative Forecasting","pr":"Cam Campbell"},"420":{"id":"420","t":"From Scottish Snow Patches to Global Snow Cover: A Deep Learning Approach to Snow Cover Fraction Retrieval","au":[{"n":"Leam Howe","raw":"Howe, Leam","p":true,"aff":""},{"n":"Richard Essery","raw":"Essery, Richard","p":false,"aff":""},{"n":"Elliot J. Crowley","raw":"Crowley, Elliot J.","p":false,"aff":""}],"ab":["Optical snow mapping products are often developed and validated on regions with deep, clean, continuous snowpacks under clear skies. Maritime mountain ranges with marginal snowpacks suffer from particularly harsh conditions for optical snow observations: fragmented cover, spectrally degraded snow, and near-permanent heavy cloud influence. In the case of cloud, quality is usually assured with a conservative cloud mask, but this discards useful observations. We quantify the cost of that trade-off and offer an alternative. Using 25 cm aerial surveys of the Scottish Highlands, we built an open snow cover fraction (SCF) reference dataset for Sentinel-2 comprising 2455 labelled 1 km chips from 37 scenes, deliberately retaining imagery through cloud gaps and heavy atmospheric interference rather than masking it away. On this dataset we trained SPUN, a U-Net with a ResNet50 encoder and a regression head that predicts continuous SCF per 10 m pixel. Evaluated on a spatially independent test set at the 20 m operational grid, SPUN and the operational Let-It-Snow (LIS) product are separated modestly under clear-sky conditions (snow-only MAE 19.10 % versus 23.26 %; F1 0.606 versus 0.493). Under all-sky conditions the gap becomes distinct: SPUN improves slightly (MAE 18.81 %, F1 0.747), while LIS recall falls to 0.013 and it recovers 1.6 % of the reference snow-covered area. Aggregated to the 1 km chip scale, SPUN tracks snow-covered area with R2 = 0.934 against -0.238 for LIS. SPUN is trained only on late-season Scottish snow patches but, nonetheless, transferred to an independent 40-scene global dataset, reaching a macro-averaged F1 of 0.931 and a snow-only F1 of 0.892. We present this as a proof-of-concept rather than a finished operational tool, and argue that the limiting factor in optical snow retrieval is training data rather than model architecture."],"kw":"snow cover mapping; fractional snow cover; remote sensing; Sentinel-2; deep learning; maritime snowpack; Scotland","ty":"P","pp":358,"em":[],"r":3545,"day":"Mon","th":"Artificial Intelligence","pr":"Leam Howe"},"421":{"id":"421","t":"Tower-Based Snow Remote Sensing for Improved Understanding of Retrieval Algorithms","au":[{"n":"Hans-Peter Marshall","raw":"Marshall, Hans-Peter","p":true,"aff":""},{"n":"Eli Deeb","raw":"Deeb, Eli","p":false,"aff":""},{"n":"Rashmi Shaw","raw":"Shaw, Rashmi","p":false,"aff":""},{"n":"Hans Lievens","raw":"Lievens, Hans","p":false,"aff":""},{"n":"Manuela Girotto","raw":"Girotto, Manuela","p":false,"aff":""},{"n":"Coleman Kane","raw":"Kane, Coleman","p":false,"aff":""},{"n":"Jaron Vandenbrouke","raw":"Vandenbrouke, Jaron","p":false,"aff":""},{"n":"Jarne Van Mulders","raw":"Van Mulders, Jarne","p":false,"aff":""},{"n":"Thomas Van Der Weide","raw":"Van Der Weide, Thomas","p":false,"aff":""}],"ab":["Microwave snow remote sensing has been challenged by a lack of the ideal frequencies, polarizations, spatial resolution, and temporal resolution, in order to test retrieval algorithms over a wide range of well-characterized snow conditions. Large efforts using combined airborne and field campaigns, such as CLPX, CoreH2O, and SnowEx, have resulted in snapshots of snow conditions with both low and high frequency radar. However aligning independent observations for calibration and validation, and addressing scale mismatches, can be difficult. While time-series campaigns have been the most valuable, they are costly. We present a time series of observations from tower platforms, combining scanning lidar, P-band signals of opportunity, radar, and standard meteorological and snowpack measurements. These tower-based remote sensing experiments provide an opportunity to observe a large dynamic range in well-characterized conditions."],"kw":"snow remote sensing, radar, lidar, SWE, tower-based observations, retrieval algorithms Figure 1: BSU Snow Study Plot at Brundage Ski Area.","ty":"P","pp":359,"em":[],"r":null,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Hans-Peter Marshall"},"422":{"id":"422","t":"The International Commission for Alpine Rescue: AVA Com Recommendations and Opportunities for ISSW Collaboration","au":[{"n":"Stephanie Thomas","raw":"Thomas, Stephanie","p":true,"aff":""},{"n":"Mike Koppang","raw":"Koppang, Mike","p":false,"aff":""},{"n":"Claudio Artoni","raw":"Artoni, Claudio","p":false,"aff":""}],"ab":["The International Snow Science Workshop (ISSW) and the International Commission for Alpine Rescue (ICAR) serve many of the same communities from different but complementary perspectives. ICAR is a worldwide association of mountain rescue organizations, founded in 1948 and headquartered in Kloten, Switzerland, with more than 100 member organizations from over 30 countries; its 2025 Congress in Jackson Hole, Wyoming drew approximately 600 rescuers from 25 countries, the largest turnout in the Commission’s 77-year history. This poster, offered by ICAR’s Avalanche Rescue Commission (AVA COM), explores how avalanche rescue research has repeatedly been translated into practical best practices, training methods, and operational guidelines for rescue teams around the world through ICAR’s international network. AVA COM’s members are practitioners, not researchers by training, and its recommendations draw on multiple sources of evidence: ISSW proceedings, peer-reviewed journals, and work from partner organizations outside ICAR. AVA COM’s Organized Avalanche Rescue Probing Strategies recommendation traces its coarse-probing method directly to a paper presented at ISSW 2014; its Phases in an Avalanche Search recommendation has been in continuous use and revision since 2008; and related Alpine Emergency Medicine Commission guidance on avalanche victim resuscitation was updated in 2023 following peer-reviewed publication, with all examples most recently revisited in 2023–2025. It also examines how field-based rescuers and practitioners can help shape future research priorities by sharing real-world challenges, operational lessons, and emerging rescue needs. The poster aims to encourage stronger collaboration between researchers, educators, and rescue professionals through shared presentations, practical applications, and ongoing dialogue that brings research knowledge into real-world rescue environments."],"kw":"ICAR, AVA COM, avalanche rescue, ISSW collaboration, search and rescue, probing strategy","ty":"P","pp":360,"em":[],"r":3547,"day":"Mon","th":"Avalanche Rescue","pr":"Stephanie Thomas"},"423":{"id":"423","t":"Drone lidar Characterization of Avalanches Triggered by a Midwinter Rain Event on Northern Vancouver Island","au":[{"n":"Anthony D. Maue","raw":"Maue, Anthony D.","p":true,"aff":""},{"n":"Devin Cvitanovich","raw":"Cvitanovich, Devin","p":false,"aff":""},{"n":"William C. Floyd","raw":"Floyd, William C.","p":false,"aff":""},{"n":"Benjamin O’Connor","raw":"O’Connor, Benjamin","p":false,"aff":""},{"n":"Sergey Marchenko","raw":"Marchenko, Sergey","p":false,"aff":""},{"n":"Maartje Korver","raw":"Korver, Maartje","p":false,"aff":""},{"n":"Eva Griffiths","raw":"Griffiths, Eva","p":false,"aff":""}],"ab":["As part of ongoing snow hydrology research, regular drone- and plane-based lidar surveys are conducted each winter and spring in the Russell Creek Experimental Watershed (50.325°N, 126.360°W; MAP 2300 mm), a tributary of the Tsitika River on northern Vancouver Island, BC. Ten weather stations at Russell Creek cover a range of elevations from 280 to 1516 m ASL. In 2025, six drone lidar surveys covering an 8.5 km² subbasin of Russell Creek were conducted monthly from January to June. Between the February and March surveys, a region-wide avalanche cycle occurred on February 22, 2025. In the weeks leading up to the event, skies were relatively clear from January 15 through 29, with generally freezing temperatures January 16 to 25 before warming January 26 to 29, when temperatures inverted. After forming a crust, approximately 50 cm of snow fell, followed by a rare occurrence of 10 days with clear skies and freezing temperatures. Temperatures gradually increased to between -2 and +2 °C in the two weeks leading to February 22, when 30 to 40 mm of rain fell in a 4- hour period, likely triggering the avalanches in this study. At the highest weather station (1516 m), this precipitation fell as ~10 cm of snow, which may have turned to rain as air temperature there increased above freezing later in the day. The overall minimal snowfall and cool temperatures between the two relevant lidar surveys provide an excellent opportunity for quantifying avalanche properties. Lidar coverage of the watershed at ~400 pts/m² has enabled topographic analyses of the alpine before and after the avalanche event using high-resolution snow surface DEMs (as fine as 25 cm) with vertical RMSE of ~10 cm. Estimates of the largest avalanches indicate snow volumes up to several thousand cubic meters, fitting within size 1 and 2 avalanches. Snow moved during this event represents 1% of the total snow volume in the studied subbasin. High-resolution lidar acquisitions and the wealth of weather station data at Russell Creek support a detailed case study of these avalanches and the related mid-winter rain event—an occurrence that will become more frequent with a warming climate."],"kw":"lidar; drone; snow depth; rain; weather station","ty":"P","pp":361,"em":[],"r":null,"day":"Thu","th":"Incidents and Case Studies","pr":"Anthony D. Maue"},"424":{"id":"424","t":"Managing the Complexity of Weather Station Networks: Lessons from Avalanche Canada’s Operational Data Pipeline","au":[{"n":"Cameron Dunning","raw":"Dunning, Cameron","p":true,"aff":""},{"n":"Russell McWhae","raw":"McWhae, Russell","p":false,"aff":""}],"ab":["Weather data from automated weather stations (AWS) is important for avalanche forecasting and public recreational users alike. At Avalanche Canada, we aggregate AWS data from a diverse network of over 600 weather stations that we and partner organizations operate. While individual weather stations automatically report their measurements, aggregating and standardizing data across all stations is a more complicated process. Given the dynamic, nonstandardized, evolving nature of AWS data, a fully automated aggregation process is unfeasible. As such, we have developed a semiautomated data integration framework to ingest and standardize AWS data, with manual controls for adding and updating stations and their meta-data, and display in a bespoke visualization dashboard used by forecasters. This paper discusses the challenges of maintaining a dynamic weather data pipeline. Weather stations are often in a state of flux, both at the individual station level, as well as across larger station networks. Data from individual stations are often delayed or contain erroneous measurements. Across larger station networks, new weather stations are added on an ongoing basis. Some of these challenges can be handled via software automation, while others necessarily require human oversight. Manual intervention is required when automated methods cannot adequately address issues with the data. Within our integration framework, we have automated AWS data aggregation where possible. Processes like data ingestion, measurement standardization, and temporal alignment run automatically. Manual intervention is still required for the addition of new, non-standardized weather stations, or reconfiguring sensors. There is now less friction for individual station updates as forecasters can directly update certain metadata fields within the dashboard. As the challenges of managing AWS data pipelines are not unique to Avalanche Canada, we offer lessons learned and suggest future directions for the benefit of other organizations aggregating AWS data into a unified pipeline."],"kw":"","ty":"P","pp":362,"em":[],"r":null,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Cameron Dunning"},"425":{"id":"425","t":"Forecasting Challenges During a Season with Unprecedented Avalanche Activity: The 2023-2024 Winter in Southwest Montana","au":[{"n":"Alex Marienthal","raw":"Marienthal, Alex","p":true,"aff":""},{"n":"Doug Chabot","raw":"Chabot, Doug","p":false,"aff":""},{"n":"Ian Hoyer","raw":"Hoyer, Ian","p":false,"aff":""},{"n":"Dave Zinn","raw":"Zinn, Dave","p":false,"aff":""}],"ab":["During the 2023-24 winter in southwest Montana, persistent weak layers formed in December and early January which caused widespread avalanche activity that lasted through spring. This activity reached levels of distribution and frequency never seen since the inception of the Gallatin National Forest Avalanche Center in 1990. We recorded 77 remote-triggered avalanches, some long after a storm, compared to an average of 13 over the previous five seasons. Our traditional applications of the avalanche danger scale were challenged, and we had to adjust our forecasting methods to best match our travel advice with the avalanche danger. In this paper, we summarize the weather associated with the formation of the season’s surface hoar and facet layers, as well as the conditions that led to avalanche activity across all eight of our forecast regions for many months after those layers were buried. While many winters have had weak layers form during similar weather, the 2023-24 season differed from years that had less widespread avalanche activity of this type. In addition, we highlight the challenges of communicating this avalanche problem in public forecasts, and the approach we took to assign danger ratings when likelihood and descriptors of avalanche danger as stated in the North American Public Avalanche Danger Scale didn’t give a clear answer. Assigning danger ratings was challenging. On many days a human-triggered avalanche seemed “likely” or “very likely”, which warranted a Considerable or High rating. However, the definitions of those ratings also indicate the potential for natural avalanches (e.g., triggered by new snow or wind-loading), which was remarkably absent. After much internal discussion and debate, all four avalanche forecasters chose to focus on basing danger ratings mainly on travel advice, or best fit for likelihood of human-triggered avalanches, which aligned with more conservative and appropriate danger ratings. As a result, we often issued higher danger ratings on days when the perceived overall likelihood for avalanches, and associated danger rating, historically might have been lower. To provide accurate and relevant advice to backcountry users, we adjusted our ways of applying danger ratings. A danger rating is too simple of a tool to describe avalanche conditions in a winter that was anything but simple."],"kw":"Avalanche Forecasting; Danger Rating; NAPADS; Persistent Weak Layer; Surface Hoar.","ty":"O","pp":363,"em":[],"r":3492,"pr":"Alex Marienthal"},"427":{"id":"427","t":"Assessing the Applicability of Snowpack in an Arctic Environment: A Case Study in Nunavik, Qc","au":[{"n":"Violaine Paquette","raw":"Paquette, Violaine","p":false,"aff":""}],"ab":["Avalanche hazard in Arctic regions remains poorly documented, partly because continuous meteorological and snowpack observations are spatially limited and forecasting approaches developed for alpine environments have rarely been evaluated under Arctic conditions. In Nunavik (northern Quebec, Canada), this represents an important challenge for communities where existing and future development may overlap with avalanche-prone terrain. This study assesses the applicability of the physically based SNOWPACK model for representing Arctic snowpack conditions and explores its potential contribution to avalanche-hazard assessment in northern communities. The modelling framework combines hourly meteorological forcing from Environment and Climate Change Canada’s High Resolution Deterministic Prediction System (HRDPS), topographic downscaling, MeteoIO, SNOWPACK, and Alpine3D. The workflow is first evaluated at Mount Fidelity, Rogers Pass (British Columbia), a well-instrumented alpine reference site, before being transferred to Nunavik. Field observations collected at Mount Fidelity in March 2025 and 2026 include detailed snow profiles, SnowScope measurements, and K-band radar observations. In Nunavik, the study focuses on Kangiqsualujjuaq, Kangirsujuaq, Salluit, and Umiujaq. Field observations were collected in Kangiqsualujjuaq and Kangirsujuaq in April 2026 and include detailed snow profiles and spatial measurements across contrasting terrain and wind-exposure conditions. Additional field data collection in Salluit and Umiujaq is planned for spring 2027. Preliminary field observations suggest substantial local variability in snow accumulation and snowpack structure, emphasizing the importance of wind redistribution and local topography in Arctic snow environments. The next stage of the study will quantitatively evaluate the modelling framework by comparing simulated and observed snowpack characteristics, including snow depth, density, temperature, and stratigraphy. Conducted in collaboration with the Kativik Regional Government (KRG), the broader research aims to assess the extent to which snowpack modelling approaches developed for alpine environments can be transferred to Arctic conditions and to identify their main limitations and adaptation requirements. Ultimately, spatialized snowpack information could complement existing terrain-based avalanche-hazard assessments and support the development of decision-support tools for northern communities."],"kw":"SNOWPACK modelling; Arctic snowpack; Nunavik; Avalanche hazard; model evalua- tion; Alpine 3D","ty":"P","pp":364,"em":[],"r":null,"day":"Thu","th":"Modelling and Quantitative Forecasting","pr":"Violaine Paquette"},"428":{"id":"428","t":"20 Years of Videos from the Field: Using the Power of Video to Support Public Avalanche Forecasts","au":[{"n":"Ian Hoyer","raw":"Hoyer, Ian","p":true,"aff":""},{"n":"Alex Marienthal","raw":"Marienthal, Alex","p":false,"aff":""},{"n":"David Zinn","raw":"Zinn, David","p":false,"aff":""},{"n":"Mark Staples","raw":"Staples, Mark","p":false,"aff":""},{"n":"Doug Chabot","raw":"Chabot, Doug","p":false,"aff":""}],"ab":["In the winter of 2006–2007, riding the earliest wave of YouTube and armed with gear that would embarrass us now, forecasters at the Gallatin National Forest Avalanche Center (GNFAC) posted 16 short videos about snowpack conditions. Those videos drew 26,419 views. Last season, 134 videos drew 6.1 million views across three platforms, in a state of one million people. This large increase in viewership reflects the success of our combination of message, format, and platform in connecting us to a broad audience. Public avalanche forecasters face a hard problem: translate complex, consequential snowpack information into decisions that keep people alive. Written forecasts reach the converted, users who already know about our products. Video reaches everyone else. Last season, our videos were watched five times more than our written forecasts were read. It is not uncommon to meet backcountry users who have digested our video content and carry a working sense of current conditions but have never read an avalanche forecast, and in some cases don’t know one exists. Social media algorithms do what optin forecast distribution cannot: they find the audience before the audience finds us. That expanded reach multiplies across everything we post. When we issue an Avalanche Warning, a larger following means the message travels farther and faster. The educational value also extends well beyond our forecast area and traditional readership. We’ve seen especially strong engagement among snowmobilers, a group the avalanche industry has historically struggled to connect with. Over the past 20 years, we’ve continuously adapted our approach as technology evolved and viewer habits shifted. The goal, efficiently creating engaging videos that warn, inform, and entertain, has never changed. The methods change constantly (e.g., shifting from horizontal to vertical video, increasing the use of “b-roll”, or shifting our messaging to focus on advice for the coming days rather than simply reciting current conditions). This paper traces that evolution at GNFAC and draws lessons for forecasters and educators ready to use video as a core communication tool. We’ll share what we got wrong, what we got right, and how integrating short-form video can expand your reach and turn a forecast into something people actually remember."],"kw":"Avalanche Communication, Social Media, Video Production, Public Outreach.","ty":"O","pp":365,"em":[],"r":3452,"pr":"Ian Hoyer"},"429":{"id":"429","t":"Pinpointing the Timing of Weak Layer Failure: A Case Study of a Large, Widespread Natural Avalanche Cycle in the Bitterroot Mountains","au":[{"n":"Allison Kaufman","raw":"Kaufman, Allison","p":true,"aff":""},{"n":"James Peabody","raw":"Peabody, James","p":false,"aff":""},{"n":"Nathalie de Leeuw","raw":"de Leeuw, Nathalie","p":false,"aff":""},{"n":"Ben VandenBos","raw":"VandenBos, Ben","p":false,"aff":""}],"ab":["In March 2026, a multi-day storm deposited over 180 mm of snow water equivalent (SWE) across the Bitterroot Mountains of Montana and Idaho. Prior to the storm, the snowpack contained multiple buried persistent weak layers, including a crust/facet layer, referred to as the January Drought Layer (JDL). In the days and weeks before the storm, cornice fall triggered large avalanches on the JDL, and forecasters anticipated a widespread natural cycle during the storm. A key forecasting challenge with persistent slab problems is predicting at what point during a storm cycle natural avalanches are most likely to occur. Previous studies have linked weather station data to persistent slab avalanche occurrence, however without knowledge of exactly when during the storm the avalanche released, it is difficult to determine exactly how much new load it took for avalanches to occur. The Bitterroot forecast zone receives few user observations, and it is unlikely observers would have been reporting the timing of avalanche occurrence during the storm. To estimate the timing of release within the storm, we measured SWE above the JDL at both the crown face and on the bed surface of a persistent slab avalanche that released during the storm. By correlating these measurements to continuous SWE data from a SNOTEL station approximately 6.5 km away, we are able to determine approximately when, and after how much load the avalanche occurred. We also used photos and mapping software to collect slope angle and aspect data from 23 additional avalanches within a 13 km radius that occurred during the same cycle. We can use this geospatial data to determine if these avalanches were similar in aspect and elevation to the avalanche where we collected the measurements. This data will allow us to look for patterns in avalanche release from this storm and determine if loading amounts before triggering may have been similar. This method has potential to improve forecasting of persistent slab cycles in intermountain snowpacks."],"kw":"Timing of weak layer failure; avalanche forecasting; geospatial analysis; deep slab instability; case study","ty":"P","pp":366,"em":[],"r":3614,"day":"Tue","th":"Avalanche Forecasting","pr":"Allison Kaufman"},"430":{"id":"430","t":"Fifty Years of BC Ministry of Transportation and Transit Avalanche and Weather Programs: From Then to Now","au":[{"n":"Wren McElroy","raw":"McElroy, Wren","p":false,"aff":""},{"n":"Matt MacDonald","raw":"MacDonald, Matt","p":false,"aff":""},{"n":"Robb Andersen","raw":"Andersen, Robb","p":false,"aff":""},{"n":"Paul Harwood","raw":"Harwood, Paul","p":false,"aff":""}],"ab":["British Columbia's provincial highways traverse steep mountainous terrain and are exposed to snow avalanche hazards at numerous locations, creating an ongoing challenge to maintain safe and reliable winter transportation. Established following the 1974 North Route Café avalanche near Terrace, the British Columbia Ministry of Transportation and Transit (MOTT) Avalanche and Weather Program has evolved from localized operations based on manual observations and helicopter-based explosive control into an integrated, risk-based management system. Today, the program manages avalanche risk across 63 avalanche areas encompassing approximately 1,400 active avalanche paths. Major developments include the expansion of automated weather and avalanche monitoring networks, adoption of Remote Avalanche Control Systems (RACS), development of the Snow Avalanche and Weather System (SAWS) and SAWSx, and deployment of automated avalanche detection technologies. These advances have improved worker safety, reduced highway closures, and strengthened operational decision making, demonstrating the value of sustained investment in people, infrastructure, and technology."],"kw":"Operations and Program Management.","ty":"P","pp":367,"em":[],"r":3615,"day":"Tue","th":"Operations and Program Management","pr":"Wren McElroy"},"431":{"id":"431","t":"Is Your Guide Certified? The Development of a Training and Certification Process for the Canadian Motorized Backcountry Guides Association","au":[{"n":"Curtis Pawliuk","raw":"Pawliuk, Curtis","p":false,"aff":""},{"n":"Steve Scott","raw":"Scott, Steve","p":false,"aff":""},{"n":"Iain Stewart-Patterson","raw":"Stewart-Patterson, Iain","p":true,"aff":""}],"ab":["Formally trained, coached, and assessed competencies are defining characteristics of professional guiding practice. The primary responsibility of a guide is the management of client safety and experience within a hazardous environment. This requires balancing two operational objectives that may at times be in tension: (1) service delivery ensuring clients receive the experience they have purchased—and (2) risk management—ensuring all participants return safely. Canada does not require certification for motorized guides. As a result, individuals can operate without standardized training, assessment, or accreditation. While many motorized operators hold land-use tenures issued by the British Columbia Ministry of Water, Lands and Resource Stewardship, a significant number of providers such as small-scale B&B operators, informal “parking lot” guides, and photographers offer guiding services without formal land access or regulatory oversight. In 2021, a cohort of eight experienced practitioners initiated the development of a formal training and certification framework specific to
