casters consider the avalanche problem type, distribution, sensitivity, size, and likelihood to assign an appropriate danger rating for a given forecast period. While there is ongoing progress in standardizing this decision-making process, there remains a large degree of subjective judgment based on professional experience. This project develops two novel decision support tools for assigning daily danger ratings. The first incorporates weather station data, previous avalanche forecasts, and reassessed avalanche forecast data to identify established patterns in public avalanche forecasts and predict daily danger ratings. We assess the performance of Extreme Gradient Boosting (XGB) and Super-Organizing Maps (SOM) and compare the predicted danger ratings using the machine learning models to those issued by human forecasters. We find 73-79% agreement between the models and professional forecasters, with the XGB model outperforming the SOM. The second tool uses a national record of avalanche forecasts to identify relationships between avalanche size, likelihood, and assigned danger rating, fully implementing the workflow described in the Conceptual Model of Avalanche Hazard (CMAH), and clearly defining the relationship between avalanche size/distribution/sensitivity and predicted danger rating. The final products of this research are (1) a machine learning tool that uses weather and avalanche variables to predict the avalanche danger rating for an avalanche center in Southcentral Alaska, and (2) an online interactive tool to visually guide the user through the CMAH workflow, linking avalanche size and likelihood to the predicted danger rating using data from 24 avalanche centers across the U.S. Both of these forecasting tools incorporate visual representations of uncertainty in the predicted danger rating based on historical records. These tools aim to assist backcountry avalanche forecasters in predicting avalanche danger ratings and quantifying uncertainty in the assigned rating. We believe this work will leverage modern machine learning methods and archived forecast data to capture the institutional knowledge of avalanche centers, which can support the decisions of newer forecasters and help seasoned practitioners identify personal biases in their forecasts."],"kw":"Machine Learning, Decision Support, CMAH, NAPADS","ty":"P","pp":234,"em":[],"r":3589,"day":"Tue","th":"Avalanche Forecasting","pr":"Andrew Schauer"},"262":{"id":"262","t":"A Post-Mitigation Deep Slab in the Hourglass Couloir","au":[{"n":"Robert Griffith","raw":"Griffith, Robert","p":true,"aff":""},{"n":"Mike Rheam","raw":"Rheam, Mike","p":false,"aff":""}],"ab":["On the morning of January 1, 2026, Jackson Hole Mountain Resort saw its largest inbounds avalanche of the season in an area called the Hourglass Couloir. This D3.5 deep persistent slab with maximum depth around 10 feet was especially significant as it was remotely triggered by a snowcat pushing snow off the summit of Rendezvous Mountain 24 hours after explosive mitigation work was performed in the area. This paper introduces this high-elevation northeast facing terrain that is permanently closed to skiers, the distinct avalanche hazard mitigation techniques utilized for this unique zone, and the mission the day before which attempted unsuccessfully to trigger this slab. Earlyseason snow and avalanche activity leading up to the event will be considered and studied; and finally, past research into post-mitigation release will be examined and how it may help to understand this avalanche. This paper does not attempt to answer the mysterious question of why this avalanche occurred, but rather examine possible contributing factors while looking back and learning from the event."],"kw":"incidents and case studies, post mitigation release, deep slab instability, ski area, explosives","ty":"P","pp":235,"em":[],"r":null,"day":"Fri","th":"Incidents and Case Studies","pr":"Robert Griffith"},"263":{"id":"263","t":"Avalanche Risk in Backcountry Touring: Less—and More—Than We Think","au":[{"n":"David Fiore","raw":"Fiore, David","p":true,"aff":""},{"n":"Wendy Antibus","raw":"Antibus, Wendy","p":false,"aff":""},{"n":"John Koopman","raw":"Koopman, John","p":false,"aff":""},{"n":"Fay Roepcke","raw":"Roepcke, Fay","p":false,"aff":""}],"ab":["The Perry Peak accident on February 17, 2026, brought widespread attention to the risks inherent in backcountry ski touring. Perceptions of these risks vary considerably within both the ski community and the broader public. We compared the statistical risk of fatal avalanche accidents among backcountry tourers with risks associated with other popular outdoor recreational activities and examined the apparent discrepancy between the low risk of fatality on any single tour and the substantial burden of avalanche fatalities within the backcountry community. We conducted a review of published research on recreational accident statistics, backcountry decisionmaking, and risk perception. Using participation data from the Snowsports Industries America (SIA) and avalanche fatality data from the Colorado Avalanche Information Center (CAIC), we estimated the statistical risk of dying in an avalanche on a single day of backcountry ski touring in the United States. The estimated risk of avalanche death in the United States was less than one per million touring days, substantially lower than estimates previously reported in Europe. This low per-tour risk contrasts with the experience of frequent backcountry skiers and avalanche professionals, many of whom have lost friends or colleagues to avalanches. This apparent discrepancy may be partly explained by social network selection effects: highly active backcountry skiers and avalanche professionals associate with others who tour frequently and therefore accumulate greater avalanche exposure. More importantly, focusing on risk per tour obscures cumulative exposure. Even a very small risk on any individual touring day can become consequential when repeated over decades and across a community of similarly exposed individuals. An informal survey of avalanche professionals further suggested that some participants were willing to accept daily risks that, when accumulated over a career, would result in substantially greater risk than they recognized or intended to accept. Thus, two observations that initially appear contradictory can coexist: (1) the statistical risk of avalanche death on any single backcountry ski tour is very low, yet (2) many highly active backcountry skiers will be affected by an avalanche death within their community. Finally, assessment of the absolute risks of backcountry skiing should be considered alongside the physical, psychological, and social benefits associated with participation in this health-promoting activity."],"kw":"","ty":"O","pp":236,"em":[],"r":3435,"pr":"David Fiore"},"264":{"id":"264","t":"Human Factor Solutions for Recreation in Avalanche Terrain: Design Inputs for Skiers and Snowboarders","au":[{"n":"Ian McCammon","raw":"McCammon, Ian","p":true,"aff":""},{"n":"Sara Boilen","raw":"Boilen, Sara","p":false,"aff":""}],"ab":["When avalanche accidents happen to parties under conditions they were trained to avoid, suspected causes are frequently gathered under the term human factors. But despite decades of emphasis in avalanche courses, so-called human factors remain a problematic topic to understand, teach and avoid. A companion paper argues that many human factors may be emergent phenomena where dynamic interactions among social, cognitive, and environmental factors combine to create critical risks that cannot be reliably anticipated from initial conditions. This paper reports on an exploratory mixed-methods product development study aimed at identifying key design inputs for a future field tool that helps backcountry skiers and snowboarders recognize and mitigate emergent risks in avalanche terrain. Interviews (n = 18) identified 268 unique pain points and struggles experienced around tours in the backcountry. These results were filtered for emergent factors and mapped to 12 capabilities reported in the empirical literature for high-risk, high-performance settings. A survey of backcountry skiers and snowboarders in the U.S. (n = 918) prioritized importance and satisfaction of desired outcomes and a latent class analysis identified four provisional response profiles and associated product delivery preferences. Design inputs include prioritized user-reported needs, candidate emergent risk management capabilities, provisional response profiles, and stated learning and field-tool preferences. Future work in this project will include prototype development, behavioral evaluation and effectiveness testing."],"kw":"Human factors, Safety-II, mixed-methods, emergent risk, intervention design","ty":"O","pp":237,"em":[],"r":3482,"pr":"Ian McCammon"},"265":{"id":"265","t":"Beyond Better Decisions: Accident Reduction in Avalanche Terrain","au":[{"n":"Ian McCammon","raw":"McCammon, Ian","p":false,"aff":""}],"ab":["A paradox lies at the heart of many recreational avalanche accidents. Avalanche education is intended to help recreationists recognize dangerous conditions, yet trained people still die on the very slopes they were taught to avoid. Because a rational person would not make a decision likely to result in injury or death, these accidents are often explained as failures of decision making. When decision making is defined as the central problem, two solutions tend to dominate: bias awareness and decision aids. In this paper I review evidence showing the limits of bias awareness as a way to improve decision making and examine over a century of avalanche decision aids that, despite their value, have not definitively solved the problem. I then consider a broader perspective drawn from modern safety research that may offer additional opportunities for accident reduction. Building on concepts from Safety-II and related research, I develop a model showing how backcountry recreationists in avalanche terrain can drift toward three types of threats: structural, cognitive and emergent. I describe the mechanisms and tools associated with each, then introduce an adaptive awareness process derived from military operations and experiential learning that can address all three threat types. A companion paper describes how this framework is being applied to develop a skills ladder intended to help recreationists recognize, interrupt, and manage the conditions that precede decision failures before they culminate in an avalanche accident."],"kw":"Decision making, human factors, Safety-II, adaptive awareness","ty":"P","pp":238,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"Ian McCammon"},"267":{"id":"267","t":"Small-Avalanche Experiments in Niseko, Japan: Trials and Results 2016−2025","au":[{"n":"Yoichi Ito","raw":"Ito, Yoichi","p":true,"aff":""},{"n":"Kouichi Nishimura","raw":"Nishimura, Kouichi","p":false,"aff":""},{"n":"Satoru Yamaguchi","raw":"Yamaguchi, Satoru","p":false,"aff":""},{"n":"Yoshihiko Saito","raw":"Saito, Yoshihiko","p":false,"aff":""},{"n":"Hirofumi Niiya","raw":"Niiya, Hirofumi","p":false,"aff":""},{"n":"Sojiro Sunako","raw":"Sunako, Sojiro","p":false,"aff":""},{"n":"Kae Tsunematsu","raw":"Tsunematsu, Kae","p":false,"aff":""},{"n":"Ryo Honda","raw":"Honda, Ryo","p":false,"aff":""},{"n":"Shinichiro Horikawa","raw":"Horikawa, Shinichiro","p":false,"aff":""},{"n":"Kazuyuki Fujita","raw":"Fujita, Kazuyuki","p":false,"aff":""},{"n":"Koji Fujita","raw":"Fujita, Koji","p":false,"aff":""},{"n":"Tsubasa Okaze","raw":"Okaze, Tsubasa","p":false,"aff":""},{"n":"Cristina Pérez-Guillén","raw":"Pérez-Guillén, Cristina","p":false,"aff":""},{"n":"Dieter Issler","raw":"Issler, Dieter","p":false,"aff":""},{"n":"Piotr Kupiszewski","raw":"Kupiszewski, Piotr","p":false,"aff":""},{"n":"Jan-Thomas Fischer","raw":"Fischer, Jan-Thomas","p":false,"aff":""},{"n":"Marc Adams","raw":"Adams, Marc","p":false,"aff":""},{"n":"Anselm Köhler","raw":"Köhler, Anselm","p":false,"aff":""},{"n":"Shoichi Mori","raw":"Mori, Shoichi","p":false,"aff":""},{"n":"Akio Shinya","raw":"Shinya, Akio","p":false,"aff":""}],"ab":["Small-avalanche experiments were conducted in the Niseko-Annupuri mountain range in Japan from 2016 to 2019 and in 2025 to obtain small avalanche dynamics data. In the experiments small avalanches were triggered using blasting or a snow groomer by pushing and collapsing piled-up snow. The avalanches ranged in runout distance approximately from 30 to 200 meters. Avalanche velocity was estimated from aerial drone footage; additionally, Doppler radar provided reliable data even for the small-scale event. Internal velocity was also obtained by releasing sensors containing IMU and GNSS units within the avalanche flow. The flow behavior of the avalanches was observed using the infrared camera and by surveying debris; however, no significant variations were observed due to the short runout distance. We also carried out seismic and infrasound monitoring, however, no significant variations in the infrasound waveforms were detected."],"kw":"small avalanche, avalanche experiment, sensor","ty":"P","pp":239,"em":[],"r":3525,"day":"Mon","th":"Avalanche Dynamics","pr":"Yoichi Ito"},"268":{"id":"268","t":"A Comprehensive Avalanche Mitigation and Monitoring Framework for Arctic Coastal Infrastructure Protection on ARNØYA, Norway","au":[{"n":"J von Wartburg","raw":"von Wartburg, J","p":true,"aff":""},{"n":"S Wickström","raw":"Wickström, S","p":false,"aff":""},{"n":"T Berger","raw":"Berger, T","p":false,"aff":""},{"n":"N Kavli Walberg","raw":"Kavli Walberg, N","p":false,"aff":""},{"n":"T St Pierre Ostrander","raw":"St Pierre Ostrander, T","p":false,"aff":""},{"n":"M Carrel","raw":"Carrel, M","p":false,"aff":""}],"ab":["Arnøya, a remote island in Troms County, Northern Norway, saw the installation of a comprehensive avalanche mitigation and monitoring system in 2024, focused on two major high-risk zones along county road 9740: Singla and Oterelvene. The primary objective was to protect critical road infrastructure, ensuring reliable year-round access for the local population while supporting regional economic activity. The system consists of 24 remotely operated O’Bellx avalanche gas control systems supported by two Doppler avalanche radars, camera networks and two weather stations. This integrated monitoring framework provides both quantitative and qualitative data in a region where operational assessments are frequently constrained by limited daylight and Arctic coastal weather conditions, making direct visual evaluation of mitigation outcomes and natural avalanche cycles difficult. In addition to supporting avalanche hazard assessment and control operations, the radar system is used to track and count boats and vehicles and to provide warnings in situations where natural avalanche activity may have exposed road users or marine traffic. This capability is particularly important because many avalanche paths terminate abruptly near the shoreline, placing transportation infrastructure and marine traffic routes at direct risk. The combined mitigation–monitoring system provides two primary operational benefits. First, centralized control and event management reduce exposure of practitioners to hazardous avalanche terrain and make post-control verification easier and more precise. Second, realtime data from cameras, weather stations and radars provide precise tools for forecasters and operators to plan and time avalanche mitigation to support effective operations. In this study, we demonstrate how advanced mitigation and monitoring technologies can be deployed in parallel to enhance avalanche hazard management in remote and operationally challenging environments, where infrastructure disruptions can have immediate and significant consequences for local communities."],"kw":"Avalanche Monitoring, Norway, RACS, Mitigation, Forecasting .","ty":"P","pp":240,"em":[],"r":3591,"day":"Tue","th":"Operations and Program Management","pr":"J von Wartburg"},"270":{"id":"270","t":"Using Total Avalanche Volume to Assess Consistency in Operation Avalanche Size Reporting.","au":[{"n":"M Sydney White","raw":"White, M Sydney","p":true,"aff":""}],"ab":["Avalanche size assignments often rely on visual estimates of key parameters such as destructive potential, debris extent, and avalanche mass, all of which are sensitive to inter-rater variability, observer experience, and vantage point. The 2024 update to the Canadian Avalanche Association Observation Guidelines and Reporting Standards (OGRS) introduced a method for estimating avalanche size based on debris volume. However, in practice, Canadian ski operations contributing to the InfoEx dataset rarely report debris depth. Instead, observations more commonly include avalanche length, width, and crown depth, enabling calculation of total avalanche volume rather than deposited debris volume. Given that avalanche size classes are defined on a logarithmic scale, it is reasonable to expect that size categories may still be distinguishable using total volume as a proxy. This study evaluates the feasibility of using total avalanche volume as a proxy for debris-volume-based size classification and assesses consistency in size reporting within a single guiding operation. At the selected operation, 99 avalanches were recorded between December 2025 and April 2026, of which 71 contained sufficient data to estimate total avalanche volume. Debris depth was not reported for any events. Calculated volumes were used to assign predicted size classes, which were then compared to sizes reported by guides. In 66 of the 71 avalanches, the predicted size exceeded the reported size, in some cases by as much as two size categories. Despite the logarithmic nature of the size scale, this discrepancy suggests inconsistency in field-based size assignments. Several limitations should be noted: avalanche geometry is often complex and terrain-constrained, making simple volume approximations imperfect, and all input parameters are subject to observational uncertainty. Overall, these findings highlight the limitations of current observational practices and reinforce the need for more standardized, measurement-based approaches. Encouraging practitioners to record debris depth within InfoEx would enable more accurate debris volume estimates, improve consistency in size classification, and support a better understanding of inter-rater variability in operational avalanche assessments."],"kw":"Avalanche size, Avalanche volume, Avalanche volume deposits","ty":"P","pp":241,"em":[],"r":3592,"day":"Tue","th":"Avalanche Forecasting","pr":"M Sydney White"},"272":{"id":"272","t":"Layerwise: A Fracture-Mechanical Concept for Snow Profile Interpretation","au":[{"n":"Yannik Werner","raw":"Werner, Yannik","p":false,"aff":""},{"n":"Valentin Adam","raw":"Adam, Valentin","p":true,"aff":""},{"n":"Stephan Harvey","raw":"Harvey, Stephan","p":false,"aff":""},{"n":"Mary Kate Carara","raw":"Carara, Mary Kate","p":false,"aff":""},{"n":"Samuel Verplanck","raw":"Verplanck, Samuel","p":false,"aff":""},{"n":"Alec van Herwijnen","raw":"van Herwijnen, Alec","p":false,"aff":""},{"n":"Florian Rheinschmidt","raw":"Rheinschmidt, Florian","p":false,"aff":""},{"n":"Philipp Weißgraeber","raw":"Weißgraeber, Philipp","p":false,"aff":""},{"n":"Philipp L. Rosendahl","raw":"Rosendahl, Philipp L.","p":false,"aff":""}],"ab":["When interpreting a snow profile, snow industry professionals rely on accumulated knowledge and intuition to judge overall snowpack stability. Explicitly linking the stratigraphy to fracture initiation and propagation remains difficult, even for experienced practitioners. Here, we introduce a conceptual model and beta web application that provides a continuous, layer-wise, side-by-side visualization of fracture initiation and propagation potential alongside a snow profile. An accompanying interactive learning environment allows users to build and compare their own snow profiles, supporting future operational use, informed decision-making, and intuitive learning. In practice, snow stability assessment relies on information with large variability in both quantity and quality. Field observations provide snow profiles and stability tests. However, they are typically limited to simple descriptors such as hand hardness or grain type and leave the underlying mechanical properties unresolved. Scientific studies offer detailed insights into snow mechanics, but these are often obtained under controlled conditions and are difficult to link directly to field observations. As a result, the gap between mechanical understanding and snow profile data prohibits a comprehensive, physics-grounded assessment. In this contribution, we present a method concept that aims to enable a continuous evaluation of the snowpack’s physical failure potential. Building on a constrained range of mechanical properties of weak layers, we map representative properties onto given snow profiles. Using a comprehensive analytical mechanical model that allows real-time evaluation, we assess the potential for failure initiation and crack propagation in each layer. This effectively translates field observations into a physically grounded assessment. The result is a continuous through-depth classification. It addresses the practical question: if a weak layer were located at a given depth, how critical would it be for avalanche release? In this way, differently sourced snow profiles become directly comparable and the focus of professionals is guided toward critical locations within the snowpack. To provide a quantitative basis for this classification, we demonstrate the concept with statistical distributions from a dataset of over 13 000 unstable snow profiles. These distributions enable a robust and data-informed interpretation."],"kw":"Snow stability assessment, analytical modelling, decision support, interactive learning, avalanche initiation, propagation potential","ty":"P","pp":242,"em":[],"r":null,"day":"Thu","th":"Modelling and Quantitative Forecasting","pr":"Valentin Adam"},"273":{"id":"273","t":"ON EXPLOSIVE BLAST WAVES AND SNOW: Insights from measurements with time-synchronized air pressure sensors and geophones","au":[{"n":"Benjamin Meier","raw":"Meier, Benjamin","p":true,"aff":""},{"n":"Samuel V. Verplanck","raw":"Verplanck, Samuel V.","p":false,"aff":""}],"ab":["In a project funded by the Transportation Avalanche Research Pool (TARP), we investigated the interaction between explosive blast waves and the snowpack to improve shot placement and charge sizing for avalanche mitigation. We employ high-resolution, time-synchronized measurements of air pressure above the snow surface and near-surface snow motion using geophones embedded in the snow. Field experiments conducted in January 2026 on the Jungfraufirn, a glacier near the Jungfraujoch, Switzerland (3500 m elevation), provided a flat-field winter test designed to minimize terrain reflections and isolate the interaction between the blast wave and the snowpack. Eight explosive charges were detonated above, on, or beneath the snow surface. Three different types of explosives were tested. We show that the blast wave propagates at the speed of sound in air and that peak over-snow pressure decays according to a power law. Higher frequency components attenuate more rapidly. The timing of the over-snow pressure signal aligns with the peak snow velocity, indicating that local air–snow coupling dominates over wave propagation within the snowpack. Geophone measurements reveal that the oscillation frequency of the snow response is similar across all tested charges. In contrast, oscillation magnitude is strongly correlated with the amplitude of the initial shock front. Although based on one snowpack, these high-resolution, coupled measurements and analysis represent an important step toward a mechanistic understanding of blast wave–snow interactions that can inform future avalanche mitigation strategies."],"kw":"Explosives, Avalanches, Pressure, Shockwave, Experiments, Geophones","ty":"O","pp":243,"em":[],"r":3417,"pr":"Benjamin Meier"},"274":{"id":"274","t":"On Measurements of Operational Avalanche Control Explosions","au":[{"n":"Benjamin Meier","raw":"Meier, Benjamin","p":true,"aff":""}],"ab":["In operational remote avalanche control systems (RACS) various types of explosives can be used. People using these systems are mostly concerned about reliability and consistent performance. To provide the end user information about the performance of every individual shot, Wyssen Avalanche Control AG developed a pressure sensor for their RACS that can record the pressure wave with reasonable accuracy. This contribution shows the result of the pilot phase of sensor development in which 250 such sensors were installed on operational RACS. The resulting 1744 explosions that were measured in one season now already comprise one of the largest datasets of explosives used in avalanche control. Since in all Wyssen RACS the distance of the deployment box to the exploding charge is at a fixed 6m, the sensor distance was the same for all direct measurements. At that distance the sensors can measure the full effect of a 5kg explosive charge, while maintaining the sensitivity and resolution to measure the wave of a single detonator. This gives the unique capability to record the effects of failed charges. While it is quickly clear from the recordings if a charge did not properly and fully detonate, the energy of a failed charge was often not limited to the energy of the two detonators. Surprisingly, in many cases at least a small portion of the explosive charge detonated. Such effects were mostly measured with emulsion type explosives that were used beyond their expiration date. While the measurements are of great value for quality control, the sensor placement is not ideal from a scientific viewpoint. The sensors are mounted near highly reflective surfaces; this results in all measurements showing clear effects of these reflections. However, we were able to roughly identify the factor for the different sensor placements and correct for the effect. The RACS for the pilot phase were selected such that the pressure sensors were exposed to different kinds of explosives. Analyzing the recordings we can see no significant difference between powder-explosives, emulsions and the Wyssen 2K binary explosives. Only the fuel-rich explosive Composition-B differs by having a unique waveform, which is addressed by analyzing these separately."],"kw":"Explosives, Pressure, Shockwave, Experiments","ty":"P","pp":244,"em":[],"r":null,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Benjamin Meier"},"276":{"id":"276","t":"New Insights of Mechanical Snowpack Properties Measured by Acoustic and Seismic Distributed Fiber Optic Sensing","au":[{"n":"Alexander Prokop","raw":"Prokop, Alexander","p":true,"aff":""},{"n":"Nicola Agostinetti","raw":"Agostinetti, Nicola","p":false,"aff":""},{"n":"Benedikt Anwander","raw":"Anwander, Benedikt","p":false,"aff":""},{"n":"Bernhard Grasemann","raw":"Grasemann, Bernhard","p":false,"aff":""}],"ab":["Since 2012 we successfully monitor avalanche activity using distributed seismic fiber optic sensing at our avalanche test area at Lech am Arlberg, Austria. We now focused on measuring mechanical snow pack properties utilizing a unique measurement set-up, where a fiber optic cable was inserted in a weak layer, near the snow surface and at the ground/snow interface. For the first time it was possible to measure and analyze the collapse of a weak layer in an avalanche release area. On February 14th we inserted the fiber optic cable within the snow pack and after a major snowfall a slab was formed and the weak layer collapsed on February 17th in the middle of the night with consecutive two small avalanche events happening. We could measure the collapse of the weak layer on a section of 250 m along the cable with a speed between 25 and 100 m/s corresponding to values found in literature. As the fiber optic cable was located close to the snow surface we were also able to measure strong winds affecting the snow surface and we see that early in the morning of February 17th strong gusts most likely triggered mechanically small avalanches. Furthermore we are able to locate strong wind patterns such as turbulence and linear wind flows along a length of 300 m along the cable and the data of the whole winter season correlated with wind speed and direction data that is available on site leads us to question current snow drift models and we indicate possible improvements that can be made using our data. Finally we are also able to see skiers moving along our cable and we are able to analyze their behavior in regard of avalanche safety measures. We can see at what time and how many and most importantly in what distance to each other those skiers crossed the avalanche prone slope. In a time of unstable snow pack stability conditions we conclude that not all skiers follow the recommended safety rules and our data is very useful for analyzing different mechanical snow pack properties and processes."],"kw":"distributed seismic sensing, fiber optic, weak layer collapse, mechanical properties.","ty":"O","pp":245,"em":[],"r":3418,"pr":"Alexander Prokop"},"277":{"id":"277","t":"From Failure to Fracture: Field Measurements of Strength and Fracture Toughness of Buried Surface Hoar Under Mixed-Mode Loading","au":[{"n":"Melin Walet","raw":"Walet, Melin","p":true,"aff":""},{"n":"Jakob Schöttner","raw":"Schöttner, Jakob","p":false,"aff":""},{"n":"Valentin Adam","raw":"Adam, Valentin","p":false,"aff":""},{"n":"Florian Rheinschmidt","raw":"Rheinschmidt, Florian","p":false,"aff":""},{"n":"Philipp Weißgraeber","raw":"Weißgraeber, Philipp","p":false,"aff":""},{"n":"Philipp Rosendahl","raw":"Rosendahl, Philipp","p":false,"aff":""},{"n":"Jürg Schweizer","raw":"Schweizer, Jürg","p":false,"aff":""},{"n":"Alec van Herwijnen","raw":"van Herwijnen, Alec","p":false,"aff":""}],"ab":["Dry-snow slab avalanche release involves failure initiation in a weak layer followed by crack propagation. Weak layer strength describes resistance to failure initiation, whereas fracture toughness describes resistance to crack propagation. Because avalanche release occurs on inclined terrain, both processes generally involve mixed-mode compression and shear loading. Weak layers are known to be weaker in shear than in compression, while recent mixed-mode fracture measurements suggest that fracture toughness may show the opposite trend. Here, we combine two field methods to characterize multiaxial strength and mixed-mode fracture toughness for the same buried surface hoar weak layer. A mobile shear–compression unit (MSCU) was used for strength measurements, and a portable mixed-mode fracture test (MMFT) was used to characterize fracture toughness. For the weak layer investigated here, strength was higher in compression than in shear, whereas fracture toughness was higher in shear loading (mode II) than in compression-dominated loading (closing mode I). These contrasting responses highlight the importance of considering failure initiation and crack propagation separately when characterizing weak layer mechanical behaviour."],"kw":"Weak layers, mixed-mode fracture toughness, multiaxial strength, field experiments, snow mechanics","ty":"O","pp":246,"em":[],"r":3419,"pr":"Melin Walet"},"278":{"id":"278","t":"Towards a Microstructure-Informed Representation of Strength and Stiffness of Weak Snow Layers","au":[{"n":"Jakob Schöttner","raw":"Schöttner, Jakob","p":true,"aff":""},{"n":"Melin Walet","raw":"Walet, Melin","p":false,"aff":""},{"n":"Valentin Adam","raw":"Adam, Valentin","p":false,"aff":""},{"n":"Francesca Carletti","raw":"Carletti, Francesca","p":false,"aff":""},{"n":"Philipp Weißgraeber","raw":"Weißgraeber, Philipp","p":false,"aff":""},{"n":"Philipp Rosendahl","raw":"Rosendahl, Philipp","p":false,"aff":""},{"n":"Florian Rheinschmidt","raw":"Rheinschmidt, Florian","p":false,"aff":""},{"n":"Jürg Schweizer","raw":"Schweizer, Jürg","p":false,"aff":""},{"n":"Alec van Herwijnen","raw":"van Herwijnen, Alec","p":false,"aff":""}],"ab":["Compilations of the mechanical properties of snow often exhibit scatter spanning orders of magnitude. The resulting uncertainty poses a significant challenge for the deterministic modeling of physical processes such as avalanche release. Much of this variability is due to differences in snow microstructure, so that density alone provides an incomplete description of mechanical behavior. This limitation is especially critical for weak layers where extreme microstructural configurations are prevalent. To bridge this gap, we collected and analyzed a comprehensive dataset of approximately 300 uniaxial compression experiments complemented by 70 co-located micro-computed tomography (µCT) scans. We show that much of the systematic variation can be captured by employing simple power laws that depend on grain type. This approach provides a practical solution for implementation in current snow cover models. Furthermore, statistical analysis revealed specific microstructural features associated with the mechanical behavior of weak layers. The effective elastic modulus was primarily related to internal orientation and the efficiency of load paths through the material, which are captured by parameters such as anisotropy and tortuosity. Strength correlates with parameters such as surface curvature and tortuosity. Finally, differences in how strength and stiffness scale with density suggest distinct deformation regimes. We find that persistent weak layers show behavior comparable to microstructures dominated by stretching, while decomposing particles and rounded grains show behavior closer to bending-dominated structures. This finding provides a representation in which density does not appear explicitly and aids in developing numerical and analytical simplifications to capture the response of complex microstructures in simplified macroscopic representations."],"kw":"snow slab avalanches, snow mechanics, weak layers, microstructure, strength, stiffness","ty":"P","pp":247,"em":[],"r":3526,"day":"Mon","th":"Avalanche Formation","pr":"Jakob Schöttner"},"279":{"id":"279","t":"Snow-Avalanche Protection Measures Put to Test in Several Avalanche Cycles in NW- and N-Iceland in March 2026","au":[{"n":"Harpa Grímsdóttir","raw":"Grímsdóttir, Harpa","p":true,"aff":""},{"n":"Tómas Jóhannesson","raw":"Jóhannesson, Tómas","p":false,"aff":""},{"n":"Óliver Hilmarsson","raw":"Hilmarsson, Óliver","p":false,"aff":""}],"ab":["In response to catastrophic avalanche accidents in Icelandic settlements in 1995, a government programme was initiated to build protection measures for settlements at risk. More than 70 snow avalanches have hit deflecting and catching dams and braking mounds in Iceland since the start of the programme, giving valuable knowledge on the effectiveness of different types of protection structures and avalanche dynamics. Most recently, severe avalanche cycles on 15–19 and 23–27 March 2026 involved snow avalanches that impacted braking mounds in Bolungarvík and at Seljalandshlíð in Ísafjörður, both in NW-Iceland. Three avalanches hit braking mounds below Innra-Bæjargil and an avalanche flowed along the entire length of the 700-m-long deflecting dam below Skollahvilft at Flateyri in NW-Iceland. Avalanches hit deflecting dams below Jörundarskál and Strengsgil in N-Iceland and were successfully deflected. Finally, an avalanche was stopped by a catching dam and flowed along a deflecting dam at Patreksfjörður in NW- Iceland. None of the avalanches overran the protection measures, and nobody came to harm. No avalanches were released from a starting area with snow supporting structures in Hafnarhyrna in Siglufjörður during these cycles when several avalanches, some large, were released from neighbouring avalanche paths with similar aspects. It appears likely that the protection measures prevented snow avalanches from reaching the respective settlements in both Patreksfjörður and Siglufjörður in this case. The avalanches that have impacted braking mounds, deflecting dams and catching dams in Iceland provide important empirical data about the effectiveness of avalanche protective structures. Rapidly moving fluidized fronts have overflowed dams in two cases, causing damage. In addition to improving the safety of inhabitants, the protection structures reduce the frequency of evacuations. It is clear that widespread evacuations would have been ordered in the March 2026 avalanche cycles if the protection measures that have been implemented in Iceland during the last quarter century had not been in place."],"kw":"Avalanche protection measures, avalanche dams, avalanche cycles","ty":"P","pp":248,"em":[],"r":3527,"day":"Mon","th":"Planning and Engineering","pr":"Harpa Grímsdóttir"},"280":{"id":"280","t":"Avalanche Mitigation in Mining Industry: Bridging Snow Science, Regulatory Compliance, and Time-Critical Decision-Making – a Case Study from Codelco Andina, Chile","au":[{"n":"Maximiliano Barros Achondo","raw":"Barros Achondo, Maximiliano","p":false,"aff":""},{"n":"Esteban Cueto","raw":"Cueto, Esteban","p":false,"aff":""},{"n":"Cesar Vera","raw":"Vera, Cesar","p":false,"aff":""}],"ab":["Operating a large-scale mine (240kton refined copper for 2030) in the Chilean Andes confronts practitioners with a fundamental challenge: how to translate snow science into operational decisions that are not only technically sound, but also legally defensible. At Codelco Andina, there are more than 200 avalanche paths, thousands of workers travelling in and out of the operation, and critical infrastructure is exposed to avalanche hazard within a safety regulatory environment requiring traceability between hazard assessment, control measures, and documented outcomes. A persistent challenge is therefore the integration of advances in avalanche science with the governance requirements of industrial operations. This paper presents an integrated framework that connects snow science, avalanche risk management, regulatory compliance, and time-critical operational decision-making. Bowtie analysis is used to formalize the relationship between avalanche threats, preventive and mitigative controls, and potential consequences, creating a structure that is both operationally functional and auditable. Decision thresholds derived from weather and snowpack monitoring are incorporated into operational management, allowing dynamic decisions concerning workforce exposure and access. Remote Avalanche Control Systems (RACS), structural defenses, and high-mountain helicopter protocols are integrated within the same risk management architecture. Climate variability, including atmospheric river events and El Niño conditions, increases forecasting complexity and requires explicit procedures for decision-making under uncertainty. The framework therefore combines technical assessment with defined operational thresholds, control ownership, verification, and documented evidence of effectiveness. Over more than 17 years of implementation, no avalanche-related worker fatalities have been recorded. Operational downtime in critical areas decreased from approximately 400 hours per year to zero, while the optimized mitigation strategy avoided approximately USD 45.7 million in capital expenditure through the incorporation of RACS into the designengineering framework and the consequent reduction in the need for permanent structural measures. The case demonstrates that avalanche science and regulatory accountability are not competing requirements. When integrated into a common operational framework, they can reinforce safety, traceability, investment optimization, and operational continuity in high-mountain mining."],"kw":"Avalanche Management; Bowtie; Compliance; Operational Continuity, accountability.","ty":"P","pp":249,"em":[],"r":3593,"day":"Tue","th":"Operations and Program Management","pr":"Maximiliano Barros Achondo"},"281":{"id":"281","t":"Shrine Bowl Avalanche Case Study: Lessons in Expectations","au":[{"n":"Aaron Parmet","raw":"Parmet, Aaron","p":true,"aff":""},{"n":"Drew Gibson","raw":"Gibson, Drew","p":false,"aff":""}],"ab":["This case study of an outlier in avalanche rescue survival provides an opportunity to examine how expectation-based heuristics influence operational judgment and attitudes in avalanche rescue decision-making. In 2025, Summit County Rescue Group (SCRG) responded to an avalanche involving two snowmobilers in Shrine Bowl, Colorado. One rider was completely buried and remained under the snow for over one hour prior to extrication. Despite a burial duration markedly exceeding likely survival times, the patient survived, making this case an outlier within the SCRG response area. Summit County has the second-highest number of avalanche fatalities in Colorado, the state with the most fatalities in the United States. We present a reconstruction of the incident, the organized response, and key operational decision points. Analysis focuses on rescue outlook considerations and access constraints, with emphasis on how these factors drove tactical choices during storm conditions. Particular attention is given to moments where time-based assumptions conflicted with observed rescue outlooks. This case highlights a critical tension in avalanche rescue: while survival probability curves are foundational to training and triage, they can also introduce expectation bias that shapes perceptions of survivability and urgency. This phenomenon is observed even among experienced and highly trained rescuers. In long burial scenarios, these expectations may influence rescue decisions related to search persistence, risk tolerance, and allocation of resources in the face of difficult access and adverse weather conditions. To place this event in context, we reference other documented long burial survival outliers, examining these unexpected cases. This examination supports a shift in emphasis in rescuer education and training to better prepare for such scenarios and to influence rescuer attitude and decision-making. This case study contributes to ongoing discussions in avalanche rescue and decision-making by identifying how expectation bias can influence operational outcomes. We propose that rescue frameworks and training explicitly address this bias and incorporate flexible, observation-driven decision strategies. Lessons learned provide practical insights in support of this approach."],"kw":"Avalanche Rescue, Search and Rescue, Long Avalanche Burial, Cognitive Heuristics, Expectation Bias, Decision-Making","ty":"O","pp":250,"em":[],"r":3404,"pr":"Aaron Parmet"},"282":{"id":"282","t":"On How the Temporal Evolution of Slab and Weak Layer Properties Affects Failure Initiation and Crack Propagation in Dry-Snow Slab Avalanche Formation","au":[{"n":"Jürg Schweizer","raw":"Schweizer, Jürg","p":true,"aff":""},{"n":"Benjamin Reuter","raw":"Reuter, Benjamin","p":false,"aff":""},{"n":"Christoph Mitterer","raw":"Mitterer, Christoph","p":false,"aff":""}],"ab":["In the European Alps, the avalanche situation in winter 2025/26 was dominated by persistent weak layers. Very many dry-snow slab avalanches were triggered, resulting in a high number of fatalities far higher than the long-term average. Early snowfall followed by a dry, partly cold December was once again the recipe for the early January snowpack, which predominantly consisted of layers of facets and depth hoar. Subsequent snowfalls in January and February produced the slab, resulting in the perfect slab-weak layer combination for slab avalanches. Not surprisingly, the critical situation persisted. While failure initiation became increasingly harder, cracks still propagated easily. So why did propagation propensity stay high, despite the weak layers slowly gaining strength? Based on field data and model results, we demonstrate how, in situations dominated by persistent weak layers, slab and weak layer properties develop, and how their interplay controls dry-snow slab avalanche formation. As weak layer strength increases with loading by snowfall, typically at a rate of 20–100 Pa/d, so does the specific fracture energy, the property describing the resistance of the weak layer to crack propagation. On the other hand, the new snow leads to an increase in slab thickness, density, and elastic modulus. The change in slab properties will affect failure initiation as much as crack propagation, however, with opposite signs. The subtle interplay between slab and weak layer properties explains, to a large part, the occurrence of low-probability, high-consequence events that are ominous of such situations with deep persistent weak layers. While forecasters recognize the delicate situation, recreationists often struggle with it, and even for professionals, decision-making is inherently difficult. This calls for targeted education and communication on the meaning of the avalanche problem types, in particular, persistent weak layers, which, for instance, in German, is not well addressed with the term “Altschnee”."],"kw":"Dry-snow slab avalanche, failure initiation, crack propagation, snow stability, weak layer, strength, toughness.","ty":"O","pp":251,"em":[],"r":3458,"pr":"Juerg Schweizer"},"283":{"id":"283","t":"Digital Image Correlation (DIC) in Snow Mechanics: Practical Considerations and Applications","au":[{"n":"Jakob Schöttner","raw":"Schöttner, Jakob","p":true,"aff":""},{"n":"Melin Walet","raw":"Walet, Melin","p":false,"aff":""},{"n":"Valentin Adam","raw":"Adam, Valentin","p":false,"aff":""},{"n":"Michael J. Kohler","raw":"Kohler, Michael J.","p":false,"aff":""},{"n":"Bastian Bergfeld","raw":"Bergfeld, Bastian","p":false,"aff":""},{"n":"Marcus Muhonen","raw":"Muhonen, Marcus","p":false,"aff":""},{"n":"Daan Leeflang","raw":"Leeflang, Daan","p":false,"aff":""},{"n":"Florian Rheinschmidt","raw":"Rheinschmidt, Florian","p":false,"aff":""},{"n":"Philipp Rosendahl","raw":"Rosendahl, Philipp","p":false,"aff":""},{"n":"Philipp Weißgraeber","raw":"Weißgraeber, Philipp","p":false,"aff":""},{"n":"Jürg Schweizer","raw":"Schweizer, Jürg","p":false,"aff":""},{"n":"Alec van Herwijnen","raw":"van Herwijnen, Alec","p":false,"aff":""}],"ab":["In snow mechanics experiments, complex loading configurations and layered snow can produce highly non-uniform deformation, including strain localization, crushing, and fracture. Moreover, machine compliance, boundary motion, and rigid-body motion can cause the imposed displacement to differ from the deformation experienced by the snow. Digital Image Correlation (DIC) complements force and actuator-displacement measurements by providing noncontact surface displacement and strain fields directly on the specimen or snow profile. This contribution summarizes practical experience gained from two-dimensional DIC measurements of exposed snow surfaces. It follows the experimental workflow from planning and preparation to acquisition, processing, and interpretation. Particular attention is given to field of view, spatial and temporal resolution, camera geometry and calibration, pattern preparation, illumination, reference-image selection, synchronization, validation, and reporting. Case studies range from small laboratory tests to field-scale fracture experiments and model-based parameter identification. The aim is to provide a practical basis for designing and interpreting DIC measurements in snow mechanics."],"kw":"digital image correlation, DIC, snow mechanics, snow slab avalanches, avalanche dynamics","ty":"P","pp":252,"em":[],"r":null,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Jakob Schöttner"},"284":{"id":"284","t":"The Role of Slope Angle in Skier-Triggered Slab Avalanche Release","au":[{"n":"Stephan Harvey","raw":"Harvey, Stephan","p":true,"aff":""},{"n":"Alec van Herwijnen","raw":"van Herwijnen, Alec","p":false,"aff":""},{"n":"Yannik Werner","raw":"Werner, Yannik","p":false,"aff":""},{"n":"Valentin Adam","raw":"Adam, Valentin","p":false,"aff":""}],"ab":["Slope angle is a key factor in dry-slab avalanche formation and central to avalanche education and terrain assessment. Combined with the avalanche danger rating, it is commonly used to estimate the release probability on a crux slope. Even small differences in steepness may therefore influence risk perception and decision-making. However, slope angle affects several interacting processes in slab avalanche formation, raising the question of how it influences triggering probability across the full range from flat to 45°, covering the terrain relevant for backcountry travel. This study examines the effect of slope angle on slab-avalanche formation, from failure initiation and crack propagation to slab release. We synthesise current research, apply fracture-mechanical approaches and relate slope angle to skier-induced loading and dynamics. Additionally, we analyse slope angles at release areas and trigger locations of human-triggered avalanches in Switzerland. Our findings show that slope angle has limited direct effects on failure initiation and the onset of crack propagation but influences skier loading and crack-face friction, thereby promoting dynamic crack propagation and slab release. Overall, loading type and snowpack properties often have a greater influence on release probability than small differences in slope angle. Particular caution is warranted on uniform slopes between 35° and 40°, where skier loading, crack-propagation propensity, and friction appear to combine favourably for avalanche release. Persistent weak layers have significantly lower friction angles and therefore require a more conservative approach."],"kw":"slope angle, slab avalanche release, failure initiation, crack propagation, friction, skier triggering","ty":"O","pp":253,"em":[],"r":3397,"pr":"Stephan Harvey"},"285":{"id":"285","t":"Entropy and the Art of Avalanche Forecasting: An Examination of Factor Weights and Classes","au":[{"n":"Dave Gauthier","raw":"Gauthier, Dave","p":true,"aff":""},{"n":"Cam Ross","raw":"Ross, Cam","p":false,"aff":""},{"n":"Caio Stringari","raw":"Stringari, Caio","p":false,"aff":""}],"ab":["Every avalanche forecast is based on many factors, such as recent avalanche observations, instability test results, or weather conditions. The art of avalanche forecasting is partly about deciding how much weight to put on each bit of information provided by the factors. As Ed Lachapelle pointed out in 1980, in practice the avalanche forecaster always has an imperfect state of knowledge of avalanche conditions, and by necessity their objective is to each day improve their forecast by iteratively incorporating new information to reduce uncertainty in the expected conditions. This paper is less about how the forecaster would do this, as that has been well covered by others. Rather the objective is to reexamine the groupings of Class I, II, and III forecasting factors as they have been traditionally defined and to estimate quantitative weights for several of the most commonly used, to help the forecaster more systematically and rigorously update forecasts based on their observations of avalanche, snowpack, and weather factors. This paper provides quantitative estimates of weights of the most common forecasting factors, and an evaluation of class membership for each. It proposes a simple framework to allow the forecaster to consider the weighting of information provided by the common factors and to estimate the weights of other factors relevant to a particular operation or location, and to generally consider information entropy in defining new factors and in improving the efficiency of avalanche forecasting workflows. Applications to different scales of decision problems, for example in backcountry travel, are also explored."],"kw":"Forecasting, entropy, factors.","ty":"P","pp":254,"em":[],"r":3594,"day":"Tue","th":"Avalanche Forecasting","pr":"Dave Gauthier"},"286":{"id":"286","t":"AVALANCHEALLEY.COM a Program Database & Risk Communication Tool","au":[{"n":"Richard W. Steiner Jr.","raw":"Steiner Jr., Richard W.","p":true,"aff":""},{"n":"Adam M. Clark","raw":"Clark, Adam M.","p":false,"aff":""},{"n":"Calvin Hill","raw":"Hill, Calvin","p":false,"aff":""}],"ab":["In 2010 avalanche forecasters with the BNSF Avalanche Safety Program (Program) began developing the Interactive Avalanche Information System (IAIS). BNSF Avalanche Safety was founded in January 2005 to assist the Railway with reducing avalanche risk. Its operational area is along the southern boundary of Glacier National Park, John F. Stevens Canyon, located in northwest Montana, USA. The IAIS was originally developed as an in-house, computerbased avalanche atlas and database where forecasters could enter and manage data. An oral presentation explaining the initial development of the IAIS was given at the 2012 International Snow Science Workshop in Anchorage, Alaska. The proceedings paper can be found at https://arc.lib.montana.edu/snow-science/item.php?id=1703. Program staff transitioned away from the IAIS beginning in 2012 and began developing a user-interactive, web-based platform (website), www.avalanchealley.com. This transition allowed forecasters to manage data remotely on various electronic devices while also utilizing the website for risk communication. Development of the website had three main objectives: (1) to allow forecasters to electronically record industry standard avalanche, snowpack, and weather data, (2) display these data, free of charge, for online viewer dissemination, (3) to integrate these data with a userinteractive, webbased avalanche atlas. Now, 15 years later, the Avalanche Alley website continues to operate efficiently and has become a robust Program risk communication tool. Keeping the website running has required enduring software glitches, programming issues, a web developer switch, and a completely new platform for managing both the website and database."],"kw":"Avalanche Alley, IAIS, Data, Data Management, Web Atlas.","ty":"P","pp":255,"em":[],"r":null,"day":"Thu","th":"Risk Communication","pr":"Richard W. Steiner Jr."},"287":{"id":"287","t":"Automotive Lidars Utilized to Provide Real Time Snow Depth Mapping for Avalanche Forecasting and Decision-Making in Ski Resorts","au":[{"n":"Alexander Prokop","raw":"Prokop, Alexander","p":true,"aff":""},{"n":"Stefan Muckenhuber","raw":"Muckenhuber, Stefan","p":false,"aff":""},{"n":"Thomas Gölles","raw":"Gölles, Thomas","p":false,"aff":""},{"n":"Stefan Wallner","raw":"Wallner, Stefan","p":false,"aff":""},{"n":"Birgit Schlager","raw":"Schlager, Birgit","p":false,"aff":""},{"n":"Stefan Graf","raw":"Graf, Stefan","p":false,"aff":""},{"n":"Florian Singer","raw":"Singer, Florian","p":false,"aff":""}],"ab":["LiDARs are used for snow depth mapping for all scales, from satellites, airplanes, drones, mobile vehicles, and terrestrial based since about 20 years now. The technology provides high resolution and accurate spatial measurements of snow surfaces. Further, snow depth maps are created via differential maps calculated from a snow on and off surface (or snow surfaces at different stages of evolution). In this project we utilize low-cost automotive LiDARs to provide real time snow depth maps that are used for avalanche forecasting and decision-making. At our avalanche test site at Lech am Arlberg, Austria, we installed 4 Livox Avia LiDARs, each monitoring a range of about 150 m to cover an avalanche prone slope that is loaded by snow drift events that form a significant cornice at the ridge. Avalanche events happen both, naturally and triggered by explosives. We tested our measurement setup against a commonly used laser scanner (Riegl VZ6000) and a continuous 1-d laser (Lufft SHM31), which has not been done before and determined the accuracy of our set-up. Most work was invested in providing a reliable solution in terms of a self-sufficient power supply and solid installation as well as straightforward post processing including filtering of air particles and web data display, which we discuss. The advantage of such permanent installations is the possibility of measuring the snow pack evolution in high time frequency. Any time a reliable spatial snow depth measurement covering an area of 600 m (four LiDARs in action) in a point resolution of 10 cm can be conducted. At our avalanche prone slope we were able to follow the accumulation of snow due to snowdrift and/or snow precipitation as well as melting and mass movement of avalanche events in a spatial content. The results we show and discuss provide a useful improvement for avalanche forecasting and decision-making compared to the commonly used 1-d snow depth sensors as e.g. spatial dimension of snow drifts can be detected and the use of explosives can be initiated or a ski run can be closed."],"kw":"LiDAR, laser scanning, snow depth, snow accumulation, low-cost","ty":"P","pp":256,"em":[],"r":3595,"day":"Tue","th":"Avalanche Forecasting","pr":"Alexander Prokop"},"289":{"id":"289","t":"What Is a Wind Slab? A Review of Variable Definitions in Research and Practice","au":[{"n":"Nata De Leeuw","raw":"De Leeuw, Nata","p":false,"aff":""},{"n":"Karl Birkeland","raw":"Birkeland, Karl","p":false,"aff":""},{"n":"Jordy Hendrikx","raw":"Hendrikx, Jordy","p":false,"aff":""}],"ab":["Despite widespread use in both research and practice, the definition of the term wind slab varies throughout snow and avalanche literature. Publications from as early as the 1930s recognized the role of wind in transporting snow and creating slabs, but acknowledged that the process was poorly understood. Though our understanding of formation processes has advanced, definitions of the term wind slab remain inconsistent. Some definitions focus on physical properties of the slab and snow grains, while others focus on formation. Different definitions are not necessarily mutually inclusive of each other. Associated terms such as wind skin and wind crust, while often used in practical situations, are only infrequently and vaguely defined in avalanche literature. Inconsistent definitions pose challenges for both practitioners and researchers. In avalanche forecasting, inconsistent definitions can hinder communication, which can lead to the application of inappropriate mitigation or avoidance strategies. From a scientific perspective, it is important to accurately and consistently define terms in order to effectively conduct and communicate research. This review paper addresses the varied definitions of the term wind slab and other associated terms. In doing so, it also summarizes how our understanding of wind influence on snow has evolved. Examining both historic and modern uses of the term wind slab can help us form consistent definitions, not just for wind-related terms, but perhaps for other avalanche problem types as well."],"kw":"Wind Slab, Avalanche Problems, Avalanche Problem Types, Review Article","ty":"P","pp":257,"em":[],"r":3596,"day":"Tue","th":"Avalanche Forecasting","pr":"Nata De Leeuw"},"290":{"id":"290","t":"Validation of Bluetooth Low Energy (BLE) Counters for Monitoring Backcountry Use","au":[{"n":"Ingeborg K. Bruflot","raw":"Bruflot, Ingeborg K.","p":true,"aff":""},{"n":"Vegard Vereide","raw":"Vereide, Vegard","p":false,"aff":""},{"n":"Håvard B. Toft","raw":"Toft, Håvard B.","p":false,"aff":""}],"ab":["It is widely acknowledged that backcountry skiing has increased in popularity in recent years. However, accurate quantification of participants requires the development and application of robust methods for measuring the number of individuals engaging in backcountry skiing. While not all skiers carry avalanche transceivers, most carry some form of Bluetooth Low Energy (BLE) device (e.g., a phone, smartwatch, or wireless headset). To capture these signals, a method has been developed that continuously scans for BLE transmissions emitted by nearby devices. This study presents the validation of BLE-based counters deployed in the Indre Sogn region during the 24/25 and 25/26 seasons. The study forms part of a multi-year development process aimed at establishing a method suitable for estimating backcountry use. To validate the BLE counters, two time-lapse cameras were deployed, capturing images at 30second intervals from morning to evening over a three-month period. The images were manually reviewed and compared with the corresponding counts from the BLE counters. The statistical analysis will include Bland–Altman plots, which highlight both systematic bias and individual differences. In addition, intraclass correlation coefficients (ICC), a two-way mixed-effect model with consistency, will be used to assess reliability and account for random variation. The results indicate that BLE counters provide promising estimates of backcountry use. This approach addresses a previous gap in backcountry use monitoring and contributes to an improved understanding of usage patterns, user characteristics and exposure to avalanche hazard."],"kw":"Quantifying backcountry use; Bluetooth Low Energy; Monitoring method","ty":"P","pp":258,"em":[],"r":null,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Ingeborg K. Bruflot"},"292":{"id":"292","t":"Considerations for Effective Uncertainty Communication in Public Avalanche Forecasts","au":[{"n":"Eeva Latosuo","raw":"Latosuo, Eeva","p":true,"aff":""},{"n":"Pascal Haegeli","raw":"Haegeli, Pascal","p":false,"aff":""},{"n":"Julie Demuth","raw":"Demuth, Julie","p":false,"aff":""},{"n":"Stan Nowak","raw":"Nowak, Stan","p":false,"aff":""},{"n":"Ethan Greene","raw":"Greene, Ethan","p":false,"aff":""}],"ab":["Uncertainty is fundamental to avalanche risk management, yet public avalanche forecasts have not communicated it as consistently as other hazard characteristics. The Conceptual Model of Avalanche Hazard addresses what type of avalanche problem exists, where it is found, how likely it is, and how large it may be, but not \"How sure are you?\" . Our prior research found that although forecasters routinely assess uncertainty, many struggle with when and how to communicate it within existing tiered structures. This paper develops considerations for communicating forecast uncertainty more effectively across user levels. Using a systems-thinking approach, we examine three components of the forecast system - hazard, users, and products - and distill our understanding into four questions: Is the uncertainty decision-relevant, and to whom? What can users reasonably understand and act on? Where in the tiered structure should it appear, and how should it be communicated? We apply these questions to three high-uncertainty situations and to an existing operational element, the confidence statement, to illustrate how communication needs shift with the nature of the uncertainty. Across these situations, decision relevance, reducibility, and user capacity varied independently, so no single approach applied across uncertainty types. Broadly relevant or irreducible uncertainty warranted direct messaging placed prominently in the forecast, while uncertainty relevant to narrower audiences suited deeper tiers with plain-language support. From these patterns, we offer five recommendations for avalanche warning services. Uncertainty communication should not be a fixed forecast component, but adapted in placement, content, and format to its nature and to users' capacity to respond - above all, relevant, actionable, and appropriate to user’s decision-making contexts."],"kw":"Avalanche risk communication, Uncertainty, Public avalanche forecasting, User re- search","ty":"O","pp":259,"em":[],"r":3449,"pr":"Eeva Latosuo"},"293":{"id":"293","t":"Lidar Derived Relative Snow Depth Mapping to Predict Persistent Weak Layer Trigger Areas","au":[{"n":"Bjoern Bingham","raw":"Bingham, Bjoern","p":false,"aff":""},{"n":"Joseph Ammatelli","raw":"Ammatelli, Joseph","p":false,"aff":""},{"n":"Dan McEvoy","raw":"McEvoy, Dan","p":false,"aff":""}],"ab":["Persistent slab avalanches are a leading cause of avalanche fatalities, in part because persistent weak layers (PWLs) are difficult to detect. A key risk factor is spatial variability in snow depth: shallow areas promote stronger temperature gradients, favor weak-layer formation, and increase the likelihood of human triggering, yet are often indistinguishable from the surface by eye. We present a feasibility study developing basin-wide “shallow snow” maps derived solely from historical, high-resolution Airborne Snow Observatories (ASO) lidar snow depth records for three case-study watersheds spanning contrasting snow climates: Truckee and Tuolumne, California, and East River, Colorado. We evaluated five depth-only statistics across three general approaches: sliding-window comparison to the local neighborhood (raw anomaly, normalized anomaly, and local percentile), local spatial autocorrelation (Local Moran’s I), and residual analysis relative to dominant spatiotemporal patterns via low-rank singular value decomposition (SVD). We assessed the sliding-window statistics via leave-one-year-out cross-validation against matched-truth intersectionover-union (IoU) scores, Normalized anomaly proved the most promising, reproducing held-out years with IoU of roughly 0.5-0.6, well above the chance baseline (IoU ≈ 0.03-0.10), and reaching most of its achievable skill within just a few years of training flights. Local Moran’s I and the SVD residual showed moderate success in qualitative comparison, but each carries a distinct limitation, an elevation bias tied to flight timing, and untested sensitivity to reconstruction rank, respectively. Both require further refinement before either is ready for the same leave-one-yearout evaluation as the sliding-window methods. These results demonstrate that historical lidar alone, without real-time data or terrain covariates, can identify terrain that is persistently prone to shallow snow, supporting further development of a shallow-snow layer for integration into backcountry mapping platforms to strengthen terrain-based decision support for persistent slab avalanches."],"kw":"LiDAR; Persistent weak layers; Shallow snow; Mapping; Cross-validation","ty":"P","pp":260,"em":[],"r":null,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Bjoern Bingham"},"294":{"id":"294","t":"Statewide Avalanche Hazard Modeling Along Alaska’s Transportation Corridors","au":[{"n":"Gabriel J. Wolken","raw":"Wolken, Gabriel J.","p":true,"aff":""},{"n":"Elizabeth Fischer","raw":"Fischer, Elizabeth","p":false,"aff":""},{"n":"Yves Bühler","raw":"Bühler, Yves","p":false,"aff":""},{"n":"Marc Christen","raw":"Christen, Marc","p":false,"aff":""},{"n":"Katreen Wikstrom Jones","raw":"Jones, Katreen Wikstrom","p":false,"aff":""}],"ab":["Alaska’s road and rail network traverses some of the most active and least observed avalanche terrain in North America, creating persistent challenges for infrastructure resilience and public safety. Avalanche risk assessment for remote transportation corridors is often hindered by a lack of weather, snowpack, and historic avalanche data. This shortage of information makes it difficult to systematically evaluate safety along these routes. We present a statewide avalanche hazard assessment for road corridors in Alaska, utilizing an automated large-scale indication modelling approach. Originally developed in Switzerland, this methodology was implemented via RAMMS::Avalanche and specifically adapted for snow climates in Alaska. The workflow automates the identification of potential release areas (PRAs) to facilitate the simulation of regional-scale avalanche ensembles across Alaska's complex terrain. To address observational gaps, spatially distributed snow input parameters are derived from downscaled climate reanalysis, enabling consistent representation of release conditions across Alaska’s diverse climatic regions. Simulations resolve runout extent, maximum velocity, maximum impact pressure, maximum flow height, and deposition for estimated frequent (~30-year) and rare (~300-year) return period scenarios. This large-scale modeling framework enables physically based hazard characterization in data-sparse environments where traditional observation-driven approaches are not feasible. Initial findings indicate significant regional variance in hazard levels, identifying localized clusters of high intensity, or 'hotspots', traversing the road corridors. Comparisons between return periods indicate nonlinear increases in runout and impact pressure, with implications for infrastructure exposure and risk management. The resulting dataset provides a standardized, quantitative basis for prioritizing mitigation and supporting operational decision-making for the State of Alaska. More broadly, this work demonstrates a scalable approach for integrating climate-informed snow inputs with large-area avalanche dynamics modeling in high-latitude, observation-limited regions."],"kw":"Avalanche modeling, Transportation corridors, Alaska, Hazard indication mapping, Cli- mate reanalysis.","ty":"O","pp":261,"em":[],"r":null,"pr":"Gabriel J. Wolken"},"295":{"id":"295","t":"Towards Real-Time Fractionation of Mixed-Phase Precipitation","au":[{"n":"Eric R. Pardyjak","raw":"Pardyjak, Eric R.","p":true,"aff":""},{"n":"Dhiraj K. Singh","raw":"Singh, Dhiraj K.","p":false,"aff":""},{"n":"Daniel Webster","raw":"Webster, Daniel","p":false,"aff":""},{"n":"Benjamin H. Silberman","raw":"Silberman, Benjamin H.","p":false,"aff":""},{"n":"Timothy Garrett","raw":"Garrett, Timothy","p":false,"aff":""},{"n":"Travis Morrison","raw":"Morrison, Travis","p":false,"aff":""}],"ab":["Near-surface precipitation can occur as liquid, solid, or mixed-phase hydrometeors. In many winter storms, individual particles are not purely rain or snow, but instead contain both liquid and ice, as in sleet, freezing rain, or partially melted snow. These complex particles remain poorly constrained in observations, which limits progress in numerical weather prediction and in understanding hazardous winter weather. Mixed-phase precipitation is especially important because it strongly affects surface icing, visibility, and road traction, creating major risks for transportation and infrastructure. From a snowpack perspective, the water content of precipitation can lead to the injection of both heat and liquid mass into the snowpack resulting in snow grain metamorphism and potentially modification of the seasonal release of snow-melt water, flooding, weakening of a snowpack, and generation of various melt-freeze crusts that lead to avalanche instabilities. Various methods currently exist for quantifying the amount of water going into a snowpack including optical disdrometers, imaging disdrometers, micro rain radars, and integrated satellite products, each of which has advantages and disadvantages. Crowdsourcing has also provided important qualitative knowledge of the spatial variability of phase that is particularly useful for validation studies. Here, we present a new first-principlesbased experimental methodology based on the Differential Emissivity Imaging Disdrometer or DEID, a thermalimaging hotplate device, that has previously been used to measure snow water equivalent (SWE), snow density, and other integrated snowpack properties. Because the DEID can analyze hydrometeors on a particleby-particle basis, it can be used to identify very short-lived mixed-phase events that may normally be overlooked. We present cold-room lab results to verify that the methodology works and to quantify its ability to fractionate liquid and ice phases. We then present preliminary results of phase-fractionation from field observations collected in Utah at the Alta-Collins snowstudy plot and Red Butte Canyon during the 2020–2021 winter season and more recently at the Atwater snow-study plot during the 2025- 2026 winter season. We analyze storms with a range of near-freezing mean air temperatures representing different conditions."],"kw":"Mixed-phase precipitation, DEID, Avalanche forecasting, Rain-on-snow events.","ty":"O","pp":262,"em":[],"r":3411,"pr":"Eric Pardyjak"},"296":{"id":"296","t":"Linking Snowpits to Snow Mechanics with an Extensible Algorithmic Framework","au":[{"n":"Mary Kate Connelly","raw":"Connelly, Mary Kate","p":false,"aff":""},{"n":"Philipp L. Rosendahl","raw":"Rosendahl, Philipp L.","p":false,"aff":""},{"n":"Valentin Adam","raw":"Adam, Valentin","p":false,"aff":""},{"n":"Samuel V. Verplanck","raw":"Verplanck, Samuel V.","p":false,"aff":""}],"ab":["Mechanical models of avalanche release require mechanical properties of snow, such as Young’s modulus, E, and Poisson’s ratio, ν, that are seldom measured directly in snowpits. Snowpit observations are widely collected, standardized, and central to avalanche practice, but the methods available to translate them into mechanical parameters remain limited. Multiple published parameterizations can estimate mechanical properties from common field observations, but they differ in input requirements, validity domains, and resulting uncertainty, and their chained combinations have not been systematically enumerated or compared. We present SnowPyt-MechParams, an extensible graph-based framework that encodes a selection of parameterizations and their dependencies as a directed acyclic graph, enumerates unique calculation pathways, executes those pathways on slab objects derived from snowpit observations, and propagates input measurement uncertainty through chained calculations. As an example implementation, we use SnowPylot to parse SnowPilot CAAML files from the 2015–2025 water years, yielding 50,278 snowpits, 371,429 layers, and 14,776 slabs constructed from propagating Extended Column Test results. We compare the number of valid pathways and the coverage across those pathways to ascertain the slopeparallel component of slab weight per unit area, Wshear, with and without elasticity parameters E and ν for each layer in the slab. Within the implemented framework, there are four valid pathways for Wshear, and the highest coverage pathway succeeds for 5,470 slabs (37.0 %). The mechanically richer target with elasticity yields 32 valid pathways, of which the highest coverage pathways succeed for only 687 slabs (4.6 %). These results surface a gap between modern mechanical model requirements and currently available methods for estimating mechanical parameters from snowpit observations."],"kw":"snow mechanics; snowpits; avalanche release; SnowPilot; parameterization; uncertainty","ty":"P","pp":263,"em":[],"r":null,"day":"Fri","th":"Snowpack Properties","pr":"Mary Kate Connelly"},"297":{"id":"297","t":"Methods for Evaluating Avalanche Loads on Bridges","au":[{"n":"Greg Johnson","raw":"Johnson, Greg","p":true,"aff":""},{"n":"Alan Jones","raw":"Jones, Alan","p":false,"aff":""},{"n":"Chris Wilbur","raw":"Wilbur, Chris","p":false,"aff":""},{"n":"John Stimberis","raw":"Stimberis, John","p":false,"aff":""}],"ab":["Transportation corridors crossing mountainous terrain frequently intersect avalanche paths capable of producing destructive snow avalanches. Avalanche bridges can provide an alternative to snowsheds or operational avalanche control where terrain and highway geometry allow avalanche flows to pass beneath an elevated structure. Their designs are complex because loading may involve wet or dry dense flow and powder avalanches, entrained debris, deposition, and variable lateral, oblique, uplift, drag, and static loads acting on multiple bridge components. Historical failures demonstrate that avalanche actions cannot be represented by a single uniform impact pressure and that terrain, bridge geometry, flow direction, and construction phase exposure can strongly influence structural response. This paper reviews the historical development of avalanche bridges and presents a practical framework for feasibility assessment and design. Key considerations include avalanche scenarios and return periods; flow depth, velocity, density, direction, and deposition; bridge clearance and geometry; component specific loading; vehicle safety; load factors; and independent review. Examples from Teton Pass, Goat Lick, Denny Creek, Snoqualmie Pass, and the Kicking Horse Canyon illustrate the evolution from early failures to designs that integrate avalanche avoidance, flow management, and structural resistance. The paper also discusses construction phase risk, long term operations, and future needs including reliability based load factors, improved methods for complex structures."],"kw":"Avalanche loads, avalanche bridges, bridge design, transportation infrastructure, struc- tural loading, avalanche mitigation.","ty":"O","pp":264,"em":[],"r":3464,"pr":"Greg Johnson"},"298":{"id":"298","t":"Closing the Gap Between Satellites and Forecasters: Experiences from the Swedish Mountains","au":[{"n":"Jakob Grahn","raw":"Grahn, Jakob","p":true,"aff":""},{"n":"Daniel Stødle","raw":"Stødle, Daniel","p":false,"aff":""},{"n":"Petter Palmgren","raw":"Palmgren, Petter","p":false,"aff":""},{"n":"Anton Grindgård","raw":"Grindgård, Anton","p":false,"aff":""},{"n":"Mattias Tarestad","raw":"Tarestad, Mattias","p":false,"aff":""}],"ab":["Spaceborne synthetic aperture radar (SAR) can help observe avalanches across large and remote areas, but detection results alone are not enough for routine use. Forecasters need to see when and where the satellite observed, inspect the evidence behind each candidate, compare it with familiar information and learn what it can and cannot tell them. Developers need feedback linked to a specific place, time and set of conditions. Within the SNÖFALL project, we are developing Lavinkartan as a shared tool for this exchange between product developers at NORCE and the Swedish avalanche forecasting service. Lavinkartan is a web-based visualisation and feedback tool built on NLive. An automated system compares repeated Sentinel-1 observations and publishes event candidates. Each candidate is shown in three-dimensional (3D) terrain with its source SAR image, familiar map layers, time controls and processing status. Users can share a view through a web link and assess a candidate in the same tool. During the 2025–2026 pilot, 6,781 event candidates were published within a 145,131 km2 monitoring domain. Two short examples show how the tool supported investigation and targeted field checks. They illustrate an emerging exchange between forecasters and developers: questions raised while using the tool could be shared, investigated and connected to field evidence. Initial feedback from the small pilot group indicated that Lavinkartan helped direct attention and provided a spatially broader view of possible activity, including beyond the forecast regions, while also identifying needs for clearer coverage information, better filtering and richer validation."],"kw":"avalanche forecasting, synthetic aperture radar, avalanche detection, visualisation","ty":"O","pp":265,"em":[],"r":3490,"pr":"Jakob Grahn"},"299":{"id":"299","t":"Data-Driven Prediction of Satellite-Observed Avalanche Activity from SNOWPACK Simulations","au":[{"n":"Jakob Grahn","raw":"Grahn, Jakob","p":true,"aff":""},{"n":"Filippo Maria Bianchi","raw":"Bianchi, Filippo Maria","p":false,"aff":""},{"n":"Bert Kruyt","raw":"Kruyt, Bert","p":false,"aff":""},{"n":"Karsten Müller","raw":"Müller, Karsten","p":false,"aff":""}],"ab":["Avalanche forecasting requires knowledge of the snowpack and recent avalanche activity, but both are difficult to keep track of across large mountain regions. Field observations are essential but often sparse, which limits regional monitoring and development of numerical or statistical prediction models. Synthetic ape
