<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISSW 2026 Whistler · Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --ink:#15232B; --muted:#5A6A72; --line:#D3DCE0;
  --accent:#D9531E; --accent-ink:#FFFFFF; --glacier:#1D6A74; --glacier-soft:#DCEBED;
  --panel:#9A6B12; --panel-soft:#F4E9D2; --poster:#4E5E9A; --poster-soft:#E3E6F2;
  --now:#D9531E;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D161B; --surface:#152229; --ink:#E4ECEF; --muted:#94A5AD; --line:#26363E;
    --accent:#FF7A45; --accent-ink:#1A0E08; --glacier:#6BBEC8; --glacier-soft:#16333A;
    --panel:#E0B458; --panel-soft:#3A2F1A; --poster:#A6B2E8; --poster-soft:#232A45; --now:#FF7A45;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D161B; --surface:#152229; --ink:#E4ECEF; --muted:#94A5AD; --line:#26363E;
  --accent:#FF7A45; --accent-ink:#1A0E08; --glacier:#6BBEC8; --glacier-soft:#16333A;
  --panel:#E0B458; --panel-soft:#3A2F1A; --poster:#A6B2E8; --poster-soft:#232A45; --now:#FF7A45;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--ui);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--glacier)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:720px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 16px 6px}
.brand h1{white-space:nowrap}.brand .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1{margin:0;font:700 22px/1 var(--cond);letter-spacing:.2px}
.brand .sub{font:500 13px/1 var(--ui);color:var(--muted)}
.days{display:flex;gap:6px;padding:6px 12px 10px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{text-decoration:none;color:var(--ink);flex:0 0 auto;min-width:54px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:center}
.day b{display:block;font:700 17px/1.1 var(--cond)}
.day span{font-size:12px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day[aria-pressed="true"] span{color:inherit;opacity:.75}
.day .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--now);margin-left:3px;vertical-align:middle}

main{padding:8px 12px 110px}

/* schedule */
.slot{display:grid;grid-template-columns:58px 1fr;gap:10px;margin:0 0 10px}
.time{font:600 17px/1.1 var(--cond);padding-top:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.time small{display:block;font:500 13px/1.2 var(--cond);color:var(--muted)}
.slot.minor .time{padding-top:6px;font-size:15px;color:var(--muted)}
.minor-card{padding:6px 0;color:var(--muted);font-size:14px;border-bottom:1px dashed var(--line)}
.cols{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card.now{border-color:var(--now);box-shadow:0 0 0 1px var(--now)}
.chead{padding:12px 14px 10px;border-left:4px solid var(--glacier)}
.chead.panel{border-left-color:var(--panel)}
.chead.posters{border-left-color:var(--poster)}
.kicker{font:600 13px/1.2 var(--ui);color:var(--glacier)}
.chead.panel .kicker{color:var(--panel)}
.chead.posters .kicker{color:var(--poster)}
.ctitle{margin:2px 0 2px;font:700 21px/1.15 var(--cond)}
.meta{font-size:13px;color:var(--muted)}
.nowtag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--now);color:var(--accent-ink);font:700 12px/1.5 var(--ui);vertical-align:2px}
.talks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.open{flex:1;display:grid;grid-template-columns:30px 1fr;gap:6px;text-align:left;padding:10px 4px 10px 12px;min-height:56px}
.open:active{background:var(--glacier-soft)}
.num{font:600 15px/1.35 var(--cond);color:var(--muted);font-variant-numeric:tabular-nums}
.who{display:block;font:600 14px/1.3 var(--ui)}
.what{display:block;font-size:14.5px;line-height:1.35;color:var(--ink);opacity:.86;margin-top:1px}
.star{flex:0 0 48px;display:grid;place-items:center;color:var(--muted)}
.star svg{width:22px;height:22px}
.star[aria-pressed="true"]{color:var(--accent)}
.star[aria-pressed="true"] svg path{fill:currentColor}
.note{padding:10px 14px;font-size:14px;color:var(--muted)}
.linkbtn{display:inline-flex;align-items:center;gap:6px;margin:0 14px 12px;padding:8px 12px;border-radius:10px;background:var(--poster-soft);color:var(--poster);font-weight:600;font-size:14px}
.dayoff{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px}
.dayoff h2{margin:0 0 4px;font:700 24px/1.1 var(--cond)}
.dayoff p{margin:0;color:var(--muted)}

/* posters */
.theme{margin:18px 2px 6px;font:700 18px/1.1 var(--cond);color:var(--poster);display:flex;justify-content:space-between;align-items:baseline}
.theme span{font:500 13px var(--ui);color:var(--muted)}
.intro{font-size:14px;color:var(--muted);margin:6px 2px 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--poster);color:var(--poster);background:var(--poster-soft);font-weight:600}

/* search */
.searchbox{position:relative;margin:4px 0 10px}
.searchbox input{width:100%;font:16px var(--ui);padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.hint{font-size:14px;color:var(--muted);margin:6px 2px}
.badge{display:inline-block;font:700 11px/1.6 var(--ui);padding:0 6px;border-radius:5px;margin-right:6px;vertical-align:1px}
.badge.O{background:var(--glacier-soft);color:var(--glacier)}
.badge.P{background:var(--poster-soft);color:var(--poster)}

/* plan */
.planday{margin:16px 2px 8px;font:700 22px/1.1 var(--cond)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:20px 16px;color:var(--muted)}
.empty b{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn svg{width:18px;height:18px}

/* detail */
.detail{background:var(--surface);min-height:100vh}
.dbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px;background:var(--surface);border-bottom:1px solid var(--line)}
.back{display:flex;align-items:center;gap:2px;padding:8px 10px 8px 4px;font:600 16px var(--ui);color:var(--glacier)}
.back svg{width:22px;height:22px}
.dstar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;border:1px solid var(--line);font-weight:600;font-size:14px}
.dstar svg{width:20px;height:20px}
.dstar[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dstar[aria-pressed="true"] svg path{fill:currentColor}
.dbody{padding:16px 18px 120px;max-width:680px;margin:0 auto}
.where{font:600 14px/1.35 var(--ui);color:var(--glacier)}
.where.P{color:var(--poster)}
.dtitle{font:700 27px/1.12 var(--cond);margin:6px 0 12px;letter-spacing:.1px}
.presenter{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.presenter .pname{font-weight:600}
.sect{font:700 15px/1 var(--cond);letter-spacing:.3px;color:var(--muted);margin:22px 0 8px}
.abstract p{font:17px/1.62 var(--serif);margin:0 0 14px;hyphens:auto;overflow-wrap:break-word}
.kw{font-size:14px;color:var(--muted)}
.authors{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.authors li{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;border-bottom:1px solid var(--line)}
.authors li:last-child{border-bottom:0}
.authors .an{flex:1;min-width:0}
.authors .an b{font-weight:600}
.authors .an small{display:block;color:var(--muted);font-size:12.5px}
.ib{flex:0 0 auto;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);color:var(--glacier);text-decoration:none}
.ib svg{width:19px;height:19px}
.paper{display:flex;gap:8px;flex-wrap:wrap}
.foot{font-size:12.5px;color:var(--muted);margin-top:26px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;text-decoration:none;color:var(--muted);font:600 12px var(--ui);position:relative}
.nav a svg{width:23px;height:23px}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.count{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:700 11px/18px var(--ui)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.toast.show{opacity:1}
.hidden{display:none!important}
@media (min-width:620px){ .cols.two{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const DATA = {"items":{"16":{"id":"16","t":"The Impact of the Heliskiing Industry and Its Contribution to Avalanche Research","au":[{"n":"Halsted “Hacksaw” Morris","raw":"Morris, Halsted “Hacksaw”","p":false,"aff":"Chief researcher for Heliskihistory.com, Avon CO, USA"}],"ab":["The early history of the heliskiing industry and its contribution to avalanche research."],"kw":"History of Heliskiing, Avalanche Research","ty":"P","pp":33,"em":[],"r":3493,"day":"Mon","th":"Avalanche Formation","pr":"Halsted “Hacksaw” Morris"},"17":{"id":"17","t":"Wildfire-Driven Increases in Avalanche Hazard: Mechanisms, Canadian Case Studies, and a Post-Wildfire Avalanche Risk Assessment Tool","au":[{"n":"Scott Thumlert","raw":"Thumlert, Scott","p":true,"aff":""},{"n":"Jillian Harvey","raw":"Harvey, Jillian","p":false,"aff":""},{"n":"Cam Campbell","raw":"Campbell, Cam","p":false,"aff":""},{"n":"Marie-Pierre Rogeau","raw":"Rogeau, Marie-Pierre","p":false,"aff":""},{"n":"Brian Gould","raw":"Gould, Brian","p":false,"aff":""}],"ab":["Wildfire-induced forest disturbance in snow-dominated mountain regions can significantly alter snowpack processes and increase avalanche hazard. The removal of forest canopy, wind shelter, and mechanical anchoring changes snow accumulation, distribution, and energy balance, promoting the development of persistent weak layers and increasing both the likelihood and size of snow avalanches. These effects can persist for years to decades, yet post-wildfire avalanche hazard is rarely considered in geohazard assessments, creating a critical gap in risk evaluation. This paper describes the physical mechanisms linking wildfire impacts to avalanche formation and dynamics drawing on recent research, field observations, and numerical modeling. Several post-wildfire avalanche hazard case studies from western Canada are presented, illustrating how burn severity, forest structure loss, and altered snow distribution patterns can increase both avalanche likelihood and magnitude. Building on these examples, we introduce a practical post-wildfire avalanche risk identification tool designed to integrate with existing geohazard assessment frameworks. This tool provides a structured method for identifying burn-related avalanche hazard, supporting more accurate risk increases, and decision-making. Addressing this gap will improve land-use planning, infrastructure protection, and operational safety in an era of increasing wildfire frequency, intensity and severity."],"kw":"post wildfire geohazard assessment, snow avalanche risk assessment, protective forest, burn severity, wildfire","ty":"P","pp":34,"em":[],"r":3502,"day":"Mon","th":"Planning and Engineering","pr":"Scott Thumlert"},"18":{"id":"18","t":"Temperature Inversions and Avalanche Character in the Central Wasatch: A Station Based Analysis","au":[{"n":"Haley Brenkmann","raw":"Brenkmann, Haley","p":false,"aff":""}],"ab":["Atmospheric temperature inversions form under clear, calm, high-pressure conditions and are shaped by both synoptic weather and local topography. We tested whether inversion strength relates to snowpack and avalanche conditions using 3,777 avalanche observations from Little and Big Cottonwood Canyons (1996–2025), alongside mountain temperature records from the Brighton SNOTEL station (8,790 ft; 2,679 m) and Snowbird SNOTEL station (9,170 ft; 2,795 m), and lowerelevation temperature observations from Hawthorne (4,285 ft; 1,306 m), Rose Park (4,249 ft; 1,295 m), and Salt Lake City International Airport (4,227 ft; 1,288 m). Together, these stations span approximately 4,900 ft (1,500 m) of elevation and allowed us to compare valley and mountain temperatures and characterize the strength and occurrence of temperature inversions across the Salt Lake Valley–Central Wasatch elevation gradient. Strong-inversion days had higher storm water equivalent, narrower avalanche crowns, and a different mix of avalanche problem types (p < 0.001 for all). PM2.5 concentrations were nearly twice as high on stronginversion days (16.8 vs. 8.8 µg/m³, p ≈ 2×10⁻⁴⁵), confirming the measure as a valid valley-scale signal. Strong inversions did not increase avalanche frequency: daily counts were actually lower (3.30 vs. 4.46, p = 0.0027). Persistent-weak-layer avalanches were not associated with stronger inversions on the day they occurred. However, the strongest inversion anomalies occurred approximately 2–3 weeks before these avalanches. This timing is consistent with inversions creating cold, stable conditions favorable for surface-hoar formation, followed by burial of that weak layer during subsequent snowfall and eventual avalanche release. Overall, these results suggest that temperature inversions are more closely associated with snowpack development and avalanche characteristics than with an immediate increase in avalanche activity. The delayed relationship between strong inversions and persistentweak-layer avalanches is particularly important, indicating that inversion periods may help identify atmospheric conditions favorable for weak-layer development weeks before avalanche release. Rather than serving as a direct predictor of avalanche frequency, inversion strength may therefore provide useful context for understanding how periods of cold, stable weather influence the evolution of persistent avalanche problems in the Central Wasatch."],"kw":"temperature inversion; avalanche; snowpack; Wasatch; SNOTEL; cold-air pooling","ty":"P","pp":35,"em":[],"r":3557,"day":"Tue","th":"Avalanche Forecasting","pr":"Haley Brenkmann"},"19":{"id":"19","t":"Building Trust in SNOWPACK Models: Evaluation Guidelines for Researchers and Forecasters","au":[{"n":"Simon Horton","raw":"Horton, Simon","p":true,"aff":""},{"n":"Florian Herla","raw":"Herla, Florian","p":false,"aff":""},{"n":"Alec van Herwijnen","raw":"van Herwijnen, Alec","p":false,"aff":""},{"n":"Francis Meloche","raw":"Meloche, Francis","p":false,"aff":""},{"n":"Travis J. Morrison","raw":"Morrison, Travis J.","p":false,"aff":""},{"n":"Louis Quéno","raw":"Quéno, Louis","p":false,"aff":""},{"n":"Vincent Vionnet","raw":"Vionnet, Vincent","p":false,"aff":""}],"ab":["Physically based snowpack models are increasingly integrated into operational avalanche hazard forecasting, yet fragmented evaluation practices reduce confidence in their outputs. Mismatched spatial and temporal scales, heterogeneous datasets, inconsistent terminology, and custom software pipelines limit reproducibility and prevent groups from transferring findings. To address these challenges, we introduce a structured evaluation framework for snowpack models in support of avalanche hazard forecasting. The framework organizes evaluation design across four core dimensions: Context (why and where an evaluation is done), Model (how the model chain is configured), Data (which observations are used), and Analysis (how model–data comparisons are performed). Applying this framework highlights the critical need to separate physical measurement agreement (Quality) from practical forecasting utility (Value). Effective evaluation requires assessing each stage of the model chain sequentially, aligning spatial and temporal scales, and reporting performance for specific scenarios rather than aggregate summaries. We translate these insights into actionable guidance for researchers, software developers, and forecasters to build trust and advance model-based decision support."],"kw":"snowpack model; model evaluation; avalanche forecasting; decision support","ty":"P","pp":36,"em":[],"r":3622,"day":"Thu","th":"Modelling and Quantitative Forecasting","pr":"Simon Horton"},"21":{"id":"21","t":"Managing Risk as a Roaming Ski Touring Guide","au":[{"n":"Alex Geary","raw":"Geary, Alex","p":true,"aff":""}],"ab":["I define a Roaming Ski Touring Guide (RSTG) as: “Guiding across multiple areas or continents within a season, for multiple operations and on private trips, in varying styles including lodge weeks, basecamps, town-based guiding and traverses”. There’s a lot going on when working as an RSTG: keeping on top of evolving snowpacks, glacier conditions, unfamiliar terrain, group dynamics, hut bookings, hotels, transport, food, nagging overuse injuries, replying to questions and bookings for upcoming trips, staying in touch with family, permits and paperwork, all of which burn energy. When I run out of capacity, I don't observe as well and I take shortcuts. I need enough capacity to make effective decisions, so maintaining it is an integral part of risk management. In Canada, many risk management strategies in guiding have been shaped by mechanized operations, where multiple guides work in familiar terrain. I’m often working in unfamiliar terrain without the support of a large team, so the same strategies don’t always work. I describe what I see as important differences for RSTGs compared with other common Canadian guiding contexts. I discuss how I have adapted some of these strategies, including when run lists are unhelpful or counterproductive, and what I do to protect my capacity and reduce the demands on it."],"kw":"capacity, decision making, human factors, run lists, ski guiding, InfoEx","ty":"O","pp":37,"em":[],"r":3479,"pr":"Alexander Geary"},"22":{"id":"22","t":"Interlinking Daily Assessments: Towards a More Comprehensive Workflow in Public Avalanche Forecasting","au":[{"n":"Norbert Lanzanasto","raw":"Lanzanasto, Norbert","p":true,"aff":""},{"n":"Matthias Walcher","raw":"Walcher, Matthias","p":false,"aff":""}],"ab":["Public avalanche warning services (AWS) assess avalanche hazard on a regional scale to support risk management for people, infrastructure, and property. While European standards such as the EAWS workflow and matrix have substantially improved consistency and communication of avalanche bulletins, they primarily support the communication step of forecasting rather than the un derlying hazard assessment. In practice, the assessment relies heavily on the forecaster’s continuous mental reconstruction of snowpack evolution throughout the winter, making it vulnerable to information loss, inconsistencies between forecasters, and limited traceability of decisions. During the 2025/26 winter season, an adapted 'hazard-source-first' workflow was operationalized for the first time by the Avalanche Warning Service Tirol. This paper documents the software architecture, the dynamic 'Deci sion Nodes' database, and discusses practical advantages (such as team handover efficiency), and the operational challenges of managing stratigraphic complexity and layer-coalescence metamorphism."],"kw":"Public avalanche forecasting, workflow, hazard assessment, operational learnings.","ty":"O","pp":38,"em":[],"r":3486,"pr":"Norbert Lanzanasto"},"23":{"id":"23","t":"Messaging for Mountaineers: New Zealand's Approach to Reducing Climber Avalanche Accidents in Spring and Summer","au":[{"n":"Penny Goddard","raw":"Goddard, Penny","p":true,"aff":""},{"n":"Bianca K. Bratton","raw":"Bratton, Bianca K.","p":false,"aff":""},{"n":"Nathan Watson","raw":"Watson, Nathan","p":false,"aff":""}],"ab":["Over the last 27 years, 70% of New Zealand’s fatal avalanche accidents involved mountaineers, and 76% of them occurred during spring and summer—an uncommon pattern internationally. These statistics have prompted industrywide innovation to address this concerning trend. We conducted a series of interviews with representatives of the New Zealand avalanche, guiding/instructing and mountaineering community to determine strategies used to reduce risk to alpine climbers. These include communicating avalanche hazards using specific language and imagery, engaging with the mountaineering community to encourage information sharing, adapting alpine guiding techniques and fostering avalanche training amongst non-skiing alpine instructors. We also discuss developments in alpine climber-focused avalanche safety training and education, differentiated from traditional winterbased and skier-centric training."],"kw":"Mountaineering, alpine climbing, summer, spring, avalanche, education.","ty":"P","pp":39,"em":[],"r":3631,"day":"Thu","th":"Ice and Alpine Climbing","pr":"Penny Goddard"},"24":{"id":"24","t":"Implementation of Snowpack and Machine Learning Models in an Operational Forecasting Workflow","au":[{"n":"Chad Brackelsberg","raw":"Brackelsberg, Chad","p":true,"aff":""},{"n":"Paige Pagnucco","raw":"Pagnucco, Paige","p":false,"aff":""},{"n":"Travis J. Morrison","raw":"Morrison, Travis J.","p":false,"aff":""}],"ab":["Snowpack modeling and machine-learning–based decision-support tools offer increasing potential for operational avalanche forecasting, yet their complexity can limit practical adoption in timeconstrained forecast environments. The Utah Avalanche Center (UAC) has integrated SNOWPACK, instability metrics, and danger-level models into its daily avalanche forecasting workflow using an operations-first development framework focused on usability and forecaster needs. The primary objective of this effort is to incorporate advanced model output into routine forecasting without overly increasing cognitive load or disrupting established workflows. System design was guided by four operational goals: improving forecasting efficiency, supporting forecast accuracy, providing clear and interpretable visualizations, and delivering information not readily available from field observations alone. To guide implementation, we identified more than 35 questions commonly considered by avalanche forecasters during daily forecast development, including assessment of snowpack structure, tracking temporal changes in instability, and identifying spatial trends across elevation and aspect. Model outputs and visualizations were explicitly designed to address these questions, allowing forecasters to quickly contextualize model information within their existing decision-making process. This questiondriven approach supported consistent interpretation and facilitated routine use during daily operations. At the UAC, SNOWPACK and machine-learning–derived models are not intended to replace field observations or professional judgment. Instead, they function as an additional decision-support layer to help forecasters synthesize complex information, recognize emerging patterns, and prioritize limited time and field resources. Particular emphasis has been placed on transparency, consistency, and building forecasters’ trust through iterative refinement and evaluation in operational settings."],"kw":"snowpack, machine learning, operational forecasting, workflow","ty":"P","pp":40,"em":[],"r":3568,"day":"Tue","th":"Avalanche Forecasting","pr":"Chad Brackelsberg"},"25":{"id":"25","t":"Avalanche Forecasting in the Pejo Ski Area: A Data-Driven Approach Using a Support Vector Machine","au":[{"n":"Christian Brida","raw":"Brida, Christian","p":true,"aff":""},{"n":"Carlo Bee","raw":"Bee, Carlo","p":false,"aff":""},{"n":"Giorgio Rosatti","raw":"Rosatti, Giorgio","p":false,"aff":""}],"ab":["Snow avalanches pose a major hazard in alpine ski areas, where reliable local forecasts are essential for operational decisions such as ski slope opening, avalanche control, and staff deployment. However, this kind of forecasting still relies heavily on expert judgment, making the integration of heterogeneous nivo-meteorological observations challenging and potentially subjective. This study presents an interpretable machine learning framework for supporting local avalanche forecasting in the Pejo ski area (Italian Alps), using a 45-year dataset of weather, snow, and avalanche observations. We developed a Support Vector Machine (SVM) classifier to discriminate between days with and without avalanches. The model was trained using historical nivo-meteorological predictors and avalanche records and then independently validated. The optimised model achieved good predictive performance (F1 = 0.83; ROC–AUC = 0.88) in distinguishing avalanche from non-avalanche days. Model interpretability was addressed using SHAP (SHapley Additive exPlanations), which identified cumulative snowfall, snow depth, temperature trends, and seasonal snowpack evolution as the dominant drivers of avalanche occurrence, consistent with established avalanche processes. To support operational forecasting, the model was integrated into a prototype Telegram-based decisionsupport system that automatically retrieves real-time observations, generates daily avalanche forecasts, provides SHAP-based explanations for individual predictions, and includes an experimental scenario-analysis module to evaluate alternative meteorological conditions. Operational deployment showed good agreement with field observations. The proposed approach combines predictive performance, physical interpretability, and operational integration, providing a transparent decision-support tool that complements expert judgment in local avalanche forecasting."],"kw":"Artificial Intelligence, Avalanche Forecasting, Decision Making, Quantitative Forecast- ing, Ski Resort Management, Local Forecasting.","ty":"P","pp":41,"em":[],"r":3513,"day":"Mon","th":"Artificial Intelligence","pr":"Christian Brida"},"26":{"id":"26","t":"An Applied Validation and Verification Framework for Computerassisted Public Avalanche Forecasting","au":[{"n":"McKinley Talty","raw":"Talty, McKinley","p":false,"aff":""},{"n":"Travis J. Morrison","raw":"Morrison, Travis J.","p":false,"aff":""},{"n":"Jack Eskeland","raw":"Eskeland, Jack","p":false,"aff":""}],"ab":["Computer-assisted avalanche forecasting models are increasingly used to support operational avalanche forecasting, yet robust and repeatable validation frameworks remain limited. This work presents a unified validation and verification system designed for operational public avalanche forecast teams to continuously validate snowpack structure, an instability model, and an avalanche danger rating model. We propose multiple verification use cases that serve as benchmarks for the validation system. Snowpack simulations are evaluated against manual snowpit observations using methods built upon dynamic time warping. Additionally, modeled temperature profiles are evaluated against measured temperatures observed throughout the snowpack. Modeled instability metrics and danger level forecasts were evaluated against backcountry observations, which were used to derive the Avalanche Activity Index (AAI) and human forecasted danger levels. AAI was calculated using the weighted sum of the frontal areas of reported avalanches. Results demonstrate that validating SNOWPACK against manual observations and measured snowpack temperatures leads to measurable comparisons in snowpack structure representation, while instability and danger level validation contextualize modeled outputs and foster a benchmark for performance. The proposed framework emphasizes relative performance, operational relevance, and repeatability rather than exact layer-by-layer model agreement, aligning model evaluation with the needs of practicing forecasters. This work provides a foundation for developing automated, scalable validation systems that support more reliable operational avalanche forecasting."],"kw":"Artificial intelligence, avalanche forecasting, modeling and quantitative forecasting, vali- dation and verification","ty":"P","pp":42,"em":[],"r":3579,"day":"Tue","th":"Artificial Intelligence","pr":"McKinley Talty"},"27":{"id":"27","t":"Avalanche Rescue VR: Immersive Virtual Reality Training for Companion Rescue","au":[{"n":"Norbert Lanzanasto","raw":"Lanzanasto, Norbert","p":true,"aff":""},{"n":"Christoph Sitar","raw":"Sitar, Christoph","p":false,"aff":""},{"n":"Anna-Lena Hetzenauer","raw":"Hetzenauer, Anna-Lena","p":false,"aff":""},{"n":"Christopher Marquardt","raw":"Marquardt, Christopher","p":false,"aff":""},{"n":"Paul Mair","raw":"Mair, Paul","p":false,"aff":""}],"ab":["Companion rescue remains the single most critical factor in surviving avalanche burials, where the first ten minutes offer a survival probability of approximately 90%. However, stress, panic, and lack of procedural practice often degrade real-world rescue performance. While physical field exercises are irreplaceable, they are logistically intensive, weather-dependent, and rarely repeated frequently enough by the general public. To bridge this training gap, the Avalanche Warning Service of the State of Tyrol, in cooperation with MEDIASQUAD and MC2ALPIN, developed 'Avalanche Rescue VR' (originally 'Notfall Lawine VR' in German), a free, highly immersive Virtual Reality application available in the Meta Store. This paper presents the pedagogical design, procedural workflow, and empirical findings from a database of 515 tracked sessions. The application guides users through a linear rescue sequence: from packing a virtual backpack at home, conducting a trailhead transceiver check, executing an emergency call, to performing signal, coarse, and fine search phases, culminating in probing and shoveling. Trainee performance was analyzed using three data streams: static session parameters, high-frequency spatial tracking, and event-based triggers. Results reveal common procedural omissions, such as 75% of trainees failing to check their mobile emergency app prior to departure, alongside highly successful procedural acquisitions, such as the systematic implementation of the 'airport approach' search technique (where transceiver height systematically reduces from 1.13 m to 0.80 m close to the victim). This study demonstrates that VR serves as a low-barrier, failure-tolerant complement to field exercises, reinforcing sequential memory, cognitive schemas, and stress-resilient action paths."],"kw":"Avalanche rescue, Virtual Reality, companion rescue, procedural training, user analytics.","ty":"P","pp":43,"em":[],"r":3524,"day":"Mon","th":"Avalanche Rescue","pr":"Norbert Lanzanasto"},"29":{"id":"29","t":"Improving Accessibility of Operational Avalanche Bulletins Through a Model Context Protocol (MCP) Server","au":[{"n":"Norbert Lanzanasto","raw":"Lanzanasto, Norbert","p":true,"aff":""},{"n":"Christoph Stanger","raw":"Stanger, Christoph","p":false,"aff":""},{"n":"Bengt Haunerland","raw":"Haunerland, Bengt","p":false,"aff":""},{"n":"Simon Legner","raw":"Legner, Simon","p":false,"aff":""}],"ab":["Timely access to official avalanche bulletins is critical for safe decision-making in avalanche terrain. While avalanche warning services publish structured and text-based bulletins, these formats are primarily optimized for direct human consumption. Large language model (LLM) based tools offer new opportunities to improve accessibility by enabling interactive, multilingual, and useradapted safety assessments. However, a key technical challenge is ensuring LLM responses are strictly grounded in real-time authoritative forecasts to prevent safety-critical hallucinations. To address this, we developed the Albina Model Context Protocol (MCP) server, which exposes published avalanche bulletins directly to LLMs as secure, machine-readable resources and tools. Built upon the Canadian Avalanche Association Markup Language (CAAML) standard, our server acts as a standardized middleware layer that retrieves the latest forecasts at query time. We propose a unified global aggregation model where a single centrally operated server aggregates CAAML-compliant feeds from multiple regional services. This model reduces technical friction for developers, minimizes operational costs for forecast organizations, and preserves strict authority control under the official warning services. Prototype integrations demonstrate that conversational assistants can reliably summarize hazard levels, resolve location queries, and retrieve operational blog posts while remaining strictly grounded in the official, currently active bulletin."],"kw":"Avalanche Bulletin, Model Context Protocol, Large Language Models, CAAML, Information Accessibility","ty":"P","pp":44,"em":[],"r":3535,"day":"Mon","th":"Artificial Intelligence","pr":"Norbert Lanzanasto"},"30":{"id":"30","t":"Cross Shaped PV-Structures in Avalanche Protection: First Field Experiences from SÖLDEN/Tyrol/Austria 2026","au":[{"n":"Alexander Ploner","raw":"Ploner, Alexander","p":true,"aff":""},{"n":"Thomas Sönser","raw":"Sönser, Thomas","p":false,"aff":""},{"n":"Florian Jamschek","raw":"Jamschek, Florian","p":false,"aff":""}],"ab":["The vertical tree-like structure is called HELIOPLANT® and the selected spacing ensure that the vertex effect interrupts the redistribution of stress in the snowpack so that avalanches are no longer possible. A mitigation field in an avalanche start area behaves like a secured high-altitude afforestation. The great advantage of this structure is that the cross shape of the wind field creates such turbulence even at low wind speeds that the system itself remains free of snow and a scour ring of transported snow forms at around m from the outer edge of the module. Considering high wind speeds and an allowance for the transported snow, this results in a design load of approx. 3 kN/m² (ÖNORM B 4801). The support structure consists of four frames, which are mounted on a post. Each element has a total of 15 bifacial PV modules, which are aligned vertically. The cross-shaped structure ensures almost continuous solar radiation. The distances between the individual elements are set between 9-14m depending on the exposure. Four IBO R38-500 nails or GEWI 40 are used to integrate the upright into the substrate. The snow reflection also ensures improved yields. One structure has a nominal output of approx. 8.3 kWp. Depending on the altitude, yields of up to 1.500 kWh/kW can be achieved. The chosen design allows the system to be adapted to the existing relief on the one hand by leaving out geologically and ecologically sensitive areas on the other. A 6.3MWp plant is currently being completed in Sölden, Austria, which is partly located in avalanchestarting zones. Under the scientific supervision of the Austrian Federal Forestry Office, the effects of the system on preventing avalanches are being documented and evaluated. Initial results will be presented."],"kw":"avalanche control; alpine PV-Structure “solarforest”; high level renewable energy pro- duction; low environmental impact.","ty":"P","pp":45,"em":[],"r":3546,"day":"Mon","th":"Planning and Engineering","pr":"Alexander Ploner"},"35":{"id":"35","t":"Intersectional Risk: An Expanded Definition of Risk for the Avalanche and Guiding Profession","au":[{"n":"Rachel D. Reimer","raw":"Reimer, Rachel D.","p":true,"aff":""}],"ab":["The Rise Study is a feminist appreciative Action Research project that utilized in-depth interviews amongst 17 mountain guides and avalanche professionals from Canada, the United States, France, and Switzerland. It sought to centre experiences of risk, inclusion and psychological safety among 2SLGBTQ+, women, BIPOC, or trauma-affected members of the profession. Study findings offer an expanded definition of psychological safety and psychological risk, and identify human-caused hazards in the profession. Two key conceptualizations of participants’ experiences as mountain guides and avalanche workers emerged from the analysis: intersectional risk, and the second shift of risk management. Intersectional risk challenges and expands on the traditional concept of risk, and is an interplay between mountain hazards and human-caused hazards, exposure and vulnerability. This paper focuses solely on the concept of intersectional risk, while other findings of the Rise Study are shared elsewhere. The interplay between psychological safety, risk, and physical safety provides a clear connection to culture change and safety outcomes in nature-facing, high-risk professions beyond the avalanche and mountain guiding profession. This paper points to intersectional risk provides as a more suitable framework for coping with emerging needs within the profession to address increasing risk complexity due to the cascading processes of climate change."],"kw":"Risk, psychological safety, human factors, intersectional feminism, climate change.","ty":"O","pp":46,"em":[],"r":3401,"pr":"Rachel Reimer"},"37":{"id":"37","t":"Fed-Up with Feedback: Why Feed-Forward Matters More in Wicked Learning Environments","au":[{"n":"Tim Dassler","raw":"Dassler, Tim","p":true,"aff":""},{"n":"Tove Dahl","raw":"Dahl, Tove","p":false,"aff":""}],"ab":["The concept of the \"wicked learning environment\" has gained significant traction in avalanche education, where the spatial variability of the snowpack, the rarity of fatal feedback, and the potential for misleading positive outcomes are cited as features that make the winter backcountry uniquely difficult for learning. This paper argues that while avalanche terrain undeniably sits at an extreme position on the wickedness spectrum, the underlying pedagogical problem it presents is not unique to the mountain environment. Drawing on educational psychology, situated learning theory, cognitive apprenticeship, and reflective practice, we argue that raw feedback, whether from a graded essay or an untracked snowfield, never guarantees learning on its own. Learning benefits from interpretive mediation: a teacher, guide, or mentor who can supply the framing, the vocabulary, and the debriefing structure that transforms experience into competence. Empirical avalanche education research suggests that current course structures, designed primarily for information transfer, may produce overconfidence without commensurate skill development, consistent with the outcome the cognitive apprenticeship literature predicts when guided reflection is absent. The implication is not merely diagnostic but actionable: the challenge of avalanche education is best understood not as a problem of environmental wickedness but as a problem of insufficient learning architecture and mentorship."],"kw":"","ty":"P","pp":47,"em":[],"r":3554,"day":"Mon","th":"Avalanche Education","pr":"Tim Dassler"},"38":{"id":"38","t":"Managing Surgical Risk Like a Mountain Guide","au":[{"n":"Alexander Miles","raw":"Miles, Alexander","p":false,"aff":""},{"n":"Tim Ricci","raw":"Ricci, Tim","p":false,"aff":""},{"n":"Geoff Osler","raw":"Osler, Geoff","p":false,"aff":""},{"n":"Jonathan S. White","raw":"White, Jonathan S.","p":false,"aff":""},{"n":"Simon R. Turner","raw":"Turner, Simon R.","p":true,"aff":""}],"ab":["While the professions of surgery and mountain guiding may seem quite different, there appear to be many similar challenges faced by both groups. Ultimately, both surgeons and mountain guides are tasked with the care of human lives in high-stakes environments. This responsibility takes different forms, but several parallels can be drawn between the training, certification and professional development of both surgeons and guides. Medicine has a long tradition of borrowing concepts and learning from such parallel professions. We studied Canadian mountain guides to determine how their practices and approaches could be adapted to support surgical education and to ultimately promote patient safety. Multiple parallels emerged, including the duration and intensity of training, apprenticeship model, challenges surrounding equity, diversity and inclusion and the high stakes nature of competence. The most salient element however, was the guides’ use of a highly structured, formalized approach to risk assessment and management that is lacking in surgery. By adapting these principles to the operating rooms, surgeons can improve how they think, talk and teach about risk and can provide safer operations for patients."],"kw":"risk, decision making, safety, education","ty":"O","pp":48,"em":[],"r":3421,"pr":"Simon Turner"},"39":{"id":"39","t":"Thin-Slicing in Avalanche Forecasting: Exploring the Role of Experience-Based Pattern Recognition in Operational Decision Making","au":[{"n":"Jake M. Hutchinson","raw":"Hutchinson, Jake M.","p":true,"aff":""}],"ab":["This exploratory survey began with a simple operational question: when avalanche professionals first build a hazard picture, does the initial forecast lean more on intuition or on structured analysis? The 166 respondents described a process in which early experience-based Recognition is common but rarely stands alone. Sixty-one percent reported forming an initial hazard assessment immediately or before completing full formal analysis, 76.5% recognized a likely hazard pattern immediately or early, and 81.3% said familiar snowpack or weather patterns frequently or almost always influenced early interpretation. At the same time, 62.7% rated a structured forecasting workflow as very important or essential, 62.7% described their overall style as balanced structured analysis plus experiential judgment, and 43.3% reported significantly revising or discarding an early interpretation when field evidence conflicted with it. Operational experience had only a weak positive association with Recognition, while professional-role, gender, and snow-climate differences were small or statistically uncertain. The survey did not measure forecast accuracy or test a training intervention, so it cannot establish that intuitive first reads are correct or that any specific training method improves them. It does, however, suggest a practical educational problem: if rapid recognition is already part of professional forecasting, training should make that process more visible, cue-based, falsifiable, and responsive to feedback. Rather than teaching professionals to “trust their gut,” advanced training can deliberately practice pattern discrimination, explicit first reads, contradiction testing, structured verification, revision, and reasoningfocused debriefs. The goal is not intuition instead of analysis. It is better recognition entering a stronger analytical process."],"kw":"","ty":"O","pp":49,"em":[],"r":3422,"pr":"Jake Hutchinson"},"40":{"id":"40","t":"Use of Hazard Rating Scales Within a Ski Area Operational Context","au":[{"n":"Wendolyn C. Antibus","raw":"Antibus, Wendolyn C.","p":false,"aff":""}],"ab":["Hazard rating scales are widely utilized in both public and operational forecasting contexts as a communication tool. While the output of the CMAH process may be linked to a hazard rating scale, this is not deterministic, leaving the final interpretation of hazard rating to the forecaster. While this allows for the possibility of utilizing a variety of hazard rating systems, it also creates the potential for inconsistency in interpretation and application. As the hazard rating may ultimately be utilized to determine operational parameters, it is important that ratings be applied consistently and accurately. Mt Rose Ski Tahoe utilizes a 5 level hazard rating scale within the InfoEx International product to describe avalanche hazard. A total of 6 seasons of operational forecasts were reviewed, including anticipated avalanche problems, size, likelihood, and the hazard rating for each day. Results indicated that the anticipated likelihood of avalanches was the primary factor in determining hazard rating, with avalanche size, problem type, and number of distinct problems being additional considerations. While the mean forecast avalanche size increased only slightly with each subsequent hazard rating level, likelihood consistently increased with higher hazard rating. The recorded avalanche size, trigger type, and relative frequency of observed activity for each hazard rating level in operational PM nowcasts was also evaluated. While the frequency of artificially triggered avalanches increased at higher hazard levels, the most substantial increases were found in the frequency of natural avalanches and avalanches size D2 or larger. Further review of the hazard comments and frequency of ‘unknown’ avalanche results suggests that data scarcity, uncertainty, and prolonged intense loading of the snowpack are additional factors causing forecasters to assign ‘high’ hazard ratings."],"kw":"Hazard Ratings, Operational Forecasting, Avalanche Hazard, InfoEx, Worker Safety","ty":"O","pp":50,"em":[],"r":3467,"pr":"Wendolyn Antibus"},"41":{"id":"41","t":"Design of Flexible Rockfall Barriers Under Static and Dynamic Areal Loading from Snow","au":[{"n":"Dennis Gasteiger","raw":"Gasteiger, Dennis","p":true,"aff":""},{"n":"Maximilian Kramer","raw":"Kramer, Maximilian","p":false,"aff":""}],"ab":["Flexible rockfall barriers are primarily designed to absorb high-energy point impacts caused by falling rocks. However, when installed in mountainous environments, they are exposed to a range of additional hazards that result in different loading conditions. Therefore, gravitational mass movements other than rockfall must be considered during the planning and design of such systems. The most critical dynamic loads arise from shallow landslides and avalanches. In addition, at higher altitudes and latitudes, static snow loading must also be considered. In contrast to rockfall impacts, these loads act over an area rather than at a single point, representing a fundamentally different loading scenario for which the systems are not originally designed. If these real loading conditions are not adequately considered, they may lead to damage of individual components or, in the worst case, complete failure of the barrier. The objective of this study was to develop a calculation method for flexible rockfall barriers that are subjected to static and dynamic areal loading. To achieve this, field measurements of static and dynamic snow loads on existing barriers were conducted. These data, combined with the mechanical properties of ring nets, the fundamentals of rope statics, and principles of snow and avalanche mechanics, form the basis for modelling areal loading scenarios on flexible structures. During field measurements, key parameters, including barrier deformation and the loading of individual components under static and dynamic areal loads, were recorded to calibrate and validate the developed calculation method. By validating the system behaviour of rockfall barriers under snow areal loading, this calculation method can also be extended to other types of areal loading, for example, for the analysis of shallow landslide events. The final calculation approach integrates Excel-based workflows with structural analysis in RSTAB and is fully parametric, enabling efficient adaptation to a wide range of environmental and loading conditions in practical applications."],"kw":"flexible rockfall barriers, snow loads, avalanche loads, rope statics, structural analysis, multi-hazard protection","ty":"P","pp":51,"em":[],"r":3555,"day":"Mon","th":"Planning and Engineering","pr":"Dennis Gasteiger"},"42":{"id":"42","t":"Evaluation of Falling Snow Density Parameterizations Against Real-Time Snow Density Measurements from a Differential Emissivity Imaging Disdrometer (DEID)","au":[{"n":"Travis J. Morrison","raw":"Morrison, Travis J.","p":true,"aff":""},{"n":"Bettina Richter","raw":"Richter, Bettina","p":false,"aff":""},{"n":"Benjamin H. Silberman","raw":"Silberman, Benjamin H.","p":false,"aff":""},{"n":"Dhiraj K. Singh","raw":"Singh, Dhiraj K.","p":false,"aff":""},{"n":"Eric R. Pardyjak","raw":"Pardyjak, Eric R.","p":false,"aff":""}],"ab":["Snow-cover models are becoming increasingly popular in the snow and hydrological communities and are highly sensitive to initial or falling snow density; small errors in falling snow density cascade through subsequent settling, metamorphism, and stability calculations. Existing parameterizations for falling snow density were largely developed from data collected in Alpine snowpacks, optimized for the temperature and wind regimes of the Alps, leaving their performance for snowpacks in the western United States unclear. Despite the dependence on falling snow density, no widely accepted automatic method exists for measuring real-time snow density before it undergoes settling and metamorphism on the ground. Therefore, parameterizations were developed to leverage existing and more common observations to model falling snow density from snow water equivalent or snow height. Traditional observations for validating these parameterizations have important limitations. Automated snow-depth and precipitation measurements are constrained by measurement accuracy, while snowboard measurements require frequent manual sampling during storm cycles to minimize the effects of settling. Even then, measured bulk density may already reflect some compaction, making continuous validation of falling-snow density at the time of deposition impractical at scale. The Differential Emissivity Imaging Disdrometer (DEID) provides real-time measurements of falling snow density, snow water equivalent, and snow height with high temporal resolution and accuracy, enabling direct, automated comparison between predicted and observed falling snow metrics at the time of deposition. This study compares commonly used falling snow density parameterizations against DEID observations collected during 16 storms at the Atwater Study Plot in Upper Little Cottonwood Canyon, Utah. Results reveal the limitations of the existing parameterizations and point toward potential improvements for snow density models."],"kw":"new-snow density, snow density parameterization, disdrometer, DEID, snow-cover mod- elling, Wasatch Mountains","ty":"P","pp":52,"em":[],"r":null,"day":"Fri","th":"Snowpack Properties","pr":"Travis J. Morrison"},"43":{"id":"43","t":"Learning from Avalanche Accidents: The Impact of the Wilson Glade Public Accident Debrief","au":[{"n":"Laura M.D. Maguire","raw":"Maguire, Laura M.D.","p":true,"aff":""},{"n":"Dave Richards","raw":"Richards, Dave","p":false,"aff":""},{"n":"Drew Hardesty","raw":"Hardesty, Drew","p":false,"aff":""},{"n":"Paige Pagnucco","raw":"Pagnucco, Paige","p":false,"aff":""},{"n":"Morgan E. Reynolds","raw":"Reynolds, Morgan E.","p":false,"aff":""}],"ab":["On February 6, 2021, two backcountry skiing groups totaling eight people converged in Wilson Glade in the central Wasatch Mountains of northern Utah. A large hard-slab avalanche captured seven skiers; despite extensive rescue efforts, four people were killed. After the accident report and public forum were released, we surveyed Utah Avalanche Center users to understand what readers remembered and whether the event influenced later behavior. The 2021 survey produced 334 responses; 200 agreed to follow-up, and 74 responded in 2026. This paper compares immediate and fiveyear follow-up responses to identify durable learning, recall gaps, and reported behavior changes connected to accident reporting. The findings suggest ways accident reports and related outreach can better support long-term learning and safer backcountry decision-making."],"kw":"Avalanche Accident, Education, Human Factors, Behavioral Change","ty":"O","pp":53,"em":[],"r":3446,"pr":"Dave Richards"},"45":{"id":"45","t":"The Human Factor: Everyone's Priority, Nobody's Curriculum. Insights from an ISSW 2024 Workshop","au":[{"n":"Richard Fjellaksel","raw":"Fjellaksel, Richard","p":false,"aff":""},{"n":"Tarjei Tveito Skille","raw":"Skille, Tarjei Tveito","p":false,"aff":""},{"n":"Tim Dassler","raw":"Dassler, Tim","p":true,"aff":""},{"n":"Audun Hetland","raw":"Hetland, Audun","p":false,"aff":""},{"n":"Ian McCammon","raw":"McCammon, Ian","p":false,"aff":""},{"n":"Tove Dahl","raw":"Dahl, Tove","p":false,"aff":""}],"ab":["Human factors are widely recognized as central to most avalanche accidents, and avalanche educators can access more content about them than ever before. Far less is known about how they are taught in avalanche courses and whether teaching them changes anything. How can we expect backcountry travelers to make better decisions if we cannot describe what a better decision might look like in practice? At ISSW 2024 in Tromsø, Norway, we ran a World Café workshop with 45 avalanche educators, mountain guides, researchers, program managers and rescue personnel working in nine different countries. Three questions structured the discussion: What works when teaching human factors? How do we know it works? What does not work? The level of agreement about methods for teaching was striking. Practitioners trained in different systems and reliance on different certifying bodies converged independently on the same experiential repertoire: engineered field experiences, storytelling, assigned roles, handing the decision to learners, and structured debriefing. Practitioners were equally consistent that presenting biases as a list in the classroom does not work. Regarding how they knew if any of their human factors teaching is effective, the same educators had almost nothing to say. The evidence available to them, such as learner reactions and the quality of a debrief, comes from the moment of instruction, not when the behavior they care about is relevant after the course, at other times on the mountain. We argue that this is not a missing assessment but a missing outcome. Companion rescue has a specified, observable competence, so it can be taught, practiced and certified. Human factors outcomes, where stated at all, are framed as awareness, and awareness is a mental state that cannot be observed. Actions can. We set out to understand what each of three constraints would require and offer illustrative learning outcomes expressed as observable actions. Each action is paired with evidence an instructor could gather during a course and evidence a learner could generate afterwards. With this, we hope to help put human factors back into the avalanche curriculum in a form that can benefit everyone. For human factors to not remain everyone's priority and nobody's curriculum, the first step is specifying what learners should be able to do."],"kw":"","ty":"O","pp":54,"em":[],"r":3402,"pr":"Tim Dassler"},"46":{"id":"46","t":"A Very Large Wet Slab Avalanche Surprised Us, Which Is Funny Because the Same Thing Happened 31 Years Earlier","au":[{"n":"Tully Hamer","raw":"Hamer, Tully","p":true,"aff":""},{"n":"Sean Fallon","raw":"Fallon, Sean","p":false,"aff":""},{"n":"Jeff Bristow","raw":"Bristow, Jeff","p":false,"aff":""},{"n":"Aleph Johnston-Bloom","raw":"Johnston-Bloom, Aleph","p":false,"aff":""}],"ab":["Wet slab avalanches at Alyeska Ski Resort in Girdwood, Alaska, have historically caused significant infrastructure damage and are among the most unpredictable. Our literature review, spanning decades of observation and research, illustrated that the avalanche industry has identified common ingredients of wet slab avalanches and emphasized that many of these ingredients may be present without an avalanche occurring. Reardon and Lundy’s 2004 wet slab conceptual model provided a helpful framework for analyzing these forecasting challenges. We present a case study of two very similar, significant wet slab avalanches at Alyeska, separated by 31 years. In April of 2024, a very large, unexpected wet slab (R4, D4) necessitated extensive terrain closures and operational impacts at Alyeska Resort. A snowcat grooming at night triggered the avalanche that started in closed, gated terrain and flowed across multiple groomed runs. Despite its magnitude, the avalanche caused no injuries or damage to infrastructure. Looking back to April of 1993, a nearly identical avalanche occurred. In an attempt to make sense of the 2024 event, we compared the snowpack and weather for the 1993 and 2024 avalanches. In addition, we applied the wet slab conceptual model as a valuable tool to qualify the wet slab hazard leading up to both the 1993 and 2024 avalanches. Finally, we discuss updating our team’s collective mental model for forecasting wet slabs. We gained a more nuanced understanding of monitoring a base area stream gauge and recognizing the presence of a hydraulic barrier within the snowpack. This analysis also highlighted a heuristic trap that we believe is unique to ski area avalanche mitigation. The recognition of which may help shift our hazard reduction mindset for the future. We hope our insights may be useful to practitioners who may be dealing with wet slab avalanches more frequently in a warming climate, or in another 31 years."],"kw":"Wet slabs, operational forecasting, crusts, mental models.","ty":"O","pp":55,"em":[],"r":3427,"pr":"Tully Hamer"},"53":{"id":"53","t":"Changing the Future: Electronic Initiation System (E*STAR) for Avalanche Explosives","au":[{"n":"Michael Blancher","raw":"Blancher, Michael","p":false,"aff":""},{"n":"Braden Schmidt","raw":"Schmidt, Braden","p":false,"aff":""},{"n":"Timothy Glassett","raw":"Glassett, Timothy","p":false,"aff":""}],"ab":["E*STAR is an electronic detonator system developed by Austin Powder Company that pairs a programmable microchip with dual capacitors to precisely initiate explosive charges within milliseconds. E*STAR detonators can be programmed to initiate 0-20,000 ms after multistep encrypted verification parameters are met between the blast logger and the Application Specific Integrated Circuit (ASIC) imbedded in the E*STAR detonator. Once activated, the ASIC timer counts down and electronically fires the detonator, eliminating the need for burning fuse or mechanical pull-wire igniters that are traditionally used in avalanche risk mitigation. Compared to conventional black powder fuse assemblies and pull-wire ignition systems, E*STAR eliminates uncertainty for ignition timing and improves operational margins of safety. Black powder fuse burn rates vary by brand, blast timing requirement, manufacturers, environmental conditions, and elevation above sea level. Pull-wire igniters use mechanical friction to initiate a fuse detonator assembly requiring vigilance to operate reliably in windy, wet, cold, alpine environments. The electronic E*STAR system eliminates blasting variables and improves initiation reliability. While adapted to be used in the Drone Amplified (DA) unmanned aerial system (UAS) MONTIS platform, the E*STAR system can also be adapted for other applications, offering the potential to improve explosive ignition systems currently in use for avalanche risk mitigation treatments, while improving margins of safety for avalanche technicians."],"kw":"avalanche risk mitigation, E*STAR, electronic detonator, safety fuse assembly, pull-wire ignitors, programmable delay, MONTIS","ty":"P","pp":56,"em":[],"r":3642,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Michael Blancher"},"54":{"id":"54","t":"Powerless: Anatomy of an Historic Storm Cycle","au":[{"n":"Robert Griffith","raw":"Griffith, Robert","p":true,"aff":""},{"n":"Mike Rheam","raw":"Rheam, Mike","p":false,"aff":""}],"ab":["The second-largest storm in the history of Jackson Hole Mountain Resort (JHMR) occurred in February 2017. Referred to as the \"Powerline Storm\", this 10-day storm cycle resulted in 2.3 m (92 in) of new snow and 30.2 cm (11.9 in) of snow water equivalent (SWE). On the sixth day of the storm, a low-elevation wind event led to 17 electrical transmission poles being blown over, shutting off all power to Teton Village and JHMR. This power outage lasted 4 days, during which time an atmospheric river delivered a non-stop moisture feed and a consequential warming trend. Local government declared a state of emergency and all highways in and out of the Jackson Hole valley were closed due to significant avalanche activity. For the Jackson Hole Ski Patrol (JHSP), mitigating hazards on the slopes of Rendezvous Mountain presented challenges which hadn’t been seen in decades. The power outage meant minimal access to weather stations, RACS support, and up-hill transport. This paper presents a summary of the event: a review of the early winter's snowpack before the storm, the events leading up to the power outage, and the decisionmaking that led the JHSP to cautiously perform avalanche mitigation and protect infrastructure throughout the storm. Significant avalanche events which occurred around the region will be discussed. Finally, this paper examines lessons learned from the storm to better prepare for unprecedented weather events and what other operations can learn from these experiences."],"kw":"incidents and case studies, operations and program management, ski area, storm cycle, atmospheric river","ty":"O","pp":57,"em":[],"r":3428,"pr":"Robert Griffith"},"55":{"id":"55","t":"Human Behaviour Abcs a New Approach to Teaching Recreational Backcountry Users","au":[{"n":"Mary Clayton","raw":"Clayton, Mary","p":true,"aff":""}],"ab":["Avalanche Canada’s recreational training program has long recognized the importance of teaching how human behaviours can affect sound decision-making in avalanche terrain. Much is owed to the work of Dr. Ian McCammon, who first introduced the concept of human factors and their effects on recreational avalanche accidents in the early 2000s (2002). Through this innovative work, McCammon developed a list of mental shortcuts known as FACETS. While FACETS served to highlight the effect of biases, its focus on negative outcomes, as well as the complexity of the acronym, were impediments to its effective implementation in recreational training. In 2018, Avalanche Canada published a student handbook for its introductory Avalanche Skills Training course (AST 1) in which we highlighted positive behaviours as well as negative. We explicitly chose to move away from using FACETS in this handbook but did not provide an easy method for instructors to teach these concepts of human behaviour. As a result, the acronym continued to appear in the instructor materials and some instructors continued to use it. In the fall of 2024, I developed the Human Behaviour ABCs: Attitude, Biases, Communication. This mnemonic comprises clear, easily understood language that points students toward an increased level of self-awareness while emphasizing the vital need for structured decision-making tools, such as the Avaluator. I also wanted to provide instructors with concepts that could be easily referred to and integrated throughout the course."],"kw":"Human behaviours, attitude, biases, communication","ty":"P","pp":58,"em":[],"r":3556,"day":"Mon","th":"Avalanche Education","pr":"Mary Clayton"},"56":{"id":"56","t":"The Operational Deviation Index: A Disclosure and Informed Refusal Protocol","au":[{"n":"Steven Andrews","raw":"Andrews, Steven","p":false,"aff":""}],"ab":["Following the 2003 season in Canada, sweeping reforms equipped recreational backcountry users with tools for better decision making. Commercial operations retain a model of institutionalized paternalism, in which operational plans may depart from the public forecast without the client's knowledge. This paper argues that the departure itself, not the hazard, is the unmeasured variable. The Operational Deviation Index detects three factors under which disclosure is owed: 1. Severity: any operating day at a danger rating of Considerable or above. 2. Direction: a plan departing from published advice, across four binary axes: travel and terrain advice, exposure to flagged problems, contradiction of explicit advisories, and timing relative to forecast trend. 3. Confidence: low published forecaster confidence, which fires independently of danger level and of departure. All three are read from published information, so the client can always verify whether disclosure was owed. Only the second varies between operations, and only the second is recorded as an index.The ODI is not a hazard assessment and claims no rival knowledge of conditions. The bulletin functions as a shared reference point, not a claim to truth. Human factors are excluded as triggers because they cannot be verified externally. Departure from the published forecast is the measurable trace they leave.The trigger activates a two-phase client protocol modeled on medical informed consent (Reibl v. Hughes; Hopp v. Lepp). The guide names the deviation aloud and presents their reasoning at full weight; each participant retains the right to refuse exposure to any named hazard and request more conservative terrain. Refusal runs one way only, toward the conservative. Disclosure operates as standing daily practice above threshold rather than an exceptional alarm, reframing the guide's role from gatekeeper to mentor.This paper makes no efficacy claim. Thresholds are provisional pending calibration; the framework's first empirical contribution is generating the base-rate record of operational deviation the field currently lacks. Recent fatal accidents during elevated public warnings illustrate the conditions the protocol is designed to surface."],"kw":"Guiding Operations, Informed Consent, Disclosure, CRM, Risk Communication","ty":"P","pp":59,"em":[],"r":null,"day":"Thu","th":"Risk Communication","pr":"Steven Andrews"},"57":{"id":"57","t":"Adoption of Avalanche Safety Behaviors in Motorized Users: A Precaution Model-Based Analysis","au":[{"n":"Kelly McNeil","raw":"McNeil, Kelly","p":true,"aff":""},{"n":"Ian McCammon","raw":"McCammon, Ian","p":false,"aff":""}],"ab":["Motorized winter recreation (snowmobiling and snowbiking) accounts for about a third of avalanche fatalities in the United States. Although avalanche safety education, outreach, and rescue equipment ownership have expanded over the past two decades, gaps remain in the adoption and application of safety practices. This study applied the Precaution Adoption Process Model (PAPM) to examine relationships among experience, avalanche education, confidence, and precautionary practices across three behavioral domains: avalanche education and adoption of rescue gear and airbag technology. A total of 1,200 survey responses were collected; 667 were considered valid after removing responses that were outside the scope of precaution adoption. Respondents were predominantly male (82%) and highly experienced, with most reporting more than 10 winters of backcountry riding and more than 20 days per season. Despite this experience, 67% reported no Level 1 or higher avalanche training. Respondents reported high confidence in their ability to manage avalanche risk, lead groups, and perform rescues regardless of training level. Notably, 31% of respondents without formal training reported high confidence in their ability to assist effectively in a rescue. Precautionary behaviors, however, were more strongly associated with training than experience or confidence. Level 1 respondents reported key practices, including forecast consultation, trailhead checks, group decision-making, and rescue practice, generally 10–20% more frequently than awareness-trained users. PAPM analysis revealed significant differences in adoption across behavioral domains. Rescue gear ownership (mean stage = 6.4) outpaced airbag use (5.9), avalanche education (5.8), and rescue practice (p < .001). Together, these findings suggest a mismatch between perceived preparedness and behaviors supporting effective avalanche risk management, with equipment adoption and confidence outpacing formal education and rescue practice. Improving avalanche safety among motorized users may therefore require shifting emphasis from equipment ownership and experience toward formal education, continued practice, and sustained application of safety behaviors. Stage-based interventions that address barriers specific to each behavior may help translate widespread equipment ownership and confidence into more effective avalanche risk management."],"kw":"Motorized recreation, rescue equipment, rescue errors, avalanche education","ty":"O","pp":60,"em":[],"r":3447,"pr":"Kelly McNeil"},"58":{"id":"58","t":"The Gear–Competence Gap in Motorized Avalanche Accidents: Trends in Equipment Use and Rescue Outcomes","au":[{"n":"Kelly McNeil","raw":"McNeil, Kelly","p":true,"aff":""},{"n":"Ian McCammon","raw":"McCammon, Ian","p":false,"aff":""}],"ab":["Over the past several decades, the presence of avalanche rescue equipment among motorized users has increased substantially alongside expanded avalanche safety messaging and education. However, it remains unclear whether increased equipment adoption has translated into improved rescue outcomes. This study examined 50 years of fatal avalanche accidents involving non-guided motorized recreational users in the United States to evaluate trends in rescue equipment use and the relationship between equipment presence, rescue performance, and survival. We analyzed 259 fatal accidents involving 466 people caught and 299 fatalities using four complementary approaches: trends in rescue equipment and trauma fatalities, survival outcomes in accidents involving two fully buried victims, recovery rates for single burials, and thematic analysis of companion rescue errors. Despite substantial increases in rescue equipment adoption, the three quantitative analyses showed limited evidence of corresponding improvements in survival outcomes. The proportion of deaths from trauma remained relatively stable despite greater equipment use, and two-burial accidents showed no significant survival difference between beacon-recoverable and non-beacon groups. In single-burial companion rescues, transceivers significantly improved recovery rates among minimally trained groups, although the improvement was modest; formally trained companions showed the highest observed recovery performance but were too few for statistical comparison. Thematic analysis provided a possible explanation for these findings, revealing recurring failures in transceiver operation, victim location, management of rogue signals and electromagnetic interference, probing and excavation, rescue leadership, and scene coordination. Together, these findings suggest a persistent gear–competence gap in motorized companion rescue: equipment ownership has increased faster than the practical skills needed to use it effectively under time-critical conditions. Future avalanche education should continue to promote complete rescue equipment while placing greater emphasis on repeated practice of the complete companion rescue system, including motorized-specific challenges, leadership, and realistic rescue scenarios."],"kw":"Motorized recreation, rescue equipment, rescue errors, avalanche education","ty":"P","pp":61,"em":[],"r":3590,"day":"Tue","th":"Snowmobiling and Motorized Access","pr":"Kelly McNeil"},"59":{"id":"59","t":"Grief as a Shared Human and Occupational Experience: Unlocking Insight into Human Factors","au":[{"n":"Brooke Edwards","raw":"Edwards, Brooke","p":true,"aff":""}],"ab":["Grief and loss are often hidden realities in snow science and mountain professions, yet acknowledging and processing these experiences can yield deep insights into human factors that shape decision-making, safety culture, and community resilience. The ski, snowboard, and avalanche mitigation industry — including researchers, forecasters, field workers, and operations professionals — faces a uniquely high rate of trauma and fatalities, and cultural norms often favor stoicism, dissociation, and rapid return to work. This paper examines how authentic engagement with grief can illuminate the human dimensions of loss that are frequently sidelined in technical disciplines. Through an in-depth case study and synthesis of lived experience with professional practice, we explore how confronting grief deepens understanding of risk perception, communication, and interpersonal dynamics in high-stress environments. By situating personal loss within the broader context of occupational risk and human performance, this paper fosters dialogue about mental health, community support, and the value of human connection in an industry that historically understates emotional impacts. Readers will gain insight into how openly addressing grief can strengthen empathy, enhance safety culture, and promote wellbeing across research and practitioner communities. Ultimately, this paper advocates for integrating human factors awareness — including grief and loss — into professional practice to build more compassionate, resilient mountain communities."],"kw":"Grief, Human Factors, Decision-Making, Loss, Mental Health, Resilience","ty":"P","pp":62,"em":[],"r":3601,"day":"Tue","th":"Mental Health and Wellness","pr":"Brooke Edwards"},"60":{"id":"60","t":"Assimilation of Human Judgment for Machine-Generated Avalanche Tendency Forecasts: Performance Gains and the Risk of Forecast Feedback Loops","au":[{"n":"Frank Techel","raw":"Techel, Frank","p":true,"aff":""},{"n":"Marc Ruesch","raw":"Ruesch, Marc","p":false,"aff":""},{"n":"Stephanie Mayer","raw":"Mayer, Stephanie","p":false,"aff":""}],"ab":["Swiss avalanche forecasters will soon issue map-based tendency forecasts two to three days ahead, a demanding and time-consuming task. We examine whether combining machine-generated forecasts with human judgments can provide such maps while retaining information about actual avalanche conditions. Using the Virtual Forecaster (VF) for the Swiss Alps in winter 2025/26, we compare the independent VF predictions (V Fabs) with a bulletin-assimilating blended forecast (V Fblended). We assess agreement with subsequent human forecasts but also skill against independent avalanche observations. Assimilation markedly improved agreement with the subsequently published bulletin: at +2 days, exact agreement increased from 39% to 54%, and agreement within one sub-level (e.g., 2+ vs. 3−) from 75% to 95%, approaching the corresponding human tendency forecast (70%, 98%). At +3 days, V Fblended performed best against the bulletin among the automated approaches. Importantly, these gains did not weaken the association with recorded dry-snow avalanche activity: discrimination and correlation were similar for V Fblended, V Fabs, and the operational +1-day bulletin. Persistence, carrying the published forecast unchanged, achieved strong bulletin agreement but showed a weaker association with avalanche activity, particularly at +3 days. Human–machine integration thus makes fully map-based tendency forecasts operationally feasible: blended forecasts provide reliable first drafts for +2 and +3 day tendency maps for the entire forecast domain. These gains can be exploited safely if three safeguards are maintained: retaining rigorous human assessments, ideally before model guidance is consulted, verifying against independent avalanche observations, and recording the provenance of model-influenced forecasts."],"kw":"Avalanche forecasting, feedback loops, artificial intelligence, decision-support systems","ty":"O","pp":63,"em":[],"r":3487,"pr":"Frank Techel"},"61":{"id":"61","t":"Advancements In Avalanche Mitigation and Monitoring – Mt. Superior, Utah","au":[{"n":"Théo St-Pierre Ostrander","raw":"Ostrander, Théo St-Pierre","p":true,"aff":""},{"n":"Steven Clark","raw":"Clark, Steven","p":false,"aff":""},{"n":"Laurie Delaney","raw":"Delaney, Laurie","p":false,"aff":""},{"n":"Maxence Carrel","raw":"Carrel, Maxence","p":false,"aff":""}],"ab":["Mt. Superior, situated within the Uinta-Wasatch-Cache National Forest in Utah, United States, generates avalanches that pose a significant hazard to sections of State Route 210 through Little Cottonwood Canyon. The proximity of Little Cottonwood Canyon to Salt Lake City facilitates extensive ski area and backcountry access, resulting in substantial vehicle traffic passing under Mt. Superior. Historically, Mt. Superior has posed operational challenges as significant seasonal snowfall combined with paths that reach the road each winter makes hazard management and mitigation a dynamic process. These combined factors have influenced the progression of the Utah Department of Transportation (UDOT) avalanche mitigation and monitoring plan, which incorporates a range of advanced technologies and systems. The primary focus of Mt. Superior mitigation measures is on destructive avalanches that may impact the roadway and infrastructure. However, these efforts do not address the full local avalanche hazard, and risk
