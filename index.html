 winter motorized backcountry guiding. The design process addressed four core questions: What competencies define a motorized guide? What performance standards should be applied? How will those competencies be evaluated? And how can industry-wide adoption be achieved? Existing certification models from the Association of Canadian Mountain Guides and Canadian Ski Guides Association provided a structural foundation. However, these frameworks are primarily oriented toward human-powered and mechanized (heli/snowcat) ski guiding. Motorized (snowmobile and snowbike) guiding presents distinct operational demands, including extensive terrain use across multiple drainages, variable aspects and elevations, and continuous machine-based mobility. These characteristics necessitate a discipline-specific competency and assessment framework. Twenty-five established guides were engaged in the development process and designated as the initial certification cohort. Embedding experienced practitioners in both the design and validation phases enhanced the credibility of the framework and reduced perceived evaluator bias, while also creating earlystage advocates within the industry. The establishment of a standardized certification system represents a shift toward the professionalization of motorized guiding. Although not mandated by regulation, certification provides a benchmark for competency, promotes consistency in risk management practices, and strengthens client trust. Over time, it is expected to function as a de facto industry standard, redefining expectations for professional practice."],"kw":"Backcountry Guiding, Snowmobiling, Risk Management","ty":"O","pp":368,"em":[],"r":3406,"pr":"Iain Stewart-Patterson"},"432":{"id":"432","t":"A Brief History of Avalanche Incidents in New Mexico","au":[{"n":"Jasper H. Thompson","raw":"Thompson, Jasper H.","p":true,"aff":""}],"ab":["When one thinks of New Mexico, avalanches may not come to mind. Nonetheless, avalanche incidents have occurred, and avalanche awareness has existed, in the state since at least the mid-20th century. The southern terminus of North America’s Rocky Mountains is the high-altitude, middle-latitude, continental Sangre de Cristo Range of New Mexico. These mountains are prone to persistent weak layers and strong year-to-year precipitation variability. Avalanche terrain can be found in the backcountry and in some of the ski areas. When snowy winters come, avalanche danger and risk exist. The Colorado Avalanche Information Center (CAIC) Accident Database lists six avalanche fatalities in New Mexico; four of which are stated as backcountry or sidecountry. Details of the backcountry and sidecountry fatalities, occurring from 1973 to 1996, are limited. This investigation recalls the stories of these accidents by way of archived newspaper articles and historic weather observations. Additional avalanche rescue training and close calls are also included. By recalling these past events we can maintain the knowledge base of avalanches in New Mexico so that current, and future recreationists and professionals can be more informed for their mountain endeavors and responsibilities."],"kw":"incidents, accidents, case studies, New Mexico, history, forecasting","ty":"P","pp":369,"em":[],"r":null,"day":"Fri","th":"Incidents and Case Studies","pr":"Jasper H. Thompson"},"433":{"id":"433","t":"The Stories Behind the Data: 30 Years of Snowpack Surveys on Niwot Ridge","au":[{"n":"Jennifer Frances Morse","raw":"Morse, Jennifer Frances","p":false,"aff":""}],"ab":["My work is a case study about the co-development of an academic field safety program with a high alpine fine-scale snow depth and snow profile record spanning 30 years in the Front Range of the Southern Rocky Mountains. The Niwot Ridge Long Term Ecological Research (LTER) Project maintains a long-term snow data set through a mid-May snow survey designed to capture peak snowpack. Up to 20 volunteers overnight at a high alpine laboratory (3,505 m) to access the otherwise restricted City of Boulder Watershed. Over three days they record ~ 500 snow depth points and six 2 m snow pit profiles across the upper Green Lakes Valley (3,567 m to 4,042 m). This record has been used to understand how snow redistributes across mountain terrain, develop an index of wind drifting and scouring, inform a model of wind slab release, validate satellite products, and track one of the leading abiotic drivers of a changing mountain watershed. I first joined the survey as a volunteer in 2007. By then, it had run for over a decade in remote, highelevation avalanche terrain, with no formal safety or avalanche protocols or training requirements. Coming from ski patrol, I found this alarming. After several years in academia, I learned it was unremarkable. Field safety provision was, and in places remains, uneven. Programs operating through polar or international logistics organizations had real requirements, while local fieldwork had whatever an individual investigator thought to provide. Field leaders in academia were trained as scientists, not practitioners, with few bridges between the two. Field safety was not taught, if it was addressed at all. Proposal budgets did not include funding for it. When I joined the program in 2010, I brought some knowledge of standard operational practices: protocols, training, and the habit of using close calls as data. Beyond bridging research and practice, this presentation describes the circular evolution between them. Field practice enabled the continuation and consistency of annual data collection in a remote, high-risk environment. The ongoing data collection improved the field practice through building years of experience from which to learn and improve. The results are an increasingly robust field safety program, enabling one of the longest fine-scale records of high alpine snowpack in the Rocky Mountains."],"kw":"academic field safety, long-term snowpack monitoring, near-miss reporting, alpine snow distribution, risk management, field research","ty":"P","pp":370,"em":[],"r":null,"day":"Fri","th":"Incidents and Case Studies","pr":"Jennifer Frances Morse"},"434":{"id":"434","t":"A Closer Look at Slope Angles of Accidentally Triggered Persistent and Deep Persistent Slab Avalanches","au":[{"n":"Roger Atkins","raw":"Atkins, Roger","p":true,"aff":""},{"n":"John Sykes","raw":"Sykes, John","p":false,"aff":""},{"n":"Nicholas Rigby","raw":"Rigby, Nicholas","p":false,"aff":""},{"n":"Pascal Haegeli","raw":"Haegeli, Pascal","p":false,"aff":""}],"ab":["Persistent slab avalanches remain a challenge for backcountry avalanche risk management. Of the 222 fatal avalanche accidents in Canada with known weak layer grain type information since the winter of 2000, 56% involved FC and 29% SH layers. The median weak layer ages of these avalanches were 33 days for FC and 14 days for SH layers. Building on existing research on typical slope angles of avalanche release, our analysis of several long-term datasets provides a new perspective into the evolution of persistent slab avalanche problems and where accidental avalanches are triggered. The identified patterns offer practical insight into the characteristics of hazardous terrain in the evolution of persistent slab avalanche problems. A better understanding of incident patterns related to persistent slab avalanche problems can help practitioners better understand how to avoid these challenges. The nature of very low angle avalanches and lingering deep persistent avalanches on moderate terrain as statistical outliers coupled with the possibility to have long years of experience without encountering them causes them to be disregarded in education and snow safety programs alike. In spite of their infrequent occurrence, these avalanches are responsible for some very high profile accidents that disproportionately impact the guiding profession and the guides involved. This study shows that lingering deep persistent avalanches tend to persist on large moderate angled slopes; they do not occur only in steep terrain. These avalanches will always pose a dilemma for risk management, but recognizing the conditions when they are more likely to occur and that they can occur on lower than expected slope angles allows us to make decisions on the basis of their possibility, not their probability."],"kw":"Avalanche risk management, Perception gap, Lingering instability, Low angle ava- lanches","ty":"O","pp":371,"em":[],"r":3426,"pr":"Roger Atkins"},"436":{"id":"436","t":"Understanding the Actionability of Future Snow Avalanche Hazard Maps in Alaska","au":[{"n":"Kristin M. F. Timm","raw":"Timm, Kristin M. F.","p":true,"aff":""},{"n":"Patrick O. Ansah","raw":"Ansah, Patrick O.","p":false,"aff":""},{"n":"Gabriel J. Wolken","raw":"Wolken, Gabriel J.","p":false,"aff":""},{"n":"Katreen W. Jones","raw":"Jones, Katreen W.","p":false,"aff":""}],"ab":["Climate change is altering snow and weather conditions in Alaska, creating new challenges for avalanche risk management. Researchers are developing future snow avalanche hazard maps to support planning under these changing conditions. This study examined how Alaska avalanche decision-makers use avalanche information and what makes future hazard maps actionable. We first conducted 18 semi-structured interviews with decision-makers working across avalanche forecasting, recreation, transportation, emergency management, utilities, municipalities, industry, homeowners, and other settings. Interview participants described using multiple information sources to understand avalanche conditions and make decisions. Future hazard maps were generally viewed as more useful for long-term planning than for day-to-day operations. The interview findings also informed a statewide survey completed by 198 avalanche decision-makers. In the survey, we examined actionability in terms of salience, credibility, and legitimacy and used latent profile analysis to identify segments of decision makers with unique perceptions of the anticipated actionability of hazard maps. The survey identified four actionability profiles among 188 respondents with complete data: Resistant (4.8%), Skeptical (16.0%), Receptive (66.5%), and Committed (12.8%). Respondents who perceived the maps as more salient, credible, and legitimate were generally more willing to use them. Profiles differed in how they viewed uncertainty. Respondents in the Committed profile, for example, were especially likely to view uncertainty as a normal part of avalanche science and to recognize multiple sources of uncertainty. Together, the findings show that future avalanche information must fit the decision context, connect with existing information practices, communicate uncertainty clearly, and address unique user needs to be more likely to be actionable."],"kw":"Snow avalanches; actionable science; hazard maps; decision-making; uncertainty; risk communication","ty":"P","pp":372,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"Kristin M. F. Timm"},"437":{"id":"437","t":"Being Difficult: Strategies for Encouraging Dissent from Colleagues and Staff in the A.M. Forecast Meeting","au":[{"n":"Jenna Malone","raw":"Malone, Jenna","p":true,"aff":""}],"ab":["Cognitive science and psychology have long explored how individuals can ignore or reinterpret crucial information to reinforce their existing beliefs. Research into confirmation bias shows that experts are more likely to adjust conflicting evidence to fit their views. Notable tragedies, including the Space Shuttle Challenger disaster, Everest fatalities in 1996, and numerous avalanche accidents reveal that survivors frequently regret not speaking up about leadership decisions (Higginbotham 2024, Kayes 2006). Amy Edmondson of Harvard Business School describes a widespread reluctance to speak up within organizations, calling it a “culture of silence.” Swiss researchers Bienefeld and Grote, in a 2012 Aviation Psychology and Applied Human Factors article, observed that despite decades of Crew Resource Management initiatives to improve communication and reduce errors, air crew members still hesitated to challenge established practices. Dissent, however, should be lauded in high stakes decision making. Colin Powell, former U.S. Secretary of State, famously encouraged junior officers to voice disagreements, asserting that agreeable advice is of little value. Following the Vietnam War, the U.S. State Department introduced a “Dissent Channel” to foster honest reporting from the field. In the 1600s, the Roman Catholic Church appointed a “Devil’s advocate” to scrutinize candidates for sainthood. Annie Duke, former poker champion and behavioral author, advises leaders to actively “farm” for dissent, create “truth-seeking groups,” and conduct premortems to reveal hidden risks. Challenging hierarchy strengthens teams’ capacity to be candid, even amid disagreement. While artificial intelligence increasingly contributes to avalanche forecasting, humans remain better at questioning assumptions and the status quo. A 2026 Stanford study in Science found that AI, particularly Large Language Models, affirmed users’ actions 49% more than humans—even when those actions involved criminal behavior. This project investigates how forecasters in Utah’s Central Wasatch Mountains in ski area, backcountry, highway, and helicopter ski guiding operations encourage dissent and skepticism among staff. Strategies include structured crowdsourcing at meetings, forecasters openly sharing uncertainty and intentionally demonstrating vulnerability. Ultimately, the ability to dissent may be the greatest asset humans bring to avalanche forecasting’s inherent uncertainty. This paper outlines some operational methods for cultivating workplace cultures that value critical thinking and healthy skepticism and explores the importance of disagreement."],"kw":"dissent, psychological safety, avalanche forecasting, decision-making, crew resource man- agement, groupthink","ty":"O","pp":373,"em":[],"r":3407,"pr":"Jenna Malone"},"438":{"id":"438","t":"What If We Are Wrong? Rethinking Avalanche Fatalities: Trauma, Burial Pressure, and the Limits of Hypoxia_focused Mitigation","au":[{"n":"Karsten Von Hoesslin","raw":"Von Hoesslin, Karsten","p":false,"aff":"Technical Rescue Instructor Trainer, Raven Rescue, Smithers, Canada"}],"ab":["Avalanche fatality research has traditionally identified asphyxia as the leading cause of death among fully buried victims, with trauma accounting for approximately one-quarter of fatalities. A frequently cited Canadian study of 204 avalanche deaths reported that 75% were attributed to asphyxia and 24% to trauma. These figures have subsequently been incorporated into wilderness medicine guidelines, avalanche education, and the rationale for technologies intended to prolong airway patency during burial. However, the underlying mortality data is more than a decade old, and substantial regional variation exists in the relationship between trauma, snow climate, burial conditions, and survival. This raises an important question: what if the prevailing interpretation of avalanche mortality is incomplete? Emerging research using special sensors on a girdle over a mannequin in simulated burials is examining partial pressures exerted by avalanche debris on the thoracic and pelvic regions. This is providing a different perspective on the mechanisms of death following burial. If avalanche debris can generate sufficient pressure to produce clinically significant blunt thoracic or pelvic trauma, some deaths currently conceptualized primarily through the lens of hypoxia may instead involve traumatic pneumothorax, internal haemorrhage, or other life-threatening injuries. This distinction is medically important because maintaining a patent airway cannot prevent death from injuries sustained during the avalanche or burial process. The possibility is especially relevant to maritime and transitional snow climates, where denser snowpacks and forested or irregular terrain have been associated with greater traumatic injury rates. This paper reviews the established evidence concerning avalanche mortality, snow climate, trauma, airway-preservation technologies, and blunt traumatic injury. It argues that avalanche safety education should continue to emphasize rapid rescue and airway management while simultaneously recognizing that avoidance and exposure-based terrain selection remain the most fundamental forms of trauma prevention. If ongoing pressure research confirms that burial forces can independently generate severe thoracic or pelvic injury, avalanche medicine and mitigation strategies may require a broader model of survivability, one that treats trauma prevention and asphyxia prevention as interconnected but distinct objectives."],"kw":"trauma, asphyxia, hypoxia, pneumothorax, pelvic fracture, haemorrhagic shock","ty":"P","pp":374,"em":[],"r":3548,"day":"Mon","th":"Avalanche Rescue","pr":"Karsten Von Hoesslin"},"442":{"id":"442","t":"Developing the National Avalanche Forecasting System for Finland Using IoT Weather Station Data and Snow Models","au":[{"n":"Tommi Laitervo","raw":"Laitervo, Tommi","p":true,"aff":""},{"n":"Kaisa Landon","raw":"Landon, Kaisa","p":false,"aff":""}],"ab":["This project aims to advance avalanche forecasting in Finland towards closer alignment with European Avalanche Warning Services (EAWS) standards. At present, forecast regions are large and observational data is sparse, reflecting the practical challenges of monitoring vast and remote fell areas. While avalanche terrain in Northern Finland is limited in scale and the risk to recreationists is generally low, improved forecasting would strengthen both safety communication and the scientific foundation underlying it. This pilot project develops a semiautomated avalanche forecasting system based on real-time IoT measurement data and snow modelling. In the project Snower IoT weather stations form an observation network across the fell areas of Northern Finland, and the continuous data they collect is integrated into the Finnish Meteorological Institute’s snow models. Model outputs are combined with regular manual snow profiles conducted by avalanche technicians, enabling risk assessment at finer spatial and temporal resolution than is currently possible. The project progresses in four phases between 2026 and 2030, expanding from a pilot in the Pyhä–Luosto area to ultimately cover the entire fell region of Lapland. The long-term goal is an operational forecasting system that progressively moves towards EAWS standards, supported by a citizen science observation application for backcountry users. Scientific outputs will include peerreviewed publications on snow model forecast accuracy and the optimal design of IoT observation networks in Arctic continental snowpack conditions."],"kw":"avalanche forecasting; IoT weather stations; snow modelling; SnowModel; SNOWPACK","ty":"P","pp":375,"em":[],"r":3616,"day":"Tue","th":"Avalanche Forecasting","pr":"Tommi Laitervo"},"443":{"id":"443","t":"The Avalanche Impact Scale: A Qualitative Framework for Forecasting and Recording Impacts on Infrastructure, Communities and Worksite Safety","au":[{"n":"Bree Stefanson","raw":"Stefanson, Bree","p":true,"aff":""},{"n":"Ryan Boyle","raw":"Boyle, Ryan","p":false,"aff":""}],"ab":["Effective risk management in avalanche-prone terrain requires a clear understanding of how avalanche activity interacts with specific elements at risk, such as worksites, infrastructure, and defence structures. This presentation introduces the Avalanche Impact Scale (AIS), a qualitative forecasting and recording tool designed to categorize potential and observed impacts on a six-level scale (0–5). The scale moves beyond traditional hazard ratings by directly linking avalanche impacts on operational outcomes and mitigation requirements. Levels range from Level 0 (No Risk), where activity is below the threshold for impact, to Level 5 (Historically Significant), representing catastrophic events that exceed engineered designs and require large-scale emergency responses like evacuations. Intermediate levels provide specific criteria for exposure controls and the impacts on avalanche defence structures. They also outline the implementation of safety measures such as training, Personal Protective Equipment (PPE), worksite signage, safe locations, closure points, and personnel sweeps. By utilizing this structured framework, avalanche practitioners can improve the consistency of risk communication, better manage vulnerability and exposure at worksites, and streamline the decisionmaking process for mitigation strategies. This presentation will detail the operational definitions of each level and discuss the practical application of the scale in protecting industrial and community assets. It is the opinion of the forecasting team in the Bear Pass Avalanche Program (BPAP) that forecasting for expected avalanche activity and recording avalanche occurrences based on this scale closes the forecasting feedback loop. This allows practitioners the ability to compare actual avalanche occurrences observed to their forecast and learn where they were correct or when it is time to reevaluate. Forecasting and recording this way can also help to train artificial intelligence, especially in programs that use automated devices such as avalanche radar detection. The BPAP has four seasons of forecasting and recording for each avalanche path utilizing the AIS with examples that can be used to showcase practical application of this scale."],"kw":"Forecasting, Recording, Communication, Risk, Management, Standardization","ty":"O","pp":376,"em":[],"r":3445,"pr":"Bree Stefanson"},"444":{"id":"444","t":"A Comprehensive Testing Toolkit for Avalanche Rescue Transceivers","au":[{"n":"Jakub Hornowski","raw":"Hornowski, Jakub","p":true,"aff":""},{"n":"Manuel Genswein","raw":"Genswein, Manuel","p":false,"aff":""}],"ab":["The goal of the MountainSafety.info Avalanche Rescue Transceiver Testing Toolkit is to provide to anyone with some technical background interested in performing an objective test of one or multiple avalanche rescue transceivers. Independently if you are an institution which needs to make a purchasing decision on a larger number of transceivers, an outdoor magazine which would like to provide to its readers a trustworthy comparative test of the devices currently on the market, or you are simply an interested individual, this toolkit will provide you with a comprehensive collection of tests. The toolkit was designed to reduce the overall testing time by cleverly combining a limited number of individual tests. The governmentally enforced European Standard EN ETS 300718 covers the fundamental safety requirements and ensures compatibility between all devices sold, independently of the brand and model. Certification to EN ETS 300718 includes complex, expensive testing of mechanical, electrical and electromagnetic properties, requiring very specialized, costly equipment and expertise. While EN ETS 300718 covers fundamental safety and compatibility requirements, the Avalanche Rescue Transceiver Testing Toolkit allows to determine what makes the difference between a “device compliant to the bare legal minimum” and an “effective search device with standardized key user interface functionality and design, providing a high level of compatibility to modern search protocols, and additional user safety provided by supplementary functions and criteria”. The toolkit includes a definition of the formal criteria of a clean testing environment followed by individual tests covering: (1) search strip width, (2) limitation of highest distance indication, (3) distance indication scale, (4) deep burials and 3d topography of the debris, (5) marking feature, (6) group check, (7) safety criteria for automatic revert to SEND features, (8) user guidance in specific search phases and (9) standardization of key terminology and symbols."],"kw":"avalanche rescue, transceiver testing, avalanche beacon, search strip width, group check, user interface","ty":"P","pp":377,"em":[],"r":3549,"day":"Mon","th":"Avalanche Rescue","pr":"Jakub Hornowski"},"445":{"id":"445","t":"Intermittent Ventilation During Excavation of a Buried Avalanche Patient - an Experimental Prospective Manikin Proof of Concept","au":[{"n":"Jakub Hornowski","raw":"Hornowski, Jakub","p":true,"aff":""},{"n":"Manuel Genswein","raw":"Genswein, Manuel","p":false,"aff":""},{"n":"Scott McIntosh","raw":"McIntosh, Scott","p":false,"aff":""},{"n":"Marcelo Parada","raw":"Parada, Marcelo","p":false,"aff":""},{"n":"Darryl Macias","raw":"Macias, Darryl","p":false,"aff":""},{"n":"Kyle McLaughlin","raw":"McLaughlin, Kyle","p":false,"aff":""},{"n":"Sven Christjar Skaiaa","raw":"Skaiaa, Sven Christjar","p":false,"aff":""},{"n":"Peter Paal","raw":"Paal, Peter","p":false,"aff":""}],"ab":["Complete burial in an avalanche leads to asphyxia-induced respiratory suppression and respiratory arrest. The timeline is influenced by the properties of the debris as well as the crystalline structure. Once respiratory arrest has occurred, hypoxia leads within minutes to severe, irreversible neurologic damage, followed by cardiac arrest due to absolute depletion of oxygen. Due to insulation of multi-layer clothing as well as the air content of the debris, the cooling rate of avalanche patients is, with very few exceptions (Pasquier et al., 2015; and Rauch et al., 2023), within a low 1°C to 3°C per hour (Brown et al., 2012; and Putzer et al. 2010). Therefore, the neuroprotective effect of hypothermia is in most cases too slow to prevent severe neurologic damage. In companion and fast organized rescue (i.e. ski patrol), reaching the head of the patient within 5 to 15min of burial duration is realistic. While many patients will already suffer severe, non-self-recoverable respiratory suppression or respiratory arrest, the majority will not have suffered cardiac arrest yet. Without rescue breaths, these patients are very likely to progress towards a further depletion of oxygen, neurologic damage and cardiac arrest. AvaLife sets as first priority a good neurologic outcome for the patient by reversing the respiratory problem with immediate first responder rescue breaths. The most likely position of the patient will be prone. Initiating rescue breaths in this position while the pelvis and lower extremities may still be firmly packed in the snow is extremely challenging. Completely freeing the entire patient takes at least 5 to 10 min. We developed a protocol which brings the airway in a position compatible with rescue breaths. Further, rescue breaths are performed continuously (when space and resources allow for it), or intermittently (intermittent ventilation, iVent). These strategies allow one rescuer to eventually completely free the patient while giving sequences of five rescue breaths every ~30 seconds. CPR for avalanche patients in hypoxic cardiac arrest remains important but second priority. Following AvaLife’s Greatest Good for the Greatest Number strategy, CPR duration is limited to 6 min in case of multiple burials/patients and shortage of resources."],"kw":"avalanche rescue; asphyxia; respiratory arrest; rescue breathing; intermittent ventilation; iVent; companion rescue.","ty":"P","pp":378,"em":[],"r":3550,"day":"Mon","th":"Avalanche Education","pr":"Jakub Hornowski"},"446":{"id":"446","t":"Do Infrasound Arrays Have an Accent? Validating Avalanche Detection Across Sites and Winters","au":[{"n":"Leslie King","raw":"King, Leslie","p":true,"aff":""},{"n":"Scott Havens","raw":"Havens, Scott","p":false,"aff":""}],"ab":["Infrasound arrays may be used to monitor avalanches and other natural hazards, and machine learning classifiers can be used to discriminate event signals from other sources. Johnson et al. (ISSW 2024) showed that a classifier trained on one day of data from a station in Little Cottonwood Canyon could identify avalanches at a second station in the same canyon using waveform features alone. As these systems move toward deployment across new stations, seasons, and snow climates, we ask the degree to which we may trust them in deployment. Machine learning models are often opaque and strong aggregate metrics do not guarantee reliable behavior in the field. In this research we develop a cross-station, multi-season validation framework and test it across six deployment clusters in California, Colorado, Utah, Alaska, and New Zealand. A histogram gradient-boosted classifier reached avalanche window F1 = 0.942 in an 8-class model. A separate probe identified the receiving array from recordings of the same event heard on multiple arrays with balanced accuracy 0.565, compared with 0.333 by chance. Although array geometry features carried stronger station signature, they performed better than content features at two of three held-out sites. Thus, features with measurable station encoding (or “accent”) did not always hurt performance at new sites. Replay on continuous data also showed that high event scores did not automatically become alarms under a given alert policy. The results support local calibration before deployment."],"kw":"avalanche detection; infrasound; machine learning; sensor arrays; model transfer","ty":"P","pp":379,"em":[],"r":3551,"day":"Mon","th":"Artificial Intelligence","pr":"Leslie King"},"448":{"id":"448","t":"Beyond Infrastructure: An Off-Grid, Trailer-Based Avalanche Radar for Remote Forecasting and Operational Decision Support","au":[{"n":"Susanne Wahlen","raw":"Wahlen, Susanne","p":true,"aff":""},{"n":"Severin Staehly","raw":"Staehly, Severin","p":false,"aff":""},{"n":"Lorenz Meier","raw":"Meier, Lorenz","p":false,"aff":""}],"ab":["Automated avalanche detection provides continuous information on avalanche activity independently of daylight and visibility conditions, and is particularly valuable at remote sites where field observations are limited. Such sites frequently lack power and communication infrastructure, and permanent radar installations are further constrained by land ownership, permitting requirements and the civil works needed for construction. A fixed installation is also restricted to a single location, although monitoring priorities may change within a season and the same Doppler radar is able to detect rockfall and debris flows as well as avalanches. This paper presents a trailer-based, off-grid Doppler radar system developed to address these constraints. The radar operates between 9 and 11 GHz and is mounted on an 11.6 m telescopic mast integrated into a commercially available off-grid power trailer. Power is supplied by a hybrid system combining a solar array, two methanol fuel cells and batteries, dimensioned for unattended operation over at least one year at high-latitude sites. Data are transmitted over cellular or satellite communication, and all project settings, detection parameters and monitoring zones are configured remotely, so that installation can be carried out by the operator without specialist support on site. The system was commissioned in February 2026 at a remote site in Canada without grid power or existing communication infrastructure, monitoring five avalanche paths above a road corridor. Between February and May 2026 it detected more than 1100 avalanche events, of which fewer than five were classified as false detections, and it remained continuously online throughout the period. After the avalanche season the operator relocated the trailer to a rockfall site and aligned the radar without support from the manufacturer; the system was operational again within a few hours. The deployment shows that operational radar monitoring can be established at sites without permanent infrastructure, and that mobility allows the same equipment to be used for different hazards throughout the year."],"kw":"avalanche detection, Doppler radar, automated monitoring, off-grid power supply, mobile monitoring, road safety","ty":"P","pp":380,"em":[],"r":null,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Susanne Wahlen"},"449":{"id":"449","t":"Improving Worker Safety and Access Timing with Avalanche Radar in a Complex Ski Resort: Crans-Montana-Aminona, Switzerland","au":[{"n":"Fabrice Meyer","raw":"Meyer, Fabrice","p":false,"aff":""},{"n":"Severin Stähly","raw":"Stähly, Severin","p":true,"aff":""},{"n":"Susanne Wahlen","raw":"Wahlen, Susanne","p":false,"aff":""}],"ab":["The Crans-Montana-Aminona (CMA) ski resort lies on the southern side of the Alpine main ridge in Valais, Switzerland, on predominantly south-facing terrain strongly influenced by solar radiation, while storms from the west and northwest can rapidly deposit large amounts of snow. The resort's three interconnected sectors are affected by recurring avalanche problems from early winter through spring, managed with hand charges, helicopter-deployed explosives, tramway charge-delivery systems, and fixed remote avalanche control installations (RACS). The eastern sector has no direct lift access from the valley and is reached only via a cat road from the central sector that passes beneath several avalanche-prone slopes; following heavy snowfall, patrollers have had to remain on-site overnight or delay access until control work in the central sector secured the route. To improve worker safety and operational efficiency, the resort deployed a Gravimon Doppler radar system in February 2026 to monitor the start zones above this access corridor. Installed on an existing lift station, the radar covers more than a dozen start zones at distances of 1 to 2.5 km, operates continuously and independent of visibility, and automatically maps detected events to a user interface with synchronized camera imagery for visual verification and post-event review. Deployment occurred just before a two-week storm cycle that brought more than 270 cm of new snow at 2400 m elevation; over the 2025/26 season the system recorded 104 avalanches between February 10 and April 1. 26 of them released naturally and 78 triggered by control work, with event durations ranging from 13 to 166 seconds. Operationally, the radar proved particularly valuable during nighttime tramway and RACS control work, when visibility is often limited: real-time confirmation of slope response gives patrollers greater confidence in determining when the access road can safely be opened, enabling earlier and more informed deployment of teams to the eastern sector. This case demonstrates how targeted radar monitoring can support safer operations and more efficient access management in complex ski resort terrain."],"kw":"avalanche radar, Doppler detection, remote avalanche control, worker safety, ski resort access management","ty":"O","pp":381,"em":[],"r":3471,"pr":"Susanne Wahlen"},"450":{"id":"450","t":"All-Weather Avalanche Monitoring: Rapid Radar Deployment Supporting Decision Making in Juneau","au":[{"n":"John Bressette","raw":"Bressette, John","p":false,"aff":""},{"n":"Pat Dryer","raw":"Dryer, Pat","p":false,"aff":""},{"n":"Michael Janes","raw":"Janes, Michael","p":false,"aff":""},{"n":"Severin Stähly","raw":"Stähly, Severin","p":true,"aff":""},{"n":"Susanne Wahlen","raw":"Wahlen, Susanne","p":false,"aff":""}],"ab":["The city center of Juneau, Alaska, lies between the sea and steep mountain terrain, with several neighborhoods located in avalanche runout zones. During the December 2025–January 2026 winter storm, record snowfall combined with sustained cold temperatures created extreme avalanche hazard conditions across coastal South Alaska. The City and Borough of Juneau issued evacuation advisories for exposed neighborhoods, while continued snow- and rainfall further increased the hazard. A State Disaster Declaration enabled rapid access to state and federal support. As part of the emergency response, a Doppler radar system for real-time avalanche detection was procured, delivered, and installed within 48 hours. Positioned across the fjord, the system monitors multiple avalanche paths at distances of up to 3 km. The radar operates continuously, independent of visibility conditions, providing reliable detection during storms, snowfall, darkness, and low cloud cover — periods when conventional observations are severely limited or not possible. The system automatically detects avalanche events and provides real-time alerts, including location and event metadata, via a user interface accessible to avalanche professionals and emergency managers. Each detection is synchronized with video from an integrated camera, allowing users to review events and validate radar signals when visibility permits. This combination of continuous detection and visual confirmation supports both immediate situational awareness and retrospective analysis. Operationally, the radar proved particularly valuable during periods of no visibility, enabling practitioners to track avalanche activity in real time and adjust hazard assessments accordingly. This improved confidence in decision-making related to evacuations, road safety, and public communication. The system also provided insight into avalanche frequency, timing, and spatial distribution across monitored paths."],"kw":"avalanche radar, Doppler detection, urban avalanche hazard, evacuation decision-mak- ing, Juneau, Alaska","ty":"P","pp":382,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"Severin Stähly"},"452":{"id":"452","t":"The Challenges of Managing Glaciated Avalanche Terrain at a Ski Area: Lessons from Blackcomb Mountain","au":[{"n":"Nicole Koshure","raw":"Koshure, Nicole","p":true,"aff":""},{"n":"Brian Gould","raw":"Gould, Brian","p":false,"aff":""},{"n":"Cam Campbell","raw":"Campbell, Cam","p":false,"aff":""},{"n":"Alexis Tessier","raw":"Tessier, Alexis","p":false,"aff":""}],"ab":["Whistler Blackcomb (WB), the largest ski resort in North America, contains glaciated avalanche terrain, including the Horstman and Blackcomb Glaciers. Recent recession of the Horstman Glacier has significantly altered avalanche terrain within the resort boundary. Since 2008, the glacier has lost more than 50% of its surface area and its toe has receded over 265 m. LiDAR-derived digital elevation models from 2019–2024 show substantial ice loss, with thinning exceeding 15 m in the lower basin. A further 6 m of ice loss was recorded between 2024 and 2025, with 2026 measurements indicating continued reduction. These rapid changes have altered historical avalanche behaviour and increased operational uncertainty. Impacts include steepening and fragmentation of start zones, reduced skier compaction in steep/extreme terrain with potential for harboring persistent weak layers, development of new start zones terminating in terrain traps, shifting technician safe zones, altered snow-loading patterns, increased avalanche activity along key control routes as measured by the Avalanche Activity Index (AAI), and reduced reliability of historical terrain knowledge. A case study using 2019 and 2024 LiDAR data examines how changing terrain affects avalanche runout potential. Results highlight the need for annual terrain mapping, re-evaluation of infrastructure exposure, and increasingly conservative operational decision-making to address technician exposure and terrain familiarity bias. Future work should include continued LiDAR acquisition, ground penetrating radar (GPR) surveys to estimate remaining ice volume and subglacial topography, expanded avalanche runout modelling on the Horstman Glacier, and the investigation of similar glacial down wasting and its impacts on the Blackcomb Glacier."],"kw":"glacial recession, climate change, avalanche terrain, avalanche hazard, risk manage- ment, remote sensing, adaptive risk management","ty":"O","pp":383,"em":[],"r":3472,"pr":"Nicole Koshure"},"453":{"id":"453","t":"Investigating Systems, Not People: Learning from Incidents in Mountain Safety Professions","au":[{"n":"Laura M.D. Maguire","raw":"Maguire, Laura M.D.","p":true,"aff":""},{"n":"Steve Conger","raw":"Conger, Steve","p":false,"aff":""},{"n":"Morgan E. Reynolds","raw":"Reynolds, Morgan E.","p":false,"aff":""}],"ab":["Over the last twenty years, several innovative new incident investigation methods have been developed to assist organizations with taking a systemic view into contributing factors to accidents. These vary in practicality for mountain safety environments where techniques need to be: relatively easy to learn, efficient, and produce meaningful insights that can improve safety performance. This paper reviews the need for systemic accident investigation methods for avalanche involvements, provides a brief overview analyzing the existing methods, outlines a case study of translating and applying a method used in another domain, and offers recommendations for future research and development in this area."],"kw":"learning from incidents, accidents, investigations, organizational learning, skills develop- ment.","ty":"O","pp":384,"em":[],"r":3440,"pr":"Laura Maguire"},"454":{"id":"454","t":"Avalanche Risk Management at Whistler Mountain Utilizing Strategic Mindset and De-Biasing Strategies","au":[{"n":"Timothy R. Haggerty","raw":"Haggerty, Timothy R.","p":true,"aff":""},{"n":"Darren Saul","raw":"Saul, Darren","p":false,"aff":""},{"n":"Nicole Koshure","raw":"Koshure, Nicole","p":false,"aff":""}],"ab":["With over two million annual skier visits, and an operational season that runs from November to May and switches to an industrial forecasting program in the off-season; Whistler Mountain has one of the largest ski resort avalanche risk management and mitigation programs in North America. High level expectations of avalanche safety within the ski resort while operating in constantly changing complex alpine terrain due to glacial recession and subsequent large rockfalls has created a new operational challenge, due to the reduced relevance of historical avalanche observations. This coupled with the increased frequency of extreme weather events producing large storm cycles with heavy precipitation, fluctuating freezing levels, and strong-to-extreme winds, adds to the creation of persistent weak layers (PWL), often resulting in large avalanches within the ski resort. Further to changing terrain and weather patterns, large turnover in operational staff has created constraints on the program and has influenced timely lift access, the availability of avalanche mitigation resources and influenced avalanche technician experience. As a result, the program has had to significantly adapt to continue to provide safety for staff and guests while maximizing operational efficiencies. Despite these challenges, risk management strategies at Whistler Mountain are constantly evolving, and the program continues to adapt to this dynamic environment through changes in policies and procedures. This paper aims to illustrate one such adaptation, the inclusion of the strategic mindset in daily forecasts which uses inflection points to help de-bias this large avalanche program. This coupled with a daily reflection and debriefing process has helped to improve communication, strengthen mentorship, and create consistency within our large and ever-changing program."],"kw":"Ski resort avalanche forecasting, risk management, strategic mindset, de-biasing, reflection, mentorship","ty":"P","pp":385,"em":[],"r":3617,"day":"Tue","th":"Operations and Program Management","pr":"Timothy R. Haggerty"},"457":{"id":"457","t":"Students’ Reflective Experiences and the Development of a Straegic Mindset for Decisions in Avalance Terrain","au":[{"n":"Linda Hallandvik","raw":"Hallandvik, Linda","p":true,"aff":""},{"n":"Odd L. Vikene","raw":"Vikene, Odd L.","p":false,"aff":""}],"ab":["Travel in avalanche terrain requires more than technical knowledge of snow, weather, and terrain. Research has repeatedly shown that human factors and decision-making processes play a central role in avalanche accidents. However, these aspects remain difficult to teach and learn, particularly in educational settings where serious consequences cannot be used as direct learning experiences. This paper presents a practical teaching model developed and implemented in a university level avalanche course in Norway. The educational design combines short theory sessions, field-based learning experiences, transparent guiding, and structured reflection. Drawing on Dewey's theory of experiential learning and contemporary avalanche decision-making literature, the model aims to support the development of a strategic mindset among students. The course was conducted over a four month period and involved repeated cycles of preparation, field observations, decision-making exercises, and reflective discussions. Student experiences indicate that the approach helped them move from passive participants to active contributors in group decision-making processes. Transparent guiding, explicit attention to avalanche problems, and post-tour reflection appeared particularly important in helping students recognize uncertainty, articulate observations, and balance personal goals against objective risk assessments. The paper argues that avalanche competence should be understood as a reflective and collective practice rather than simply the acquisition of technical knowledge. Practical implications are provided for avalanche educators seeking to strengthen decision-making skills and communication within educational programs."],"kw":"Decision-making, avalanche education, transparent guiding, strategic mindset, experiential learning.","ty":"P","pp":386,"em":[],"r":null,"day":"Fri","th":"Decision Making","pr":"Linda Hallandvik"},"459":{"id":"459","t":"Precision in the Air: Engineering Reliability and Accuracy of sUAS-Delivered Air Blasts","au":[{"n":"Ralph Blumberg","raw":"Blumberg, Ralph","p":true,"aff":""},{"n":"Joseph Albanese","raw":"Albanese, Joseph","p":false,"aff":""},{"n":"Braden Schmidt","raw":"Schmidt, Braden","p":false,"aff":""},{"n":"Carrick Detweiler","raw":"Detweiler, Carrick","p":false,"aff":""},{"n":"Dan Justa","raw":"Justa, Dan","p":false,"aff":""},{"n":"Max Tubman","raw":"Tubman, Max","p":false,"aff":""}],"ab":["Successful avalanche mitigation relies on the spatial precision of explosive placement and the optimization of air-blast detonations to maximize shockwave propagation. We examine the technical evolution of the MONTIS UAS platform, focusing on a next-generation ignition architecture engineered for high-reliability air-blast delivery. Based on thousands of cycles and operational data from the US and Canada, we analyze the system's accuracy and reliability in extreme alpine environments. By allowing for surgical, altitude-contingent charge placement, this adaptable system provides a scientifically targeted approach to hazard reduction that maximizes effective pressure footprints while minimizing personnel exposure."],"kw":"Electronic Detonator, sUAS, Avalanche Mitigation, Air-Blast, Safety, E*STAR, MONTIS","ty":"P","pp":387,"em":[],"r":3618,"day":"Tue","th":"Operations and Program Management","pr":"Ralph Blumberg"},"460":{"id":"460","t":"Bridging the Gap: Integrating the RECCO R9 Detector into sUAS for Aerial Avalanche Search","au":[{"n":"Joseph Albanese","raw":"Albanese, Joseph","p":true,"aff":""},{"n":"Mattias Hellgren","raw":"Hellgren, Mattias","p":false,"aff":""},{"n":"Ralph Blumberg","raw":"Blumberg, Ralph","p":false,"aff":""},{"n":"Craig Donovan","raw":"Donovan, Craig","p":false,"aff":""},{"n":"Dan Justa","raw":"Justa, Dan","p":false,"aff":""},{"n":"Carrick Detweiler","raw":"Detweiler, Carrick","p":false,"aff":""},{"n":"Pat Dryer","raw":"Dryer, Pat","p":false,"aff":""}],"ab":["The integration of the RECCO R9 detector onto a small Unmanned Aerial System (sUAS) offers a promising, forcemultiplying tool to search and rescue teams. This technical presenta tion details the engineering challenges of the integration, primarily focusing on the mitigation of electro magnetic interference (EMI) from the sUAS powertrain and electronics to maintain an interference free environment for the R9’s high receiver sensitivity. To ensure operational reliability, we developed a payload architecture which implements RF shielding so that the risk of distracting signal returns is mitigated. A key feature of this integration is the “dual-mode” feedback system: a new digital data bridge provides real-time signal visualization and GPS-tagging of detections, while the original analog audio feedback is preserved. This allows experienced rescuers to leverage their intuitive “search by ear” skills while benefiting from precise digital mapping of the debris field on the sUAS controller. Operational analysis suggests that this sUAS-based platform occupies a unique niche between RECCO handheld detectors and helicopter-mounted systems. We will present data on search-speed efficiencies and signal resolution when operating at a variety of altitudes, particularly in terrain where secondary avalanche hazards limit ground access. By utilizing autonomous grid-pattern flight paths, the system ensures full coverage of an area, reducing human induced search pattern variation, and significantly decreases the time to cover avalanche debris, particularly crucial in emergencies where every minute counts. It is considered that this integration serves as a force multiplier, by providing high-resolution aerial search capabilities combined with the potential to be rapidly and remotely de ployed by on-site responders, contributing to enhanced safety and efficacy of ground-based recovery teams."],"kw":"sUAS, RECCO R9, Search and Rescue, Drone","ty":"P","pp":388,"em":[],"r":3552,"day":"Mon","th":"Avalanche Rescue","pr":"Joseph Albanese"},"461":{"id":"461","t":"Much Ado About Slushing","au":[{"n":"Susanne Eide Haug","raw":"Haug, Susanne Eide","p":false,"aff":""},{"n":"Louise Daines-Vick","raw":"Daines-Vick, Louise","p":true,"aff":""},{"n":"Alfred Hanssen","raw":"Hanssen, Alfred","p":false,"aff":""},{"n":"Yoichi Ito","raw":"Ito, Yoichi","p":false,"aff":""},{"n":"Satoru Yamaguchi","raw":"Yamaguchi, Satoru","p":false,"aff":""},{"n":"Chris D'Amboise","raw":"D'Amboise, Chris","p":false,"aff":""},{"n":"Dieter Issler","raw":"Issler, Dieter","p":false,"aff":""}],"ab":["Slush, or soaked now, is a poorly understood endmember of the wet–dry snow continuum that can produce fast, damaging flows. A commonly cited threshold for slush formation is a liquid water content (LWC) of ~15%, but that value remains largely untested. We performed rotating-drum experiments to observe how snow–water mixtures evolve under shear and how LWC, structure, and mechanical reworking control flow regime and morphology. LWC was varied between 0 and 100% by controlled additions and removals while we recorded material dynamics and flow modes. As LWC and mechanical reworking increased, behaviour progressed from dry granular flow to structured flow, then wet snow, slush, and finally slurry. By progressively adding and removing snow and water we found that different experimental runs showed different flow behaviour at the same LWC. Transitions between regimes were not governed by LWC alone but by the coupled effects of LWC, snow microstructure, mechanical history, rotation rate, and boundary conditions over time. Applying these laboratory findings to field settings suggests that slushflow initiation and evolution are sensitive to snowpack history and terrain morphology, and that when encounters with drainage pathways abruptly increase water content the knock-on effects are a change in flow regime, runout, and damage potential. We recommend new considerations for uptake in dynamic runout modelling, together with improved documentation of slushflow events, to improve data harmonisation in future hazard studies."],"kw":"","ty":"P","pp":389,"em":[],"r":3553,"day":"Mon","th":"Avalanche Dynamics","pr":"Louise Daines-Vick"},"462":{"id":"462","t":"Climate-Driven Changes in Snowpack Timing, Magnitude, and Downstream Hydrology Across Western North America","au":[{"n":"Kate Hale","raw":"Hale, Kate","p":true,"aff":""},{"n":"Wouter Berghuijs","raw":"Berghuijs, Wouter","p":false,"aff":""}],"ab":["Climate warming threatens snow-dependent water resources non-uniformly across western North America, where hydrologic sensitivities to snowpack loss and advanced snowmelt differ between mountain regions and contrasting maritime to continental climates. Communities rely on snowmelt-derived water for ecosystems, agriculture, and downstream supply, yet the physical processes shaping hydrologic sensitivity remain poorly understood, limiting predictions of hydrologic responses to changing snowpack conditions. We use directional statistics, applied to seven decades of daily hydrometeorological data across several mountain watersheds, to quantify annual runoff sensitivity to two components of snow water availability: (1) center-of-mass timing, the seasonal alignment of snowpack-derived water delivery relative to atmospheric demand, and (2) seasonal clustering, the concentration of water availability within a year. Historically, coastal, maritime-influenced regions exhibit greater sensitivity to water availability timing (e.g., Pacific Coastal Mountains, Cascades), whereas interior, continental regions exhibit greater sensitivity to seasonal clustering (e.g., Rocky Mountains), regardless of differences in climatic aridity. Although seasonal clustering has intensified in some regions and weakened in others, producing limited net change across western North America, water availability timing has advanced consistently across the study domain and is the larger contributor to declines in runoff generation, explaining the majority of the runoff ratio trends. Hydrologic vulnerability therefore depends on both regional sensitivity and the magnitude of hydroclimatic change; offering a transferable framework for anticipating where and how snow loss will most affect downstream water availability across global, snow-dependent mountain systems."],"kw":"Snow hydrology, seasonal water availability, hydrologic partitioning, runoff ratio, climate change, western North America","ty":"P","pp":390,"em":[],"r":null,"day":"Thu","th":"Weather Forecasting and Climate","pr":"Kate Hale"},"463":{"id":"463","t":"From Publicly Available Webcams to Ice-Avalanche Hazard Assessment: A Decade of Serac Falls from a Hanging Glacier of the Mont-Blanc Massif (France)","au":[{"n":"Gregoire Guillet","raw":"Guillet, Gregoire","p":true,"aff":""},{"n":"Ludovic Ravanel","raw":"Ravanel, Ludovic","p":false,"aff":""}],"ab":["Outside a few studies of ice masses threatening valleys (e.g., Weissmies, Taconnaz, and Grandes Jorasses in the Alps), hanging glaciers (HGs) and their dynamics remain poorly understood. Because individual collapses are rarely observed and measured, the size and frequency of serac falls remain largely unquantified. We use the Contamine- Négri HG, on the north-eastern side of Mont Blanc du Tacul (4248 m a.s.l., Mont-Blanc massif, France), as a case study. Repeated serac falls from this HG trigger ice avalanches across heavily travelled mountaineering routes. Recent near-fatal events include 22 May 2020, when ∼15,000 m3 of ice partially rebounded nearly 50 m up the north face of Pointe Lachenal, and 8 May 2025, when >60,000 m3 generated two avalanches (450 m northwards, burying three people, and 700 m eastwards). We analyzed a decade (2016–2026) of daily imagery from two webcams successively installed at the Aiguille du Midi (3842 m a.s.l.), 1.7 km from the HG. Using single-image photogrammetry with a Bayesian model, we estimated the volume of each major collapse. For every resolvable event, we measured the released ice surface area and volume, building a decade-long catalogue and magnitude-frequency distribution. Repurposing publicly available webcam archives as calibrated, georeferenced measurements transforms tourism infrastructure into a quantitative tool for studying serac falls and ice avalanches. The resulting magnitude-frequency distribution and seasonal release rates provide return periods and time-varying exposure probabilities, supporting seasonal guidance and future assessment of climate-driven changes. Peak activity coincides with route use, mainly from late spring to late autumn."],"kw":"Ice avalanches, serac falls, hanging glacier, Bayesian inference, Mont Blanc du Tacul.","ty":"P","pp":391,"em":[],"r":null,"day":"Thu","th":"Instrumentation and Remote Sensing","pr":"Gregoire Guillet"},"465":{"id":"465","t":"Is There Safe Ski Touring? Estimating Exposure with Avalanche Beacon Checkpoints in Indre Sogn Norway","au":[{"n":"Vegard Vereide","raw":"Vereide, Vegard","p":true,"aff":""},{"n":"Audun Hetland","raw":"Hetland, Audun","p":false,"aff":""},{"n":"Ingeborg Bruflot","raw":"Bruflot, Ingeborg","p":false,"aff":""},{"n":"Thor Espen Fugelsøy","raw":"Fugelsøy, Thor Espen","p":false,"aff":""},{"n":"Håvard B. Toft","raw":"Toft, Håvard B.","p":false,"aff":""}],"ab":["Since 2008, 64 ski-touring–related fatalities have been recorded in Norway. Of these, 33 occurred in the Troms region, while only one fatality has been documented in Sogn og Fjordane. This substantial regional disparity has motivated a joint research initiative between Western Norway University of Applied Sciences (HVL) and UiT The Arctic University of Norway – Centre for Avalanche Research and Education (UiT CARE).The Tromsø avalanche forecasting region covers approximately 2,589 km² and has a population of around 80,000, making it the most heavily used ski-touring region in Troms. Using beacon checkpoint (CP) data, Toft et al. (2025) estimated approximately 28,000 ski-touring trips per winter season during 2021–2023, based on observations from 29 CPs. The aim of this study is to examine whether the markedly lower number of fatalities in Sogn og Fjordane can be explained by lower exposure to ski touring. The Indre Sogn avalanche forecasting region spans approximately 3,964 km², has a population of about 18,000 inhabitants, and represents the most frequently skied region in Sogn og Fjordane. To quantify exposure, HVL deployed 25 beacon CPs at popular ski-touring trailheads in Indre Sogn in 2023, using the same methodology and setup as applied in the Tromsø region (Toft et al., 2025). The CPs record beacon detections, providing a consistent proxy for ski-touring activity and enabling temporal analyses of use patterns (e.g., time of day, weekly and seasonal variation). Data collection is planned over three winter seasons to allow interannual and cross-regional comparisons. During the winter season of 2024/2025, the CPs in Indre Sogn recorded approximately 21,000 ski-touring trips, despite a relatively short season characterized by variable conditions, multiple rain-on-snow events, and early spring melt. The results indicate that exposure levels in Indre Sogn are comparable to those observed in the Tromsø forecasting region, suggesting that differences in exposure alone are unlikely to explain the pronounced regional disparity in ski-touring fatalities. This points toward other contributing factors, such as snowpack characteristics, terrain use, travel practices, or regional ski culture, which warrant further investigation."],"kw":"Ski touring, Exposure Quantification, Avalanche Accidents, Beacon Checkpoint","ty":"P","pp":392,"em":[],"r":null,"day":"Fri","th":"Incidents and Case Studies","pr":"Vegard Vereide"}},"sessions":[{"k":"s","code":"Advances in Understanding 1","t":"Avalanche Initiation","mod":"Juerg Schweizer","day":"Mon","st":"08:20","en":"09:40","talks":["73","276","277","191","356","273","245"]},{"k":"s","code":"Advances in Understanding 2","t":"Avalanche Forecasting","mod":"Erich Peitzsch","day":"Tue","st":"08:10","en":"09:30","talks":["282","126","149","189","182","332","190"]},{"k":"s","code":"Advances in Understanding 3","t":"Forecasting with E e Koppang","day":"Mon","st":"14:45","en":"16:00","talks":["176","134","64","237","161","99","336"]},{"k":"s","code":"Focus Session 2","t":"Terrain and Mapping","mod":"Eirik Sharp","day":"Tue","st":"14:45","en":"16:00","talks":["362","396","394","150","284","198","215"]},{"k":"s","code":"Focus Session 3","t":"Teamwork, Training and Resilience","mod":"Wren McElroy","day":"Thu","st":"14:15","en":"15:30","talks":["437","281","431","45","35","368","65"]},{"k":"s","code":"Focus Session 4","t":"Intelligent Systems","mod":"Simon Horton","day":"Fri","st":"14:45","en":"16:00","talks":["337","158","295","300","309","227","138"]}],"posters":["16","81","108","188","278","355","357","369","17","30","41","100","122","166","220","279","325","335","358","372","25","29","195","234","320","414","420","446","27","93","117","118","193","222","345","422","438","444","460","37","55","70","94","135","136","168","170","186","235","303","339","367","381","445","104","109","152","183","196","199","267","305","379","461","130","18","24","62","82","101","102","107","110","131","157","164","173","177","178","223","232","249","251","254","258","261","270","285","287","289","299","311","334","338","402","403","406","410","429","442","26","58","242","407","59","260","61","68","79","95","111","156","214","238","246","268","280","354","364","370","371","375","409","430","454","459","129","133","160","206","19","76","86","132","172","187","211","239","272","348","419","427","23","53","121","143","155","180","184","200","202","205","208","209","217","247","255","274","283","290","293","346","347","361","377","386","408","412","421","424","448","463","56","72","88","89","90","127","225","259","286","312","324","329","330","365","392","75","194","423","462","42","69","83","84","92","97","116","125","144","192","296","313","326","350","398","74","77","96","171","201","230","262","307","344","373","382","405","432","433","465","78","114","141","151","153","162","163","165","226","265","302","317","328","35
